  - id: entrainement-p14-e3
    kind: exercise
    sheet: "Le rejet naturel"
    exercise: 3
    caption: "A l'aide d'un rejet naturel, replacer cinq fois la bille blanche afin de jouer la bille la bille noire."
    success_rate: [3, 5]
    bridge: unknown
    bronze: false
    table: {view: top, head_end: left}
    balls:
      - {id: y1, color: yellow, at: [1.82, 2.0]}
      - {id: y2, color: yellow, at: [3.0, 3.0]}
      - {id: r1, color: red, at: [4.74, 3.0]}
      - {id: b1, color: black, at: [1.0, 3.0]}
      - {id: w, color: white, at: [7.53, 2.02], role: cue}
    ghosts:
      - {id: g1, at: [7.53, 2.02], role: cue_start, for: w}
      - {id: g2, at: [4.88, 2.83], role: impact, for: w}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[7.53, 2.02], [4.88, 2.83]], bounces: []}
      - {id: a2, ball: r1, kind: object, path: [[4.74, 3.0], [4.19, 3.76]], to: bm}
      - {id: a3, ball: w, kind: cue, path: [[4.88, 2.83], [3.75, 2.28]], bounces: []}
    sequence:
      - {step: 1, cue: w, hit: r1, contact: half, pocket: bm, repeat: 5}
    inset:
      contact: half
      tip_point: above_center
      bridge_height: unknown
    annotations: ["x 5"]
    description: >-
      Table vue de dessus, tête à gauche. Une ligne de départ verticale à environ 1,8 case du bord gauche. Deux
      billes jaunes : l'une sur la ligne de départ (environ 1,8 ; 2), l'autre vers (3 ; 3). Une bille noire (8)
      vers (1 ; 3). Une bille rouge vers (4,7 ; 3). L'annotation « x 5 » est écrite juste à gauche de la pointe de la flèche pleine de la blanche (environ 3,2 ; 2,2). Un cercle creux pointillé à droite (environ
      7,5 ; 2) indique où poser la blanche ; elle part vers un cercle creux d'impact collé en haut à droite de la
      rouge (environ 4,9 ; 2,8). La rouge part vers le bas, en direction de la poche milieu bas. La blanche, après
      le contact, repart vers le haut gauche (flèche pleine vers environ 3,75 ; 2,3), c'est le rejet naturel qui
      la replace. Petit schéma en haut à droite : blanche et rouge qui se recouvrent à moitié environ, point bleu
      au-dessus du centre de la blanche, trait bleu-vert sous les billes.
    uncertainties:
      - "Ligne de départ lue à x ≈ 1.82 sur le schéma (et non 2.0)."
      - "La blanche n'est pas dessinée : son rôle est déduit des cercles creux pointillés."
      - "Le type de chevalet n'est pas indiqué dans l'énoncé ; trait bleu-vert sous les billes de l'inset non commenté."
      - "Quantité de bille de l'inset estimée à une demi-bille d'après le recouvrement (non légendé) ; point bleu au-dessus du centre."
      - "La destination exacte de la flèche de la rouge est lue vers la poche milieu bas (à ≈ 0,15 case près)."
      - "L'énoncé dit « jouer la bille la bille noire » (répétition dans le PDF) ; le schéma ne montre pas la trajectoire vers la noire."
      - "Pas de pastille Billard de bronze visible sur la page."
