      - "Seuls les deux traits depuis l'emplacement 1 sont tracés ; pour 2, 3 et 4 les trajets sont supposés vers les mêmes cercles d'impact."
      - "L'ordre de tir (emplacement par emplacement, rouge de gauche puis de droite) est supposé ; le PDF ne le précise pas."
