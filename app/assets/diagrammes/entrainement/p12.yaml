    annotations: []
    description: >-
      Vue de dessus, extrémité de départ à gauche. Une seule bille jaune juste au-dessus et à gauche de la poche du
      milieu bas (x ≈ 3 ; y ≈ 3), avec un cercle pointillé d'impact collé au-dessus à gauche (x ≈ 2,8 ; y ≈ 2,8) :
      position de la blanche au contact. Une flèche part de la jaune vers la poche du milieu bas (bm). Neuf
      cercles pointillés numérotés donnent les emplacements où poser la blanche : une rangée horizontale à
      y ≈ 1 portant 1, 3, 5, 7, 9 (x ≈ 1 ; 1,5 ; 2 ; 2,5 ; 3) et une colonne verticale à x ≈ 1 portant 1, 2, 4, 6,
      8 (y ≈ 1 ; 1,45 ; 2 ; 2,5 ; 3). Les numéros pairs sont dans la colonne, les impairs dans la rangée. Trois
      traits convergent vers le cercle d'impact, depuis les emplacements 5, 7 et 9 : la quantité de bille varie
      d'un emplacement à l'autre pour la même jaune. Pas de schéma « quantité de bille » (inset) sur cette page.
    uncertainties:
      - "Ligne de départ (trait plein vertical) lue à x ≈ 1,8 et non 2,0 comme la convention du FORMAT ; l'emplacement 5 est juste à droite de cette ligne."
      - "Le PDF ne dessine aucune blanche : `w` est posée à l'emplacement 1 par convention de l'outil (référence de blanche obligatoire), ce n'est pas une lecture du schéma."
      - "Seuls les trajets depuis 5, 7 et 9 sont tracés : pour 1, 2, 3, 4, 6 et 8 le trait n'est pas dessiné, et la position d'impact de la blanche est supposée identique."
      - "L'ordre de tir est supposé suivre la numérotation 1 à 9 ; le PDF ne le dit pas explicitement."
      - "Le type de chevalet n'est pas précisé (bridge: unknown) et le contact par emplacement n'est pas indiqué (pas d'inset)."
      - "Les positions sont lues à ≈ 0,1 case près ; le cercle d'impact est en pointillés très fins."
