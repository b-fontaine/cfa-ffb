      - "Les têtes de flèche des billes rouges s'arrêtent près des poches tm et tr sans les atteindre ; le point d'arrivée est approximatif."
      - "Les positions sont lues à ≈ 0,1 case près ; la rouge de droite à x ≈ 7,4 (lecture ±0,1)."
