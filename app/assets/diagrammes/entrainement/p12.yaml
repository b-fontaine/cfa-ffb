    description: >-
      Vue de dessus, extrémité de départ à gauche. Deux billes rouges dans la moitié droite, à mi-hauteur (y ≈ 2) :
      l'une à x ≈ 5, l'autre à x ≈ 7,4. Chacune a un cercle pointillé d'impact collé juste en dessous (légèrement à droite pour
