      rouge part vers la poche haut gauche (tl). Après l'impact, deux trajets de blanche, chacun marqué « x5 » :
      l'un vers le haut, rebond sur la bande gauche puis la bande haute, et arrivée au centre de la table, vers
      la noire ; l'autre vers le bas, rebond sur la bande gauche puis la bande basse, et arrivée vers la noire.
      Pas de schéma de quantité de bille.
