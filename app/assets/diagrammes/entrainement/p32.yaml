    description: >-
      Table vue de dessus, extrémité de départ à gauche. Un trait plein vertical à environ 1,8 case du bord
      gauche. Une bille rouge à gauche, sur la ligne médiane (environ 1,15 ; 2), la noire (8) au centre de la
      table (environ 4 ; 2) et deux billes jaunes dans les coins droits, près des poches haut droite et bas droite
      (environ 7,75 ; 0,3 et 7,75 ; 3,7). La blanche (cercle clair à points rouges) est posée en bas à gauche
