    zones: []
    sequence:
      - {step: 1, cue: w, from: g1, hit: r1, contact: full, pocket: tr, repeat: 3, cue_then: y1}
      - {step: 2, cue: w, from: g1, hit: r1, contact: full, pocket: tr, repeat: 3, cue_then: y2}
      - {step: 3, cue: w, from: g1, hit: r1, contact: full, pocket: tr, repeat: 3, cue_then: y3}
    annotations:
      - "x3 à côté de chacune des trois billes jaunes : la blanche est dirigée trois fois sur chaque jaune (3 x 3 = 9 billes empochées)"
      - "Trait vertical plein tracé sur la surface de jeu (x ≈ 1,8), à gauche, sans lien explicite avec l'exercice"
    description: >-
      Table vue de dessus, extrémité de départ à gauche. Un trait plein vertical à environ 1,8 case du bord
      gauche. Dans la moitié droite : une bille rouge (environ 6 ; 2) et trois billes jaunes, en haut (environ
      6 ; 1), au milieu (environ 5 ; 1,4) et en bas (environ 5 ; 2,3), chacune accompagnée de « x3 ». La blanche
      (cercle clair avec points rouges) est posée en bas (environ 5,2 ; 3). Elle va toucher la rouge en bille
      pleine (cercle pointillé d'impact environ 5,85 ; 2,15) ; la rouge part en diagonale vers la poche haut droite
      (tr). Après l'impact, trois flèches partent du cercle d'impact vers chacune des trois billes jaunes : c'est
      la trajectoire de blanche à obtenir, en variant la hauteur d'attaque. Pas de schéma de quantité de bille.
    uncertainties:
      - "La blanche est dessinée comme cercle clair à points rouges (cue_start) ; elle est modélisée comme bille w à cette position."
      - "Le schéma ne dit pas quelle hauteur d'attaque mène à quelle jaune ; l'association y1/y2/y3 aux flèches est géométrique, pas légendée."
      - "Le type de chevalet n'est pas indiqué ; pas de pastille Billard de bronze ni de schéma de quantité de bille visibles."
      - "Les flèches de la blanche après l'impact s'arrêtent juste avant les jaunes ; destination lue comme la bille jaune visée."
      - "Le trait vertical est lu à x ≈ 1,8 (et non 2,0 de la convention)."
      - "La flèche de la rouge se termine un peu avant la poche tr ; destination lue comme la poche haut droite."
