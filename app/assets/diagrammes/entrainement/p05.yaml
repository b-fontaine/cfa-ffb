version: 1
source: {file: "Fiches Entrainement CFA blackball.pdf", page: 5, rank: S}
diagrams:
  - id: entrainement-p05-e1
    kind: exercise
    sheet: "La quantité demi-bille"
    exercise: 1
    caption: "Empocher six billes en quantité demi-bille selon des distances différentes."
    success_rate: [4, 6]
    sessions: "2 à 3"
    bridge: unknown
    bronze: true
    table: {view: top, head_end: left}
    balls:
      - {id: r1, color: red, at: [4.0, 0.98]}
      - {id: w, color: white, at: [3.51, 1.97], role: cue, label: "1"}
    ghosts:
      - {id: g2, at: [4.47, 1.97], role: cue_start, label: "2", for: w}
      - {id: g3, at: [2.98, 2.79], role: cue_start, label: "3", for: w}
      - {id: g4, at: [4.99, 2.79], role: cue_start, label: "4", for: w}
      - {id: g5, at: [2.43, 3.64], role: cue_start, label: "5", for: w}
      - {id: g6, at: [5.57, 3.64], role: cue_start, label: "6", for: w}
      - {id: gi, at: [4.0, 1.25], role: impact, for: w}
    arrows:
      - {id: a1, ball: r1, kind: object, path: [[4.0, 0.98], [4.0, 0.0]], to: tm}
      - {id: a2, ball: w, kind: cue, path: [[2.43, 3.64], [4.0, 1.25]], bounces: [], note: "passe par les positions 5, 3 et 1 (alignées)"}
      - {id: a3, ball: w, kind: cue, path: [[5.57, 3.64], [4.0, 1.25]], bounces: [], note: "passe par les positions 6, 4 et 2 (alignées)"}
    zones: []
    sequence:
      - {step: 1, cue: w, from: w, hit: r1, contact: half, pocket: tm}
      - {step: 2, cue: w, from: g2, hit: r1, contact: half, pocket: tm}
      - {step: 3, cue: w, from: g3, hit: r1, contact: half, pocket: tm}
      - {step: 4, cue: w, from: g4, hit: r1, contact: half, pocket: tm}
      - {step: 5, cue: w, from: g5, hit: r1, contact: half, pocket: tm}
      - {step: 6, cue: w, from: g6, hit: r1, contact: half, pocket: tm}
    inset:
      contact: half
      tip_point: center
      bridge_height: surface
    annotations: ["Six positions numérotées de la blanche (1 à 6), de plus en plus éloignées de la bille rouge, deux demi-droites symétriques depuis le point d'impact."]
    description: >-
      Table vue de dessus, départ à gauche. Une seule bille rouge, au centre de la longueur
      (x = 4, y ≈ 1), juste sous la poche du milieu du haut ; une flèche pleine l'envoie dans cette
      poche (tm). Six cercles creux numérotés indiquent où poser la blanche, deux alignements
      symétriques partant du point d'impact derrière la rouge : à gauche 1 (3,5 ; 2,0), 3 (3,0 ; 2,8),
      5 (2,4 ; 3,6) ; à droite 2 (4,5 ; 2,0), 4 (5,0 ; 2,8), 6 (5,6 ; 3,6). Chaque tir se joue en
      quantité demi-bille sur la rouge, à des distances croissantes (positions 1-2 proches, 5-6
      éloignées). Schéma de quantité de bille en bas à droite : la blanche recouvre la moitié de la
      rouge, point d'impact du tip au centre de la blanche, sur la surface (ligne horizontale).
      La pastille Billard de bronze est présente. Le texte de l'énoncé ne mentionne pas de chevalet.
    uncertainties:
      - "Ligne de départ lue à x ≈ 1,75 (et non 2,0) sur le schéma."
      - "Aucune bille blanche pleine dessinée : seules les positions de pose (cercles creux) sont données ; la bille w est posée par convention sur la position 1, les autres sont des ghosts cue_start (ordre 1 à 6 supposé par la numérotation)."
      - "Le cercle en pointillés fin au sommet des deux alignements (4,0 ; 1,25) est lu comme la position de la blanche à l'impact."
      - "Type de chevalet non précisé pour l'exercice 1."
  - id: entrainement-p05-e2
    kind: exercise
    sheet: "La quantité demi-bille"
    exercise: 2
    caption: "Empocher huit billes en quantité demi-bille avec un chevalet sur la surface de jeu."
    success_rate: [6, 8]
    bridge: surface
    bronze: true
    table: {view: top, head_end: left}
    balls:
      - {id: y1, color: yellow, at: [5.01, 1.40], label: "x4"}
      - {id: y2, color: yellow, at: [5.01, 2.57], label: "x4"}
      - {id: w, color: white, at: [6.0, 2.0], role: cue}
    ghosts:
      - {id: gi1, at: [5.12, 1.58], role: impact, for: w}
      - {id: gi2, at: [5.12, 2.38], role: impact, for: w}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[6.0, 2.0], [5.12, 1.58]], bounces: []}
      - {id: a2, ball: y1, kind: object, path: [[5.01, 1.40], [4.0, 0.0]], to: tm}
      - {id: a3, ball: w, kind: cue, path: [[6.0, 2.0], [5.12, 2.38]], bounces: []}
      - {id: a4, ball: y2, kind: object, path: [[5.01, 2.57], [4.0, 4.0]], to: bm}
    zones: []
    sequence:
      - {step: 1, cue: w, from: w, hit: y1, contact: half, pocket: tm, repeat: 4}
      - {step: 2, cue: w, from: w, hit: y2, contact: half, pocket: bm, repeat: 4}
    inset:
      contact: half
      tip_point: center
      bridge_height: surface
    annotations: ["x4 à côté de chaque bille jaune : chaque situation est répétée 4 fois (8 billes au total)."]
    description: >-
      Table vue de dessus, départ à gauche. Deux billes jaunes alignées verticalement à x ≈ 5,0,
      l'une en haut (y ≈ 1,4) et l'autre en bas (y ≈ 2,6), chacune marquée « x4 ». Un cercle creux
      (position de pose de la blanche) se trouve à droite, au milieu de la largeur (x = 6, y = 2).
      Depuis cette position, deux lignes partent vers les deux billes jaunes, qu'elles touchent en
      demi-bille (cercles creux d'impact ≈ (5,1 ; 1,6) et (5,1 ; 2,4)). La jaune du haut est envoyée
      vers la poche du milieu du haut (tm) ; la jaune du bas vers la poche du milieu du bas (bm).
      Chaque jaune est jouée 4 fois, soit huit billes. Schéma de quantité de bille en bas à gauche :
      la blanche recouvre la moitié de la bille visée, point d'impact du tip au centre, chevalet sur la
      surface de jeu (ligne horizontale). La pastille Billard de bronze est présente.
    uncertainties:
      - "Ligne de départ lue à x ≈ 1,75 (et non 2,0) sur le schéma."
      - "Le cercle creux à (6,0 ; 2,0) est lu comme la position de pose de la blanche (cercle à points rouges, comme les positions numérotées de l'exercice 1) ; aucune bille blanche pleine n'est dessinée, w est posée par convention sur ce cercle."
      - "Ordre des deux situations (haut puis bas) non indiqué sur le schéma."
      - "Les flèches de la blanche s'arrêtent aux cercles d'impact ; leur prolongement éventuel n'est pas dessiné."
