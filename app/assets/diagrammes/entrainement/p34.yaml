      pointillé collé en bas à gauche de la jaune (environ 2,9 ; 2,2). Une flèche pleine part de la jaune vers la
      poche milieu haut (tm). Trois étiquettes de zone, sans contour tracé : « Zone 2 » vers (3,1 ; 1,1),
      « Zone 1 » vers (2,6 ; 1,9) et « Zone 3 » vers (2,2 ; 2,7). Aucun schéma « quantité de bille » sur cette page.
