    description: >-
      Table vue de dessus, extrémité de départ à gauche. Un trait vertical plein est tracé à environ 1,8 case du
      bord gauche, sur toute la largeur. La bille noire (8) est vers (1 ; 1). Quatre billes rouges forment une
      diagonale descendante vers la gauche : (3 ; 0,5), (2,5 ; 1,5), (2,15 ; 2,1) et (1,6 ; 3,1). Une bille jaune
