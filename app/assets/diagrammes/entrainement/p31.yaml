  - id: entrainement-p31-e9
    kind: exercise
    sheet: "Le rétro"
    exercise: 9
    caption: "Empocher cinq billes en effectuant un rétro, pour replacer la bille blanche au-delà du trait tracé, afin de jouer la bille noire."
    success_rate: [3, 5]
    bridge: unknown
    bronze: false
    table: {view: top, head_end: left}
    balls:
      - {id: b1, color: black, at: [4.0, 1.0]}
      - {id: y1, color: yellow, at: [1.55, 1.49]}
      - {id: y2, color: yellow, at: [1.79, 1.81]}
      - {id: y3, color: yellow, at: [2.99, 2.75]}
      - {id: r1, color: red, at: [0.9, 1.99], label: "x5"}
      - {id: w, color: white, at: [0.98, 3.41], role: cue}
    ghosts:
      - {id: g1, at: [0.98, 3.41], role: cue_start}
      - {id: g2, at: [0.99, 2.21], role: impact, for: w}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[0.98, 3.41], [0.99, 2.21]], bounces: []}
      - {id: a2, ball: r1, kind: object, path: [[0.9, 1.99], [0.15, 0.25]], to: tl}
      - {id: a3, ball: w, kind: cue, path: [[0.99, 2.21], [3.13, 2.2]], bounces: []}
    sequence:
      - {step: 1, cue: w, hit: r1, contact: half, pocket: tl, repeat: 5}
    inset:
      contact: half
      tip_point: below_center
      bridge_height: unknown
    annotations:
      - "x5 : la situation est répétée cinq fois (taux 3/5), étiquette lue à gauche de la rouge, vers (0,7 ; 2,2)."
      - "Le trait vertical tracé sur la surface de jeu est la ligne que la blanche doit dépasser après le rétro."
    description: >-
      Table vue de dessus, tête à gauche. Un trait vertical plein est tracé à environ 1,8 case du bord gauche, sur
      toute la largeur. La bille noire (8) est vers (4 ; 1), dans l'axe de la poche milieu. Trois billes jaunes : vers
      (1,55 ; 1,5), (1,8 ; 1,8) posée sur le trait, et (3 ; 2,75). Une bille rouge vers (0,9 ; 2), marquée « x5 », à
      gauche du trait ; une flèche pleine l'envoie vers le haut gauche, en direction de la poche haut gauche (jusque
      vers 0,15 ; 0,25). Un cercle creux pointillé vers (1 ; 3,4) indique où poser la blanche ; elle monte droit
      vers un cercle creux d'impact collé sous la rouge (environ 1 ; 2,2). Après le contact, la blanche repart en
      rétro vers la droite, à l'horizontale (flèche pleine jusque vers 3,1 ; 2,2), en franchissant le trait vertical.
      Petit schéma en bas à droite (quantité de bille) : la blanche recouvre environ la moitié de la rouge, dont un
      croissant reste visible à gauche ; point bleu en bas de la blanche (sous le centre, effet rétro), réticule et
      trait bleu-vert sous les billes.
    uncertainties:
      - "Trait vertical lu à x ≈ 1.81 sur le schéma (et non 2.0)."
      - "La blanche n'est pas dessinée : sa position de départ (w) est déduite du cercle creux pointillé."
      - "Le type de chevalet n'est pas indiqué dans l'énoncé ; trait bleu-vert sous les billes de l'inset non commenté."
      - "Quantité de bille de l'inset estimée à environ une demi-bille d'après le recouvrement (non légendé)."
      - "La fin de la flèche de la blanche (vers 3,1 ; 2,2) est approximative (≈ 0,15 case) ; la blanche est supposée s'arrêter là ou plus loin selon l'effet."
      - "La destination de la flèche de la rouge est lue vers la poche haut gauche."
      - "Étiquette « x5 » lue à gauche du cercle d'impact ; rattachée par convention à la rouge."
      - "Pas de pastille Billard de bronze ni de « Nombre de séances » visibles sur la page."
