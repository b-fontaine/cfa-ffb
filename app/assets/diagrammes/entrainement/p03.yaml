diagrams:
  - id: entrainement-p03-e1
    kind: exercise
    sheet: "La quantité de bille pleine"
    exercise: 1
    sessions: "2 à 3"                  # « Nombre de séances : 2 à 3 »
    caption: "Empocher huit billes en quantité de bille pleine, avec un chevalet sur cadre."
    success_rate: [6, 8]
    bridge: frame
    bronze: true
    table: {view: top, head_end: left}
    balls:
      - {id: y1, color: yellow, at: [1.18, 2.07], label: "x4"}
      - {id: y2, color: yellow, at: [2.83, 2.08], label: "x4"}
      - {id: w,  color: white,  at: [1.99, 3.51], role: cue}
    ghosts:
      - {id: g1, at: [1.29, 2.28], role: impact, for: w}
      - {id: g2, at: [2.71, 2.29], role: impact, for: w}
    arrows:
      - {id: a1, ball: w,  kind: cue,    path: [[1.99, 3.51], [1.29, 2.28]], bounces: []}
      - {id: a2, ball: y1, kind: object, path: [[1.18, 2.07], [0, 0]], to: tl}
      - {id: a3, ball: w,  kind: cue,    path: [[1.99, 3.51], [2.71, 2.29]], bounces: []}
      - {id: a4, ball: y2, kind: object, path: [[2.83, 2.08], [4, 0]], to: tm}
    zones: []
    sequence:
      - {step: 1, cue: w, hit: y1, contact: full, pocket: tl, repeat: 4}
      - {step: 2, cue: w, hit: y2, contact: full, pocket: tm, repeat: 4}
    inset:
      contact: full
      tip_point: center
      bridge_height: frame
    annotations:
      - "x 4 à côté de chaque bille jaune (2 x 4 = 8 billes, soit les « huit billes » de l'énoncé)"
    description: >-
      Table vue de dessus, départ à gauche. Deux billes jaunes sont posées l'une à gauche (environ 1,2 ; 2,1)
      et l'autre à droite (environ 2,8 ; 2,1) de la bille blanche, placée en bas, au centre de la 2e colonne
      (environ 2,0 ; 3,5), de part et d'autre de la ligne de départ (trait plein vertical). Chaque jaune porte
      « x 4 ». Pour chaque jaune, un cercle creux pointillé (position de la blanche au contact) est collé en
      bas de la bille (à droite pour la jaune de gauche, à gauche pour la jaune de droite), et la blanche vise ce cercle : contact en bille pleine. La jaune de gauche
      part vers la poche d'angle haut gauche (tl) ; la jaune de droite part vers la poche du milieu haut (tm).
      Total : 2 positions x 4 = huit billes à empocher. Petit schéma en bas à droite : bille blanche vue de
      face, point bleu au centre, arc rouge au sommet (bille cible), trait turquoise sous la bille (chevalet
      sur cadre selon l'énoncé).
    uncertainties:
      - "Ligne de départ lue à x ≈ 1,83 (et non 2,0 comme dans FORMAT.md)."
      - "Le schéma ne précise pas si les 4 répétitions de chaque jaune alternent ou se font en série : transcrit sans ordre entre les deux positions."
      - "Hauteur du chevalet et point d'impact du tip dans l'inset : lus sur un petit dessin, interprétation approximative (point bleu au centre)."

  - id: entrainement-p03-e2
    kind: exercise
    sheet: "La quantité de bille pleine"
    exercise: 2
    caption: "Empocher six billes en quantité de bille pleine avec un chevalet sur la surface de jeu."
    success_rate: [4, 6]
    bridge: surface
    bronze: true
    table: {view: top, head_end: left}
    balls:
      - {id: r1, color: red,    at: [0.98, 0.58], label: "1", order: 1}
      - {id: y2, color: yellow, at: [0.98, 3.51], label: "2", order: 2}
      - {id: r3, color: red,    at: [1.98, 1.04], label: "3", order: 3}
      - {id: y4, color: yellow, at: [1.98, 3.01], label: "4", order: 4}
      - {id: r5, color: red,    at: [2.97, 1.53], label: "5", order: 5}
      - {id: y6, color: yellow, at: [2.97, 2.52], label: "6", order: 6}
      - {id: w,  color: white,  at: [3.99, 2.01], role: cue}
    ghosts:
      - {id: g5, at: [3.18, 1.62], role: impact, for: w, label: "5"}
      - {id: g6, at: [3.18, 2.43], role: impact, for: w, label: "6"}
    arrows:
      - {id: a1, ball: w,  kind: cue,    path: [[3.99, 2.01], [3.18, 1.62]], bounces: []}
      - {id: a2, ball: r5, kind: object, path: [[2.97, 1.53], [0, 0]], to: tl}
      - {id: a3, ball: w,  kind: cue,    path: [[3.99, 2.01], [3.18, 2.43]], bounces: []}
      - {id: a4, ball: y6, kind: object, path: [[2.97, 2.52], [0, 4]], to: bl}
    zones: []
    sequence:
      - {step: 1, cue: w, hit: r1, contact: full, pocket: tl}
      - {step: 2, cue: w, hit: y2, contact: full, pocket: bl}
      - {step: 3, cue: w, hit: r3, contact: full, pocket: tl}
      - {step: 4, cue: w, hit: y4, contact: full, pocket: bl}
      - {step: 5, cue: w, hit: r5, contact: full, pocket: tl}
      - {step: 6, cue: w, hit: y6, contact: full, pocket: bl}
    inset:
      contact: full
      tip_point: center
      bridge_height: surface
    annotations:
      - "Billes numérotées de 1 à 6 (rouges 1, 3, 5 ; jaunes 2, 4, 6)"
    description: >-
      Table vue de dessus, départ à gauche. Six billes alignées sur deux diagonales symétriques par rapport
      à l'axe longitudinal : trois rouges (1, 3, 5) en haut sur une droite qui monte vers la poche d'angle haut
      gauche (tl), et trois jaunes (2, 4, 6) en bas sur une droite qui descend vers la poche d'angle bas gauche
      (bl). Chaque diagonale est espacée d'une colonne en x (environ 1,0 ; 2,0 ; 3,0). La bille blanche est au
      milieu, au centre de la table sur la longueur (environ 4,0 ; 2,0), avec deux cercles creux pointillés
      collés à droite des billes 5 et 6 (position de la blanche au contact). Les numéros 1 à 6 sont écrits à
      côté des billes. Les lignes de visée tracées depuis la blanche mènent les rouges vers tl et les jaunes vers bl, en bille pleine. La
      ligne de départ (trait plein) passe entre les colonnes de billes 1/2 et 3/4. Petit schéma en bas à droite : bille
      blanche de face, point bleu au centre, trait turquoise sous la bille (chevalet sur la surface de jeu).
    uncertainties:
      - "Ligne de départ lue à x ≈ 1,83 (et non 2,0 comme dans FORMAT.md)."
      - "Les numéros sont écrits sous ou à côté des billes ; 1, 3, 5 et 4 sont légèrement chevauchés par les billes, lecture jugée sûre."
      - "Le numéro est interprété comme ordre de tir (hypothèse de lecture ; le texte de la page ne le dit pas)."
      - "Les billes 1 et 3 sont alignées derrière la 5 sur la ligne vers tl (idem 2 et 4 derrière la 6 vers bl) : l'ordre de tir 1 à 6 est donc douteux (les numéros peuvent être de simples repères) ; seuls les fantômes de 5 et 6 sont dessinés."
      - "Les billes 2 à 6 sont tirées à partir d'une blanche replacée au centre (cercle de départ unique) : le schéma ne montre pas de positions de blanche différentes par bille."
      - "Les trajectoires dessinées passent à travers les billes 3 et 1 (resp. 4 et 2) : elles indiquent la direction de la ligne de visée, pas des chocs successifs."
      - "Hauteur du chevalet et point d'impact du tip dans l'inset : lus sur un petit dessin, interprétation approximative."
