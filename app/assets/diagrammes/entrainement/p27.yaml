version: 1
source: {file: "Fiches Entrainement CFA blackball.pdf", page: 27, rank: S}
diagrams:
  - id: entrainement-p27-e1
    kind: exercise
    sheet: "Le rétro"
    exercise: 1
    caption: "Empocher cinq billes en effectuant un rétro, pour replacer la bille blanche au-delà du trait tracé, afin de jouer la bille noire."
    success_rate: [3, 5]
    sessions: "3 à 4"
    bridge: unknown
    bronze: false
    table: {view: top, head_end: left}
    balls:
      - {id: r1, color: red, at: [0.99, 1.11], label: "x5"}
      - {id: y1, color: yellow, at: [1.02, 2.28]}
      - {id: y2, color: yellow, at: [1.52, 2.5]}
      - {id: b1, color: black, at: [0.99, 3.35]}
      - {id: w, color: white, at: [1.82, 1.99], role: cue}
    ghosts:
      - {id: g1, at: [1.82, 1.99], role: cue_start, for: w}
      - {id: g2, at: [1.14, 1.29], role: impact, for: w}
    arrows:
      - {id: c1, ball: w, kind: cue, path: [[1.82, 1.99], [1.14, 1.29]], bounces: []}
      - {id: a1, ball: r1, kind: object, path: [[0.99, 1.11], [0.18, 0.23]], to: tl}
      - {id: c2, ball: w, kind: cue, path: [[1.14, 1.29], [2.35, 2.55]], bounces: [], note: "retour de la blanche (rétro) au-delà du trait"}
    zones: []
    sequence:
      - {step: 1, cue: w, from: g1, hit: r1, contact: full, pocket: tl, effect: retro, repeat: 5}
    inset:
      contact: full
      tip_point: lower_center
      bridge_height: surface
    annotations:
      - "x5 : l'exercice est répété cinq fois"
      - "Trait vertical plein tracé sur la surface de jeu (x ≈ 1,8) : la blanche doit le dépasser (aller vers la droite) après l'empochage de la rouge, pour pouvoir jouer la noire"
    description: >-
      Table vue de dessus, extrémité de départ à gauche. Un trait plein vertical à environ 1,8 case du bord
      gauche, sur toute la largeur. Une bille rouge près du bord gauche (environ 1 ; 1,1), deux billes jaunes
      (environ 1 ; 2,3 et 1,5 ; 2,5) et la noire (8) en bas à gauche (environ 1 ; 3,35). Un petit cercle pointillé
      sur le trait (environ 1,8 ; 2) indique où poser la blanche ; un second cercle pointillé collé en bas à droite
      de la rouge (environ 1,15 ; 1,3) est la position d'impact. La rouge part en diagonale vers la poche haut gauche
      (tl). La blanche, jouée avec effet rétro (point bleu bas sur la blanche du schéma), revient en arrière le long de la même
      diagonale et finit au-delà du trait (flèche vers environ 2,35 ; 2,55, marquée « x5 »). Schéma « quantité de
      bille » en bas à droite : bille pleine, point bleu sous le centre de la blanche, trait vert d'eau sous la bille
      (surface).
    uncertainties:
      - "La blanche n'est pas dessinée : sa position initiale (bille w) est déduite du cercle pointillé sur le trait, son impact du cercle collé à la rouge."
      - "Le type de chevalet n'est pas indiqué dans l'énoncé de l'exercice 1 (bridge: unknown) ; pas de pastille Billard de bronze visible."
      - "Le cercle pointillé sur le trait est lu comme départ de la blanche, et la flèche de retour comme le trajet rétro de la blanche ; le schéma ne les distingue pas par deux flèches."
      - "Les billes jaunes et la noire ne sont pas visées par une flèche (les jaunes ne sont pas commentées par l'énoncé ; la noire est la bille à jouer ensuite)."
      - "Quantité de bille de l'inset estimée pleine d'après le recouvrement (non légendé) ; point bleu lu bas-centre."
      - "La flèche de la rouge se termine un peu avant la poche tl ; destination lue comme la poche haut gauche."
      - "Le texte « x5 » est dessiné près de la pointe de la flèche de la blanche (environ 2,6 ; 2,9), pas sur la rouge ; le format ne porte pas de libellé sur une flèche, il est donc rattaché à la rouge r1."
