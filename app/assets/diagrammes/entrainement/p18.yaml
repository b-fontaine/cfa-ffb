      - "Point de contact du tip : point bleu environ une demi-rayon au-dessus du centre de la blanche (upper_center), non légendé."
      - "Ligne de départ lue à x ≈ 1.83 sur le schéma (et non 2.0)."
      - "Le point de rebond sur la bande gauche est lu à x ≈ 0.18 (extrémité du trait au bord du schéma), précision ≈ 0,15 case."
      - "Position de la pointe de flèche finale de la blanche et des cercles creux lue à ≈ 0,15 case près."
