    annotations: ["x5 près de la pointe de la flèche finale de la blanche : la situation est répétée 5 fois"]
    description: >-
      Table en vue de dessus, départ à gauche. Une bille jaune vers le milieu haut de la table (environ 4,5 cases
      du bord gauche, 1 case du bord haut), une bille rouge vers le centre (environ 5 cases, 2,5 cases) et la bille
      noire en bas (environ 6 cases, 3,7 cases). Un cercle creux pointillé marque l'emplacement où poser la
      blanche (environ 6 cases, 2 cases). De là, la blanche monte vers la bille jaune (cercle creux d'impact collé
      sous la jaune, légèrement à droite). La jaune part en ligne droite vers la poche milieu haut. La blanche,
      après le contact, repart vers la bande gauche (rejet naturel), la touche à environ 2,3 cases du bord haut
      puis revient vers le bas-droite et s'arrête (pointe de flèche) à environ 4,6 cases du bord gauche et 3,5
      cases du bord haut, avec la mention « x5 ». Le petit schéma en haut à droite
      montre la blanche et la bille rouge qui se recouvrent environ à moitié, point bleu un peu au-dessus du
      centre de la blanche, trait bleu-vert sous les billes.
    uncertainties:
      - "L'énoncé du PDF contient la répétition « la bille la bille noire » (conservée mot pour mot) ; la bille visée en fin de trajectoire n'est pas nommée plus précisément."
      - "La blanche n'est pas dessinée sur la table : par convention elle est posée (w) sur le cercle creux pointillé à deux points rouges, qui marque son emplacement de départ ; la jaune est la bille de contact, la noire n'est pas touchée par la trajectoire."
