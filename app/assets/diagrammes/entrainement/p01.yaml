      bridge_height: surface
    annotations:
      - "x5 à côté de chacune des deux billes jaunes."
    description: >-
      Table vue de dessus, extrémité de départ à gauche. Deux billes jaunes sont posées dans les coins gauches,
      chacune dans une zone grisée (haut gauche et bas gauche) et marquée « x5 ». Quatre billes rouges forment
      deux paires verticales : deux à x vers 2,0 en haut (y vers 0,4 et 1,0, sur la ligne de départ) et deux
      à x vers 4,0 en bas (y vers 2,5 et 3,2). La bille blanche (cercle creux à points rouges) est à droite,
      à mi-largeur (x vers 7,4, y vers 2,0). Deux flèches partent de la blanche : l'une vers la bille jaune du haut
      en passant entre les deux rouges de la paire de gauche, l'autre vers la bille jaune du bas en passant entre
      les deux rouges de la paire du milieu. L'encart en bas à droite est identique à l'exercice 1 (bille blanche, point bleu au-dessus du centre,
      ligne turquoise sous la bille).
    uncertainties:
      - "Ligne de départ mesurée à x ≈ 1,8 (FORMAT : 2,0 [Prop]) ; les deux billes rouges du haut sont posées sur cette ligne."
      - "Le rôle des billes rouges (obstacles à passer entre ou billes à toucher) n'est pas précisé par le texte."
      - "Les poches visées (tl, bl) sont déduites de la position des billes jaunes au ras des poches ; le texte ne les nomme pas."
      - "L'ordre d'exécution des deux séries de cinq tirs n'est pas indiqué."
      - "Pas de « Nombre de séances » affiché pour l'exercice 2."
