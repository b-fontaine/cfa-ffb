    caption: "Empocher huit billes en quantité demi-bille avec un chevalet sur cadre."
    success_rate: [6, 8]
    bridge: frame
    bronze: true
    table: {view: top, head_end: left}
    balls:
      - {id: y1, color: yellow, at: [1.0, 1.05], label: "x4"}
      - {id: y2, color: yellow, at: [3.0, 1.05], label: "x4"}
      - {id: w, color: white, at: [2.0, 3.65], role: cue}
    ghosts:
      - {id: g1, at: [1.15, 1.2], role: impact, for: w}
      - {id: g2, at: [2.8, 1.2], role: impact, for: w}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[2.0, 3.65], [1.15, 1.2]], bounces: []}
      - {id: a2, ball: y1, kind: object, path: [[1.0, 1.05], [0, 0]], to: tl}
      - {id: a3, ball: w, kind: cue, path: [[2.0, 3.65], [2.8, 1.2]], bounces: []}
      - {id: a4, ball: y2, kind: object, path: [[3.0, 1.05], [4, 0]], to: tm}
    zones: []
    sequence:
      - {step: 1, cue: w, hit: y1, contact: half, pocket: tl, repeat: 4}
      - {step: 2, cue: w, hit: y2, contact: half, pocket: tm, repeat: 4}
    inset:
      contact: half
      tip_point: center
      bridge_height: unknown
    annotations: ["x4 à côté de chaque bille jaune : la même situation est répétée 4 fois (2 x 4 = huit billes)"]
    description: >-
      Table vue de dessus, départ à gauche. Deux billes jaunes : l'une en (1.0 ; 1.05) à gauche de la ligne de départ,
      visée vers la poche d'angle haut gauche ; l'autre en (3.0 ; 1.05) à droite de la ligne de départ, visée vers la
      poche du milieu haut. Chacune porte « x 4 ». La bille blanche est placée en (2.0 ; 3.65), au bas du schéma, sur
      un cercle pointillé marqué de deux petits points rouges. Pour chaque jaune, un cercle creux pointillé collé à
      la bille, côté opposé à la poche, indique la position de la blanche à l'impact (demi-bille). La blanche
      part de son emplacement vers chaque cercle d'impact (deux traits), la jaune part ensuite vers sa poche (flèche pleine).
      En bas à droite, schéma de quantité demi-bille : la blanche recouvre à moitié la rouge, point bleu au centre
      de la blanche (centre-bille), un trait horizontal vert-bleu sous les billes.
    uncertainties:
      - "Ordre de tir des deux séries de 4 billes non indiqué : l'ordre des étapes de sequence est arbitraire."
      - "Les deux points rouges sur le cercle de la blanche en (2.0 ; 3.65) ne sont pas expliqués dans le texte."
      - "Ligne de départ mesurée vers x = 1.83 sur la grille (valeur par défaut du format : 2.0)."
      - "Hauteur du chevalet de l'inset (trait vert-bleu) non légendée ; bridge_height inconnu."
