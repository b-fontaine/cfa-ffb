      - {id: r2, color: red, at: [7.0, 1.0], label: "x4"}
      - {id: w, color: white, at: [1.15, 3.0], role: cue}
    ghosts:
      - {id: g1, at: [1.15, 1.13], role: impact, for: w}
      - {id: g2, at: [1.15, 3.0], role: cue_start}
      - {id: g3, at: [6.8, 1.12], role: impact, for: w}
      - {id: g4, at: [6.8, 3.0], role: cue_start}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[1.15, 3.0], [1.15, 1.13]], bounces: []}
      - {id: a2, ball: r1, kind: object, path: [[1.0, 1.0], [0, 0]], to: tl}
      - {id: a3, ball: w, kind: cue, path: [[6.8, 3.0], [6.8, 1.12]], bounces: []}
      - {id: a4, ball: r2, kind: object, path: [[7.0, 1.0], [8, 0]], to: tr}
    sequence:
      - {step: 1, cue: w, hit: r1, contact: quarter, pocket: tl, repeat: 4}
      - {step: 2, cue: w, hit: r2, contact: quarter, pocket: tr, repeat: 4}
    inset:
      contact: quarter
      tip_point: center
      bridge_height: surface
    annotations: ["x4 à côté de chaque bille rouge : la situation est répétée 4 fois par bille, soit 8 billes"]
    description: >-
      Deux billes rouges, l'une à gauche (environ 1 case du bord gauche, 1 case du bord haut), l'autre à droite
      (environ 1 case du bord droit, 1 case du bord haut), chacune marquée « x4 ». Pour chacune, la blanche est
      posée sur un cercle creux pointillé à environ 3 cases du bord haut, légèrement à droite de l'axe de la
      bille rouge gauche (décalée d'environ 0,15 case), légèrement à gauche de l'axe de la rouge droite. Elle monte
      en ligne droite vers un cercle creux collé à la bille rouge (contact en quart de bille). La rouge gauche part
      vers la poche haut gauche, la rouge droite vers la poche haut droite. Le petit schéma central montre la
      blanche et la rouge qui se recouvrent partiellement, point bleu au centre de la blanche, chevalet sur la
      surface (trait bleu-vert sous les billes).
    uncertainties:
      - "Ligne de départ lue à x ≈ 1.83 sur le schéma (et non 2.0)."
      - "La blanche n'est pas dessinée : son rôle est déduit des cercles creux pointillés ; l'inset n'a pas de légende texte."
      - "La blanche w est posée par convention au premier cercle de départ (g2) ; la seconde pose (g4, côté droit) est lue sur le schéma, l'ordre n'est pas indiqué."
      - "Le champ sessions (« 1 à 2 », texte « Nombre de séances ») n'existe pas dans FORMAT.md."
      - "Le sens du décalage de la blanche (côté de la bille où a lieu le contact) est lu à ≈ 0,15 case près."
