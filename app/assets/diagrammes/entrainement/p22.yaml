    description: >-
      Table vue de dessus, tête à gauche. Une ligne verticale pleine (le « trait tracé sur la surface de jeu »)
      à environ 1,83 case du bord gauche. Une bille noire vers (1 ; 0,4), proche de la poche haut gauche. Une
      bille rouge sur le trait (environ 1,85 ; 1,6), une autre bille rouge près de la bande gauche (environ 0,3 ;
      2,5). Une bille jaune vers (1 ; 2) à laquelle est associé l'indice « X5 » (écrit près de la fin de la flèche
      de la blanche, à droite du trait). Un cercle creux pointillé en bas (environ 2 ; 3,6), juste à droite du trait,
      indique où poser la blanche ; elle monte vers la gauche jusqu'à un cercle creux d'impact collé sous la jaune,
      côté droit (environ 1,1 ; 2,2). La jaune part vers le haut gauche, vers la poche haut gauche. La blanche,
      après le contact, continue vers la gauche, touche la bande gauche vers (0,2 ; 1,6), puis remonte vers le haut
      droit et s'arrête juste après le trait vers (1,9 ; 0,5), flèche pleine : elle a avancé au-delà du trait. Petit
      schéma en bas à droite : blanche en avant, rouge derrière et décalée vers la droite (recouvrement important),
      point bleu au-dessus du centre de la blanche, trait bleu-vert sous les billes.
    uncertainties:
      - "Le trait tracé est lu à x ≈ 1.83 (et non 2.0)."
      - "La blanche est le petit cercle clair à points rouges (cercle de départ) ; sa position initiale est confondue avec le cercle creux numéroté de départ, et le cercle d'impact est déduit du cercle creux pointillé."
      - "Le type de chevalet n'est pas indiqué dans l'énoncé ; trait bleu-vert sous les billes de l'inset non commenté."
      - "Quantité de bille de l'inset estimée à trois quarts de bille d'après le recouvrement (non légendé) ; point bleu au-dessus du centre (upper_center)."
      - "L'indice « X5 » est écrit à droite du trait, près de la pointe de la flèche, et non collé à une bille : rattaché à la jaune par convention."
      - "Le point de rebond sur la bande gauche est lu à x ≈ 0.2 (la bande est à x = 0, à ≈ 0,15 case près)."
      - "La destination de la flèche de la jaune est lue vers la poche haut gauche (à ≈ 0,15 case près) ; la fin de la flèche de la blanche (1,9 ; 0,5) est celle de la pointe, non d'un point d'arrêt mesuré."
      - "Le schéma ne montre pas la trajectoire vers la noire (objectif du coup suivant)."
      - "Pas de pastille Billard de bronze visible sur la page."
