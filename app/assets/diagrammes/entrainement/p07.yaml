      - {id: c-left, ball: w, kind: cue, path: [[4.0, 3.5], [1.6, 1.1]], bounces: []}
      - {id: c-right, ball: w, kind: cue, path: [[4.0, 3.5], [6.4, 1.1]], bounces: []}
    sequence:
