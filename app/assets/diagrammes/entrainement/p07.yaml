    description: >-
      Vue de dessus, extrémité de départ à gauche. Deux billes jaunes en haut, l'une à gauche (x ≈ 1,4 ; y ≈ 1)
      et l'autre à droite (x ≈ 6,55 ; y ≈ 1), chacune avec un cercle pointillé d'impact collé en bas à droite
      (gauche) ou en bas à gauche (droite). La jaune de gauche part vers la poche haut gauche (tl), celle de
      droite vers la poche haut droite (tr). Huit cercles pointillés numérotés, posés en V sur deux lignes qui
      convergent vers (4 ; 3,5), donnent les emplacements de la blanche : 1, 3, 5, 7 sur la branche gauche (1 le
      plus proche de la jaune, 7 le plus éloigné, en bas au centre), 2, 4, 6, 8 sur la
      branche droite ; 7 et 8 sont au même endroit, en bas au centre. Chaque emplacement est donc visé sur la
      jaune de son côté, à une distance différente. Le schéma « quantité de bille » en bas à droite montre une
      bille blanche en avant d'une bille rouge, contact trois-quarts, point bleu du tip au centre de la blanche,
      trait vert d'eau sous la bille (niveau de la surface).
    uncertainties:
