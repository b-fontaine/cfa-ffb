      - {step: 5, cue: w, from: g5, hit: yl, contact: three_quarter, pocket: tl}
      - {step: 6, cue: w, from: g6, hit: yr, contact: three_quarter, pocket: tr}
      - {step: 7, cue: w, from: g7, hit: yl, contact: three_quarter, pocket: tl}
      - {step: 8, cue: w, from: g8, hit: yr, contact: three_quarter, pocket: tr}
