      - "L'alternance gauche (impairs) / droite (pairs) est lue sur la position des numéros ; le PDF ne donne pas d'ordre de tir explicite en dehors de la numérotation."
      - "Les emplacements 7 et 8 sont confondus à (4 ; 3,5) à la précision de lecture."
      - "Pas de bille blanche dessinée : seuls les cercles pointillés numérotés indiquent où la poser."
      - "La bille blanche w déclarée dans balls (en (4 ; 3,5)) n'est pas dessinée : elle est ajoutée pour référencer les flèches de la blanche ; l'emplacement réel est l'un des cercles numérotés."
