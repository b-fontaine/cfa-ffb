diagrams:
  - id: entrainement-p07-e1
    kind: exercise
    sheet: "La quantité trois-quarts"
    exercise: 1
    caption: "Empocher deux fois chaque bille jaune, puis chaque bille rouge en quantité trois-quarts avec un chevalet sur cadre."
    success_rate: [6, 8]
    sessions: "1 à 2"
    bridge: frame
    bronze: true
    table: {view: top, head_end: left}
    balls:
      - {id: y1, color: yellow, at: [4.4, 1.0], label: "x2"}
      - {id: y2, color: yellow, at: [4.8, 1.0], label: "x2"}
      - {id: r1, color: red, at: [6.55, 2.0], label: "x2"}
      - {id: r2, color: red, at: [6.95, 2.0], label: "x2"}
      - {id: w, color: white, at: [6.0, 3.45], role: cue}
    ghosts:
      - {id: g-start, at: [6.0, 3.45], role: cue_start}
      - {id: g-y1, at: [4.5, 1.2], role: impact, for: w}
      - {id: g-y2, at: [4.95, 1.1], role: impact, for: w}
      - {id: g-r1, at: [6.4, 2.2], role: impact, for: w}
      - {id: g-r2, at: [6.85, 2.2], role: impact, for: w}
    arrows:
      - {id: a-y1, ball: y1, kind: object, path: [[4.4, 1.0], [4.0, 0.0]], to: tm}
      - {id: a-y2, ball: y2, kind: object, path: [[4.8, 1.0], [4.0, 0.0]], to: tm}
      - {id: a-r1, ball: r1, kind: object, path: [[6.55, 2.0], [8.0, 0.0]], to: tr}
      - {id: a-r2, ball: r2, kind: object, path: [[6.95, 2.0], [8.0, 0.0]], to: tr}
      - {id: c-y1, ball: w, kind: cue, path: [[6.0, 3.45], [4.5, 1.2]], bounces: []}
      - {id: c-y2, ball: w, kind: cue, path: [[6.0, 3.45], [4.95, 1.1]], bounces: []}
      - {id: c-r1, ball: w, kind: cue, path: [[6.0, 3.45], [6.4, 2.2]], bounces: []}
      - {id: c-r2, ball: w, kind: cue, path: [[6.0, 3.45], [6.85, 2.2]], bounces: []}
    sequence:
      - {step: 1, cue: w, hit: y1, contact: three_quarter, pocket: tm, repeat: 2}
      - {step: 2, cue: w, hit: y2, contact: three_quarter, pocket: tm, repeat: 2}
      - {step: 3, cue: w, hit: r1, contact: three_quarter, pocket: tr, repeat: 2}
      - {step: 4, cue: w, hit: r2, contact: three_quarter, pocket: tr, repeat: 2}
    inset:
      contact: three_quarter
      tip_point: upper_center
      bridge_height: surface
    annotations:
      - "x 2 à côté de chacune des quatre billes : chaque bille est empochée deux fois"
      - "La blanche part toujours du même emplacement (cercle pointillé en bas, à droite de la médiane)"
    description: >-
      Vue de dessus, extrémité de départ à gauche. Deux billes jaunes côte à côte dans la partie haute, près de la
      poche du milieu haut (x ≈ 4,4 et 4,8 ; y ≈ 1), et deux billes rouges plus bas à droite (x ≈ 6,55 et 6,95 ;
      y ≈ 2), chacune annotée « x 2 ». Chaque bille a, collé en dessous, un cercle pointillé : position de la
      blanche à l'impact. Les jaunes sont envoyées vers la poche du milieu haut (tm), les rouges vers la poche
      haut droite (tr). Un unique cercle pointillé en bas (x ≈ 6, y ≈ 3,45) est l'emplacement de départ de la
      blanche ; quatre traits en partent, un vers chaque cercle d'impact. Le schéma « quantité de bille » en bas à
      gauche montre une bille blanche en avant d'une bille rouge, contact trois-quarts,
      point bleu du tip au-dessus du centre de la blanche, trait vert d'eau sous la bille
      (niveau de la surface).
    uncertainties:
      - "Ligne de départ (trait plein vertical) lue à x ≈ 1,8 et non 2,0 comme la convention du FORMAT."
      - "Les quatre positions de billes sont lues à ≈ 0,1 case près."
      - "Pas de numéro d'ordre de tir sur le schéma : l'ordre jaunes puis rouges vient du texte ; l'ordre entre les deux billes d'une même couleur est supposé gauche puis droite."
      - "Le point de tip du schéma de quantité est lu au-dessus du centre (environ la moitié du rayon) ; la hauteur exacte n'est pas donnée par le texte."
      - "Aucune bille blanche pleine n'est dessinée : w est déclarée à l'emplacement du cercle de départ (6 ; 3,45) pour référencer les flèches."
      - "Les flèches des rouges et jaunes visent les poches tr et tm (têtes de flèche proches des poches) ; le point exact d'arrivée est approximatif."
