    description: >-
      Table vue de dessus, tête à gauche, ligne de départ verticale à environ 1,8 case du bord gauche. Côté
      gauche : une bille jaune vers (2,4 ; 0,6), une jaune vers (2 ; 1,6), une rouge vers (2,4 ; 2) et une bille
