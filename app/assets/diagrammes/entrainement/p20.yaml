      jaune de droite part en diagonale vers la même poche milieu haut. « x5 » est inscrit à gauche de chacune
      des deux flèches d'objet, à mi-hauteur. Au centre bas de la table, un schéma agrandi : la blanche recouvre presque
      entièrement une bille rouge (bille pleine), point bleu légèrement au-dessus du centre de la blanche, trait
      bleu-vert sous la bille.
