      contact: full
      tip_point: above_center
      bridge_height: unknown
    annotations:
      - "Quatre zones, chacune marquée « x3 » : Zone 1 (étiquette vers 2.44 ; 2.27), Zone 2 (vers 5.65 ; 2.31), Zone 3 (vers 1.48 ; 1.67), Zone 4 (vers 6.49 ; 1.70)."
      - "Quatre séries de trois billes = 12 tentatives (taux 8/12)."
    description: >-
      Table vue de dessus, tête à gauche, ligne de départ verticale à environ 1,8 case du bord gauche. La blanche
      est replacée au centre bas de la table (cercle creux pointillé vers 4 ; 3). Quatre billes rouges (vers
      1 ; 1,5, 2 ; 2, 2,8 ; 2,7 et 5 ; 2,3) et quatre billes jaunes (vers 3 ; 2,3, 5,3 ; 2,7, 6 ; 2 et 7 ; 1,5),
      deux billes noires (8) vers (1 ; 3) et (7 ; 3). Deux flèches de trajectoire partent du cercle de la blanche
      vers un cercle creux d'impact collé à la jaune de gauche (vers 3 ; 2,3) puis à la rouge de droite (vers
      5 ; 2,3). La jaune de gauche part en diagonale vers la poche haut gauche ; la rouge de droite part en
      diagonale vers la poche haut droite. Quatre étiquettes « Zone 1 » à « Zone 4 », chacune avec « x3 »,
      figurent près des billes : Zone 1 et Zone 3 à gauche, Zone 2 et Zone 4 à droite. Au centre de la table, un
      schéma agrandi : la blanche recouvre presque entièrement une bille rouge (bille pleine), point bleu
      légèrement au-dessus du centre de la blanche, trait bleu-vert sous la bille.
    uncertainties:
      - "Ligne de départ lue à x ≈ 1.82 sur le schéma (et non 2.0)."
      - "La blanche n'est pas dessinée : son rôle est déduit du cercle creux pointillé (points rouges)."
      - "L'attribution des billes aux Zones 1 à 4 n'est pas lisible : seules deux billes (jaune vers 3 ; 2,3 et rouge vers 5 ; 2,3) portent une flèche vers une poche ; « x3 » est placé à côté des étiquettes de zone, pas des billes."
      - "Les flèches ne sont tracées que pour deux billes sur les huit ; les autres zones suivent vraisemblablement le même principe (non dessiné)."
      - "Les étiquettes « Zone n » sont des étiquettes de texte sans surface délimitée : aucune zone (rect) n'est transcrite."
      - "Le type de chevalet n'est pas indiqué ; trait bleu-vert sous la bille du schéma agrandi non commenté."
      - "Schéma agrandi central : quantité de bille estimée pleine (blanche recouvrant presque entièrement la rouge), point bleu légèrement au-dessus du centre."
      - "Pas de pastille Billard de bronze visible sur la page."
      - "Le fond de la page porte une bande « BLACKBALL FICHE ENTRAÎNEMENT Niveau 1 Le coulé » (pied de page latéral), sans rapport avec le schéma."
