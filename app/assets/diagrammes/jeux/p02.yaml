    kind: game
    sheet: "Posture, visée et coup de queue."
    caption: "Objectif : Viser et empocher 6 billes placées en bord de poches."
    bridge: unknown
    bronze: false
    table: {view: top, head_end: left}
    balls:
      - {id: r1, color: red, at: [0.3, 0.35]}
      - {id: r2, color: red, at: [4.0, 0.4]}
      - {id: r3, color: red, at: [7.7, 0.4]}
      - {id: r4, color: red, at: [0.35, 3.7]}
