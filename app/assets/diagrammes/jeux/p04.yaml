    annotations:
      - "Le jeu se déroule avec des règles similaires à la pétanque. Il peut se disputer en opposant deux joueurs ou par équipe de deux. Chaque tir est effectué depuis la ligne tracée sur la surface de jeu."
      - "Chaque joueur, ou équipe, disposant de 4 billes, il faudra réaliser plusieurs manches pour cumuler 8 points. Le premier joueur à atteindre 8 points a gagné la partie."
    description: >-
      Table vue de dessus, extrémité de départ à gauche. Une ligne pleine verticale est tracée sur la
      surface de jeu, à environ 1,8 case du bord gauche, entre la bande du haut et la bande du bas. À gauche
      de la ligne, deux groupes de quatre billes : quatre rouges en haut à gauche (près de la poche haut
      gauche) et quatre jaunes en bas à gauche (près de la poche bas gauche), chaque groupe en petit
      amas serré. Une bille blanche, marquée de petits points rouges, est posée sur la ligne, au milieu de
      la largeur de la table. Pas de flèche, pas de chevalet, pas de pastille ni de taux de réussite. C'est
      l'illustration du jeu « La puissance » : la blanche est lancée au-delà du trait, puis chaque joueur
      place une de ses billes de son groupe de couleur au plus près de la blanche.
    uncertainties:
      - "Position de la ligne tracée mesurée à x ≈ 1,8 (le FORMAT suppose 2,0 [Prop]) : écart consigné."
      - "La bille blanche porte des points rouges sur le schéma ; interprétée comme la bille blanche du jeu, posée sur la ligne."
      - "Positions des billes lues à environ 0,15 case près."
