      - "Positions des billes lues à environ 0,05 à 0,15 case près ; les billes rouges se touchent, leurs centres exacts sont approximatifs."
      - "Le texte ne précise pas le type de chevalet (bridge: unknown) ; aucun taux de réussite ni nombre de séances sur cette page."
      - "La bille blanche est dessinée pleine (blanche à trois points rouges), posée sur la ligne de départ ; la source n'indique pas si elle doit être placée à cet endroit à chaque partie."
