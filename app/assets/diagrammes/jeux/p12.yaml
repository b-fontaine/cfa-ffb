    annotations:
      - "Règles du jeu : le jeu se déroule en une partie qui oppose deux joueurs."
      - "Les règles sont identiques à une partie classique, excepté que l'on utilise uniquement les billes d'un même groupe de couleur et la bille noire."
      - "Le joueur qui casse est déterminé par le tirage à la bande. S'il empoche une bille, il continue jusqu'à ce qu'il loupe ou commette une faute. Dès lors, son adversaire joue les billes du même groupe de couleur. Les joueurs continuent ainsi jusqu'à empocher la bille noire."
    description: >-
      Table vue de dessus, en paysage. Au centre de la moitié droite, un groupe compact de sept billes
      rouges entoure la bille noire (marquée du chiffre 8), centrée sur le croisement de la 6e ligne
      verticale en pointillés et de la ligne horizontale médiane de la grille (x = 6, y = 2) : une rouge au-dessus, deux à gauche (haut-gauche et
      bas-gauche) et une plus à gauche encore, une en dessous, deux à droite (haut-droite et bas-droite).
      Les billes sont quasiment jointives. La bille blanche (disque blanc cerclé de noir, avec trois petits points rouges) est posée sur
      la ligne de départ (trait plein vertical), au milieu de la largeur (y = 2). Aucune flèche, aucune
      zone grisée, pas de pastille Billard de bronze.
    uncertainties:
