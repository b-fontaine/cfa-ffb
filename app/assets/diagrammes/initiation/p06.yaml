    annotations:
      - "Page sans « x N » ni numéro de bille : une seule bille de couleur par schéma, un seul tir."
    description: >-
      Table vue de dessus, départ à gauche. Schéma de gauche : une bille rouge (environ 1,4 ; 2,6) dans la moitié
      basse de la zone de départ, à gauche de la ligne de départ (trait plein vertical), et la bille blanche
      (environ 1,8 ; 3,5) en bas, posée sur cette ligne. Un cercle creux pointillé (position de la blanche au
      contact) est collé en bas à droite de la rouge ; la blanche vise ce cercle : contact en bille pleine. La rouge
      part en ligne droite vers la poche d'angle haut gauche (tl), la flèche pleine prolonge la ligne de
      visée de la blanche. Petit schéma en bas à gauche : bille blanche vue de face, point bleu légèrement
      au-dessus du centre, arc rouge au sommet (bille cible), repère en croix et trait turquoise sous la bille
      (chevalet).
    uncertainties:
      - "Ligne de départ lue à x ≈ 1,82 (et non 2,0 comme dans FORMAT.md)."
      - "L'énoncé de la fiche demande « un chevalet sur la surface de jeu et un chevalet sur cadre » sans dire quel schéma correspond à quel chevalet : bridge: unknown."
      - "Point bleu du petit schéma lu environ 0,4 rayon au-dessus du centre de la blanche (tip_point: above_center), à confirmer ; dans le petit schéma de droite il est au centre."
      - "Aucune pastille « Billard de bronze », aucun taux de réussite ni « Nombre de séances » sur cette page."
      - "Le schéma de gauche et celui de droite ne sont pas numérotés : l'ordre e1/e2 (gauche/droite) est une convention de transcription."

