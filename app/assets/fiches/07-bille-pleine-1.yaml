# Séance du catalogue : « Quantité de bille pleine », partie 1/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: bille-pleine-1
order: 7
technique: bille-pleine
part: 1
title: Quantité de bille pleine
technical_sheets: [4]
previous: bille-fantome-2
catalogue_block: bille-pleine
notion: Viser le centre de la bille de couleur, en ligne avec la poche, pour l'empocher en bille pleine.
theme:
  name: Tir plein cœur
  pitch: >-
    La bille de couleur a un cœur : son centre. Un tir en plein cœur l'envoie
    droit dans la poche, et chaque bille empochée droit devant est un but marqué.
recall:
  points:
    - La bille fantôme est la blanche à l'impact, au contact de la bille à empocher, sur la ligne de la poche.
    - Elle est retirée avant le tir ; on regarde le point visé sur la bille de couleur.
  question:
    ask: Où se trouve la bille fantôme quand la bille de couleur est alignée avec la poche ?
    answer: "Collée à la bille de couleur, sur la ligne de la poche : c'est à cet endroit que la blanche doit toucher la bille de couleur."
  reuse: {sheet: bille-fantome-2, illustration: visee-plein}
  src: S
theory:
  sections:
    - id: centre
      title: Viser le centre de la bille
      weight: {children: 3, adults: 3}
      body:
        - En bille pleine, on vise le centre de la bille de couleur.
        - La blanche arrive juste derrière elle, sur la ligne qui mène à la poche.
        - La bille de couleur part droit, sur la trajectoire de la blanche.
      adult_extra:
        - Le point de visée est aussi le point de contact entre les deux billes ; c'est vrai seulement en bille pleine.
        - "Au Blackball, la blanche est plus petite que les autres billes : le contact se fait légèrement au-dessus de l'équateur de la blanche, ce qui donne des rejets différents des autres disciplines."
      key_point: "Bille pleine : je vise le centre de la bille, elle part droit."
      demo: Poser la queue sur la trajectoire qui passe par le centre de la blanche et le centre de la bille de couleur.
      illustrations: [contact-plein, visee-plein, hauteur-contact, schema-aligne]
      src: S
    - id: energie
      title: Toute l'énergie passe
      weight: {children: 2, adults: 2}
      body:
        - Au choc, presque toute l'énergie de la blanche passe à la bille de couleur.
        - La bille de couleur parcourt beaucoup ; la blanche parcourt peu.
      adult_extra:
        - "Pour comparer (fiche n° 5) : en demi-bille, l'énergie est à peu près partagée entre les deux billes."
      key_point: "Plein : la couleur file loin, la blanche parcourt peu."
      demo: null
      illustrations: [quantites]
      src: S
    - id: aligner
      title: Aligner poche, bille, blanche
      weight: {adults: 2}
      body:
        - Le centre de la poche et le centre de la bille de couleur donnent la ligne à suivre.
        - Le centre de la blanche doit être sur cette ligne au moment du choc.
        - La bille fantôme aide à voir où la blanche doit toucher.
      adult_extra:
        - Pendant le limage, vérifier que la queue reste sur l'axe qui vise le centre de la bille de couleur.
      key_point: "Poche, bille, blanche : trois centres sur une même ligne."
      demo: Poser une blanche au contact de la bille, sur la ligne de la poche, puis la retirer avant le tir.
      illustrations: [visee-plein, schema-aligne]
      src: S
    - id: attaque
      title: Où frapper la blanche ?
      weight: {children: 1, adults: 1}
      body:
        - On frappe la blanche en son centre, avec la queue bien à l'horizontale.
      key_point: Je frappe la blanche en son centre.
      demo: "Montrer la cible sur la blanche, le procédé au centre de la croix, avec la queue bien à l'horizontale (petit profil). Attention : sur le schéma 1 de la fiche d'initiation, le point d'impact est légèrement au-dessus du centre ; ici on enseigne le centre (proposition), à dire aux élèves qui comparent les deux schémas."
      illustrations: [cue-centre]
      src: Prop
initiation:
  - id: ini-6
    initiation_sheet: 6
    title: Deux billes en plein
    weight: {children: 3, adults: 3}
    setup: "La rouge du schéma 1, puis la jaune du schéma 2 de la fiche, chacune avec la blanche posée comme sur son schéma ; la blanche est replacée après chaque tir."
    goal: "Empocher 2 billes en bille pleine (la rouge du schéma 1, puis la jaune du schéma 2), en utilisant un chevalet sur la surface de jeu et un chevalet sur cadre."
    expected: La blanche touche le centre de la bille de couleur, qui part droit vers la poche ; le transfert d'énergie est quasi total.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation
    src: S
illustrations:
  - {id: contact-plein, type: contact, fraction: full, tip_point: center,
     caption: "Bille pleine : la blanche vise le centre de la bille de couleur.",
     alt: "La blanche, vue de dessus et un peu plus petite que la bille de couleur, est exactement derrière elle : leurs centres sont alignés sur la ligne de visée ; à droite, la blanche vue de face avec son point d'impact au centre."}
  - {id: visee-plein, type: ghost_aim, cue: [4.0, 3.0], object: [2.0, 1.5], pocket: tl, fraction: full,
     caption: "La bille fantôme est collée à la bille de couleur, sur la ligne de la poche.",
     alt: "Blanche en bas à droite, bille de couleur au milieu, poche en haut à gauche : la bille fantôme, cercle creux de la taille de la blanche (un peu plus petite que la bille de couleur), est collée à la bille de couleur ; la blanche, la bille fantôme, la bille de couleur et la poche sont sur une même ligne droite."}
  - {id: hauteur-contact, type: contact_height,
     caption: "Vue de côté, inclinaison exagérée ×10 : la blanche, plus petite, touche la bille de couleur légèrement au-dessus de l'équateur de la blanche.",
     alt: "Vue de côté : la blanche et la bille de couleur, un peu plus grosse, posées sur le tapis ; elles se touchent légèrement au-dessus de l'équateur de la blanche, un point marque le contact et un trait pointillé l'équateur. L'inclinaison est exagérée dix fois pour être visible, la bille de couleur est dessinée bien plus grosse qu'en réalité : ce n'est pas une mesure, en réalité le contact est à moins d'un millimètre au-dessus de l'équateur."}
  - {id: quantites, type: contact_strip, fractions: [full], highlight: full,
     caption: "Bille pleine : presque toute l'énergie passe à la bille de couleur.",
     alt: "Schéma de contact : la blanche, un peu plus petite que la bille de couleur et exactement derrière elle, la touche en bille pleine."}
  - {id: cue-centre, type: cue_ball_target, tip_point: center, cue_height: level,
     caption: "Bille pleine : le procédé frappe la blanche au centre de la cible, queue à hauteur moyenne.",
     alt: "La blanche vue de face avec une cible (deux anneaux, une croix aux quatre côtés nommés Haut, Bas, Gauche, Droite) : le point d'impact du procédé, dessiné à l'échelle de la blanche, est au centre de la croix ; un petit profil montre la queue à hauteur moyenne."}
  - {id: schema-aligne, type: diagram_ref, diagram: initiation-p06-e2,
     caption: "Bille et blanche exactement alignées avec la poche du milieu du haut.",
     alt: "Table vue de dessus : une bille jaune et la blanche sont alignées sur une même verticale avec la poche du milieu du haut ; la jaune part droit dans la poche."}
  - {id: schema-initiation, type: diagram_ref, diagram: initiation-p06-e1,
     caption: "Initiation 6 : la rouge est jouée en plein vers la poche du haut à gauche.",
     alt: "Table vue de dessus : une bille rouge près de la poche du haut à gauche, la blanche en bas à droite de la rouge ; la blanche touche la rouge en plein."}
  - {id: schema-jeu, type: diagram_ref, diagram: jeux-p06-j1,
     caption: "Jeu 6 : la noire doit finir dans le camp adverse, entouré de quatre billes.",
     alt: "Table vue de dessus : à gauche un camp entouré de quatre rouges, à droite un camp entouré de quatre jaunes ; la noire et la blanche sont sur la ligne du milieu, la noire doit aller vers le camp adverse."}
training:
  exercises:
    - id: e1
      ref: {block: bille-pleine, n: 1}
      diagram: entrainement-p03-e1
      title: Les deux cibles
      weight: {children: 2, adults: 1}
      setup: Les deux jaunes du schéma, l'une à gauche et l'autre à droite de la blanche, posée en bas entre elles ; la jaune de gauche vise la poche d'angle du haut à gauche, celle de droite la poche du milieu du haut.
      instruction: Empocher chaque jaune en bille pleine, quatre tirs par jaune ; la jaune est replacée après chaque tir.
      expected: Le contact se fait au centre de la jaune, qui part droit vers sa poche ; la blanche parcourt peu.
      mistakes:
        - {symptom: La jaune part de côté, fix: "Vérifier que la blanche, la jaune et la poche sont sur une même ligne, puis viser le centre."}
        - {symptom: La blanche suit la jaune, fix: "Vérifier que le procédé frappe bien le centre de la blanche et que la queue est horizontale ; la blanche doit s'arrêter près de l'impact."}
      playful:
        hook: Chaque jaune qui part droit dans la poche est un but, marqué au tableau.
        challenge: Empocher les quatre tirs d'une même jaune d'affilée, sans la déplacer entre les tirs.
      passes: 2
      src: S
    - id: e2
      ref: {block: bille-pleine, n: 2}
      diagram: entrainement-p03-e2
      title: Les deux diagonales
      weight: {children: 1, adults: 1}
      setup: Les billes du schéma en deux diagonales, les rouges en haut vers la poche d'angle du haut à gauche, les jaunes en bas vers la poche d'angle du bas à gauche ; la blanche au centre de la table.
      instruction: Empocher les rouges puis les jaunes en bille pleine, en commençant par la bille la plus proche de la blanche ; la blanche est replacée au centre avant chaque tir.
      expected: Chaque bille part droit vers sa poche ; la main d'appui reste stable et l'élève ne se relève pas avant la fin du tir.
      mistakes:
        - {symptom: Une bille gêne la ligne de tir, fix: "Commencer par la bille la plus proche de la blanche, puis reculer."}
        - {symptom: L'élève se relève ou bouge pendant le tir, fix: "Rester immobile jusqu'à ce que la bille soit partie et regarder le point cible."}
        - {symptom: L'élève suit l'ordre des numéros de la fiche, fix: "Les numéros ne sont pas un ordre imposé ; on commence par la bille la plus proche de la blanche pour dégager la ligne."}
      playful:
        hook: Avant chaque tir, annoncer « centre ! » ; le camarade vérifie la ligne en posant sa queue au sol.
        challenge: Vider une diagonale entière sans rater, puis échanger les rôles avec le contrôleur.
      passes: 1
      src: S
game:
  title: Placer la noire dans une zone
  source_game: 6
  adapted: false
  players: Partie à 2
  materials: "Billes du jeu complet, noire et blanche. Pour le défi ludique (proposition) : un tableau et des jetons."
  setup_illustration: schema-jeu
  rules:
    - Placer la noire dans le camp adverse, en un tir, en la visant en bille pleine avec un chevalet sur cadre.
    - Les joueurs tirent à tour de rôle ; la noire peut rebondir sur la petite bande.
    - Le coup n'est pas valable si le joueur commet une faute ou si la noire touche une bille.
    - Faire aussi jouer avec un chevalet sur la surface de jeu, en espaçant davantage la blanche et la noire de la bande.
  scoring: Chaque noire placée dans le camp adverse compte un point.
  end: Fin quand un joueur a placé 5 fois la noire dans le camp adverse.
  playful_variant: "Tournante : à la fin de chaque manche, chacun change d'adversaire (le jeu reste à 2). Le joueur qui annonce « plein cœur » avant son tir et réussit gagne un jeton ; deux jetons donnent un tir de rattrapage. Une seule annonce par tir pour les enfants : « plein cœur »."
  link_previous:
    notion_of: bille-fantome-2
    rule: "Exception aux règles du jeu 6, avant chaque tir : le joueur annonce « fantôme » et désigne du doigt, sur la noire, l'endroit où sa blanche doit la toucher (la place de la bille fantôme, comme dans le duel de la séance précédente) ; l'adversaire contrôle que cet endroit est aligné avec le camp visé."
    note: "Rejoue l'annonce de la bille fantôme de la séance précédente au service de la bille pleine ; règle facultative, réservée aux adultes (les enfants n'annoncent que « plein cœur ») ; le jeu 6 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Agrandir le camp visé pour faciliter le tir (la fiche conseille de modifier la zone ; c'est le seul conseil de la fiche). Mise en place proposée (la fiche ne la précise pas), symétrique : chaque joueur tire depuis sa petite bande, vers le camp de l'autre ; la noire est posée sur l'axe de la table, à la même distance de la petite bande que sur le schéma (environ un quart de la longueur de la table), la blanche juste derrière elle, entre la noire et la petite bande, et c'est la blanche qui frappe la noire ; noire et blanche sont replacées après chaque tir. Le camp est la zone entourée des quatre billes. Le tir n'est pas valable si la noire est empochée, si elle touche une des quatre billes ou si elle s'arrête sur le bord du camp, à cheval sur la ligne qui joint deux billes. Pour raccourcir le tir (proposition) : poser la noire plus près du camp visé. Manches courtes, premier à 3 ; en salle, tournante d'adversaires pour que chacun joue vite. Pour doser l'arrêt de la noire, rappeler la puissance travaillée aux séances de puissance."
    adults: "Rétrécir le camp visé (la fiche conseille de modifier la zone). Mise en place proposée comme pour les enfants : chaque joueur tire depuis sa petite bande vers le camp de l'autre, noire sur l'axe de la table à la même distance de la petite bande que sur le schéma et blanche juste derrière elle, replacées après chaque tir ; le camp est la zone entourée des quatre billes ; noire empochée, noire qui touche une des quatre billes ou noire arrêtée sur le bord du camp = tir non valable. Après la partie, chercher ensemble ce qui a écarté la noire : alignement, point d'impact ou puissance."
  src: S   # titre, règles, score et fin du jeu 6 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Que vise-t-on sur la bille de couleur en bille pleine ?
    - Quelle ligne as-tu vérifiée avant de tirer ?
    - Quel tir t'a le mieux réussi, et pourquoi ?
sources:
