  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 13, note: "Fiche technique n° 3 (viser pour empocher, bille fantôme, pour le rappel)"}
  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 15, note: "Fiche technique n° 5 (demi-bille : partage de l'énergie, pour la comparaison adulte)"}
