  - {rank: S, file: Fiches Entrainement CFA blackball.pdf, page: 3, note: "Entraînement « La quantité de bille pleine », exercices 1 et 2"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 6, note: Jeu 6}
uncertainties:
  - "Mises en place en texte, défis ludiques, variante de jeu (jetons compris), règle de lien et adaptation du jeu : [Prop], à valider par un animateur dans l'application. La différenciation enfants / adultes (poids, compléments, adaptation du jeu) est aussi une proposition."
  - "La section « Où frapper la blanche ? » est [Prop] : le dessin de la fiche n° 4 n'est pas légendé et le point d'impact du procédé au centre de la blanche est une interprétation (transcription techniques p14) ; l'initiation 6 montre un point légèrement au-dessus du centre sur un des deux schémas."
  - "Le schéma « hauteur-contact » (vue de côté, inclinaison exagérée ×10) est dans la section « Où frapper la blanche ? », donc vu par les deux publics, alors que le texte sur l'équateur est réservé aux adultes : le format ne permet pas d'illustration réservée à un public. [Prop], à faire trancher par la relecture pédagogique (règle enfants « 1 notion, explications courtes »)."
  - "Initiation 6 : la fiche cite un chevalet sur la surface de jeu et un chevalet sur cadre sans dire lequel va avec quel schéma ; la séance ne l'impose pas."
  - "Entraînement 2 : sur le schéma, les billes 1 à 4 sont alignées derrière les billes 5 et 6 ; l'ordre « la plus proche de la blanche d'abord » est une lecture [Prop] pour dégager la ligne."
  - "Entraînement 1 : le schéma note « x 4 » à côté de chaque jaune ; la consigne « quatre tirs par jaune » en est la lecture, sans ordre précisé entre les deux jaunes."
  - "Jeu 6 : le schéma ne montre pas explicitement le rôle de la blanche (dessinée en cercle creux) ni le point d'arrêt de la noire ; la séance reprend le texte de la fiche et comble ces points par des mises en place [Prop] (adaptation : côtés, noire et blanche sur l'axe à la distance du schéma, replacement, tir non valable si la noire est empochée, touche une bille ou s'arrête sur le bord du camp)."
  - "Jeu 6 : la fiche dit à la fois « 5 tirs à tour de rôle » et « le premier à placer 5 fois la noire gagne » ; la séance ne garde que « premier à 5 » (fin du jeu) sans fixer le nombre de tirs par joueur."
  - "Le rappel reprend `visee-plein` de bille-fantome-2 (V7) ; ses points reprennent la fiche n° 3 (fantôme à l'impact, retirée avant le tir) ; le décalage de la fantôme en demi-bille, déduction [Prop] de bille-fantome-2, n'est pas rappelé. Le chevalet sur la surface et la distance, section [Prop] de bille-fantome-2, ne sont pas rappelés."
