# Séance du catalogue : « Le rejet naturel », partie 1/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: rejet-naturel-1
order: 16
technique: rejet-naturel
part: 1
title: Le rejet naturel
technical_sheets: [10]
previous: rebond-bande-2
catalogue_block: rejet-naturel
notion: Empocher une bille en demi-bille avec une attaque haute, pour que la blanche soit rejetée à environ 45°.
theme:
  name: Le virage à 45°
  pitch: >-
    La blanche frappe la bille de couleur puis prend un virage d'environ 45°,
    vers la zone où l'on veut la poser. Chaque virage réussi prépare le tir
    suivant.
recall:
  points:
    - Sans effet, la blanche repart d'une bande avec un angle de rebond égal à l'angle d'arrivée.
    - "On vise un point de la bande, et non la bille ; plus l'angle d'arrivée est ouvert, plus ce point est loin du point d'impact."
    - Plus le coup est puissant, plus l'angle de rebond se referme.
    - "Aujourd'hui, la blanche ne passe plus par la bande : on prévoit où elle repart après avoir touché une bille."
  question:
    ask: Quand la blanche arrive sur une bande sans effet, comment repart-elle ?
    answer: Avec un angle de rebond égal à l'angle d'arrivée ; un coup puissant referme un peu l'angle.
  reuse: {sheet: rebond-bande-2, illustration: angle-ouvert}
  src: Prop
theory:
  sections:
    - id: rejet
      title: La blanche repart à environ 45°
      weight: {children: 3, adults: 3}
      body:
        - On joue la bille de couleur en quantité proche de la demi-bille, en visant la tangente.
        - On frappe la blanche un peu au-dessus de son centre.
        - Après l'impact, la blanche dévie d'environ 45° par rapport à sa trajectoire initiale.
      adult_extra:
        - "On connaît ainsi la direction de la blanche : on vérifie qu'elle ne va pas vers une poche et on prévoit le replacement en adaptant la puissance."
      key_point: "Demi-bille, attaque haute : la blanche part à environ 45°."
      demo: "Tirer en demi-bille avec une attaque haute, puis repérer où la blanche s'arrête."
      illustrations: [deviation-45, contact-haut]
      src: S
    - id: de-cote
      title: Qui envoie la blanche de côté ?
      weight: {children: 1, adults: 1}
      body:
        - La demi-bille envoie la blanche de côté.
        - "L'attaque haute la fait tourner vers l'avant : après le choc, elle continue d'avancer au lieu de partir presque à angle droit, et dévie moins, environ 45°."
        - "La bille de couleur n'est pas un mur : elle part vers la poche, et la blanche file de côté."
      key_point: "Demi-bille : la blanche part de côté ; attaque haute : elle continue d'avancer et dévie moins, environ 45°."
      demo: null
      illustrations: [deviation-45]
      src: Prop
    - id: attaque-haute
      title: Frapper la blanche en haut
      weight: {children: 2, adults: 2}
      body:
        - Le procédé touche la blanche un peu au-dessus de son centre, pas au bord.
        - Il ne faut pas jouer trop vite, sinon la blanche peut reculer.
        - "Astuce de la fiche : avec la blanche près d'une bande et le chevalet sur cadre, le joueur place obligatoirement son procédé en haut."
      key_point: Attaque haute et coup pas trop rapide.
      demo: null
      illustrations: [attaque-haute]
      src: S
    - id: mot-replacement
      title: Le mot « replacement »
      weight: {children: 1}
      body:
        - "Replacer la blanche, c'est la faire arriver à l'endroit choisi pour le tir suivant ; cet endroit s'appelle la zone de replacement."
      key_point: On choisit d'avance où la blanche doit s'arrêter.
      demo: null
      illustrations: []
      src: Prop
    - id: zone
      title: Viser la zone de replacement
      weight: {children: 2, adults: 2}
      body:
        - Avant de tirer, on regarde où la blanche va repartir.
        - On peut poser une bille sur le chemin prévu, dans la zone de replacement, puis tirer pour vérifier.
      adult_extra:
        - "Faire placer la blanche par l'élève lui-même : cela permet de vérifier que la notion de demi-bille est intégrée."
      key_point: On décide où la blanche doit aller avant de tirer.
      demo: "Poser une bille sur la trajectoire prévue de la blanche, tirer, et constater si la blanche la touche."
      illustrations: [schema-initiation, chemin-blanche]
      src: S
initiation:
  - id: ini-12
    initiation_sheet: 12
    title: Un rejet vers la zone
    weight: {children: 3, adults: 3}
    setup: La jaune au centre de la table, alignée avec la poche du milieu du haut ; l'élève pose lui-même la blanche, en bas à droite de la jaune, à courte distance, là où il voit la demi-bille.
    goal: Empocher la jaune par un rejet naturel, en dirigeant la blanche dans la zone de replacement.
    expected: La jaune part vers la poche ; la blanche est rejetée vers la zone de replacement sans reculer.
    scoring:
      mode: checklist
      criteria:
        - La jaune est empochée.
        - La blanche part vers la zone de replacement, sans reculer.
    illustration: schema-initiation
    src: S
