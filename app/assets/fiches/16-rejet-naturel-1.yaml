     caption: "Après l'impact, la blanche dévie d'environ 45° par rapport à sa trajectoire initiale (marque d'angle seule ; voir le chemin de la blanche pour les billes).",
     alt: "Table vue de dessus, sans bille : deux traits partent du point d'impact et un arc d'environ 45° marque l'écart entre le prolongement de la trajectoire initiale de la blanche et sa nouvelle direction, vers la gauche. Les billes sont visibles dans l'illustration « chemin de la blanche »."}
  - {id: contact-haut, type: contact, fraction: half, tip_point: top, offset: slight,
     caption: "Demi-bille : la blanche, un peu plus petite que la bille de couleur, vise la tangente. À droite, le procédé frappe la blanche un peu au-dessus de son centre, pas au bord.",
     alt: "À gauche, vue de dessus : la blanche, un peu plus petite que la bille de couleur, la touche en demi-bille, sa trajectoire passant par la tangente de la bille de couleur. À droite, la blanche vue de face avec un anneau à mi-rayon : le point d'impact du procédé est entre le centre et le bord, dans la partie haute."}
  - {id: attaque-haute, type: cue_ball_target, tip_point: top, offset: slight, cue_height: level,
     caption: "Le procédé frappe la blanche un peu au-dessus de son centre, pas au bord (schéma indicatif).",
