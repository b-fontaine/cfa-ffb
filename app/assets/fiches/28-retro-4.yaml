uncertainties:
  - "Jeu : la source ne propose aucun jeu spécifique au rétro ; le jeu 14 est repris et adapté (règle de lien pour les adultes, variante en équipes pour les enfants) : [Prop], à valider par un animateur dans l'application. Le rappel des règles classiques est repris du jeu 12 ; les jetons de la règle de lien (adultes) n'ont aucun effet sur la victoire."
  - "Thème (Le boomerang), notion et titre alignés sur retro-1, retro-2 et retro-3 (V23) ; défis ludiques, variante de jeu (enfants, sans règle de lien), règle de lien (adultes), adaptations, poids et minutes : [Prop]."
  - "Le rappel porte sur retro-3 (quantité et puissance, trois-quarts plus ou moins ouvert, proche du demi-bille un peu plus plein à peu près à angle droit, exercices 7 et 8 ; la limite du rétro et le cas du Blackball sont enseignés dans retro-4, pas rappelés) : recall.reuse cite son illustration schema-e8 et link_previous reprend ses exercices 7 et 8."
  - "Initiation 19 : rétro en demi-bille, alors que l'exercice 8 de retro-3 faisait déjà jouer le rétro en demi-bille ; l'ordre des fiches 17 à 19 par séance suit la répartition des parties du FORMAT et n'a pas été modifié (une initiation après l'entraînement est une conséquence de ce découpage)."
  - "Exercices 9 et 10 : la source ne précise pas le type de chevalet ; la quantité de bille est lue sur l'encart (environ demi-bille), non légendée ; les limites des zones 1 et 2 ne sont pas tracées sur le schéma, et la blanche n'y est pas dessinée (position déduite du cercle pointillé). La matérialisation des zones à la craie ou au ruban, leur position et leur taille sont une proposition."
  - "Exercice 10 : l'énoncé parle de six tirs alors que le schéma ne montre que cinq billes colorées ; la séance ne donne que la rouge à jouer trois fois par zone, replacée après chaque tir. Le schéma montre le même encart de quantité pour les deux zones ; le rôle de la puissance pour passer de la zone 1 à la zone 2 est une lecture du schéma, [Prop] : elle n'est formulée que dans la section « Passer d'une zone à l'autre » et dans les conseils d'erreurs marqués « Proposition », jamais dans l'attendu de l'exercice, qui ne retient que la zone atteinte."
  - "Illustrations générées et indicatives : les zones de zones-rebond sont déduites des étiquettes du schéma de l'exercice 10 (proposition) ; angle-90 et retro-demi reprennent la fiche d'initiation 19, avec la bille fantôme recalculée à la distance de contact r_c + r_o = 0,2136 case de la rouge, sur la ligne rouge-poche (blanche à x = 1,10, soit une visée à 0,10 case du centre de la rouge : un peu plus pleine que la demi-bille, 0,1098, comme le dit la fiche) ; dans zones-rebond, seule la bille fantôme est recalculée (2,01 ; 1,10), le départ de la blanche restant celui du schéma de l'exercice 10. Le procédé de attaque-basse est dessiné au point bottom : à mi-rayon sous le centre de la blanche [Prop], sur l'anneau intérieur, et non au bord, ce qui risquerait une fausse queue ; la source ne chiffre pas la hauteur d'attaque. Dans chevalet-cadre-profil, la main d'appui sur le rail est une lecture proposée de « chevalet sur cadre » (le type de chevalet n'est pas précisé par la source) ; la figure ne montre pas la hauteur du procédé, que porte attaque-basse. Dans plan-zones, les deux exemples (moyen, puis puissant) sont [Prop] : la source ne donne que les extrêmes (peu de recul et peu de vitesse, grand recul et grande vitesse) ; ils ne sont pas des consignes d'exercice."
  - "Section « Au-delà du trait, ou par la bande » : [Prop] (badge « Proposition »). Elle ne fait que décrire les deux retours des exercices 9 et 10 ; l'idée de décider la destination avant le tir n'est pas formulée telle quelle par la source et n'est portée que par la section de retro-3 (« Décider où la blanche s'arrête »), que le rappel de cette séance reprend. Les conseils d'erreurs de l'exercice 10 qui touchent à la puissance sont marqués « Proposition »."
