  - id: ini-19
    initiation_sheet: 19
    title: Un rétro en demi-bille
    weight: {children: 2, adults: 2}
    setup: La rouge à gauche du trait du schéma ; la blanche en dessous de la rouge, à courte distance, de sorte que le rétro se joue vers la droite.
    goal: Empocher la rouge en réalisant un rétro en demi-bille, avec une vitesse suffisante pour que la rotation arrière dure jusqu'au contact, puis laisser la blanche suivre une trajectoire parallèle à la grande bande.
    expected: La rouge part vers la poche d'angle ; la blanche repart à angle droit (90°) de sa trajectoire d'arrivée, sans courbe marquée.
    scoring: {mode: counter, of: 1}
    illustration: schema-initiation
    src: S
