# Séance du catalogue : « Le rétro », partie 4/4.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: retro-4
order: 28
technique: retro
part: 4
title: Le rétro
technical_sheets: [14]
previous: retro-3
catalogue_block: retro
notion: Jouer un rétro, attaquer la blanche sous son centre pour la faire reculer après le contact.
theme:
  name: Le boomerang
  pitch: >-
    La blanche part, touche la bille, puis repart comme un boomerang, de côté
    ou en arrière. Dernier épisode : l'envoyer au-delà d'une frontière, puis
    dans une zone choisie, pour jouer la noire.
recall:
  points:
    - Entre le plein et le demi-bille, la déviation de la blanche dépend de la quantité de bille et de la puissance.
    - "Même rouge, même poche : en trois-quarts, la blanche recule plus ou moins ouverte selon la puissance du coup."
    - En quantité proche du demi-bille, un peu plus pleine, la blanche repart à peu près à angle droit.
    - Aux exercices 7 et 8 de la fiche d'entraînement, la blanche s'arrête dans une zone ou au-delà d'un trait, toujours en attaque basse.
  question:
    ask: De quoi dépend l'endroit où la blanche s'arrête, et que fait-elle en quantité proche du demi-bille, un peu plus pleine ?
    answer: De la quantité de bille et de la puissance du coup ; en quantité proche du demi-bille, un peu plus pleine, elle repart à peu près à angle droit.
  reuse: {sheet: retro-3, illustration: schema-e8}
  src: S
theory:
  sections:
    - id: recul
      title: La blanche recule
      weight: {children: 1, adults: 2}
      body:
        - Pour un rétro, le procédé frappe la blanche sous son centre.
        - La blanche part avec une rotation arrière ; après le contact, elle recule.
        - En bille pleine, elle revient exactement sur son chemin d'arrivée.
      key_point: Attaque basse, et la blanche recule après le contact.
      demo: "Jouer un rétro en bille pleine à courte distance et montrer que la blanche revient sur son chemin d'arrivée."
      illustrations: [attaque-basse, retro-plein]
      src: S
    - id: quantite-puissance
      title: Où la blanche s'arrête
      weight: {children: 2, adults: 3}
      body:
        - Plus on s'écarte du plein, plus la blanche s'écarte de son chemin d'arrivée.
        - La déviation dépend de la quantité de bille et de la puissance du coup.
        - En demi-bille, la blanche repart sur le côté, à peu près à angle droit (90°) de sa trajectoire d'arrivée ; plus bas, elle ne recule plus.
        - "Au Blackball, la blanche est plus petite que les autres billes : pour obtenir 90°, on vise un peu plus à l'intérieur de la demi-bille, donc un peu plus plein."
      adult_extra:
        - "Selon la fiche, la blanche étant petite, le 90° n'est pas tout à fait atteint en demi-bille exacte ; sur les schémas, l'écart de taille est trop faible pour se voir, la note sous les schémas de quantité le rappelle."
        - "Si le coup est trop rapide, la blanche peut décrire une légère courbe, liée à la friction sur le tapis : la déviation dépasse alors 90°."

      key_point: La quantité de bille et la puissance règlent où la blanche s'arrête.
      demo: "Jouer le même rétro en plein, puis en trois-quarts, puis en demi-bille, et marquer où la blanche s'arrête."
      illustrations: [quantites, retro-demi, angle-90]
      src: S
    - id: viser-zone
      title: Au-delà du trait, ou par la bande
      weight: {children: 2, adults: 2}
      body:
        - Le but du rétro est de replacer la blanche pour jouer ensuite la noire.
        - Au premier défi (exercice 9), la blanche repart sur le côté, parallèlement à la grande bande, et passe un trait.
        - Au deuxième défi (exercice 10), elle passe par la bande du haut avant d'arriver dans la zone 1 puis dans la zone 2.
      key_point: Deux retours à connaître, au-delà d'un trait ou par la bande.
      demo: null
      illustrations: [schema-e9, schema-e10, zones-rebond]
      src: Prop
    - id: zone-puissance
      title: Passer d'une zone à l'autre
      weight: {adults: 1}
      body:
        - "Sur le schéma de l'exercice 10, l'encart de quantité reste le même (environ une demi-bille) pour les deux zones."
        - C'est surtout la puissance qui fait passer la blanche de la zone 1 à la zone 2.
        - "Sur le plan amplitude et vitesse, plus de recul de la main donne un coup plus rapide, donc une blanche qui va plus loin (deux exemples proposés, sans graduation)."
      key_point: Sur ce schéma, la puissance fait passer de la zone 1 à la zone 2.
      demo: "Jouer le même rétro deux fois, plus doux puis plus franc, et marquer où la blanche s'arrête."
      illustrations: [schema-e10, plan-zones]
      src: Prop
    - id: chevalet-cadre
      title: Sur le chevalet sur cadre
      weight: {adults: 1}
      body:
        - Sur un chevalet sur cadre, lever légèrement le talon de la queue pour obtenir une attaque basse.
        - Si la queue se relève en fin de coup, la main est trop serrée.
      key_point: Talon légèrement levé et main souple pour une attaque basse.
      demo: null
      illustrations: [attaque-basse, chevalet-cadre-profil]
      src: S
