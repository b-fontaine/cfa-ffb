training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e9
      ref: {block: retro, n: 9}
      diagram: entrainement-p31-e9
      title: Passer le trait en rétro
      weight: {children: 2, adults: 1}
      setup: La rouge à gauche du trait, les jaunes et la noire comme sur le schéma ; la blanche sur son repère, en bas à gauche, sous la rouge ; le trait est la ligne verticale du schéma. Après chaque tir, replacer la rouge sur son point et la blanche sur son repère.
      instruction: Empocher la rouge en rétro vers la poche du haut à gauche, de façon que la blanche s'arrête au-delà du trait, côté droit du schéma, pour pouvoir jouer ensuite la noire ; cinq tirs.
      expected: La rouge est empochée et la blanche franchit le trait vers la droite, bien placée pour jouer la noire.
      mistakes:
        - symptom: La blanche ne recule pas ou s'arrête avant le trait
          fix: Attaquer plus bas sur la blanche et donner assez de vitesse.
        - symptom: La queue se relève en fin de coup
          fix: Desserrer la main et garder la queue stable jusqu'à la fin du geste ; seul le talon se lève, légèrement, avant le coup sur un chevalet sur cadre.
        - symptom: La blanche décrit une courbe et passe loin de la zone
          fix: Réduire la vitesse du coup et vérifier la quantité de bille.
      playful:
        hook: >-
          Le trait est la frontière du boomerang : chaque retour réussi vaut
          un tampon dans le carnet de l'élève.
        challenge: >-
          Faire franchir la frontière à la blanche trois fois de suite pour
          gagner le titre de lanceur confirmé.
      passes: 2
      src: S
    - id: e10
      ref: {block: retro, n: 10}
      diagram: entrainement-p31-e10
      title: Deux zones d'arrivée par la bande
      weight: {children: 1, adults: 1}
      setup: "La rouge sur le trait, les jaunes et la noire comme sur le schéma ; la blanche sur son repère, à droite et en dessous de la rouge ; la blanche passe par la bande du haut pour arriver dans la zone 1 ou la zone 2. Après chaque tir, replacer la rouge sur son point et la blanche sur son repère. Les zones ne sont pas tracées sur le schéma : proposition, les matérialiser à la craie ou au ruban, la zone 1 vers le milieu droit de la table (environ 5,2 sur 8 en partant de la gauche) et la zone 2 un peu plus loin (environ 6,4), taille à fixer par l'animateur."
      instruction: Empocher la rouge en rétro vers la poche du haut à gauche, trois fois avec la blanche qui s'arrête dans la zone 1, puis trois fois dans la zone 2, pour pouvoir jouer ensuite la noire ; six tirs en tout.
      expected: La rouge est empochée et la blanche s'arrête dans la zone annoncée avant le tir.
      mistakes:
        - symptom: La blanche s'arrête avant la zone
          fix: "Proposition : augmenter légèrement la puissance sans changer le point d'attaque."
        - symptom: La blanche dépasse la zone
          fix: "Proposition : réduire la puissance ; si elle part trop sur le côté, modifier un peu la quantité de bille."
        - symptom: La blanche s'arrête dans la même zone à chaque tir
          fix: "Proposition (lecture du schéma, voir la section « Passer d'une zone à l'autre ») : garder la quantité de bille et ne changer que la puissance, plus doux pour la zone 1, plus franc pour la zone 2."
      playful:
        hook: >-
          Avant chaque tir, l'élève annonce « zone 1 » ou « zone 2 » et son
          partenaire vérifie le point d'arrivée.
        challenge: >-
          Réussir un retour dans chacune des deux zones, l'une après l'autre,
          pour gagner une étoile de boomerang.
      passes: 1
      src: S
game:
  title: Partie à difficulté réduite, avec rétro
  source_game: 14
  adapted: true
  players: "Partie à 2 ; en variante ludique, 2 équipes de 2 qui se relaient tir après tir."
  materials: "Billes du jeu complet, quatre par groupe plus la noire. Pour la variante ludique (proposition) : rien de plus. Pour la règle de lien, adultes seulement (proposition) : un tableau ou un carnet, des jetons, de la craie ou du ruban pour matérialiser un trait ou une zone."
  setup_illustration: schema-jeu
  rules:
    - Jouer une partie avec les règles classiques, avec seulement quatre billes de chaque groupe de couleur et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
    - "Rappel des règles classiques : un joueur qui empoche une bille continue jusqu'à ce qu'il manque ou commette une faute ; chacun vide son groupe de couleur puis empoche la noire."
  scoring: Comme dans une partie classique, le premier qui empoche son groupe de billes puis la noire gagne.
  end: Fin quand un joueur a vidé son groupe puis empoché la noire.
  playful_variant: "Version enfants, autonome (proposition) : le boomerang en équipes. Deux équipes de deux se relaient tir après tir, et cherchent à jouer des rétros comme à la séance précédente ; la victoire reste celle de la partie classique, sans annonce ni jeton."
  link_previous:
    notion_of: retro-3
    rule: "Adultes seulement (les enfants jouent la variante). Exception facultative aux règles classiques : le joueur qui vient d'empocher une bille et rejoue annonce, avant son tir suivant, un rétro et la destination de la blanche, zone ou trait matérialisé à la craie ou au ruban avant le tir, comme aux exercices 7 et 8 (trait ou zone), éventuellement par une bande. Il marque un jeton si la bille est empochée et si la blanche s'arrête dans la zone annoncée ou au-delà du trait."
    note: "Reprend le choix d'une destination pour la blanche (zone ou trait) et le réglage de la quantité et de la puissance travaillés à la séance précédente, et y ajoute le passage par la bande ; règle facultative, la partie se joue telle quelle sans elle. Une seule règle facultative par partie."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Version enfants : la variante en équipes seule, sans la règle de lien ; le tirage à la bande désigne celui qui casse et la partie se termine comme une partie classique."
    adults: "Version adultes : la règle de lien seule, sans la variante ludique. Après la partie, compter les rétros annoncés et réussis, à titre indicatif (aucun taux de référence : la source n'en donne pas pour ce jeu)."
  src: Prop
review:
  prompts:
    - Dans quel rétro la blanche est-elle revenue exactement où tu voulais ?
    - Qu'est-ce qui change quand tu passes par la bande avant la zone ?
    - Que dirais-tu à un copain pour que sa blanche recule sans se courber ?
