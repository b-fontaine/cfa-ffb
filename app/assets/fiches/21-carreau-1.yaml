  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 21, note: "Fiche technique n° 11 (coulé, attaque haute, pour le rappel)"}
  - {rank: S, file: Fiches Initiation CFA blackball.pdf, page: 15, note: Initiation 15}
  - {rank: S, file: Fiches Entrainement CFA blackball.pdf, page: 23, note: "Entraînement « Le carreau », exercices 1 et 2"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 14, note: "Jeu 14 (partie à difficulté réduite)"}
uncertainties:
  - "Thème, défis, sections « La blanche se gare » (enfants) et « Quel chevalet ? », variante de jeu (conseil, jetons, annonce), règle de lien (adultes) et adaptations : [Prop], à valider par un animateur dans l'application. Le minutage et la différenciation enfants / adultes sont aussi des propositions."
  - "Le jeu est le jeu 14 [S] repris tel quel : la fiche ne propose aucun jeu dédié au carreau et ne mentionne pas le carreau ; le conseil de le chercher à courte distance est une proposition (playful_variant)."
  - "Le rappel porte sur la séance coule-3 (fiche technique n° 11 : attaque haute, du plein au trois-quarts, amplitude, zone d'arrivée) ; `recall.reuse` reprend son illustration `coule-plein`."
  - "Initiation 15 : la fiche cite un chevalet sur surface et un chevalet sur cadre sans dire lequel va avec quel tir ; la section « Quel chevalet ? » propose cadre pour la blanche proche de la bande (seconde position du schéma), surface pour l'autre : [Prop]."
  - "Entraînement 1 et 2 : le type de chevalet n'est pas indiqué ; la fiche dit « replacer la blanche sur la bille noire », mais sur le schéma 1 la blanche s'arrête à l'impact (environ 5,1 ; 2,2) alors que la noire est en (7,0 ; 1,0), soit plus de 2 unités du repère avec une jaune entre les deux : la consigne de la séance reprend la formulation de la fiche (« replacer la blanche sur la noire ») ; l'attendu se limite à l'arrêt de la blanche à l'impact, sans prétendre qu'elle atteint la noire. Au schéma 2, le dégagement entre les deux jaunes est serré."
  - "Le complément adulte de « Carreau ou coulé ? » rapproche les fiches n° 11 (coulé, du plein au trois-quarts) et n° 12 (carreau, plein) : mise en regard pédagogique à valider ; l'opposition amplitude (fiche 11) / pénétration et vitesse (fiche 12) reprend chaque fiche."
  - "Tailles : la blanche (48,0 mm) est un peu plus petite que la bille de couleur (50,8 mm) [FFB] ; `schema-carreau` la dessine à sa taille, avec la bille fantôme à s = r_c + r_o ; la fiche n° 12 [S] attribue le recul à la différence de poids seule, la taille n'y est pas citée pour le carreau."
  - "Les illustrations `attaque-centre`, `attaque-haute` et `schema-carreau` sont indicatives (non à l'échelle)."
