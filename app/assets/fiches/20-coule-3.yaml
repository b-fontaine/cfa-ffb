# Séance du catalogue : « Le coulé », partie 3/3.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: coule-3
order: 20
technique: coule
part: 3
title: Le coulé
technical_sheets: [11]
previous: coule-2
catalogue_block: coule
notion: Replacer la blanche par un coulé, attaque en haut, en quantité de bille du plein au trois-quarts.
theme:
  name: Dans le sillage
  pitch: >-
    La barque suit le bateau dans son sillage : dernière étape du voyage,
    c'est toi qui choisis où elle jette l'ancre. D'abord au-delà d'une
    frontière tracée sur la table, puis dans une zone précise.
recall:
  points:
    - Le coulé se joue avec une attaque en haut de la blanche.
    - En bille pleine, la blanche suit la même trajectoire que la bille de couleur.
    - Plus on s'éloigne du plein, plus la blanche s'écarte de sa trajectoire.
    - On privilégie l'amplitude du geste plutôt que la vitesse.
  question:
    ask: Où frappe-t-on la blanche pour un coulé, et que fait-elle après le contact en bille pleine ?
    answer: En haut de la blanche ; elle suit la même ligne que la bille de couleur et avance.
  # Illustration `visee-trois-quarts` de la séance précédente (coule-2) : visée en trois-quarts avec bille fantôme.
  reuse: {sheet: coule-2, illustration: visee-trois-quarts}
  src: S
theory:
  sections:
    - id: chemin
      title: Où va la blanche en trois-quarts ?
      weight: {children: 2, adults: 2}
      body:
        - En trois-quarts, la bille de couleur file vers la poche et la blanche part de côté, vers la bande.
        - Avec une attaque en haut, elle avance après le contact au lieu de s'arrêter.
      adult_extra:
        - La quantité de bille donne la direction de départ de la blanche ; la puissance influe sur sa trajectoire (taille et poids de la blanche).
      key_point: En trois-quarts, la blanche part de côté, vers la bande, et avance.
      demo: "Jouer un coulé en trois-quarts et montrer où la blanche part, puis le comparer au coulé en plein ; rappeler que la puissance joue sur la trajectoire de la blanche."
      illustrations: [coule-plein, schema-coule-trois-quarts]
      src: S
    - id: geste
      title: Attaque en haut, grand geste
      weight: {children: 2, adults: 2}
      body:
        - Le procédé frappe la blanche au-dessus de son centre.
        - On fait un grand geste plutôt qu'un geste rapide, pour que la blanche garde sa rotation avant.
      adult_extra:
        - "En plein, le transfert d'énergie est important : on adapte la puissance pour donner assez d'énergie à la blanche pour son replacement."
        - Cette adaptation est plus prononcée au Blackball, la blanche étant plus légère et plus petite.
      key_point: Attaque en haut, amplitude plutôt que vitesse.
      demo: "Jouer un coulé avec un petit geste rapide puis avec un grand geste plus lent, et comparer la distance parcourue par la blanche."
      illustrations: [attaque-haute, contact-haut, plan-geste]
      src: S
    - id: empoche
      title: Attention à la blanche en plein
      weight: {adults: 1}
      body:
        - En plein, si la blanche avance trop après le contact, elle risque d'être empochée avec la bille de couleur.
      key_point: En plein, régler la puissance pour ne pas empocher la blanche.
      demo: null
      illustrations: [coule-plein]
      src: Prop
    - id: zone
      title: Deux zones, trois tirs chacune
      weight: {children: 2, adults: 2}
      body:
        - Sur le schéma de l'exercice 7, deux flèches mènent la blanche à deux zones.
        - On joue trois tirs vers la zone 1, puis trois tirs vers la zone 2.
        - Chaque fois, on empoche la bille puis on joue la noire.
      key_point: Deux zones, trois tirs pour chacune.
      demo: null
      illustrations: [schema-e7, schema-e8]
      src: S
    - id: zone-lecture
      title: Lire le schéma, un même contact
      weight: {children: 1, adults: 1}
      body:
        - Sur le schéma, la zone 1 est atteinte tout droit, la zone 2 en passant par la bande du haut.
        - Le contact semble le même, en trois-quarts, pour les deux zones.
        - Le trajet vers la zone 2 est plus long ; c'est la puissance, avec une attaque en haut et un geste ample, qui le prolonge.
      key_point: Même contact, c'est la puissance qui porte la blanche plus loin.
      demo: null
      illustrations: [schema-e7]
      src: Prop
    - id: annonce
      title: Annoncer où la blanche s'arrête
      weight: {children: 1, adults: 1}
      body:
        - Avant de tirer, dis à voix haute la zone où la blanche doit s'arrêter.
        - "Après le tir, regarde : est-elle là ? Sinon, ajuste d'abord la puissance."
      key_point: On annonce la zone avant de tirer.
      demo: "L'animateur annonce « zone 2 », joue, puis montre où la blanche s'est arrêtée."
      illustrations: [schema-e7]
      src: Prop
