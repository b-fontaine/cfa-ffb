training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e7
      ref: {block: coule, n: 7}
      diagram: entrainement-p22-e7
      title: Deux zones d'arrivée
      weight: {children: 2, adults: 1}
      setup: La rouge, les jaunes et la noire comme sur le schéma ; la blanche sur son repère, à gauche de la rouge. La zone 1 est là où finit la flèche courte, au-dessus de la jaune la plus proche ; la zone 2 est là où finit la flèche longue, après la bande du haut.
      instruction: Empocher la rouge du schéma en coulé dans la poche du haut à droite, six tirs en rejouant la même situation (la rouge et la blanche remises sur leurs repères) ; trois fois en arrêtant la blanche en zone 1, puis trois fois en zone 2, pour pouvoir jouer ensuite la noire.
      expected: "La rouge est empochée et la blanche s'arrête dans la zone visée, pour pouvoir jouer ensuite la noire. Lecture du schéma (proposition) : le contact reste en trois-quarts et c'est la puissance qui allonge le trajet jusqu'à la zone 2."
      mistakes:
        - symptom: La blanche s'arrête avant la zone ou reste près de la bille
          fix: Attaquer plus haut sur la blanche et allonger le geste plutôt que d'accélérer.
        - symptom: La blanche est empochée avec la rouge
          fix: Réduire la puissance et l'amplitude, et vérifier que la blanche part vers le haut, vers la bande, et non vers la poche.
        - symptom: La blanche passe par la bande mais manque la zone 2
          fix: Garder la même visée en trois-quarts et ajuster seulement la puissance, par l'amplitude du geste.
      playful:
        hook: >-
          Chaque tir est une étape du voyage de la blanche : l'élève annonce
          à voix haute « zone 1 » ou « zone 2 » avant de tirer.
        challenge: >-
          Réussir une étape sur deux zones différentes de suite pour tamponner
          le carnet de voyage.
      passes: 1
      src: S
    - id: e8
      ref: {block: coule, n: 8}
      diagram: entrainement-p22-e8
      title: Passer la frontière
      weight: {children: 1, adults: 1}
      setup: Les billes du schéma, la jaune à gauche du trait, à mi-hauteur de la table ; la noire près de la poche du haut à gauche ; les deux rouges, l'une sur le trait, l'autre près de la bande de gauche. La blanche est sur son repère, en bas, juste à droite du trait tracé sur la surface de jeu (la ligne verticale du schéma).
      instruction: Empocher la jaune du schéma dans la poche du haut à gauche en coulé ; la blanche touche la bande de gauche puis repasse le trait pour se replacer et jouer ensuite la noire ; le passage qui compte est le retour, après la bande de gauche. Cinq tirs en rejouant la même situation, en vue de jouer ensuite la noire.
      expected: "La jaune est empochée et la blanche repasse le trait au retour, après la bande de gauche, bien placée pour jouer la noire. Lecture du schéma (proposition) : elle s'arrête juste à droite du trait, en haut de la table, et son chemin de retour passe loin de la rouge du trait et de la noire."
      mistakes:
        - symptom: La blanche ne repasse pas le trait au retour
          fix: Garder l'attaque en haut et prolonger le geste après le contact.
        - symptom: La jaune manque la poche quand on cherche à faire avancer la blanche
          fix: Revenir à la visée de la jaune d'abord ; la longueur du geste règle ensuite la blanche.
      playful:
        hook: >-
          Le trait est la frontière : chaque retour qui repasse le trait vaut un
          tampon dans le carnet de voyage de l'élève.
        challenge: >-
          Faire passer la frontière à la blanche trois fois de suite pour
          gagner le titre de voyageur confirmé. Au deuxième passage, le
          binôme peut poser le repère de la blanche un peu plus haut ou plus
          bas, à droite du trait (proposition).
      passes: 2
      src: S
game:
  title: Partie à difficulté réduite, avec coulé
  source_game: 14
  adapted: true
  players: Partie à 2
  materials: "Billes du jeu complet, quatre par groupe plus la noire. Pour la variante enfants ou la règle de lien (proposition) : de la craie pour marquer une zone (variante enfants) ou deux zones (règle de lien adultes), un carnet ou un tableau pour les tampons."
  setup_illustration: schema-jeu
  rules:
    - Jouer une partie avec les règles classiques, avec seulement quatre billes de chaque groupe de couleur et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
  scoring: Comme dans une partie classique, le premier qui empoche son groupe de billes puis la noire gagne.
  end: Fin quand un joueur a vidé son groupe puis empoché la noire.
  playful_variant: "Le carnet de voyage (version enfants, autonome, sans la règle de lien) : une zone est marquée à la craie avant la partie, d'une taille convenue entre les joueurs. Avant de jouer une bille en coulé (attaque en haut, plein ou trois-quarts, geste ample), le joueur annonce le coulé et la zone unique où la blanche doit s'arrêter ; si la bille est empochée et que la blanche s'arrête dans cette zone, son adversaire, qui juge, lui accorde un tampon. À trois tampons, le joueur gagne une marque au tableau et le titre de voyageur confirmé (récompense symbolique, sans effet sur la partie)."
  link_previous:
    notion_of: coule-2
    rule: "Règle facultative, adultes seulement (les enfants jouent la variante), à jouer sans la variante ludique, en exception aux règles classiques : deux zones sont marquées à la craie avant la partie, d'une taille convenue entre les joueurs. Avant de jouer une bille en coulé (attaque en haut, plein ou trois-quarts, geste ample), le joueur annonce l'une des deux zones ; si la bille est empochée et que la blanche s'arrête dans la zone annoncée, son adversaire, qui juge, lui accorde un tampon (un seul décompte, les tampons)."
    note: "Rejoue le coulé de la séance précédente (attaque en haut, amplitude, plein et trois-quarts) en y ajoutant le choix d'une destination. Règle facultative, la partie se joue telle quelle sans elle. Une seule règle facultative par partie."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche et les billes des poches. Version enfants : la variante ludique seule, sans la règle de lien ; partie à deux, chaque joueur compte ses tampons et son adversaire juge (une marque au tableau à trois tampons). Mise en place proposée : un joueur les rouges et l'autre les jaunes, partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes, et à égalité la partie est nulle."
    adults: "Version adultes : la règle de lien seule, sans la variante ludique."
  src: Prop
review:
  prompts:
    - Dans quel coulé la blanche s'est-elle arrêtée où tu le voulais ?
    - Pour arriver en zone 2, par où est passée la blanche et comment as-tu réglé ton coup ?
    - Que dirais-tu à un copain pour faire avancer la blanche sans l'empocher ?
