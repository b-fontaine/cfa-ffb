uncertainties:
  - "Jeu : la source ne propose aucun jeu spécifique au coulé ; le jeu 14 est repris et adapté (règle de lien adultes à deux zones marquées et tampons, variante enfants autonome à une zone, adaptations « version enfants / version adultes », une seule règle facultative par public) : [Prop], à valider par un animateur dans l'application."
  - "Thème (nom et notion alignés sur coule-1 et coule-2, V23), défis ludiques, variante de jeu, règle de lien, adaptations, poids, minutes et variation du repère de la blanche à l'exercice 8 : [Prop]."
  - "Le rappel reprend ce que coule-2 a enseigné (attaque en haut, blanche sur la même ligne en plein, déviation selon la quantité, amplitude plutôt que vitesse) ; `recall.reuse` réutilise son illustration `visee-trois-quarts`. L'illustration `coule-plein` est conservée dans cette séance car la séance carreau-1 la réutilise (recall.reuse) ; elle est distincte de celle de coule-2 (même id, schéma propre)."
  - "Exercice 7 : le schéma [S] ne montre qu'une rouge, trois jaunes et la noire alors que l'énoncé parle de six billes empochées, et ne dit pas lesquelles sont tirées ; la séance retient, en [Prop], de rejouer six fois la même situation avec la rouge du schéma. Les zones ne sont pas délimitées sur le schéma : elles sont lues au bout des flèches (zone 1 tout droit, zone 2 par la bande du haut)."
  - "Exercice 7 et section « Lire le schéma, un même contact » : sur le schéma, les deux zones partent du même contact en trois-quarts et de la même direction (environ 43°) ; seule la longueur du trajet les distingue, d'où la lecture « la puissance allonge le trajet » : lecture du schéma, [Prop] ; la source (entraînement p.22) ne donne que les deux flèches, sans consigne de puissance, et justifie l'amplitude par la conservation de la rotation avant."
  - "Exercice 8 : la fiche dit seulement « avancer la blanche au-delà du trait ». Le critère retenu en [S] est de repasser le trait au retour, après la bande de gauche (la blanche franchit le trait à l'aller et au retour). L'arrêt juste à droite du trait, en haut de la table, et le chemin de retour sont une lecture du schéma [Prop] : la fin de la flèche (pointe à environ 0,08 case du trait) est sous la précision de lecture."
  - "Théorie « Attaque en haut, grand geste » : l'adaptation de la puissance en plein et son caractère plus prononcé au Blackball viennent de la fiche n° 11 (p.21). Le risque d'empoche de la blanche (section « Attention à la blanche en plein », adultes) vient du mémento d'initiation 13 et est présenté en [Prop] ; il n'est pas dans la fiche n° 11. La section « Où va la blanche en trois-quarts ? » ne dit plus rien de l'influence de l'endroit où se trouve la blanche, qui n'est dans aucune source."
  - "Exercices 7 et 8 : le type de chevalet n'est pas précisé par la source ; la quantité de bille est lue sur l'encart (trois-quarts environ), non légendée. Les erreurs fréquentes et leurs corrections sont des lectures [Prop] des fiches, la fiche d'entraînement n'en donne pas."
  - "Illustrations de la théorie « Attaque en haut, grand geste » : `attaque-haute` (cible `cue_ball_target`, point à mi-rayon au-dessus du centre, position indicative `[Prop]`, la source ne gradue pas la hauteur d'attaque) ; `contact-haut` dessine la blanche plus petite que la bille de couleur ; `plan-geste` (plan amplitude × vitesse) est une image `[Prop]` : la source (fiche n° 11) dit seulement « amplitude plutôt que vitesse » ; les deux exemples tombent dans la même zone moyenne du plan pour montrer que seule la manière change."
  - "Section « Annoncer où la blanche s'arrête » : glose pédagogique [Prop], non formulée par la source (le reste de la théorie vient des fiches n° 11 et 14 et des schémas de la page 22)."
