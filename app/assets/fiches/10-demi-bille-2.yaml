uncertainties:
  - "Sections « Où poser la bille fantôme » (côté opposé à la poche, ligne centre de la bille-centre de la poche, équivalence avec la tangente : déduction du schéma d'entraînement p. 6 et de la géométrie, non formulée telle quelle par les fiches n° 3 et 5), « Plus loin, la même demi-bille », « Le chevalet sur cadre » et « Lire ses erreurs à l'exercice 4 », initiation (repère plus loin ajouté à la fiche 7), schéma des repères près et loin, thème, défis, variante de jeu (équipes, tournante, six parts de gâteau), règle de lien et adaptations : [Prop], à valider par un animateur dans l'application."
  - "Chevalets : l'exercice 2 (séance 1/2) est sur surface, l'exercice 3 sur cadre ; le PDF ne précise pas l'appui de l'exercice 4. L'ordre de la source est donc surface puis cadre, pas une progression « cadre vers surface » ; la séance n'impose rien pour l'exercice 4."
  - "Exercice 4 : le schéma [S] montre des distances blanche-rouge presque égales des deux côtés malgré l'intitulé « distances différentes » ; la séance demande de faire varier la distance (proposition)."
  - "Point d'impact sur la blanche : les schémas des exercices 3 et 4 le montrent au centre, l'initiation 7 au-dessus du centre ; la séance ne tranche pas, n'impose rien et ne propose aucune illustration de hauteur de queue."
  - "La bille fantôme du schéma « visée » est calculée pour une demi-bille nominale (environ 30°) ; elle ne reprend pas la position du schéma du PDF."
  - "Le schéma du jeu 7 [S] montre deux billes, un point rouge et un point jaune ; les billes d'un groupe sont replacées sur ces points. La composition des groupes, la place de la noire et la limite de temps sont des propositions (adaptation.children)."
  - "Règle de lien : distances chiffrées en cases du schéma (point d'origine du jeu 7 à environ 1,1 case de la bille visée ; repères de l'initiation 7 à environ 1,0 et 2,1 cases) ; le repère éloigné à environ deux cases et le repère de la noire sont des propositions."
