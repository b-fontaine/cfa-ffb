version: 1
id: demi-bille-2
order: 10
technique: demi-bille
part: 2
title: Quantité demi-bille
technical_sheets: [5]
previous: demi-bille-1
catalogue_block: demi-bille
notion: Viser la tangente de la bille de couleur pour empocher en demi-bille.
theme:
  name: Le partage du gâteau
  pitch: >-
    Le gâteau est maintenant posé plus loin sur la table, à gauche comme à droite.
    Pour le partager en deux parts égales, il faut garder la même visée et
    soigner le geste.
recall:
  points:
    - En demi-bille, la blanche couvre la moitié de la bille de couleur.
    - On vise la tangente de la bille de couleur avec le centre de la blanche.
    - La bille de couleur part à environ 30° de l'axe de visée.
  question:
    ask: Où vise-t-on en demi-bille, et de combien la bille de couleur est-elle déviée ?
    answer: La tangente de la bille de couleur ; environ 30° par rapport à l'axe de visée.
  reuse: {sheet: demi-bille-1, illustration: contact-demi}
  src: S
theory:
  sections:
    - id: retenir
      title: Viser la tangente en demi-bille
      weight: {children: 1, adults: 1}
      body:
        - La blanche couvre la moitié de la bille de couleur.
        - On vise la tangente de la bille de couleur avec le centre de la blanche.
        - L'animateur pose une blanche au contact de la bille à empocher ; le joueur vise le centre de cette bille fantôme avec le centre de la blanche, puis l'animateur la retire avant le tir.
      adult_extra:
        - Le point de visée est différent du point d'impact ; la bille de couleur est déviée d'environ 30° par rapport à l'axe de visée.
      key_point: Le centre de la blanche passe sur la tangente de la bille de couleur.
      demo: "Poser une blanche au contact de la bille à empocher, la retirer avant le tir, puis faire observer le point visé sur la bille de couleur."
      illustrations: []
      src: S
    - id: fantome-cote
      title: Où poser la bille fantôme
      weight: {children: 1, adults: 1}
      body:
        - La bille fantôme se pose collée à la bille de couleur, côté opposé à la poche, sur la ligne qui joint le centre de la bille au centre de la poche.
        - Viser le centre de la bille fantôme revient à viser la tangente de la bille de couleur.
      key_point: La bille fantôme est collée à la bille de couleur, côté opposé à la poche.
      demo: null
      illustrations: [visee-autre-cote]
      src: Prop
    - id: loin
      title: Plus loin, la même demi-bille
      weight: {children: 2, adults: 2}
      body:
        - Quand la blanche est loin, une petite erreur de visée devient grande à l'arrivée.
        - On garde la même visée ; seul le geste s'allonge, et on l'accompagne jusqu'au bout.
      adult_extra:
        - "Chercher l'origine de l'erreur : le point visé, ou la queue qui dévie pendant le geste (lire la position finale de la queue, fiche technique n° 1)."
      key_point: Plus la blanche est loin, plus on soigne l'alignement.
      demo: "Jouer la même demi-bille depuis un repère proche puis depuis un repère éloigné et comparer où part la bille de couleur."
      illustrations: [pres-loin]
      src: Prop
    - id: cadre
      title: Le chevalet sur cadre
      weight: {children: 1, adults: 1}
      body:
        - Le chevalet sur cadre prend appui sur le cadre de la table, un support naturel.
        - "Le chevalet change, la visée reste la même : la tangente."
      key_point: Le chevalet change, la visée ne change pas.
      demo: null
      illustrations: []
      src: Prop
    - id: lire-erreur
      title: Lire ses erreurs à l'exercice 4
      weight: {adults: 1}
      body:
        - Après chaque tir de l'exercice 4, noter si la bille de couleur passe à gauche ou à droite de la poche.
        - Une erreur toujours du même côté se corrige par le point de visée ; une erreur qui change de côté se cherche dans le geste.
      key_point: Une erreur qui a un sens se corrige ; une erreur sans sens se cherche dans le geste.
      demo: null
      illustrations: []
      src: Prop
initiation:
  - id: ini-7
    initiation_sheet: 7
    title: Près puis loin
    weight: {children: 2, adults: 2}
    setup: Une bille rouge sous la poche du milieu du haut ; les deux repères proches en V du schéma, puis un repère plus loin sur la même ligne de visée.
    goal: "Empocher la rouge en demi-bille depuis un repère proche, puis depuis un repère plus loin, avec un chevalet sur la surface de jeu puis un chevalet sur cadre."
    expected: Le contact reste en demi à chaque distance et la rouge part vers la poche ; la visée ne change pas.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation
    src: Prop
