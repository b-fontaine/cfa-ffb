training:
  exercises:
    - id: e3
      ref: {block: demi-bille, n: 3}
      diagram: entrainement-p06-e3
      title: Deux gâteaux, deux poches
      weight: {children: 1, adults: 1}
      setup: Les jaunes du schéma alignées près de la bande du haut ; la blanche sur son repère, plus bas sur la table, devant elles ; gauche et droite se lisent comme sur le schéma, la ligne de départ étant à gauche.
      instruction: Empocher la jaune de gauche dans la poche d'angle, puis la jaune de droite dans la poche du milieu, toujours en demi-bille, avec l'appui indiqué pour cet exercice ; quatre tirs par jaune.
      expected: Chaque jaune part vers sa poche ; la blanche la touche en demi, du côté opposé à la poche, depuis le même repère.
      mistakes:
        - {symptom: La jaune de droite (poche du milieu) manque la poche, fix: Refaire la visée pour cette jaune sans reprendre celle de l'autre ; demander à l'élève de montrer sur la bille le point visé.}
        - {symptom: Le chevalet bouge au moment du tir, fix: Rester immobile jusqu'à la fin du geste ; le cadre sert de support naturel.}
      playful:
        hook: Le tireur annonce « demi » avant le tir ; son partenaire regarde la queue et son alignement vers l'emplacement de la bille fantôme, pas le contact.
        challenge: Le partenaire dessine au tableau une part de gâteau par tir réussi en demi ; à deux, compléter un gâteau de six parts.
      passes: 1
      src: S
    - id: e4
      ref: {block: demi-bille, n: 4}
      diagram: entrainement-p06-e4
      title: Loin, près, des deux côtés
      weight: {children: 1, adults: 1}
      setup: Les rouges du schéma à mi-largeur, l'une près de la bande gauche et l'autre près de la bande droite ; un repère de blanche sous chaque rouge, à des distances différentes.
      instruction: Empocher la rouge de gauche dans la poche d'angle du haut à gauche, puis celle de droite dans la poche d'angle du haut à droite, en demi-bille ; quatre tirs par rouge, en changeant la distance de la blanche d'un tir à l'autre.
      expected: Le contact reste en demi à toutes les distances ; chaque rouge part vers la poche d'angle.
      mistakes:
        - {symptom: La rouge manque la poche quand la blanche est loin, fix: Garder le même point de visée ; accompagner le geste sans forcer.}
        - {symptom: Les réussites viennent d'une seule rouge, fix: "Au passage suivant, refaire la série de quatre sur la rouge ratée en comparant la position de la queue à l'arrivée."}
      playful:
        hook: Le partenaire choisit la distance de chaque tir (près, moyen ou loin) et déplace le repère.
        challenge: Réussir deux tirs de suite à la plus grande distance choisie par le partenaire.
      passes: 2
      src: S
game:
  title: 8 billes dans une poche
  source_game: 7
  adapted: false
  players: Partie à 2 ; la variante ludique se joue à 4 (deux équipes de deux)
  materials: "Billes du jeu complet. Pour la variante ludique (proposition) : un tableau pour dessiner les parts de gâteau."
  setup_illustration: schema-jeu
  rules:
    - Les joueurs tirent à tour de rôle.
    - Vider son groupe de billes puis la noire dans une poche.
    - "La blanche est replacée sur son point d'origine après chaque tir ; lorsqu'une bille de couleur est empochée, on replace une autre bille sur le même point ; toute bille non empochée est replacée sur son point d'origine."
    - Un coup n'est pas valable si le joueur commet une faute.
    - "Égalité : jouer la noire jusqu'à ce que l'un manque."
    - "Conseil : vérifier que les billes sont positionnées à chaque fois en quantité demi-bille."
  scoring: Le premier qui vide son groupe puis la noire gagne.
  end: Fin quand un joueur a vidé son groupe puis empoché la noire.
  playful_variant: "Parties à 4, en tournante : deux équipes de deux, les partenaires se relaient tir après tir. L'équipe adverse contrôle le contact en demi et dessine une part de gâteau pour chaque demi validé, six parts à compléter. La manche des parts est un défi en plus : elle ne compte pas pour la victoire, qui reste celle du jeu (groupe puis noire)."
  link_previous:
    notion_of: demi-bille-1
    rule: "Exception à la règle du replacement de la blanche, sans limite de nombre de tirs : les tirs impairs du joueur (1er, 3e, 5e…) partent du point d'origine du schéma, à environ une case de la bille visée ; ses tirs pairs (2e, 4e, 6e…) partent d'un repère posé à environ deux cases de la bille visée, du même côté que le point d'origine. La noire se joue depuis un repère à environ deux cases de la noire, au choix du joueur. La bille reste jouée en demi."
    note: "Fait rejouer dans la même partie un tir proche (le point d'origine du jeu, comme les repères proches de l'initiation 7) et un tir plus éloigné (comme le repère plus loin de l'initiation 7 et l'exercice 4) ; distances proposées, lues en cases du schéma ; règle facultative, le jeu 7 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Si la règle de lien est jouée : garder les deux distances mais raccourcir la plus longue (repère éloigné un peu plus près), sans supprimer la différence ; sinon, rapprocher un peu le point d'origine des billes. Mise en place proposée (la fiche ne la précise pas) : deux points marqués comme sur le schéma, un point pour la rouge (poche du haut à gauche) et un point pour la jaune (poche du bas à gauche), le point d'origine de la blanche entre les deux ; les billes de chaque groupe attendent sur le côté et sont posées une à une sur leur point. Deux adversaires de niveau proche, un joueur les rouges et l'autre les jaunes, la noire jouée depuis le point de son choix ; partie limitée à 15 minutes, au-delà gagne qui a le moins de billes restantes."
    adults: "Après la partie, noter ses tirs manqués par côté (gauche, droite) et par distance (près, loin) et les comparer au taux de l'exercice. Variante plus difficile : annoncer la poche et « demi » avant chaque tir."
  src: S   # titre, règles, score et fin du jeu 7 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Depuis quelle distance la demi-bille était-elle la plus difficile ?
    - De quel côté de la table as-tu le mieux réussi, et pourquoi ?
    - Que ferais-tu pour viser aussi bien de loin que de près ?
