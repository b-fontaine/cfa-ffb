uncertainties:
  - "Thème, défis, sections « Qui envoie la blanche de côté ? » et « Le mot replacement », rappel (transition vers le rejet), variante de jeu (jetons, annonce, tolérance de deux largeurs de main), règle de lien et adaptations : [Prop], à valider par un animateur dans l'application. Le minutage et la différenciation enfants / adultes sont aussi des propositions."
  - "Le jeu est le jeu 14 [S] repris tel quel (`adapted: false`) : la fiche ne propose aucun jeu dédié au rejet naturel ; le conseil de replacer par rejet et le rappel des règles classiques sont des propositions placées dans `adaptation`. Les règles de la partie classique ne figurent pas dans les sources du dépôt : le rappel est à valider (fautes : règlement fédéral)."
  - "La fiche n° 10 réunit demi-bille et attaque haute sans dire laquelle fait partir la blanche de côté et laquelle l'empêche de reculer : la répartition des rôles est une explication [Prop] (section `de-cote`), les sections [S] ne la portent pas."
  - "Illustrations `contact-haut` et `attaque-haute` : le type `TipPoint` n'a pas de valeur « un peu au-dessus du centre » ; `top` dessine le point en haut de la bille, alors que la fiche n° 10 et l'entraînement p. 13 (« légèrement au-dessus du centre ») placent le point d'impact plus bas. Les légendes le précisent ; le schéma est indicatif."
  - "Le rappel reprend trois points sourcés de rebond-bande-2 (angle égal, point de la bande visé, puissance qui referme l'angle) ; les sections `deux-bandes` et `chemin-long` de cette séance étant [Prop], elles ne sont pas rappelées comme sourcées. Le rappel est [Prop] à cause de la phrase de transition. Écart connu (00-provenance) : sur la puissance, le texte de la fiche n° 9 dit que l'angle se referme, la légende du schéma note « angle d'arrivée < angle de rebond » ; le texte est retenu, à signaler à l'animateur pour les enfants. `recall.reuse` réutilise l'illustration `angle-ouvert` de rebond-bande-2."
  - "Thème « Le virage à 45° » : nom distinct de celui de rebond-bande (« Le ricochet »), pour ne pas faire porter la même métaphore à deux techniques ; il est identique dans rejet-naturel-1 et 2 (V23). Le pion sur un chemin au tableau (e1) reste l'accroche d'e1."
  - "Initiation 12 et schémas d'entraînement : le type de chevalet n'est pas indiqué ; la quantité est lue comme proche de la demi-bille, le texte ne précisant pas le taux sur le schéma. Sur le schéma, la flèche d'arrivée de la blanche (exercice 1) est à droite de la ligne de départ, alors que l'initiation 12 place la zone à gauche : la séance matérialise la zone par un jeton posé au bout de la flèche, sans la décrire par rapport à la ligne."
  - "Exercices : la fiche dit « replacer cinq fois la blanche afin de jouer la noire » ; la séance garde cette consigne (cinq tirs, jaune et blanche replacées à chaque fois). La noire dégagée est une lecture [Prop] de « pour jouer la noire » (géométrie du schéma), à valider ; elle ne change pas le taux 3/5 repris de la source."
  - "Le bloc « Le rejet naturel » figure deux fois dans le PDF d'entraînement (pp. 13-14 puis 17-18, schémas avec bandes) ; la séance utilise les exercices de la 1re occurrence (p. 13) ; la 2e (pp. 17-18, avec rebond) n'est pas utilisée."
  - "L'illustration `chemin-blanche` et la marque d'angle sont indicatives (non à l'échelle). `chemin-blanche` reprend le schéma d'initiation 12 [S] auquel s'ajoute une bille de repère rouge, qui est le conseil de vérification de la fiche (bille posée sur la trajectoire estimée) : c'est une bille de repère, pas la rouge d'un exercice."
