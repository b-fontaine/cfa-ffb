# Séance pilote du catalogue : « Quantité demi-bille », partie 1/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: demi-bille-1
order: 8
technique: demi-bille
part: 1
title: Quantité demi-bille
technical_sheets: [5]
previous: bille-pleine-2
catalogue_block: demi-bille
notion: Viser la tangente de la bille de couleur pour empocher en demi-bille.
theme:
  name: Le partage du gâteau
  pitch: >-
    La bille de couleur est un gâteau. En bille pleine on le prend entier ;
    en demi-bille, on n'en prend que la moitié, et chaque bille empochée
    est une part gagnée.
recall:
  points:
    - En bille pleine, la blanche vise le centre de la bille de couleur.
    - La bille de couleur part droit dans l'axe du choc.
    - La couleur parcourt beaucoup, la blanche peu.
  question:
    ask: En bille pleine, où vise-t-on et où part la bille de couleur ?
    answer: Le centre de la bille ; elle part droit devant, dans l'axe.
  # Illustration `contact-plein` de la séance précédente (bille-pleine-2) :
  # elle doit exister dans cette séance quand elle sera rédigée (V7).
  reuse: {sheet: bille-pleine-2, illustration: contact-plein}
  src: S
theory:
  sections:
    - id: tangente
      title: Viser la moitié de la bille
      weight: {children: 3, adults: 3}
      body:
        - En demi-bille, la blanche couvre la moitié de la bille de couleur.
        - On vise la tangente de la bille de couleur avec le centre de la blanche.
        - Au choc, le transfert d'énergie est réparti équitablement entre les deux billes.
      adult_extra:
        - Le point de visée n'est pas le point d'impact ; la bille de couleur est déviée d'environ 30° par rapport à l'axe de visée.
      key_point: La trajectoire du centre de la blanche passe par la tangente.
      demo: "Tirer sans empocher, à courte distance : les deux billes s'arrêtent presque en même temps."
      illustrations: [contact-demi, visee-demi, taille-billes]
      src: S
    - id: mot-tangente
      title: Le mot « tangente »
      weight: {children: 1}
      body:
        - La tangente de la bille de couleur, c'est son bord ; le centre de la blanche passe sur ce bord, et la blanche couvre la moitié de la bille.
      key_point: Le centre de la blanche passe sur le bord de la bille de couleur.
      demo: null
      illustrations: [visee-demi]
      src: Prop
    - id: comparer
      title: Plein ou demi ?
      weight: {children: 2, adults: 2}
      body:
        - En bille pleine, la bille de couleur part droit, dans l'axe du choc.
        - En demi-bille, elle est déviée d'environ 30° par rapport à l'axe de visée.
      adult_extra:
        - Au trois-quarts, la déviation est d'environ 15° (billes identiques) ; cette quantité se travaille plus tard.
      key_point: "Plein : la couleur part droit ; demi : elle part à environ 30°."
      demo: null
      illustrations: [quantites]
      src: S
    - id: fantome
      title: "Rappel : la bille fantôme"
      weight: {adults: 2}
      body:
        - L'animateur pose une blanche au contact de la bille à empocher, puis la retire avant le tir.
      key_point: On vise le centre de la bille fantôme en plaçant le procédé au centre de la blanche.
      demo: null
      illustrations: [visee-demi]
      src: S
initiation:
  - id: ini-7
    initiation_sheet: 7
    title: Deux billes en demi
    weight: {children: 3, adults: 3}
    setup: Une bille rouge sous la poche du milieu du haut ; deux repères pour la blanche, à courte distance, l'un à gauche et l'autre à droite de la rouge (le V du schéma).
    goal: "Empocher 2 billes en demi-bille, une depuis chaque repère, en utilisant un chevalet sur la surface de jeu et un chevalet sur cadre."
    expected: Le contact se fait en demi-bille et la rouge part vers la poche ; le transfert d'énergie est réparti équitablement.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation
    src: S
illustrations:
  - {id: taille-billes, type: ball_size,
     caption: "La blanche (48,0 mm) est un peu plus petite que la bille de couleur (50,8 mm) : le point de contact entre les deux billes est légèrement au-dessus de l'axe horizontal de la blanche (ce n'est pas l'endroit où frappe le procédé).",
     alt: "Deux billes côte à côte, à l'échelle : à gauche la blanche, 48,0 mm, à droite une bille de couleur, 50,8 mm ; la blanche est un peu plus petite."}
  - {id: contact-demi, type: contact, fraction: half, tip_point: center, paths: true,
     caption: "Demi-bille : la blanche, un peu plus petite, couvre la moitié de la bille de couleur ; le procédé vise le centre de la blanche. Après le contact, la couleur part à environ 30° de la ligne de visée ; la blanche, jouée sans rotation, part à angle droit de la couleur.",
     alt: "Vue de dessus : la blanche, un peu plus petite que la bille de couleur, recouvre la moitié de celle-ci ; à droite, la blanche vue de face avec le point du procédé au centre."}
  - {id: visee-demi, type: ghost_aim, cue: [1.84, 2.26], object: [5.0, 2.0], pocket: tr, fraction: half,
     caption: "La bille fantôme (à la taille de la blanche) montre où la blanche touche la bille de couleur.",
     alt: "Table vue de dessus : blanche à gauche, bille de couleur au centre, poche en haut à droite. La bille fantôme, un cercle de la taille de la blanche, est au contact de la bille de couleur, côté opposé à la poche ; la ligne de visée y mène et le point de contact est marqué. Le centre de la blanche passe par la tangente : la moitié de la bille est couverte."}
  - {id: quantites, type: contact_strip, fractions: [full, half], highlight: half,
     caption: "Plein et demi-bille, côte à côte.",
     alt: "Deux schémas de contact vus de dessus, avec la blanche (48,0 mm) un peu plus petite que la bille de couleur (50,8 mm) : la bille pleine, puis la demi-bille mise en évidence."}
  - {id: schema-initiation, type: diagram_ref, diagram: initiation-p07-e1,
     caption: "Initiation 7 : la rouge est jouée en demi depuis deux repères.",
     alt: "Table vue de dessus : une bille rouge sous la poche du milieu du haut, deux repères de blanche à courte distance, la blanche touche la rouge en demi."}
  - {id: schema-jeu, type: diagram_ref, diagram: jeux-p07-g1,
     caption: "Jeu 7 : une bille rouge et une bille jaune près des poches de gauche (le schéma ne montre que deux billes).",
     alt: "Table vue de dessus : la blanche au centre gauche ; une rouge près de la poche du haut à gauche et une jaune près de la poche du bas à gauche, chacune jouée en demi-bille."}
training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e1
      ref: {block: demi-bille, n: 1}
      diagram: entrainement-p05-e1
      title: Les six parts de gâteau
      weight: {children: 2, adults: 1}
      setup: La rouge du schéma sous la poche du milieu ; poser la blanche tour à tour sur les six repères, de plus en plus loin.
      instruction: Empocher la rouge en demi-bille depuis chaque repère, du plus proche au plus éloigné.
      expected: Le contact reste en demi à toute distance ; la rouge part droit vers la poche du milieu.
      mistakes:
        - {symptom: La rouge part trop pleine, fix: Viser plus sur la tangente et vérifier l'alignement de la queue.}
        - {symptom: La rouge manque la poche quand la blanche est loin, fix: Garder le même point de visée et accompagner le geste sans forcer.}
      playful:
        hook: Chaque tir réussi colorie une part du gâteau dessiné au tableau.
        challenge: Compléter le gâteau à deux.
      passes: 2
      src: S
    - id: e2
      ref: {block: demi-bille, n: 2}
      diagram: entrainement-p05-e2
      title: Le tir de précision
      weight: {children: 1, adults: 1}
      setup: La blanche posée sur le repère du schéma, à droite des deux jaunes ; les jaunes sont alignées entre elles, l'une au-dessus de l'axe de la table, l'autre en dessous.
      instruction: Empocher la jaune du haut vers la poche du milieu du haut, puis celle du bas vers la poche du milieu du bas, toujours en demi-bille ; quatre tirs par jaune.
      expected: Même position de blanche pour tous les tirs, main d'appui stable ; chaque jaune part vers sa poche.
      mistakes:
        - {symptom: La jaune dévie trop sur le côté, fix: Revenir à la tangente en demandant à l'élève de montrer sur la jaune le point visé.}
      playful:
        hook: Avant chaque tir, annoncer à voix haute « je vise la tangente ».
        challenge: Réussir les quatre tirs d'une même jaune sans déplacer la blanche.
      passes: 1
      src: S
game:
  title: 8 billes dans une poche
  source_game: 7
  adapted: false
  players: Partie à 2
  materials: "Billes du jeu complet. Pour le défi ludique (proposition) : un tableau et des jetons."
  setup_illustration: schema-jeu
  rules:
    - Les joueurs tirent à tour de rôle.
    - Vider son groupe de billes puis la noire dans une poche.
    - "La blanche est replacée sur son point d'origine après chaque tir ; lorsqu'une bille de couleur est empochée, on replace une autre bille sur le même point ; toute bille non empochée est replacée sur son point d'origine."
    - Un coup n'est pas valable si le joueur commet une faute.
    - "Conseil : à chaque tir, vérifier que la bille est bien jouée en demi."
    - "Égalité : jouer la noire jusqu'à ce que l'un manque."
  scoring: Le premier qui vide son groupe puis la noire gagne.
  end: Fin quand un joueur a vidé son groupe puis empoché la noire.
  playful_variant: "Variante enfants, facultative, autonome (jouable sans la règle de lien) : avant chaque tir, annoncer « demi » ; l'adversaire contrôle et, s'il a raison, gagne un jeton. Un jeton permet de rejouer, une fois, un tir manqué."
  link_previous:
    notion_of: bille-pleine-2
    rule: "Adultes seulement (les enfants jouent la variante). Règle facultative, sans jeton, en exception à la règle de la demi-bille et du replacement de la blanche, à chaque tour de table (un tir de chaque joueur) : le joueur qui ouvre le tour suivant joue sa première bille en plein, depuis une blanche que son adversaire pose alignée avec la bille et la poche."
    note: "Réactive la bille pleine de la séance précédente ; le jeu 7 se joue tel quel sans elle. Une seule règle facultative par partie : les adultes jouent la règle de lien, les enfants la variante ludique."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche et les billes des poches. Mise en place proposée (la fiche ne la précise pas) : un joueur les rouges, l'autre les jaunes ; deux points de départ, comme sur le schéma (les rouges vers la poche du haut à gauche, les jaunes vers la poche du bas à gauche), les billes d'un groupe posées une à une sur leur point ; la blanche sur son point d'origine, au centre gauche de la table ; la noire sur un point choisi par les joueurs avant la partie ; tirage au sort pour commencer, partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes."
    adults: "Après la partie, comparer avec le taux de l'exercice : où la demi-bille échoue-t-elle (distance, côté) ?"
  src: S   # titre, règles, score et fin du jeu 7 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Quelle quantité as-tu le mieux réussie ?
    - Quelle bille était la plus difficile en demi, et pourquoi ?
    - Que dirais-tu à un copain pour viser la demi-bille ?
