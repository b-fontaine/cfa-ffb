training:
  exercises:
    - id: e1
      ref: {block: rebond-bande, n: 1}
      diagram: entrainement-p15-e1
      title: La mare aux galets
      weight: {children: 1, adults: 1}
      setup: La blanche sur son repère près de la poche d'angle du bas à gauche ; la noire du schéma entre la blanche et la première rouge, elle reste en place et ne doit pas être touchée ; les rouges numérotées du schéma alignées près de la bande du bas.
      instruction: Jouer cinq tirs de suite, dans l'ordre des numéros, de la rouge 1 à la dernière ; chaque fois, toucher la rouge visée avec la blanche après un rebond sur la bande du haut, et replacer la blanche sur son repère avant le tir suivant.
      expected: "La blanche touche la bande du haut puis la rouge visée sans toucher la noire ; le point visé sur la bande change d'une rouge à l'autre. Attaque au centre de la blanche (le petit schéma de la fiche la dessine un peu au-dessus du centre : écart signalé dans les incertitudes)."
      mistakes:
        - {symptom: L'élève vise la rouge au lieu d'un point de la bande, fix: "Lui faire montrer du doigt le point de la bande qu'il vise avant de tirer."}
        - {symptom: La blanche touche la bande trop près ou trop loin de la rouge, fix: "Faire relever la tête avant de se placer pour projeter le parcours de la blanche (puis tête sur la queue jusqu'au contact) et rappeler de viser légèrement à côté du point commun."}
        - {symptom: Le coup est trop puissant et la blanche repart sur un angle plus fermé, fix: "Revenir à une puissance modérée."}
      playful:
        hook: Chaque rouge touchée après la bande ajoute un galet sur la mare dessinée au tableau.
        challenge: Toucher toutes les rouges du schéma à la suite, sans changer le repère de départ de la blanche.
      passes: 2
      src: S
    - id: e2
      ref: {block: rebond-bande, n: 2}
      diagram: entrainement-p15-e2
      title: Le ricochet à distance variable
      weight: {children: 1, adults: 1}
      setup: La blanche sur son repère près de la poche d'angle du haut à gauche, la noire et la rouge du schéma laissées en place à côté d'elle, comme obstacles à ne pas toucher ; les jaunes numérotées du schéma alignées à mi-hauteur de la table.
      instruction: Jouer cinq tirs de suite, dans l'ordre des numéros, de la jaune 1 à la dernière ; chaque fois, toucher la jaune visée avec la blanche après un rebond sur la bande du haut, et replacer la blanche sur son repère avant le tir suivant.
      expected: La blanche rebondit sur la bande du haut puis touche la jaune visée ; le point visé sur la bande se décale d'une jaune à l'autre.
      mistakes:
        - {symptom: L'angle est trop ouvert et la blanche passe loin de la jaune, fix: "Montrer l'effet d'un angle trop ouvert sur le point d'impact (situation B de l'initiation) et reprendre le point visé."}
        - {symptom: La blanche touche la bande à droite ou à gauche du point annoncé, fix: "Refaire annoncer le point visé et vérifier l'alignement de la queue sur le centre de la blanche."}
      playful:
        hook: Le tireur annonce le point de la bande qu'il vise ; l'observateur dit où la blanche l'a vraiment touchée.
        challenge: En binôme, réussir deux jaunes de suite en ayant annoncé le bon point, puis échanger les rôles.
      passes: 1
      src: S
game:
  title: "Pétanque avec bande avant impact"
  source_game: 13
  adapted: false
  players: Deux joueurs ou deux équipes de deux
  materials: "Billes du jeu complet : la noire et un groupe de billes de couleur par camp, posées sur le trait. Pour la variante ludique (proposition) : un tableau et des jetons."
  setup_illustration: schema-jeu
  rules:
    - Pour chaque tir, la blanche est placée librement dans la zone de replacement ; chaque bille de couleur est posée librement sur le trait.
    - À l'aide de la blanche, le joueur propulse la noire ; en replaçant la blanche à la main, il joue une des billes de son groupe pour la placer au plus près de la noire.
    - Chaque coup doit être effectué avec une bande avant impact.
    - Le coup n'est pas valable si aucune bille ne touche une bande, ou si la bille de couleur jouée touche une autre bille avant un rebond sur une bande.
    - L'adversaire tente à son tour de placer une de ses billes plus près de la noire ; s'il y parvient, la main passe, sinon il rejoue jusqu'à y parvenir ou jusqu'à ne plus avoir de billes.
  scoring: On compte le plus grand nombre de billes du même groupe au plus près de la noire ; le premier joueur à atteindre 8 points gagne.
  end: Fin de la partie quand un joueur atteint 8 points.
  playful_variant: "Avant chaque tir, annoncer et montrer du doigt le point de la bande visé ; si la bille jouée y touche la bande, le joueur gagne un jeton, et un jeton permet de rejouer une fois un tir invalidé."
  link_previous:
    notion_of: finesse-1
    rule: "Exception facultative aux règles du jeu 13, une fois par manche et par camp : quand une bille de couleur de son groupe est posée sur le trait près d'une bande, le joueur annonce « finesse » et le point de la bande où cette bille doit passer. La blanche, replacée à la main, frôle la bille de couleur par son bord ; la bille de couleur, à peine poussée, doit toucher la bande annoncée avant toute autre bille. L'adversaire contrôle seulement deux choses : la blanche n'a touché que le bord de la bille de couleur, et celle-ci a touché la bande avant toute autre bille."
    note: "Fait rejouer la finesse de la séance précédente (très faible transfert d'énergie, la bille de couleur parcourt peu) avec une bande avant impact portée par la bille de couleur, comme dans le schéma du jeu 13, d'où la bille posée près d'une bande ; règle facultative, le jeu 13 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "But du jeu 13 d'après la fiche : visualiser les trajectoires après le rebond d'une bille sur une bande. Déroulé proposé (la fiche ne le précise pas) : un camp les rouges, l'autre les jaunes, quatre billes chacun comme sur le schéma ; tirage au sort pour ouvrir. Une manche : l'ouvreur propulse la noire avec la blanche, puis, la blanche replacée à la main avant chaque tir, les camps jouent selon les règles ci-dessus jusqu'à ce que toutes les billes soient jouées. Décompte comme à la pétanque : le camp dont une bille est la plus proche de la noire marque un point par bille de son groupe plus proche de la noire que la meilleure bille de l'autre camp ; il ouvre la manche suivante. Pour des tirs plus courts : l'animateur pose lui-même la noire plus près du trait, ou on choisit un trait plus proche de la zone de replacement de la blanche. Objectif réduit à 4 points ; partie limitée à 15 minutes, au-delà gagne qui a le plus de points."
    adults: "But du jeu 13 d'après la fiche : visualiser les trajectoires après le rebond d'une bille sur une bande. Déroulé proposé (la fiche ne le précise pas) : tirage au sort pour ouvrir ; une manche = la noire propulsée par l'ouvreur, puis toutes les billes des deux camps jouées selon les règles ci-dessus, la blanche replacée à la main avant chaque tir ; décompte comme à la pétanque (un point par bille d'un camp plus proche de la noire que la meilleure bille de l'autre camp) ; le camp qui marque ouvre la manche suivante ; premier à 8 points. Après la partie, noter où la bande avant impact échoue (angle trop ouvert, puissance trop forte) et le comparer au taux des exercices. Variante plus difficile : imposer à chaque tir la bande du haut ou celle du bas, tirée au sort."
  src: S   # titre, règles, score et fin du jeu 13 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Où vise-t-on pour toucher une bille par la bande ?
    - Que sais-tu de l'angle avec lequel la blanche arrive et de celui avec lequel elle repart ?
    - Que dirais-tu à un copain pour trouver le bon point sur la bande ?
