  - {rank: S, file: Fiches Entrainement CFA blackball.pdf, page: 15, note: "Entraînement « Le rebond d'une bille sur une bande », exercices 1 et 2 (jouer une bande avant)"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 13, note: "Jeu 13 (« pétanque » avec bande avant impact)"}
uncertainties:
  - "Mises en place en texte, défis ludiques, variante de jeu (jetons compris), règle de lien et adaptation du jeu : [Prop], à valider par un animateur dans l'application. La différenciation enfants / adultes (poids, compléments, adaptation du jeu) est aussi une proposition."
  - "Les sections « Les mots de la bande » (enfants : glose de « sans effet », « bande avant », « bille objet », « bille obstacle », métaphore du galet) et « Quand relever la tête ? » sont des propositions [Prop] ; les schémas « angles-compares » et « rebond-puissant » sont générés, non à l'échelle (l'écart entre point visé et point d'impact n'y est pas dessiné : voir les schémas de l'initiation 11). Ces termes ne figurent pas dans 07-glossaire.md (à compléter hors de cette séance)."
  - "Tête : le conseil de la fiche d'initiation 11 (« relever légèrement la tête pour projeter le parcours de la blanche ») s'adresse à l'animateur ; la séance le précise comme une proposition (tête relevée avant de se placer, puis sur la queue jusqu'au contact, en accord avec posture-1)."
  - "Écart interne à la fiche n° 9 : le texte dit que l'angle de rebond se referme avec la puissance, la légende du schéma note « angle d'arrivée < angle de rebond » ; le texte est retenu et l'écart est signalé aux adultes (voir 00-provenance-et-fiabilite.md). La lecture « repart plus près de la perpendiculaire à la bande » vient de la transcription YAML du schéma (techniques-p19), pas du texte de la fiche ; le sens dépend de l'angle mesuré par rapport à la bande ou à la perpendiculaire, et seul le schéma « rebond-puissant » (non à l'échelle) la montre."
  - "Attaque : la séance affirme une attaque au centre (initiation 11, exercice 2) mais le petit schéma de l'exercice 1 [S] dessine le point bleu un peu au-dessus du centre de la blanche (non quantifié) ; l'écart est signalé dans l'attendu de l'exercice 1."
  - "Exercices 1 et 2 : le PDF ne dessine que deux flèches (vers les cibles 1 et 2) et ne dit pas comment jouer les cibles 3 à 5 ; la séance les joue toutes, cinq tirs de suite dans l'ordre des numéros, depuis le même repère (lecture de la ligne de cinq tirs du taux). Le type de chevalet n'est pas donné."
  - "Exercice 1 : la noire est lue comme obstacle entre la blanche et la première rouge (alignement du schéma), ce que le texte ne dit pas. Exercice 2 : le rôle de la noire et de la rouge groupées près de la blanche n'est pas précisé ; la séance les laisse en place comme obstacles à ne pas toucher."
  - "Initiation 11 : la fiche ne chiffre aucun objectif ; la notation est une grille des consignes de la fiche (visée à côté du trait, centre de la blanche, puissance modérée) et du résultat, non enregistrée dans le suivi ; le nombre de tirs d'essai observés (deux par situation) est une proposition. Le sens du décalage est lu « du côté de la bille objet » (ligne de visée du schéma [S]) ; la fiche dit « légèrement à droite », y compris en situation B où la bille objet est à gauche."
  - "Jeu 13 : le schéma [S] montre une rouge (« bille jouée ») qui part de la zone du trait vers la bande puis vers la noire, avec la blanche en position de départ ; la fiche ne dit pas explicitement quelle bille doit toucher la bande. La clause « si la bille de couleur jouée touche une autre bille avant un rebond sur une bande » et le schéma font lire la bande avant impact comme celle de la bille de couleur jouée ; la séance retient cette lecture dans la variante ludique et la règle de lien, et la section « Les mots de la bande » précise que le jeu 13 emploie « bande avant » pour la bille jouée (dans les exercices, c'est la blanche). Les règles [S] reprennent le replacement de la blanche à chaque tir et le tir de la noire par la blanche avant de jouer une bille de couleur. Le déroulé (qui ouvre, manche, décompte), le nombre de billes par camp, l'objectif réduit à 4 points et la limite de temps sont des propositions (adaptation)."
  - "Le rappel s'appuie sur finesse-1 (illustration trajectoires-finesse reprise, contrôlée par V7)."
