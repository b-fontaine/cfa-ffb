# Séance du catalogue : « Le rebond d'une bille sur une bande », partie 1/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: rebond-bande-1
order: 15
technique: rebond-bande
part: 1
title: Le rebond d'une bille sur une bande
technical_sheets: [9]
previous: finesse-1
catalogue_block: rebond-bande
notion: Viser un point de la bande pour que la blanche, jouée sans effet, touche une bille après un rebond.
theme:
  name: Le ricochet
  pitch: >-
    Comme un galet qui ricoche sur l'eau, la blanche rebondit sur la bande
    pour atteindre sa cible. Chaque bille touchée par ricochet ajoute un
    galet sur la mare dessinée au tableau.
recall:
  points:
    - En finesse, la visée passe à côté de la bille de couleur ; seul son bord est touché.
    - "Le transfert d'énergie est très faible : la blanche garde presque toute son énergie."
    - La blanche dévie à peine de sa trajectoire de départ.
    - La blanche parcourt un trajet bien plus long que la bille de couleur.
  question:
    ask: En finesse, que devient la blanche après le contact ?
    answer: Elle garde presque toute son énergie et dévie à peine de sa trajectoire.
  reuse: {sheet: finesse-1, illustration: trajectoires-finesse}
  src: S
theory:
  sections:
    - id: rebond
      title: Le rebond sur la bande
      weight: {children: 3, adults: 3}
      body:
        - Une bille jouée sans effet qui arrive sur une bande repart avec un angle de rebond égal à son angle d'arrivée.
        - La qualité des bandes et du drap peut modifier légèrement cet angle.
        - Pour toucher une bille par la bande, on vise donc un point de la bande, et non la bille.
        - "La blanche a un rayon : elle ne touche pas la bande exactement au point que l'on vise."
      key_point: Sans effet, l'angle de rebond est égal à l'angle d'arrivée.
      demo: "Jouer la blanche sans effet vers la bande, à angle faible puis plus ouvert, et montrer chaque fois où elle repart."
      illustrations: [rebond-egal, angles-compares]
      src: S
    - id: mots-bande
      title: Les mots de la bande
      weight: {children: 1}
      body:
        - "Sans effet : on frappe la blanche en son centre, sans la faire tourner sur le côté."
        - "Bande avant : la bille jouée touche d'abord une bande, puis sa cible. Dans les exercices, c'est la blanche ; dans le jeu 13, c'est la bille de couleur jouée."
        - "Bille objet : la bille à toucher. Bille obstacle : celle qui barre le chemin direct vers elle."
        - "Comme un galet qui ricoche sur l'eau, la blanche repart de la bande avec le même angle."
      key_point: Bande avant, c'est la bille jouée qui touche une bande avant de toucher sa cible.
      demo: null
      illustrations: [rebond-egal]
      src: Prop
    - id: point-vise
      title: Viser un point de la bande
      weight: {adults: 3}
      body:
        - "Le point où la blanche touche la bande (point d'impact) n'est pas le point que l'on vise."
        - Avec un angle d'arrivée faible, le point d'impact et le point de visée sont proches.
        - Plus l'angle d'arrivée est important, plus le point de visée s'éloigne du point d'impact.
      adult_extra:
        - "Le joueur tient compte de la sphéricité de la bille, donc de son rayon, pour entrer en contact avec la bande au point voulu."
      key_point: Plus l'angle est important, plus on vise loin du point où la blanche touche la bande.
      demo: "Jouer la situation B du schéma, avec un angle trop ouvert, et montrer où la blanche touche la bande par rapport au point visé."
      illustrations: [schema-initiation-a, schema-initiation-b]
      src: S
    - id: consignes
      title: Les bons réglages
      weight: {children: 2, adults: 2}
      body:
        - On vise légèrement à côté du point commun à la bande et au trait.
        - On vise le centre de la blanche, avec une puissance modérée.
        - "Plus le coup est puissant, plus l'angle de rebond a tendance à se refermer : on garde donc une puissance modérée."
      adult_extra:
        - "Écart dans la fiche : le texte dit que l'angle se referme avec la puissance, la légende du schéma note « angle d'arrivée < angle de rebond » ; le texte est retenu."
      key_point: "Centre de la blanche, puissance modérée : un coup trop puissant referme l'angle."
      demo: null
      illustrations: [attaque-centre, rebond-puissant]
      src: S
    - id: tete-relevee
      title: Quand relever la tête ?
      weight: {children: 1, adults: 1}
      body:
        - "Avant de se mettre en position, on relève la tête pour imaginer le chemin de la blanche."
        - "Une fois en position, la tête reste sur la queue jusqu'au contact."
      key_point: Tête relevée avant de se placer ; une fois placé, tête sur la queue jusqu'au contact.
      demo: null
      illustrations: []
      src: Prop
initiation:
  - id: ini-11
    initiation_sheet: 11
    title: Toucher une bille par la bande
    weight: {children: 3, adults: 3}
    setup: "Situation A : la blanche, la bille obstacle (la jaune du schéma) et la bille objet (la rouge) alignées parallèlement à la grande bande, au niveau du trait dessiné sur le tapis ; la jaune à mi-chemin entre la blanche et la rouge. Situation B : même disposition de l'autre côté de la table, angle plus ouvert, vers la bande du bas."
    goal: "Toucher la bille objet (la rouge) avec la blanche, qui doit d'abord rebondir sur une bande (la bande avant), en visant un point de la bande."
    expected: "Le point visé est légèrement décalé, du côté de la bille objet, par rapport au point commun à la bande et au trait du tapis ; la blanche est visée au centre, avec une puissance modérée. Observer deux tirs d'essai en situation A, puis deux en situation B, avant de cocher la grille."
    scoring:
      mode: checklist
      criteria:
        - Vise légèrement à côté du point commun à la bande et au trait
        - Vise le centre de la blanche
        - Joue avec une puissance modérée
        - La blanche touche la bille objet après la bande
    illustration: schema-initiation-a
    src: S
