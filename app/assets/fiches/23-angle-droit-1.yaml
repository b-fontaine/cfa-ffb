    initiation_sheet: 16
    title: La rouge à angle droit
    weight: {children: 3, adults: 3}
    setup: Une bille rouge face à la poche du milieu du haut, dans son axe ; trois repères pour la blanche, en bas à gauche de la rouge, à courte distance (le schéma).
    goal: "Empocher la rouge en jouant un coup à angle droit : attaque au centre, quantité au choix sauf le plein, comme un carreau ; un essai depuis chacun des trois repères."
    expected: La rouge part vers la poche du milieu et la blanche part à angle droit ; la blanche glisse jusqu'à l'impact.
    scoring: {mode: counter, of: 3}
    illustration: schema-initiation
    src: S
