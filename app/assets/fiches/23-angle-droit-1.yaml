# Séance du catalogue : « Le coup à angle droit », partie 1/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: angle-droit-1
order: 23
technique: angle-droit
part: 1
title: Le coup à angle droit
technical_sheets: [13]
previous: carreau-2
catalogue_block: angle-droit
notion: "Jouer un coup à angle droit : attaque au centre, sans rotation, distance courte, sur toute quantité sauf le plein."
theme:
  name: Le jeu de l'équerre
  pitch: >-
    Une équerre a deux côtés qui forment un angle droit. Quand la blanche
    touche une bille de couleur en dehors du plein, les deux billes partent
    chacune sur un côté d'une équerre. Aujourd'hui, on apprend à dessiner
    l'équerre sur la table.
recall:
  points:
    - Le carreau se joue en bille pleine, avec une attaque au centre de la blanche.
    - Sans rotation à l'impact, la blanche s'arrête sur la bille de couleur.
    - On joue à courte distance (50 cm au plus pour un débutant), pour que la blanche glisse jusqu'à l'impact.
    - Trop puissant, la blanche recule ; trop doux, elle roule après l'impact.
  question:
    ask: Dans un carreau, que fait la blanche à l'impact, et pourquoi ?
    answer: Elle s'arrête, car on joue en bille pleine avec une attaque au centre et sans rotation au moment du choc.
  reuse: {sheet: carreau-2, illustration: carreau-distance}
  src: S
theory:
  sections:
    - id: quatre-vingt-dix
      title: Deux billes, un angle droit
      weight: {children: 3, adults: 3}
      body:
        - Sans rotation de la blanche à l'impact, et sur toute quantité de bille sauf le plein, les deux billes partent à 90°.
        - La bille de couleur part d'un côté, la blanche part de l'autre.
      adult_extra:
        - "Au plein, ce n'est pas un angle droit mais un carreau : la blanche s'arrête (fiche n° 12)."
      key_point: Pas de rotation, pas de plein, et les deux billes partent à 90°.
      demo: "Jouer un coup à courte distance et montrer les deux trajectoires avec deux queues posées au sol en équerre."
      illustrations: [angle-90, trajectoires-croisees]
      src: S
    - id: mot-equerre
      title: Le mot « équerre »
      weight: {children: 1}
      body:
        - Une équerre est un outil qui donne un angle droit, comme le coin d'une feuille.
        - Les deux billes partent comme les deux côtés d'une équerre.
      key_point: Les deux billes dessinent un coin de feuille sur la table.
      demo: null
      illustrations: [angle-90]
      src: Prop
    - id: attaque-centre
      title: Attaque au centre, distance courte, coup à la mesure
      weight: {children: 3, adults: 3}
      body:
        - Le procédé frappe le centre de la blanche.
        - Elle avance d'abord en glissant, puis elle roule.
        - En l'absence de rotation au moment de l'impact, la blanche glisse jusqu'à l'impact.
        - On joue à courte distance entre les deux billes, pour garder le glissement.
        - "Trop puissant, l'angle s'ouvre, d'autant plus que la bille est jouée près du plein : il dépasse 90°."
      adult_extra:
        - L'amplitude et la vitesse doivent être particulièrement adaptées pour que la blanche glisse jusqu'à l'impact, comme au carreau.
        - Un coup peu puissant risque de faire rouler la blanche après l'impact et de réduire son angle de déviation (fiche d'initiation n° 16).
        - La trajectoire résulte des différences de poids et de taille entre la blanche et la bille de couleur (fiche d'initiation n° 16).
      key_point: "Attaque au centre, distance courte, coup à la mesure : la blanche glisse et l'angle reste droit."
      demo: "Jouer le même coup doucement puis trop fort, et comparer les deux angles."
      illustrations: [attaque-centre, angle-plus-90]
      src: S
    - id: quantites
      title: Toutes les quantités, sauf le plein
      weight: {children: 1, adults: 2}
      body:
        - "On choisit la quantité de bille (trois-quarts, demi, quart… toutes sauf le plein)."
        - Seul le plein est exclu, car il donne un carreau.
      adult_extra:
        - "Refaire le coup avec des quantités différentes : l'angle reste droit si l'attaque est au centre et le coup à la mesure."
        - "Au Blackball, la blanche est plus petite que les autres billes : pour le quart de bille, la mesure est prise par rapport à la blanche (fiche technique n° 7)."
      key_point: Toute quantité va bien, sauf le plein.
      demo: null
      illustrations: [quantites-angle]
      src: S
