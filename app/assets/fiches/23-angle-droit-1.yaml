training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e1
      ref: {block: angle-droit, n: 1}
      diagram: entrainement-p25-e1
      title: L'équerre vers la noire
      weight: {children: 1, adults: 1}
      setup: La rouge du schéma sous la poche du milieu du haut ; la blanche posée sur le repère en bas à droite de la rouge ; la noire en haut à gauche, avec la zone grisée juste sous elle ; les jaunes du schéma restent en place.
      instruction: Empocher la rouge dans la poche du milieu du haut par un coup à angle droit, de façon que la blanche reparte vers la gauche et s'arrête dans la zone grisée, près de la noire ; recommencer cinq fois.
      expected: Attaque au centre, contact sur une quantité autre que le plein ; la rouge monte droit vers la poche et la blanche part à angle droit jusqu'à la zone grisée.
      mistakes:
        - {symptom: "La blanche part trop vers l'avant et dépasse la zone", fix: "Jouer moins fort ; trop puissant, l'angle s'ouvre au-delà de 90°."}
        - {symptom: "La blanche roule après l'impact et l'angle se ferme", fix: "Garder l'attaque au centre et adapter l'amplitude pour que la blanche glisse jusqu'à l'impact."}
        - {symptom: "La rouge ne va pas à la poche", fix: "Revenir à la visée de la quantité choisie avant de chercher l'angle."}
      playful:
        hook: La blanche dessine une équerre ; la zone grisée est le coin de la feuille.
        challenge:
          Réussir deux équerres de suite, la blanche arrêtée dans la zone grisée.
      passes: 2
      src: S
    - id: e2
      ref: {block: angle-droit, n: 2}
      diagram: entrainement-p25-e2
      title: L'équerre par la bande
      weight: {children: 1, adults: 1}
      setup: La blanche posée sur le repère à gauche du schéma, en bas à droite de la rouge ; la rouge près de la poche du haut à gauche ; la zone grisée en bas, au centre de la table ; la noire et les jaunes du schéma restent en place.
      instruction: Empocher la rouge dans la poche du haut à gauche par un coup à angle droit, de façon que la blanche reparte vers la bande du haut, rebondisse puis s'arrête dans la zone grisée, près de la noire ; recommencer cinq fois.
      expected: Attaque au centre ; la rouge part vers la poche, la blanche part en angle voisin de 90°, touche la bande du haut puis revient dans la zone grisée.
      mistakes:
        - {symptom: "La blanche rebondit trop loin de la zone", fix: "Doser la puissance ; un coup trop puissant ouvre l'angle et allonge le rebond."}
        - {symptom: "La blanche touche la bande trop près ou trop loin de la rouge", fix: "Vérifier la position de départ de la blanche et la quantité choisie."}
      playful:
        hook: La blanche dessine l'équerre, puis rebondit sur la bande du haut pour revenir dans le coin.
        challenge:
          Réussir une équerre avec rebond, puis la refaire en changeant de quantité.
      passes: 2
      src: S
game:
  title: Partie à difficulté réduite
  source_game: 14
  adapted: false
  players: Partie à 2
  materials: Billes du jeu complet (4 par groupe et la noire).
  setup_illustration: schema-jeu
  rules:
    - Partie à 2 ; les règles sont celles d'une partie classique, avec seulement 4 billes de chaque groupe et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
  scoring: Comme dans une partie classique, selon le règlement FFB.
  end: Comme dans une partie classique, selon le règlement FFB.
  playful_variant: "Version enfants, facultative (les adultes jouent la règle du carreau, pas cette variante) : le tireur annonce « équerre » quand il joue un coup à courte distance, hors du plein, avec attaque au centre ; son adversaire vérifie ces trois conditions avant le tir. Équerre réussie = bille empochée. Chaque équerre réussie compte un point d'équerre. La partie se joue telle quelle sans cette variante."
  link_previous:
    notion_of: carreau-2
    rule: "Règle facultative, adultes seulement (les enfants jouent la variante), à jouer sans la variante ludique, en exception aux règles classiques : sur une bille en plein et à courte distance (50 cm au plus), le joueur peut annoncer « carreau » ; si la blanche s'arrête à l'impact, le coup compte comme un carreau réussi."
    note: "Fait rejouer dans la même partie le carreau de la séance précédente (bille pleine, attaque au centre, blanche arrêtée) à côté de l'angle droit, qui garde la même attaque au centre et ne change que la quantité ; règle facultative, la partie se joue telle quelle sans elle. Une seule règle facultative par partie."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche et les billes des poches. Mise en place proposée : un joueur les rouges et l'autre les jaunes, tirage au sort pour commencer, partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes. Une seule mécanique ludique : l'annonce « équerre »."
    adults: "Après la partie, noter, pour chaque équerre ratée, si l'erreur vient de la quantité, de la puissance ou de l'attaque. Conseil d'animateur : inviter chacun à dire la quantité choisie avant le tir, sans en faire une règle de la partie."
  src: S   # titre et règles du jeu 14 ; scoring et end renvoient à la partie classique (règlement FFB, non transcrit : lacune) sans réécrire la condition de victoire ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
