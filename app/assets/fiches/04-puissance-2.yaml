# Séance du catalogue : « La puissance », partie 2/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: puissance-2
order: 4
technique: puissance
part: 2
title: La puissance
technical_sheets: [2]
previous: puissance-1
catalogue_block: puissance
notion: Doser la puissance du coup en réglant la vitesse du coup de queue et l'amplitude du geste.
theme:
  name: Les deux curseurs
  pitch: >-
    Épisode 2 : les deux curseurs, le recul de la main et la vitesse du coup,
    servent à garer la blanche. Chaque zone grise est un garage : elle doit s'y
    arrêter en douceur, sans filer trop vite. Les garages sont de tailles et
    de distances variées : le coin est loin, le milieu est proche. Le
    chevalet se pose sur le tapis.
recall:
  points:
    - La puissance d'un coup dépend de la vitesse de la queue et de son amplitude.
    - L'amplitude est le recul de la main quand on arme le tir, jusqu'à la fin de la pénétration dans la blanche.
    - On règle le recul de la main sur la distance à parcourir.
    - "La zone grise est l'objectif de placement de la blanche : après l'impact, elle doit s'y arrêter."
  question:
    ask: Qu'est-ce que l'amplitude d'un coup de queue ?
    answer: Le recul de la main quand on arme le tir, jusqu'à la fin de la pénétration dans la blanche.
  # Illustration `court-long` de la séance précédente (puissance-1) : même cible, deux distances.
  reuse: {sheet: puissance-1, illustration: court-long}
  src: S
theory:
  sections:
    - id: fleche-chevalet
      title: Le chevalet et la flèche
      weight: {children: 1, adults: 1}
      body:
        - La flèche est la partie de la queue entre le bout et le chevalet.
        - "Quand la main est près du centre de gravité, on pose le chevalet près de la blanche : peu de flèche, peu de recul."
        - "Main vers le talon, chevalet plus loin : beaucoup de flèche, grand recul possible."
      adult_extra:
        - Entre les deux, le joueur évalue la longueur de flèche selon la puissance désirée.
      key_point: Plus la main est près du talon, plus le recul peut être grand.
      demo: "Montrer deux positions de la main sur la queue, chevalet près puis loin de la blanche. Insister sur le recul : le débutant pense d'abord à la vitesse."
      illustrations: [fleche-personnage, photos-amplitude]
      src: S
    - id: distances
      title: Plus loin, plus de recul
      weight: {children: 2, adults: 3}
      body:
        - Plus la zone à atteindre est loin, plus on arme le coup et plus on le rend rapide.
        - Plus elle est proche, plus on raccourcit le recul de la main et plus on ralentit.
        - "L'amplitude et la vitesse vont ensemble : on règle les deux."
        - Sur la surface de jeu, le chevalet est posé sur le tapis ; on règle son recul avant de tirer, comme avant.
      adult_extra:
        - Avant chaque tir, se demander où la blanche doit s'arrêter, puis choisir la flèche et le recul.
        - Comparer un tir proche et un tir lointain vers la même zone grise ; noter ce qui change dans la main arrière.
      key_point: Je choisis mon amplitude et ma vitesse avant de tirer, selon la distance.
      demo: "Tirer vers la même zone grise depuis un repère proche, puis depuis un repère lointain, en montrant le recul de la main."
      illustrations: [zones-distances]
      src: Prop
    - id: plan
      title: Le plan recul et vitesse
      weight: {adults: 1}
      body:
        - "Pour les adultes, une image : le recul de la main en abscisse, la vitesse du coup en ordonnée ; un tir proche est en bas à gauche, un tir lointain en haut à droite. Ce n'est pas une graduation fédérale."
      key_point: Plus la zone est loin, plus le point monte vers le haut à droite du plan.
      demo: null
      illustrations: [plan-puissance]
      src: Prop
initiation:
  - id: ini-5
    initiation_sheet: 5
    title: À la mesure, deux fois
    weight: {children: 5, adults: 3}
    setup: La rouge et la jaune du schéma sous les poches du haut ; deux repères pour la blanche, un à droite et un en bas à gauche, comme sur le schéma ; après chaque tir, replacer la blanche et la bille empochée.
    goal: "Empocher 4 billes à la mesure, la blanche ne devant pas sortir de la zone grise après impact : 2 billes avec un chevalet sur cadre, puis 2 billes avec un chevalet sur la surface de jeu."
    expected: La blanche s'arrête dans la zone grise à chaque tir ; le geste reste droit, avec une amplitude adaptée à la distance.
    scoring: {mode: counter, of: 4}
    illustration: schema-initiation
    src: S
