training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e3
      ref: {block: puissance, n: 3}
      diagram: entrainement-p02-e3
      title: Tir long, les deux garages du coin
      weight: {children: 1, adults: 1}
      setup: Une jaune dans chaque coin de gauche, devant la poche, dans la zone grise ; les rouges en deux paires, comme sur le schéma ; la blanche sur le repère à droite.
      instruction: "Empocher la jaune, la blanche passant entre les deux rouges de sa paire (d'après la flèche du schéma) : cinq tirs vers le coin du haut, puis cinq vers celui du bas, ou en alternant, au choix. Replacer la jaune et la blanche après chaque tir."
      expected: La blanche s'arrête dans la zone grise après chaque tir ; c'est le tir long, observer le recul de la main puis la vitesse.
      mistakes:
        - {symptom: "La blanche suit la jaune dans la poche ou rebondit hors de la zone grise", fix: "Reculer moins la main au moment d'armer et ralentir le coup ; amplitude et vitesse comptent toutes les deux."}
        - {symptom: "La blanche n'arrive pas à la jaune ou la touche trop mollement", fix: "Reculer davantage la main vers l'arrière au moment d'armer et accompagner le coup."}
        - {symptom: "L'élève confond les deux sens de « main »", fix: "Distinguer le réglage de la flèche (tenir la queue plus près du centre de gravité et poser le chevalet plus près) du recul de la main au moment d'armer."}
      playful:
        hook: Chaque blanche garée dans le garage fait avancer une voiture dessinée au tableau.
        challenge: Garer cinq blanches de suite sans sortir de la zone, chacun son tour.
      passes: 2
      src: S
    - id: e4
      ref: {block: puissance, n: 4}
      diagram: entrainement-p02-e4
      title: Tir court et précis, les garages du milieu
      weight: {children: 1, adults: 1}
      setup: Une jaune contre chaque poche du milieu, dans la zone grise ; les rouges en deux paires en diagonale, comme sur le schéma ; la blanche sur le repère à droite.
      instruction: "Empocher la jaune du haut, puis celle du bas, la blanche passant entre les deux rouges de chaque paire (d'après la flèche du schéma) ; quatre séries de deux tirs. Replacer la jaune et la blanche après chaque tir."
      expected: La blanche s'arrête dans la zone grise après chaque tir ; c'est le tir court, plus précis, avec le même recul de la main et la même vitesse pour le même tir.
      mistakes:
        - {symptom: "La blanche part trop vite et ressort de la zone", fix: "Reculer moins la main au moment d'armer, ralentir le coup, et choisir le recul avant de tirer."}
        - {symptom: "Le recul change d'un tir à l'autre", fix: "Tenir la queue au même endroit et poser le chevalet au même endroit pour garder la même flèche, puis reculer la main de la même longueur."}
      playful:
        hook: Annoncer « petit », « moyen » ou « grand » recul avant chaque tir.
        challenge: Réussir une série de deux tirs sans que la blanche ne quitte sa zone.
      passes: 1
      src: S
game:
  title: La pétanque avec la blanche
  source_game: 4
  adapted: false
  players: Partie à 2, ou par équipes de 2
  materials: "Un groupe de quatre billes (rouges ou jaunes) par joueur ou équipe, plus la blanche. Au départ, les deux groupes sont en deux amas à gauche de la ligne, rouges en haut et jaunes en bas, comme sur le schéma ; le groupe de chaque camp est tiré au sort [Prop]. Pour le défi ludique (proposition) : des jetons."
  setup_illustration: schema-jeu
  rules:
    - Le jeu se déroule avec des règles similaires à la pétanque ; chaque tir est joué depuis la ligne.
    - Le premier joueur tire la blanche pour la placer au-delà du trait, puis joue une bille de son groupe pour la placer au plus près de la blanche.
    - L'adversaire tente à son tour de placer une bille au plus près ; s'il y parvient, la main passe, sinon il rejoue jusqu'à y parvenir ou à ne plus avoir de billes.
    - Toute bille empochée ou revenue derrière le trait est retirée du jeu ; si c'est la blanche, les points restants vont à l'adversaire, plus 2 points.
    - "Chaque joueur ou équipe dispose de 4 billes : plusieurs manches sont nécessaires."
  scoring: En fin de manche, on compte le plus grand nombre de billes d'un même groupe au plus près de la blanche pour attribuer les points.
  end: Le premier joueur ou la première équipe à atteindre 8 points gagne la partie.
  playful_variant: "Le garage : on compte les jetons de la règle ci-dessous (annonce faite et bille à moins d'une largeur de main de la blanche), sans changer les points de la partie ; à la fin, le joueur qui a le plus de jetons est « maître garagiste »."
  link_previous:
    notion_of: puissance-1
    rule: "Exception aux règles de la fiche : avant chaque tir, le joueur annonce « petit », « moyen » ou « grand » recul (l'amplitude de l'armé, pas la position de la main sur la queue), selon la distance entre la ligne et la zone visée (la blanche, ou la bille à rejoindre). L'adversaire observe le recul réel et dit s'il correspond à l'annonce, à vue, sans mesure ; le joueur gagne un jeton si ce recul correspond et si sa bille s'arrête à moins d'une largeur de main (main posée à plat, doigts serrés) de la blanche."
    note: "Rejoue le dosage de l'amplitude de la séance précédente (recul réglé sur la distance, zone grise) ; une seule monnaie, le jeton ; règle facultative, le jeu 4 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Les équipes de deux sont déjà prévues par la fiche [S] : alterner les tireurs. Expliquer la pétanque (on lance une boule le plus près possible du but ; ici, le but est la blanche). Au-delà de quatre enfants, jouer sur plusieurs billards et faire tourner les équipes d'un billard à l'autre à chaque manche. Décompte proposé, la fiche ne le définissant pas : une bille plus proche de la blanche que toutes celles de l'adversaire vaut 1 point ; le perdant de la manche commence la suivante ; « points restants » = points manquants pour atteindre 8, à valider. Si le temps manque, fixer la partie à 5 points plutôt que 8, ou limiter à 15 minutes et donner la victoire à celui qui a le plus de points."
    adults: "Décompte proposé, la fiche ne le définissant pas : une bille plus proche de la blanche que toutes celles de l'adversaire vaut 1 point ; le perdant de la manche commence la suivante ; « points restants » = points manquants pour atteindre 8, à valider. Variante avec la noire (jeu 5) : propulser la noire grâce à la blanche, puis placer ses billes au plus près de la noire. Après la partie, chacun dit quel recul de main lui a donné ses meilleures billes."
  src: S   # titre, règles, score et fin du jeu 4 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Comment as-tu réglé ton recul pour arrêter la blanche dans la zone ?
    - Quelle distance était la plus difficile à doser, et pourquoi ?
    - Que dirais-tu à un copain pour choisir sa flèche avant de tirer ?
