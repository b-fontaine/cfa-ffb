  - {rank: S, file: Fiches Initiation CFA blackball.pdf, page: 5, note: Initiation 5}
  - {rank: S, file: Fiches Entrainement CFA blackball.pdf, page: 2, note: "Entraînement « La puissance », exercices 3 et 4"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 4, note: "Jeu 4 (pétanque avec la blanche) ; jeu 5 pour la variante adultes"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 5, note: "Jeu 5 (pétanque avec la noire), variante adultes"}
uncertainties:
  - "Le plan recul et vitesse (`plan-puissance`) est réservé aux adultes depuis le 2026-10-15 (audit : image abstraite pour des enfants), dans sa propre section ; les enfants voient le schéma de table `zones-distances`."
  - "Liaison avec puissance-1 (écrite) : notion et nom du thème alignés (V23) ; le pitch porte l'épisode 2. Partie 1 : jeu 3 et défi du dosage annoncé (doux, moyen, fort) ; partie 2 : jeu 4 et défi du garage. La liaison de jeu (annonce du recul) prolonge l'annonce « doux, moyen, fort » de la partie 1 ; le choix petit / moyen / grand est une proposition."
  - "Jeu 4 : la fiche [S] ne définit pas « points restants », à qui « la main passe », la règle de la pétanque (plus grand nombre de billes d'un même groupe au plus près), qui commence la manche suivante, ni le rôle de la noire ; le texte [S] est gardé intact, les précisions de décompte sont des propositions [Prop] dans l'adaptation. Matériel : un seul groupe de quatre billes par camp (schéma jeux-p04-j1) ; le tirage au sort du groupe est [Prop]."
  - "Illustration `fleche-personnage` de type `player_figure` : le joueur de profil montre la main de chevalet et la queue ; les deux positions de la main arrière (flèche courte, flèche longue) sont dites en légende, un personnage ne montrant qu'une position. Le plan `plan-puissance` est une image [Prop] (seuls les deux extrêmes viennent de la fiche n° 2)."
  - "Le rôle des rouges (obstacles à passer entre) est lu d'après la flèche du schéma ; la consigne l'indique (« d'après la flèche du schéma »)."
  - "Chevalet : le catalogue place les exercices 1-2 (partie 1) sur cadre et 3-4 (partie 2) sur la surface ; l'initiation 5 est jouée avec les deux chevalets dans les deux séances (fiche d'initiation)."
  - "La section « Plus loin, plus de recul » (distances, chevalet sur surface) est une proposition [Prop] : la fiche technique n° 2 ne détaille ni la distance ni le type de chevalet. Les schémas de flèche et de distance sont générés."
  - "Le rôle des rouges dans les exercices 3 et 4 n'est pas précisé par le schéma [S] (obstacles à passer entre, ou billes à toucher) ; la consigne suit la flèche du schéma. Rôle des jaunes : billes à empocher, déduit du libellé « empocher »."
  - "L'initiation 5 est reprise de la partie 1 comme échauffement ; le choix de la rejouer est une proposition, la fiche l'attribue à la technique entière."
  - "La règle de rappel (annonce du recul), le jeton, le garage, l'adaptation enfants (5 points, 15 minutes) et la variante adultes sont des propositions [Prop] ; la variante noire s'appuie sur le jeu 5 [S]."
  - "Tailles : la blanche (48,0 mm) est plus petite que la bille de but (50,8 mm) [S], sans effet sur la notion de puissance : aucune mention ajoutée dans le texte. Dans `zones-distances`, les flèches s'arrêtent au contact, centre de la blanche à 0,2136 case du centre de la rouge (r_c + r_o, et non 2 r) [Prop]."
  - "Les minutes sont calculées à partir des poids et sont des propositions."
