  - {rank: S, file: Fiches Entrainement CFA blackball.pdf, page: 16, note: "Entraînement « Le rebond d'une bille sur une bande », exercices 3 et 4 (deux bandes avant de toucher une bille)"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 13, note: Jeu 13}
uncertainties:
  - "Section « La puissance referme l'angle » : texte de la fiche n° 9 seul ; la puissance modérée à deux bandes est une phrase [Prop] de « Deux bandes, deux rebonds »."
  - "Sections « D'où part l'angle ? » et « Deux bandes, deux rebonds » (méthode « repérer la seconde bande puis viser la première », inspirée du « miroir » du carambole, non transposée sans validation), initiation sur deux bandes, thème, défis, règle de lien, variante de jeu et adaptations : [Prop], à valider par un animateur dans l'application."
  - "Les énoncés des exercices 3 et 4 ne précisent pas le type de chevalet ; la séance ne l'impose pas."
  - "Exercice 3 : le taux du catalogue porte sur trois tirs ; le schéma [S] ne dessine que les jaunes 1 et 2 (la jaune 3 n'a pas de flèche) : la séance joue ces deux jaunes puis rejoue l'une d'elles, ce qui est une proposition. Exercice 4 : seule la rouge 1 est visée sur le schéma ; viser les rouges 2 et 3 est une proposition de la séance."
  - "Les billes noire, rouge et jaunes des schémas des exercices 3 et 4 sont des obstacles ou repères dont le rôle n'est pas précisé par la source ; les éviter est une lecture du schéma."
  - "Fiche n° 9 : le texte dit que l'angle de rebond se referme avec la puissance, la légende du schéma note « angle d'arrivée < angle de rebond ». Les deux sont cohérents si l'angle est mesuré depuis la bande (légende) ou depuis la perpendiculaire (texte) ; la séance fixe la perpendiculaire comme convention (section « D'où part l'angle ? », [Prop]) et signale le point à l'animateur (voir 00-provenance-et-fiabilite.md)."
  - "Le rappel porte sur rebond-bande-1 (angle égal, point visé et point d'impact, centre de la blanche et puissance modérée, puissance qui referme l'angle) et reprend son illustration rebond-egal (V7) ; notion et theme.name sont alignés sur elle (V23) ; le pitch annonce les deux rebonds du jour."
  - "Jeu 13 : la source ne dit rien du sort d'une bille jouée sur un coup invalide ni du nombre de points par bille ; les conventions « bille replacée, tir perdu » et « un point par bille du groupe au plus proche » sont des propositions (adaptation). Le schéma [S] montre quatre rouges et quatre jaunes sans en préciser le nombre dans le texte ; composition des groupes, tirage au sort et limite de temps sont des propositions."
