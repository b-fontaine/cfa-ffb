training:
  exercises:
    - id: e3
      ref: {block: rebond-bande, n: 3}
      diagram: entrainement-p16-e3
      title: Le double ricochet à droite
      weight: {children: 2, adults: 1}
      setup: "La blanche sur son repère à gauche de la médiane ; les jaunes du schéma alignées près de la grande bande du bas, à droite ; la noire et la rouge du schéma restent immobiles devant la blanche."
      instruction: "Envoyer la blanche sur la grande bande du haut, puis sur la petite bande de droite, avant de toucher la jaune 1 ; jouer ensuite la jaune 2 de la même façon, puis rejouer au choix la jaune 1 ou la jaune 2 pour faire trois tirs."
      expected: "La blanche touche deux bandes avant de toucher la jaune visée. Éviter la noire et la rouge est une lecture du schéma, que la fiche ne formule pas."
      mistakes:
        - {symptom: La blanche touche la noire ou la rouge avant la bande, fix: Suivre des yeux le chemin entier avant de tirer et décaler le point visé sur la première bande.}
        - {symptom: La blanche arrive trop court sur la seconde bande, fix: "Accompagner davantage le geste, avec une amplitude plus grande et sans à-coup."}
        - {symptom: La blanche rate la jaune d'une largeur de bille, fix: Rejouer le même tir en déplaçant le point visé sur la première bande d'un petit pas.}
      playful:
        hook: Avant chaque tir, le joueur annonce « haut puis droite » ; son binôme trace le chemin du doigt au-dessus de la table.
        challenge: "Faire avancer le galet d'une case au tableau pour chaque jaune touchée après deux bandes. Adultes (proposition) : déplacer le repère de départ d'une largeur de main entre deux tirs."
      passes: 2
      src: S
    - id: e4
      ref: {block: rebond-bande, n: 4}
      diagram: entrainement-p16-e4
      title: Le double ricochet à gauche
      weight: {children: 1, adults: 1}
      setup: "La blanche sur son repère à droite de la ligne de départ, juste sous la noire du schéma ; les rouges du schéma alignées sur la médiane de la table ; les jaunes et la noire restent immobiles."
      instruction: Envoyer la blanche sur la petite bande de gauche, puis sur la grande bande du haut, avant de toucher la rouge 1 de la médiane ; viser ensuite la rouge 2 puis la rouge 3 en changeant le point visé.
      expected: La blanche touche deux bandes avant la rouge visée, sans toucher les jaunes ni la noire ; la trajectoire redescend en diagonale vers la médiane.
      mistakes:
        - {symptom: La blanche quitte la bande de gauche trop haut, fix: "Viser un point plus bas sur la bande de gauche, plus loin du coin du haut."}
        - {symptom: La blanche touche une jaune sur son chemin, fix: "Vérifier avant le tir que l'aller passe entre la noire et la bande de gauche, et que le retour passe au-dessus des jaunes."}
      playful:
        hook: Le binôme choisit la rouge à viser (1, 2 ou 3) et le joueur le dit avant de tirer.
        challenge: Toucher deux rouges différentes de suite, après deux bandes chaque fois.
      passes: 1
      src: S
game:
  title: "« Pétanque » avec bande avant impact"
  source_game: 13
  adapted: false
  players: 2 joueurs ou 2 équipes de 2
  materials: "Les billes du schéma : quatre rouges, quatre jaunes, la noire et la blanche. Pour la variante ludique (proposition) : un tableau."
  setup_illustration: schema-jeu
  rules:
    - "Pour chaque tir, la blanche est placée librement dans la zone de replacement. Chaque bille de couleur est positionnée librement sur le trait tracé."
    - "À l'aide de la blanche, le joueur propulse la noire sur l'aire de jeu."
    - "En replaçant la blanche avec la main, il joue une des billes de son groupe pour la placer au plus près de la noire ; chaque coup doit être effectué avec une bande avant impact."
    - Le coup n'est pas valable si aucune bille ne touche une bande, ou si la bille de couleur jouée touche une autre bille avant un rebond sur une bande.
    - "L'adversaire tente à son tour de placer une de ses billes au plus près de la noire ; s'il y parvient, la main passe et son adversaire doit tenter de placer une de ses billes au plus près ; s'il n'y parvient pas, il rejoue jusqu'à ce qu'il y parvienne ou qu'il n'ait plus de billes à jouer."
  scoring: "On comptabilise le plus grand nombre de billes du même groupe au plus proche de la noire pour attribuer les points au joueur."
  end: Le premier joueur à atteindre 8 points gagne la partie.
  playful_variant: "Course aux ricochets, en équipes de deux et en tournante : les partenaires se relaient tir après tir. Pour chaque bille de l'équipe placée près de la noire, un galet est ajouté sur la mare dessinée au tableau ; le chemin de chaque tir réussi à deux bandes y est tracé."
  link_previous:
    notion_of: rebond-bande-1
    rule: "Exception aux règles du jeu 13 : un joueur peut annoncer « deux bandes » avant son tir ; sa bille doit alors toucher une première bande, puis une seconde bande, avant d'atteindre une autre bille, au lieu d'une seule bande avant impact. S'il réussit et que sa bille finit plus près de la noire que toutes les autres, son équipe compte un point de plus."
    note: "Fait jouer la bande avant impact de la séance 1/2 et la nouveauté de cette séance dans la même partie ; règle facultative, le jeu 13 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Réduire le nombre de billes par joueur et propulser la noire avec une puissance modérée, pour qu'elle reste dans la zone de jeu (proposition). Mise en place proposée (la fiche ne la précise pas) : binômes de niveau proche, tirage au sort pour commencer, partie limitée à 15 minutes ; après 15 minutes, on compte les billes les plus proches de la noire et gagne qui en a le plus. La règle « deux bandes » est réservée à un tour bonus : un seul tir annoncé par joueur. Conventions proposées : une bille jouée sur un coup invalide est replacée et le tir est perdu ; chaque bille du groupe au plus proche de la noire compte un point."
    adults: "Après la partie, compter les coups invalides (aucune bande, contact avant le rebond) et les comparer à ceux de la séance précédente. Variante plus difficile : exiger deux bandes avant impact pour tous les coups d'un tour. Mêmes conventions proposées que pour les enfants (bille d'un coup invalide replacée et tir perdu ; un point par bille du groupe au plus proche de la noire)."
  src: S   # titre, règles, score et fin du jeu 13 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Combien de bandes la blanche a-t-elle touchées dans ton meilleur tir, et où as-tu visé ?
    - Qu'as-tu changé quand la blanche arrivait trop court ou trop loin ?
    - Que dirais-tu à un copain pour réussir un coup à deux bandes ?
sources:
  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 19, note: "Fiche technique n° 9 (rebond sans effet, point visé et point d'impact, puissance)"}
