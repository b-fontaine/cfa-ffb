# Séance du catalogue : « Le rebond d'une bille sur une bande », partie 2/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: rebond-bande-2
order: 16
technique: rebond-bande
part: 2
title: Le rebond d'une bille sur une bande
technical_sheets: [9]
previous: rebond-bande-1
catalogue_block: rebond-bande
notion: Viser un point de la bande pour que la blanche, jouée sans effet, touche une bille après un rebond.
theme:
  name: Le ricochet
  pitch: >-
    Épisode 2 : aujourd'hui, la blanche rebondit deux fois. Un seul rebond ne
    suffit plus, le galet fait deux ricochets de suite. Chaque tir à deux bandes
    réussi ajoute un galet sur la mare dessinée au tableau.
recall:
  points:
    - Sans effet, l'angle de rebond est égal à l'angle d'arrivée.
    - On vise un point de la bande, et non la bille ; plus l'angle d'arrivée est important (ouvert), plus ce point est loin du point d'impact.
    - On vise le centre de la blanche, avec une puissance modérée.
    - Un coup trop puissant referme l'angle de rebond.
  question:
    ask: Sans effet, quel est le lien entre l'angle d'arrivée et l'angle de rebond ?
    answer: Ils sont égaux, à peu de chose près (les bandes et le drap peuvent le modifier un peu).
  reuse: {sheet: rebond-bande-1, illustration: rebond-egal}
  src: S
theory:
  sections:
    - id: angle-convention
      title: D'où part l'angle ?
      weight: {children: 1, adults: 1}
      body:
        - "Pour parler d'un angle de rebond, on part de la perpendiculaire à la bande : le trait droit devant la bande."
        - "Sur la fiche fédérale, la légende « angle d'arrivée < angle de rebond » du coup puissant est juste si l'on mesure depuis la bande ; avec la perpendiculaire, on dit que l'angle se referme."
      key_point: Les angles se mesurent depuis la perpendiculaire, droit devant la bande.
      demo: "Poser la main à plat, doigts vers la table, droit devant la bande : c'est la perpendiculaire."
      illustrations: []
      src: Prop
    - id: deux-bandes
      title: Deux bandes, deux rebonds
      weight: {children: 3, adults: 3}
      body:
        - "À chaque bande, la même règle : la blanche repart avec l'angle d'arrivée."
        - "Pour viser, on part de la fin : on repère le point de la seconde bande qui renvoie la blanche sur la bille, puis on vise sur la première bande le point qui l'envoie vers ce repère."
        - On regarde le chemin entier de la blanche avant de tirer.
        - Avec deux bandes, on garde une puissance modérée.
      adult_extra:
        - "Même idée qu'au carambole (le « miroir ») : la bande prolonge le chemin de l'autre côté ; cette méthode n'est pas dans les fiches du Blackball et reste à valider."
        - "Plus il y a de bandes, plus une petite erreur au premier rebond s'agrandit ; la qualité des bandes et du drap pèse à chaque rebond."
      key_point: On repère d'abord le point de la seconde bande, puis on vise la première.
      demo: "Poser un repère sur la première bande, tirer, puis rejouer le même tir en déplaçant le repère de la largeur d'une bille pour voir où arrive la blanche."
      illustrations: [deux-bandes]
      src: Prop
    - id: visee-impact
      title: Le point visé n'est pas le point d'impact
      weight: {adults: 2}
      body:
        - Plus l'angle d'arrivée est important, plus le point de visée s'éloigne du point d'impact, car la bille a un rayon.
      key_point: Plus l'angle est important (ouvert), plus on vise loin du point d'impact.
      demo: "Montrer, avec un angle trop ouvert, l'écart entre le point visé et le point d'impact sur la bande (situation B de l'initiation 11)."
      illustrations: [angle-ouvert]
      src: S
    - id: puissance
      title: La puissance referme l'angle
      weight: {children: 1, adults: 1}
      body:
        - Plus le coup est puissant, plus l'angle de rebond a tendance à se refermer.
      key_point: Un coup puissant referme l'angle de rebond.
      demo: null
      illustrations: []
      src: S
initiation:
  - id: ini-deux-bandes
    initiation_sheet: 11
    title: Toucher une bille par deux bandes
    weight: {children: 3, adults: 3}
    setup: "Reprendre l'initiation 11 sans la bille obstacle : la blanche à gauche de la table, la bille objet (la rouge, comme dans l'initiation 11) en bas à droite, près de la grande bande du bas ; aucune autre bille sur la table."
    goal: "Toucher la bille objet avec la blanche après deux bandes : la grande bande du haut, puis la petite bande de droite."
    expected: Le point de la seconde bande est repéré avant de viser la première ; la blanche est visée au centre, avec une puissance modérée.
    scoring:
      mode: checklist
      criteria:
        - Repère le point de la seconde bande avant de viser
        - Vise un point de la première bande
        - Vise le centre de la blanche avec une puissance modérée
        - La blanche touche les deux bandes puis la bille objet
    illustration: deux-bandes
    src: Prop
