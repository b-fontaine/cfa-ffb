# Séance du catalogue : « Finesse », partie 1/1.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: finesse-1
order: 14
technique: finesse
part: 1
title: Finesse
technical_sheets: [8]
previous: quart-1
catalogue_block: quart-finesses
notion: Viser en dehors de la bille de couleur pour l'effleurer par le bord et l'empocher en finesse.
theme:
  name: L'art de frôler
  pitch: >-
    Une finesse, c'est encore plus fin qu'un quart : on ne voit presque plus
    de recouvrement, seulement le bord de la bille. Chaque finesse réussie
    fait avancer le frôleur d'une case sur la piste.
recall:
  points:
    - Au quart de bille, on vise en dehors de la bille de couleur, à un demi-rayon au-delà, compté avec la blanche, qui est plus petite.
    - Les deux billes se touchent bien, même si la visée passe à côté.
    - La blanche garde une grande part de son énergie et dévie peu.
    - La blanche parcourt plus de chemin que la bille de couleur.
  question:
    ask: Au quart de bille, où vise-t-on, et quelle bille parcourt le plus de chemin ?
    answer: En dehors de la bille de couleur, à un demi-rayon au-delà ; c'est la blanche qui parcourt le plus.
  # Illustration `visee-quart` de la séance précédente (quart-1) : la visée passe à côté de la bille.
  reuse: {sheet: quart-1, illustration: visee-quart}
  src: S
theory:
  sections:
    - id: viser-dehors
      title: Viser à côté de la bille
      weight: {children: 3, adults: 3}
      body:
        - Au-delà du quart de bille, la disposition des billes demande une visée en finesse.
        - La visée passe à côté de la bille de couleur sans la couper.
        - La blanche ne touche la bille de couleur que sur son bord.
        - On vise un peu plus loin de la bille que pour le quart.
      adult_extra:
        - "La blanche est un peu plus petite que la bille de couleur : au Blackball, la mesure du quart se prend par rapport à la blanche, et la finesse commence au-delà de ce quart."
        - "Il n'existe pas une seule finesse : le joueur apprécie la quantité selon la trajectoire que doit suivre la bille de couleur."
      key_point: En finesse, on vise un peu plus loin qu'au quart ; seul le bord de la bille est touché.
      demo: "Poser la blanche au contact du bord de la bille de couleur (bille fantôme), montrer le point de contact, retirer la blanche, puis jouer sans empocher."
      illustrations: [contact-fin, visee-finesse, quantites]
      src: S
    - id: deux-faits
      title: Deux choses à observer
      weight: {children: 2, adults: 2}
      body:
        - Le transfert d'énergie est très faible ; la blanche garde presque toute son énergie.
        - La blanche parcourt un trajet bien plus long que la bille de couleur.
        - La blanche dévie à peine de sa trajectoire de départ.
      key_point: Très peu de transfert, très peu de déviation de la blanche.
      demo: "Jouer une finesse sans empocher et montrer où s'arrêtent la blanche, puis la bille de couleur."
      illustrations: [trajectoires-finesse, quantites]
      src: S
    - id: mot-bord
      title: Effleurer
      weight: {children: 1}
      body:
        - "Au quart, on voit encore la blanche recouvrir un peu la bille de couleur. En finesse, on ne voit presque plus de recouvrement : la blanche effleure le bord, comme une plume."
      key_point: "Quart : un peu de recouvrement. Finesse : presque plus, juste le bord."
      demo: null
      illustrations: [contact-fin, quantites]
      src: Prop
    - id: puissance
      title: Régler la puissance
      weight: {children: 1, adults: 1}
      body:
        - "Peu d'énergie passe à la couleur : on règle la puissance pour qu'elle arrive à la poche."
        - La visée ne change pas.
      key_point: La visée ne change pas ; on règle la puissance pour que la couleur arrive à la poche.
      demo: null
      illustrations: [trajectoires-finesse]
      src: Prop
    - id: lire-blanche
      title: Lire la blanche
      weight: {adults: 2}
      body:
        - Après chaque tir, repérer où s'arrête la blanche par rapport à sa trajectoire de départ.
        - Plus la blanche dévie, plus le contact était épais ; elle part du côté opposé à la direction prise par la bille de couleur, et la visée était trop proche de la bille.
        - "Correction : blanche qui dévie fort, viser plus à l'extérieur de la bille ; la poser en bille fantôme, puis la retirer, pour repérer le bon point."
      key_point: La déviation de la blanche dit quelle quantité a vraiment été jouée.
      demo: null
      illustrations: [trajectoires-finesse]
      src: Prop
