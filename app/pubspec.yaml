name: billard_cfa
description: "Assistant de préparation de séances de billard"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  injectable: ^3.0.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.11.3
  shared_preferences: ^2.5.6
  sqlite3: ^3.4.0
  yaml: ^3.1.3

dev_dependencies:
  bdd_widget_test: ^2.1.4
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  cross_file: ^0.3.5+5
  drift_dev: ^2.35.1
  fake_cloud_firestore: ^4.3.0
  file_picker_platform_interface: ^4.2.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Copie du catalogue (source : docs/knowledge/03-exercices) ;
    # produite par scripts/sync_catalogue.sh, vérifiée par check.sh.
    - assets/catalogue/

    # Logo de la FFB (utilisé via BrandAssets, shared/ui/theme).
    - assets/images/

    # Copie des diagrammes à table (source : docs/knowledge/03-exercices/
    # diagrammes) ; produite par scripts/sync_diagrammes.sh, vérifiée par
    # check.sh. Un dossier par transcription (la déclaration n'est pas récursive).
    - assets/diagrammes/entrainement/
    - assets/diagrammes/initiation/
    - assets/diagrammes/jeux/
    # Pages [Prop] (hors PDF) : mise en place des blocs d'entraînement proposés.
    - assets/diagrammes/proposition/

    # Copie des séances du catalogue (source : docs/knowledge/05-seances/
    # catalogue) ; produite par scripts/sync_fiches.sh, vérifiée par check.sh.
    - assets/fiches/

  # Exo 2 (charte FFB) : police libre SIL OFL 1.1, source
  # https://github.com/google/fonts/tree/main/ofl/exo2 ; licence dans
  # assets/fonts/OFL.txt (à conserver avec les fichiers de police).
  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2.ttf
        - asset: assets/fonts/Exo2-Italic.ttf
          style: italic
