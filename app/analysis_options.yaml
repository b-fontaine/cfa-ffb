include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/*.steps.dart"
    - lib/shared/l10n/generated/**
    - test/bdd/**/*_test.dart
    # Schémas de migration générés par drift_dev (make-migrations).
    - test/drift/**/generated/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Les identifiants de code sont en anglais mais la doc publique est en français :
    public_member_api_docs: false
    # Syntaxe de constructeur classique conservée (freezed, injectable).
    unnecessary_type_name_in_constructor: false
