<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Valeur remplacée par l'argument `--base-href` de `flutter build`
    (« $FLUTTER_BASE_HREF » sinon). Le service worker et le manifeste
    s'appuient sur des chemins relatifs à cette base.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Assistant de préparation de séances de billard">
  <meta name="theme-color" content="#1964AF">

  <!-- iOS : « Ajouter à l'écran d'accueil » -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Billard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Séances de billard</title>

  <style>
    /* Fond de l'écran de chargement : celui de l'application, sans flash blanc. */
    body { margin: 0; background: #F7F9FC; }
    @media (prefers-color-scheme: dark) { body { background: #0E1318; } }
  </style>
</head>
<body>
  <!-- Service worker hors ligne et détection de mise à jour (offline.js). -->
  <script src="offline.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
