# Déploiement de la version web sur Firebase Hosting (canal « live ») à chaque
# push sur main. Généré par la CLI Firebase puis adapté : la recette de build
# est celle du job build-web de ci.yml (Flutter épinglé, scripts/generate.sh).
# Les règles et les index Firestore sont déployés AVANT l'hébergement par le
# job `firestore` (workflow appelé firebase-firestore-deploy.yml, à chaque
# exécution : un push en attente remplacé par un suivant ne doit jamais perdre
# ses règles) ; si ce déploiement échoue, l'hébergement n'est pas déployé
# (`needs`).

name: Déployer sur Firebase Hosting (main)
on:
  push:
    branches:
      - main

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Version épinglée : alignée sur ci.yml et sur le Flutter utilisé en local.
  FLUTTER_VERSION: "3.47.7"

jobs:
  firestore:
    name: Règles et index Firestore (avant l'hébergement)
    uses: ./.github/workflows/firebase-firestore-deploy.yml
    # Le job de déploiement du workflow appelé a besoin du jeton d'identité
    # (WIF) ; un workflow appelé ne peut pas dépasser les droits de l'appelant.
    permissions:
      contents: read
      id-token: write

  build_and_deploy:
    name: Build web + déploiement live
    needs: firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code
        run: scripts/generate.sh
      # Une seule recette (CanvasKit local, service worker hors ligne stampé et
      # vérifié) : scripts/build_web.sh. Sans drapeau : le défaut du build est
      # Firestore (bascule du 2026-10-21) ; les previews de PR, elles, passent
      # drift explicitement (firebase-hosting-pull-request.yml).
      - name: Build web
        run: scripts/build_web.sh
      - name: Déploiement Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANIMATION_BILLARD }}
          channelId: live
          projectId: animation-billard
