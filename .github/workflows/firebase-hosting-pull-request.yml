# Canal de prévisualisation Firebase Hosting pour chaque pull request interne
# (URL temporaire commentée sur la PR). Généré par la CLI Firebase puis adapté :
# la recette de build est celle du job build-web de ci.yml.

name: Prévisualiser sur Firebase Hosting (PR)
on: pull_request

concurrency:
  group: firebase-hosting-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  # Version épinglée : alignée sur ci.yml et sur le Flutter utilisé en local.
  FLUTTER_VERSION: "3.47.7"

jobs:
  build_and_preview:
    name: Build web + canal de prévisualisation
    # Les PR issues d'un fork n'ont pas accès aux secrets : pas de prévisualisation.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code
        run: scripts/generate.sh
      # Une seule recette (CanvasKit local, service worker hors ligne stampé et
      # vérifié) : scripts/build_web.sh.
      # Décision A1 de l'ADR 0024 : previews de PR non connectées à Firestore.
      # Le défaut du build est Firestore (bascule du 2026-10-21) ; la
      # prévisualisation d'une PR, éphémère et sans donnée de club, reste sur
      # drift (explicite) pour ne jamais lire ni écrire les données du club
      # réel. Le déploiement live (firebase-hosting-merge.yml) construit le
      # défaut, Firestore. Contrôlé par app/test/tool/workflows_test.dart.
      - name: Build web
        run: scripts/build_web.sh --dart-define=DATA_BACKEND=drift
      - name: Déploiement sur un canal de prévisualisation
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANIMATION_BILLARD }}
          projectId: animation-billard
