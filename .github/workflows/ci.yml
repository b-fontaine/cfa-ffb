name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mutation complète, chaque dimanche à 02:00 UTC (seuls quality + mutation tournent).
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Version épinglée : alignée sur le Flutter utilisé en local (voir docs/engineering).
  FLUTTER_VERSION: "3.47.7"

jobs:
  quality:
    name: Qualité (format, analyse, architecture, séances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Garde-fous rapides
        run: scripts/check.sh --fast

  test:
    if: github.event_name != 'schedule'
    name: Tests + couverture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Garde-fous complets (sans mutation)
        run: scripts/check.sh --full
        env:
          SKIP_MUTATION: "1"
      - name: Rapport de couverture
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  mutation:
    # PR : mutation CIBLÉE sur les fichiers lib/ modifiés vs la base.
    # Planifié (hebdo) ou manuel : mutation COMPLÈTE. Pas de mutation sur push main
    # (déjà faite sur la PR).
    name: Mutation testing (${{ github.event_name == 'pull_request' && 'ciblée' || 'complète' }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historique complet : merge-base avec la branche de base.
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code
        run: scripts/generate.sh
      - name: Mutation ciblée (fichiers modifiés vs la base, seuil de app/mutation-test.xml)
        if: github.event_name == 'pull_request'
        run: scripts/mutation.sh --changed "origin/${{ github.base_ref }}"
      - name: Mutation complète (seuil de app/mutation-test.xml)
        if: github.event_name != 'pull_request'
        run: scripts/mutation.sh
      - name: Rapport de mutation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: app/build/mutation-report
          if-no-files-found: ignore

  build-web:
    if: github.event_name != 'schedule'
    name: Build web
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code
        run: scripts/generate.sh
      - name: Build web
        working-directory: app
        run: flutter build web --release --no-pub

  widgetbook:
    if: github.event_name != 'schedule'
    name: Widgetbook (génération, analyse, build web)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code de l'application
        run: scripts/generate.sh
      - name: Génération du code Widgetbook (pub get, build_runner)
        run: scripts/generate_widgetbook.sh
      - name: Analyse stricte
        working-directory: widgetbook
        run: flutter analyze --no-pub --fatal-infos
      - name: Complétude des use cases
        run: dart run scripts/check_widgetbook.dart app widgetbook
      - name: Build web
        working-directory: widgetbook
        run: flutter build web --release --no-pub
