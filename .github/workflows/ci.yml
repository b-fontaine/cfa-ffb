name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Version épinglée : alignée sur le Flutter utilisé en local (voir docs/engineering).
  FLUTTER_VERSION: "3.47.7"
  # Outillage Firebase (émulateurs, tests des règles) : package.json exige Node >= 24.12 ;
  # les émulateurs de firebase-tools 15 exigent Java >= 21 (voir docs/engineering/quality-gates.md).
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:
  quality:
    name: Qualité (format, analyse, architecture, séances, fiches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Inclut la synchro et la validation des fiches de séance (sync_fiches.sh --check,
      # tool/fiches.dart --complete, 29 séances) : une seule définition des garde-fous, dans check.sh.
      - name: Garde-fous rapides
        run: scripts/check.sh --fast

  test:
    name: Tests + couverture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Prérequis des règles Firestore (check.sh --full lance les émulateurs) ; leur
      # absence fait ÉCHOUER le garde-fou, jamais sauter (scripts/rules_test.sh).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Dépendances Node (versions épinglées)
        run: npm ci
      # Google Chrome est installé d'office sur ubuntu-latest et macos-latest : la fumée du
      # build web compilé (scripts/web_smoke.sh) pilote ce Chrome, sans téléchargement.
      # Le parcours application + émulateurs (scripts/emulator_e2e.sh) compile l'application en debug
      # avec le Flutter déjà installé par ce job.
      - name: Garde-fous complets (dont règles Firestore, fumée du build web compilé et parcours application + émulateurs)
        run: scripts/check.sh --full
      - name: Rapport de couverture
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code
        run: scripts/generate.sh
      # Une seule recette (CanvasKit local, service worker hors ligne stampé et
      # vérifié) : scripts/build_web.sh.
      - name: Build web
        run: scripts/build_web.sh

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Gradle (AGP 9) exige Java 17 ou plus.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Génération du code
        run: scripts/generate.sh
      # Détecte tôt les incompatibilités natives des plugins FlutterFire ;
      # pas de signature (plateforme Android signée : lot 21).
      - name: Build APK debug
        working-directory: app
        run: flutter build apk --debug --no-pub

  widgetbook:
    name: Widgetbook (génération, analyse, build web)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code de l'application
        run: scripts/generate.sh
      - name: Génération du code Widgetbook (pub get, build_runner)
        run: scripts/generate_widgetbook.sh
      - name: Analyse stricte
        working-directory: widgetbook
        run: flutter analyze --no-pub --fatal-infos
      - name: Complétude des use cases
        run: dart run scripts/check_widgetbook.dart app widgetbook
      - name: Build web
        working-directory: widgetbook
        run: flutter build web --release --no-pub
