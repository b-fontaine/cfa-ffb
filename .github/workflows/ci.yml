name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Version épinglée : alignée sur le Flutter utilisé en local (voir docs/engineering).
  FLUTTER_VERSION: "3.47.7"

jobs:
  quality:
    name: Qualité (format, analyse, architecture, séances, fiches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Inclut la synchro et la validation des fiches de séance (sync_fiches.sh --check,
      # tool/fiches.dart --complete, 29 séances) : une seule définition des garde-fous, dans check.sh.
      - name: Garde-fous rapides
        run: scripts/check.sh --fast

  test:
    name: Tests + couverture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Garde-fous complets
        run: scripts/check.sh --full
      - name: Rapport de couverture
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code
        run: scripts/generate.sh
      # Une seule recette (CanvasKit local, service worker hors ligne stampé et
      # vérifié) : scripts/build_web.sh.
      - name: Build web
        run: scripts/build_web.sh

  widgetbook:
    name: Widgetbook (génération, analyse, build web)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Génération du code de l'application
        run: scripts/generate.sh
      - name: Génération du code Widgetbook (pub get, build_runner)
        run: scripts/generate_widgetbook.sh
      - name: Analyse stricte
        working-directory: widgetbook
        run: flutter analyze --no-pub --fatal-infos
      - name: Complétude des use cases
        run: dart run scripts/check_widgetbook.dart app widgetbook
      - name: Build web
        working-directory: widgetbook
        run: flutter build web --release --no-pub
