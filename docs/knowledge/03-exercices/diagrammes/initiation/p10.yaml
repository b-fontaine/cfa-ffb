    annotations:
      - "Trait plein vertical à x ≈ 1,82 : trait tracé près duquel placer la bille blanche (adulte) ; un enfant se place un peu plus près de la petite bande."
      - "Schéma de quantité de bille au centre gauche de la table : blanche recouvrant presque entièrement une bille rouge (bille pleine), point bleu au centre de la blanche (attaque au centre), ligne turquoise sous la bille."
      - "Consigne : puissance très importante (grande amplitude, grande vitesse)."
    description: >-
      Table vue de dessus, départ à gauche. Neuf billes forment un losange (diamant) centré sur la bille noire
      numérotée 8, à x ≈ 6,0 ; y ≈ 2,0 (sur l'axe médian) : 4 rouges (une au-dessus,
      une en dessous de la noire, deux de part et d'autre en diagonale), 4 jaunes (une à gauche et une à droite de
      la noire sur l'axe médian, deux en diagonale), et la noire au centre. Les billes se touchent. Un cercle
      creux (la blanche, à poser) est dessiné à x ≈ 1,65 ; y ≈ 1,55, juste à gauche du trait vertical plein
      (x ≈ 1,82). Une flèche pleine part de ce cercle vers le losange et s'arrête à x ≈ 4,8 ; y ≈ 1,9 : sa
      prolongation arrive sur un cercle creux pointillé à x ≈ 5,37 ; y ≈ 2,0, collé à la bille jaune de pointe
      gauche du losange (position de la blanche à l'impact, première bille du losange). Aucune bille blanche
      n'est dessinée. Au centre gauche, un grand schéma de quantité de bille (blanche et bille rouge presque
      superposées, point bleu au centre, croix de visée, trait turquoise sous la bille). Objectif du texte : viser
      la première bille du losange pour éparpiller les billes, en quantité de bille pleine et en attaquant au
      centre, avec une puissance très importante. Le chevalet peut être sur la surface de jeu ou sur le cadre.
    uncertainties:
      - "Aucune bille blanche pleine dessinée : le petit cercle creux à x ≈ 1,65 est lu comme la blanche posée (bille w ajoutée aux billes par convention de transcription)."
      - "Type de chevalet non imposé : le texte propose « sur la surface de jeu ou sur le cadre » ; le trait turquoise du schéma n'est pas commenté."
      - "La flèche s'arrête avant le cercle d'impact ; sa prolongation (pente) vise le cercle pointillé collé à la bille jaune de pointe gauche."
      - "Ligne de départ lue à x ≈ 1,82 (et non 2,0) ; le texte parle de « trait tracé »."
      - "Positions lues à ≈ 0,1 case près ; billes du losange supposées jointives."
      - "Pas de taux de réussite ni de nombre de séances, pas de pastille Billard de bronze sur cette page."
