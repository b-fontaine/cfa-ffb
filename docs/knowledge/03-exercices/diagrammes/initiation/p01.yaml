      - {id: g4, at: [6.97, 3.57], role: cue_start, for: w, label: "4"}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[1.01, 3.45], [0.36, 0.68]], bounces: [], to: tl}
      - {id: a2, ball: w, kind: cue, path: [[3.0, 3.45], [3.96, 0.56]], bounces: [], to: tm}
      - {id: a3, ball: w, kind: cue, path: [[5.02, 3.45], [4.06, 0.56]], bounces: [], to: tm}
