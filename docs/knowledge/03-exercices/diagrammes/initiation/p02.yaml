      - {id: a2, ball: w, kind: cue, path: [[1.82, 2.01], [3.75, 0.38]], bounces: [], to: tm}
      - {id: a3, ball: w, kind: cue, path: [[1.82, 2.01], [0.35, 3.67]], bounces: [], to: bl}
      - {id: a4, ball: w, kind: cue, path: [[1.82, 2.01], [3.86, 3.67]], bounces: [], to: bm}
    zones: []
    sequence:
      - {step: 1, cue: w, hit: r1, contact: none, pocket: tl}
      - {step: 2, cue: w, hit: y1, contact: none, pocket: tm}
      - {step: 3, cue: w, hit: y2, contact: none, pocket: bl}
      - {step: 4, cue: w, hit: r2, contact: none, pocket: bm}
