    description: >-
      Table vue de dessus, en paysage, départ à gauche, avec la grille pointillée (8 colonnes x 4 lignes) et le
      trait plein vertical de la ligne de départ à gauche (environ x = 1,8). La bille blanche est posée sur
      cette ligne, au centre de la largeur (environ 1,8 ; 2,0) ; elle porte deux petits repères rouges
      (probablement des marques de l'illustration, sans consigne dans le texte). Au centre-droit de la table,
      à environ x = 6,0 sur l'axe longitudinal (y = 2,0), les neuf billes de la partie sont groupées en losange : la bille noire numérotée 8 au centre, entourée de 4 billes
      rouges et 4 billes jaunes. Disposition : une rouge à chaque extrémité de la longueur (gauche et droite) ;
      au-dessus de la noire, une jaune au sommet, une rouge en haut à gauche et une jaune en haut à droite ;
      au-dessous, une jaune en bas à gauche, une jaune au point bas et une rouge en bas à droite. Total 4 rouges +
      4 jaunes + 1 noire = 9 billes, conforme au texte « 4 billes de chaque groupe de couleur et la
      bille noire ». Aucune flèche, aucun cercle creux, aucune zone grisée, aucun schéma de quantité de bille.
