    annotations:
      - "Règles du jeu : le jeu se déroule en un défi à réaliser seul."
      - "Le joueur doit empocher toutes les billes dans les poches de son choix."
      - "La bille blanche est repositionnée après chaque tir sur son point d'origine. On ne replace pas les billes empochées. Toute bille non empochée est repositionnée sur son point d'origine."
      - "Le défi est réalisé complètement lorsque le joueur a utilisé un tir pour chaque bille."
      - "Un coup n'est pas valable si le joueur commet une faute."
    description: >-
      Table vue de dessus, en paysage, avec la grille pointillée 8 x 4 et la ligne de départ (trait plein
      vertical) à gauche. La bille blanche est au centre de la table (environ x = 4, y = 2), dessinée
      comme un cercle clair avec deux petits points rouges. Quatorze billes de couleur sont alignées en
      deux colonnes verticales de sept : sept billes jaunes à gauche (x environ 1,95, juste à droite de la
      ligne de départ) et sept billes rouges à droite (x environ 6), espacées d'environ une demi-case
      (y de 0,5 à 3,5, par pas de 0,5). La bille jaune centrale et la bille rouge
      centrale sont à la hauteur de la blanche (y = 2). Aucune flèche, aucun cercle creux, aucune zone
      grisée, aucun schéma de quantité de bille.
    uncertainties:
