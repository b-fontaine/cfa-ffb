      - "Positions lues à ≈ 0,15 case près ; l'espacement vertical des billes est régulier (0,5 case)."
      - "La bille blanche est dessinée en cercle clair avec deux points rouges ; interprétée comme la bille blanche (point d'origine du tir)."
