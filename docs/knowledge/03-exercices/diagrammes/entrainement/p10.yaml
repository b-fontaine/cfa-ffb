    annotations: ["« x 4 » à côté de chaque bille rouge ; énoncé : huit billes (2 billes × 4)."]
    description: >-
      Deux billes rouges alignées verticalement au milieu de la table, juste à droite de l'axe des poches
      milieu (environ 4,2 cases du bord gauche), l'une près du bord haut (1 case), l'autre près du bord bas
      (3 cases du bord haut), chacune marquée « x4 ». Un seul cercle creux pointillé de départ de la blanche est
      situé à droite, au centre de la hauteur (environ 6 cases du bord gauche, 2 cases du bord haut). De là, la
      blanche vise successivement chaque rouge : une flèche rejoint un cercle creux d'impact collé sous la rouge
      haute, l'autre un cercle collé au-dessus de la rouge basse (contact fin, en finesse). La rouge haute part vers la poche milieu haut, la rouge basse vers la poche milieu bas. Le schéma
      central, à gauche, montre la blanche et la rouge côte à côte qui se touchent par le bord, point bleu au
      centre de la blanche, trait bleu-vert sous les billes (chevalet sur la surface).
    uncertainties:
      - "L'énoncé ne précise pas le type de chevalet ; « surface » est déduit du trait bleu-vert sous les billes du schéma, non commenté."
      - "Le schéma central n'a pas de légende : le contact « thin » est déduit du titre « finesse » et des billes qui se touchent par le bord."
      - "La blanche n'est pas dessinée sur la table : son rôle est déduit du cercle creux de départ (déclarée en (6 ; 2))."
      - "Ordre de tir entre les deux rouges non indiqué."
      - "Ligne de départ lue à x ≈ 1.82 sur le schéma (et non 2.0)."
      - "Positions lues à ≈ 0,15 case près."
