    description: >-
      Table vue de dessus, départ à gauche. Une bille rouge est posée à environ (4,5 ; 1,0), juste sous et à
      droite de la poche du milieu haut (tm). La blanche (cercle blanc cerclé, deux points rouges) est
      placée en bas de la rouge, presque à la verticale, vers (4,7 ; 2,0). Un cercle creux pointillé collé sous
      la rouge (environ 4,6 ; 1,2) marque la position de la blanche à l'impact : la blanche monte presque droit
      jusqu'à ce cercle et touche la rouge, qui part en haut à gauche vers la poche du milieu haut (flèche
      pleine). Depuis le point d'impact, trois flèches pleines partent vers la droite, une par bille jaune :
      une montante vers la jaune proche de la bande haute (environ 5,6 ; 0,2), une montante plus tendue vers la
      jaune la plus à droite en haut (environ 6,5 ; 0,2), une horizontale vers la jaune de droite plus basse
      (environ 6,6 ; 1,2). Chaque jaune porte « x 3 ». La hauteur d'attaque de la blanche varie d'une flèche
      à l'autre (énoncé), sans que le schéma la précise. Total : 3 trajectoires x 3 = neuf billes.
    uncertainties:
      - "Ligne de départ lue à x ≈ 1,83 (et non 2,0 comme dans FORMAT.md)."
      - "Le schéma ne montre qu'une seule bille rouge alors que l'énoncé parle de neuf billes à empocher : on suppose que la même situation (rouge replacée, empochée en tm) est rejouée neuf fois ; non écrit sur la fiche."
      - "Les flèches de la blanche s'arrêtent juste avant les jaunes ; elles sont interprétées comme visant chacune une jaune (alignement lu à ≈ 0,15 case)."
      - "Les pastilles « x 3 » sont placées près des extrémités de flèches / des jaunes ; l'association exacte étiquette-flèche est déduite de la proximité."
      - "La hauteur d'attaque (haut, centre, bas) de chaque trajectoire n'est pas indiquée sur le schéma."
      - "Type de chevalet non indiqué dans l'énoncé (bridge: unknown) ; pas de pastille Billard de bronze visible sur la page."
      - "Le champ then_cue_to de sequence est une extension de lecture (jaune visée après le contact) absente du FORMAT ; contact non transcrit (aucun encart)."

