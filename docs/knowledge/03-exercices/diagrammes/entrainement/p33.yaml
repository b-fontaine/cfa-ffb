    description: >-
      Table vue de dessus, départ à gauche. Une bille rouge est posée à environ (1,6 ; 2,0), juste à droite du
      trait vertical. Deux billes jaunes à sa droite : (2,6 ; 1,6) et (2,7 ; 2,5). La bille noire est au
      centre de la table vers (4,0 ; 3,0), sous la ligne médiane. La blanche (cercle blanc cerclé, deux points
      rouges) est en bas vers (2,0 ; 3,5). Un cercle creux pointillé collé en bas à droite de la rouge
      (environ 1,7 ; 2,15) marque l'impact : la blanche monte vers ce cercle et touche la rouge, qui part vers la
      poche d'angle haut gauche (tl, flèche pleine). Depuis le point d'impact partent deux flèches de blanche.
      La première monte vers la droite, touche la bande haute vers (3,1 ; 0,2) puis redescend vers (3,6 ; 1,0)
      (étiquette « x 5 » près de la pointe). La seconde part presque horizontale vers la droite jusque vers
      (3,3 ; 1,9) (étiquette « x 5 » à son extrémité), en passant entre les deux jaunes. Les jaunes ne sont
      désignées par aucune flèche ni étiquette. L'énoncé demande d'alterner la hauteur d'attaque (haut / bas)
      entre chaque coup pour replacer la blanche sur la noire, sans que le schéma dise quelle flèche correspond à quelle hauteur.
