      contact: half
      tip_point: upper_center
      bridge_height: unknown
    annotations: ["x 5"]
    description: >-
      Table vue de dessus, départ à gauche. La blanche est posée sur un cercle creux marqué de deux petits points
      rouges, à droite et en haut (environ x 7, y 1). Elle va toucher la bille jaune, située près de la poche haut
      milieu (environ x 4,35, y 0,4), au niveau d'un cercle creux pointillé collé à la jaune. La jaune part vers la
      poche haut milieu (petite flèche). La blanche rejetée repart vers le bas-gauche en ligne droite jusqu'à une
      flèche d'arrivée vers x 2,5, y 1,9 (position où elle est replacée par rejet naturel), à côté de « x 5 ».
      Deux billes rouges sont côte à côte au centre (x 3 et 3,5, y 2) et deux autres sont l'une sous l'autre
      contre la ligne de départ (x 1,8, y 3 et 3,5). La bille noire (8) est en bas au centre (x 3,6, y 3,6). Le
      petit schéma en bas à droite montre la blanche recouvrant à peu près la moitié de la rouge, point bleu
      légèrement au-dessus du centre de la blanche, trait bleu-vert sous les billes.
    uncertainties:
      - "Ligne de départ lue à x ≈ 1.83 sur le schéma (et non 2.0)."
      - "La blanche n'est pas dessinée : sa position de départ est déduite du cercle creux à points rouges (déclarée comme bille w au même endroit que le ghost g1) et du cercle pointillé d'impact."
      - "Les deux billes rouges contre la ligne de départ (x 1.83) et un petit point sur la ligne à y ≈ 2.0 ne sont pas expliqués par le texte."
      - "Le rôle des billes rouges et de la noire (obstacles ou cibles suivantes) n'est pas précisé au-delà de « jouer la bille noire »."
      - "Quantité de bille de l'inset lue approximativement comme demi-bille (recouvrement ≈ 40-50 %) ; le texte n'indique pas la quantité."
      - "Hauteur du chevalet (trait bleu-vert) non légendée ; bridge inconnu. Pastille Billard de bronze absente de cette page."
      - "Poche visée par la jaune déduite de la direction de la flèche (haut milieu)."
