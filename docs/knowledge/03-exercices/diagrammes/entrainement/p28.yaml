    exercise: 3
    caption: "Empocher six billes, en effectuant un rétro pour replacer la bille blanche trois fois dans chaque zone, afin de jouer la bille noire."
    success_rate: [4, 6]
    bridge: unknown
    bronze: false
    table: {view: top, head_end: left}
    balls:
      - {id: r1, color: red, at: [0.53, 0.55]}
      - {id: y1, color: yellow, at: [0.65, 2.0]}
      - {id: y2, color: yellow, at: [1.80, 2.49]}
      - {id: b1, color: black, at: [0.76, 3.50]}
      - {id: w, color: white, at: [1.80, 1.99], role: cue}
    ghosts:
      - {id: g1, at: [0.70, 0.73], role: impact, for: w}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[1.80, 1.99], [0.70, 0.73]], bounces: []}
      - {id: a2, ball: r1, kind: object, path: [[0.53, 0.55], [0.18, 0.17]], to: tl}
      - {id: a3, ball: w, kind: cue, path: [[0.70, 0.73], [1.21, 1.35]], bounces: []}
    zones: []
    sequence:
      - {step: 1, cue: w, hit: r1, contact: full, pocket: tl, repeat: 3}
    inset:
      contact: full
      tip_point: below_center
      bridge_height: unknown
    annotations:
      - "Zone 1 x3 : libellé placé vers (1.3 ; 1.8), à gauche de la bille blanche ; la blanche doit être replacée trois fois dans la zone 1 grâce au rétro."
      - "Zone 2 x3 : libellé placé vers (2.7 ; 3.3) ; la blanche doit être replacée trois fois dans la zone 2 grâce au rétro (six billes au total)."
      - "Un trait vertical plein est tracé sur la surface de jeu vers x = 1.8, sur toute la largeur de la table."
    description: >-
      Table vue de dessus, tête à gauche. Un trait vertical plein est tracé sur toute la largeur vers 1,8 case du
      bord gauche. Une bille rouge près du coin haut gauche (environ 0,5 ; 0,55), une bille jaune vers (0,65 ; 2),
      une bille jaune posée sur le trait vers (1,8 ; 2,5), la bille noire (8) vers (0,75 ; 3,5). Une bille blanche
      (cercle blanc cerclé de points rouges) est posée sur le trait vers (1,8 ; 2). Un cercle creux pointillé collé
      en bas à droite de la rouge (environ 0,7 ; 0,75) marque la position de la blanche à l'impact. Une flèche part
      de la blanche vers ce cercle ; la rouge part vers la poche haut gauche. Une pointe de flèche sur le segment
      entre le cercle d'impact et la blanche (vers 1,2 ; 1,35) indique le retour de la blanche après le contact :
      c'est le rétro. Les libellés « Zone 1 x3 » (près de la blanche)
      et « Zone 2 x3 » (au centre bas) indiquent les deux zones où replacer la blanche trois fois chacune. Petit
      schéma en bas à droite : grosse bille blanche vue de face recouvrant presque entièrement la bille rouge (seul
      un fin croissant rouge reste visible en haut) ; point bleu sous le centre de la blanche, croix de visée et
      trait bleu-vert sous la bille.
    uncertainties:
      - "Les zones 1 et 2 ne sont pas délimitées sur le schéma : seuls les libellés « Zone 1 x3 » et « Zone 2 x3 » sont écrits ; leur étendue n'est pas connue."
      - "On ne sait pas lequel des deux jaunes, ni quelles billes, correspond à quelle zone."
      - "Le nombre de billes dessinées (rouge, 2 jaunes, noire) ne correspond pas aux « six billes » de l'énoncé ; l'énoncé ne précise pas comment les six billes sont disposées."
      - "La bille blanche est dessinée comme une bille (cercle blanc et points rouges) et non comme un cercle creux pointillé ; son rôle de blanche est déduit."
      - "Une seule ligne relie la blanche au cercle d'impact ; la pointe de flèche à mi-parcours est lue comme le retour de la blanche (rétro) et la longueur exacte du retour n'est pas indiquée."
      - "Type de chevalet non indiqué dans l'énoncé."
      - "Recouvrement de la bille dans l'inset estimé à bille pleine (recouvrement presque total) ; point bleu sous le centre (rétro, non légendé)."
      - "Pas de pastille Billard de bronze visible sur la page."
