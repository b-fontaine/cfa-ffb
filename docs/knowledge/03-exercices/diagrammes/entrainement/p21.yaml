    annotations: ["X5 : la situation est répétée cinq fois (taux 3/5)", "Le trait vertical tracé sur la surface de jeu est la ligne que la blanche doit dépasser après le contact."]
    description: >-
      Table vue de dessus, tête à gauche. Un trait vertical plein tracé sur la surface de jeu à environ 1,8 case du
      bord gauche ; la bille jaune est posée sur ce trait (environ 1,8 ; 2,4). Une bille noire (8) vers (0,4 ; 3).
      Une bille rouge vers (2,5 ; 2), marquée « X5 ». Un cercle creux pointillé vers (3,8 ; 3) indique où poser la
      blanche ; elle monte vers un cercle creux d'impact collé en bas à droite de la rouge (environ 2,6 ; 2,15). La
      rouge part vers le coin haut gauche (poche haut gauche). La blanche, après le contact, avance en coulé vers
      la gauche et dépasse le trait (flèche pleine jusque vers 1,5 ; 1,8), ce qui la replace pour jouer la noire.
      Petit schéma en bas à droite : la blanche recouvre la rouge, dont seul un croissant reste visible à droite
      (environ trois quarts de bille) ; point bleu au-dessus du centre de la blanche, trait bleu-vert sous les billes.
    uncertainties:
      - "Ligne tracée lue à x ≈ 1.77 sur le schéma (et non 2.0)."
      - "La blanche est figurée par un petit cercle creux pointillé (deux points rouges) à son emplacement de départ ; elle est transcrite comme bille blanche, le cercle d'impact étant un ghost."
      - "Le type de chevalet n'est pas indiqué dans l'énoncé ; trait bleu-vert sous les billes de l'inset non commenté."
      - "Quantité de bille de l'inset estimée à environ trois quarts de bille d'après le recouvrement (non légendé) ; point bleu au-dessus du centre."
      - "La destination de la flèche de la rouge est lue vers la poche haut gauche (à ≈ 0,15 case près)."
      - "Pas de pastille Billard de bronze visible sur la page."
