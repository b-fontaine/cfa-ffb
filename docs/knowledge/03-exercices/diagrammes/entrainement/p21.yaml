      - {id: a3, ball: w, kind: cue, path: [[2.64, 2.15], [1.46, 1.82]], bounces: []}
    sequence:
      - {step: 1, cue: w, hit: r1, contact: three_quarter, pocket: tl, repeat: 5}
    inset:
      contact: three_quarter
      tip_point: above_center
