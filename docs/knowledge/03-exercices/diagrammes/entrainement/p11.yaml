    description: >-
      Une bille jaune au centre de la table (environ 4 cases du bord gauche, 2 du bord haut), avec une flèche
      pleine qui monte droit vers la poche milieu haut. Un cercle creux pointillé est collé juste sous la jaune
      (position de la blanche à l'impact, environ 4,0 / 2,2). Sept cercles creux numérotés indiquent où poser la
      blanche : 1 est dans l'axe de la jaune (environ 4,0 / 3,5), puis 2 (3,5 / 3,5), 3 (4,5 / 3,5), 4 (3,0 / 3,5),
      5 (5,0 / 3,5) sur la rangée du bas, et 6 (3,0 / 3,0) et 7 (5,0 / 3,0) une demi-case plus haut. Des traits
      relient les positions 6, 4 et 2 au cercle d'impact sous la jaune : la blanche vise la jaune depuis des
      positions d'angle différent (la fiche porte sur les quantités de bille).
      Aucun trait n'est dessiné depuis les positions 1, 3, 5 et 7.
    uncertainties:
