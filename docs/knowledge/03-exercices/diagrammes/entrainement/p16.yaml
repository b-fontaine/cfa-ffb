      - "Les billes jaunes sont numérotées 1, 2, 3 de droite à gauche ; seules les billes 1 et 2 ont une flèche d'arrivée."
    description: >-
      Vue de dessus, extrémité de départ à gauche. La bille noire (8) est vers le centre-gauche (x ≈ 3,1 ; y ≈ 2,4)
      et une bille rouge juste en dessous à droite (x ≈ 3,5 ; y ≈ 3,1). Trois billes jaunes alignées près de la bande
      du bas, numérotées 1 (x ≈ 7,0), 2 (x ≈ 5,85) et 3 (x ≈ 4,75), toutes à y ≈ 3,8. La blanche est posée sur le
      cercle pointillé (x ≈ 3,0 ; y ≈ 3,0), à gauche de la bille rouge (sans la toucher). Deux trajets partent de ce cercle vers le haut à
      droite : le premier rebondit sur la bande du haut vers x ≈ 5,5, puis sur la bande de droite vers y ≈ 2,8, et
      redescend vers la jaune 1 ; le second rebondit sur la bande du haut vers x ≈ 6,0, puis sur la bande de droite
      vers y ≈ 1,9, et redescend vers la jaune 2. Le schéma en haut à gauche de la table montre une bille blanche
      seule (sans bille cible), point bleu du tip au centre de la blanche, trait vert d'eau sous la bille (niveau
      de la surface) : jeu à hauteur centrale. Pastille « Billard de bronze » absente.
    uncertainties:
      - "Ligne de départ (trait plein vertical) lue à x ≈ 1,8 et non 2,0 comme la convention du FORMAT."
      - "Les points de rebond sont les sommets des traits tels que dessinés (y ≈ 0,15 sur la bande du haut, x ≈ 7,87 sur la bande de droite), à ≈ 0,1 case près ; la bande exacte est à y = 0 / x = 8."
      - "La jaune 3 n'a pas de flèche : la source ne dit pas si elle est jouée ; seules deux trajectoires (billes 1 et 2) sont dessinées."
      - "Les billes noire (8) et rouge sont des obstacles ou repères non commentés par le texte ; leur rôle n'est pas précisé."
      - "Le schéma de quantité est placé en haut à gauche de la table (et non en bas à droite) ; aucune bille cible n'y figure, donc contact: none."
      - "Type de chevalet non indiqué par l'énoncé."
