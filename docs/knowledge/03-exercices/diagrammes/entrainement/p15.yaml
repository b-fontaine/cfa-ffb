      - {id: a2, ball: w, kind: cue, path: [[0.7, 3.69], [1.97, 0.18], [3.33, 3.49]], bounces: [top]}
    sequence:
      - {step: 1, cue: w, hit: r1, via: top}
      - {step: 2, cue: w, hit: r2, via: top}
    inset:
      contact: none
      tip_point: above_center
      bridge_height: surface
    annotations:
      - "Cinq billes rouges numérotées 1 à 5 alignées près de la bande du bas ; la bille noire (8) est entre la blanche et la rouge 1."
      - "Deux flèches seulement (vers les rouges 1 et 2) ; aucune flèche n'est dessinée vers les rouges 3 à 5 et le texte ne précise pas comment elles se jouent."
    description: >-
      Table vue de dessus, extrémité de départ à gauche, ligne de départ verticale (trait plein) un peu à gauche de la
      colonne x = 2. Une bille blanche (cercle creux avec deux petits points rouges) est posée près de la poche
      d'angle bas gauche, à (0,7 ; 3,7). Sur la même ligne, près de la bande du bas, la bille noire (8) à environ
      (1,45 ; 3,7), puis cinq billes rouges numérotées 1 à 5, espacées d'environ une case (x ≈ 2,5 ; 3,5 ; 4,5 ; 5,5 ;
      6,5). Deux flèches partent de la blanche et montent presque verticalement vers la bande du haut (rebond vers
      x ≈ 1,4 puis x ≈ 2,0, le premier rebond étant matérialisé par un cercle creux pointillé contre la bande),
      puis redescendent en diagonale vers la rouge 1 et vers la rouge 2. Le trajet croise donc la ligne de départ.
      Petit schéma en haut à droite de la table : bille blanche vue de face, point bleu un peu au-dessus du centre
      de la bille, repères en croix et trait turquoise sous la bille (chevalet sur la surface de jeu).
    uncertainties:
      - "Ligne de départ lue à x ≈ 1,82 sur le schéma (la convention du FORMAT donne 2,0)."
      - "Le cercle creux pointillé contre la bande du haut est le point de rebond de la blanche (centre à ≈ 0,18 de la bande) ; il n'est pas légendé. Le second rebond (x ≈ 1,97) n'a pas de cercle."
      - "Les pointes de flèche s'arrêtent juste avant les rouges 1 et 2 (≈ 0,2 case) ; le chemin est transcrit jusqu'à la pointe."
      - "Les numéros 1 à 5 près des rouges sont transcrits en label ; le texte n'indique pas s'il s'agit d'un ordre de jeu."
      - "Le type de chevalet n'est pas donné par l'énoncé ; le trait turquoise du petit schéma est transcrit bridge_height: surface par convention."
      - "Point bleu du petit schéma : au-dessus du centre (environ la moitié du rayon), non quantifié par le texte ; aucune bille de contact n'y est dessinée."
      - "La bille blanche est dessinée en cercle creux (symbole de position de départ) avec deux points rouges ; elle est transcrite comme bille blanche role cue."
