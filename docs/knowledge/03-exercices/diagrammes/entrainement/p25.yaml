      - {id: c1, ball: w, kind: cue, path: [[4.43, 2.35], [4.0, 1.68]], bounces: []}
      - {id: a1, ball: r1, kind: object, path: [[4.0, 1.47], [4.0, 0.0]], to: tm}
      - {id: c2, ball: w, kind: cue, path: [[4.0, 1.68], [1.13, 1.68]], bounces: []}
    zones:
      - {id: z1, shape: rect, from: [0.12, 1.18], to: [1.76, 2.12], label: "x5"}
    sequence:
      - {step: 1, cue: w, from: g1, hit: r1, contact: half, pocket: tm, repeat: 5}
    inset:
      contact: half
      tip_point: center
      bridge_height: surface
    annotations:
      - "x5 : l'exercice est répété cinq fois"
      - "Zone grisée à gauche : emplacement où la blanche doit s'arrêter, près de la noire"
    description: >-
      Table vue de dessus, extrémité de départ à gauche. Un trait plein vertical à environ 1,8 case du bord
      gauche. La bille noire est en haut à gauche (environ 0,3 ; 0,7). Une zone grisée rectangulaire marquée
      « x5 » (environ de 0,1 à 1,8 en x et de 1,2 à 2,1 en y) se trouve juste sous la noire. Deux billes jaunes
      sont alignées verticalement vers x ≈ 2,8 (y ≈ 1,3 et 2,2). Une bille rouge est au milieu de la table vers
      (4 ; 1,5), à la verticale de la poche du milieu haut (tm). Un cercle creux pointillé en bas à droite de la
      rouge (environ 4,4 ; 2,35) indique où poser la blanche ; un trait le relie à un cercle d'impact collé sous
      la rouge (environ 4 ; 1,7). La rouge part en ligne droite vers le haut dans la poche tm ; la blanche repart
      à angle droit vers la gauche, en ligne droite, jusqu'à la zone grisée (flèche terminée vers 1,1 ; 1,7).
      Schéma « quantité de bille » en bas à droite : la blanche (point bleu au centre) est décalée à gauche de la
      rouge et la recouvre en partie.
    uncertainties:
      - "La blanche n'est pas dessinée sur la table : sa position initiale (bille w) est celle du cercle creux pointillé de départ."
      - "Ligne de départ lue à x ≈ 1,8 et non 2,0 comme la convention du FORMAT."
      - "Les deux billes jaunes ne sont pas citées par l'énoncé ; leur rôle (obstacles ou repères) n'est pas précisé."
      - "Quantité de bille de l'inset estimée à la moitié d'après le recouvrement (environ 0,35 à 0,45 de diamètre) ; non légendée."
      - "Le type de chevalet n'est pas indiqué dans l'énoncé (bridge: unknown) ; pas de pastille Billard de bronze visible."
      - "La zone grisée n'est pas légendée dans le PDF ; son rôle de zone d'arrivée de la blanche est déduit de la flèche et de l'énoncé."
