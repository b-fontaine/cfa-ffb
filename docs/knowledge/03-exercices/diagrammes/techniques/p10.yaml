    subject: "Onglet rose vertical sur le bord droit de la page, repère du type de fiche et de son titre."
    elements:
      - "Onglet magenta avec le texte vertical « FICHE TECHNIQUE » et, dessous, « Le coup de queue »"
    teaching_point: "Repère de navigation : fiche technique, thème « Le coup de queue »."
    adjacent_text_summary: "Page « Étape 4 : le coup de queue » : amplitude du geste, maintien de la queue, limage."
