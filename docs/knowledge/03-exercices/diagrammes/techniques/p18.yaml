diagrams:
  - id: techniques-p18-contact-blanche-rouge
    kind: technique-photo
    sheet: "Fiche Technique N°8 : Les finesses"
    caption: "Les finesses"
    subject: >-
      Schéma en vue de côté (billes rendues en 3D, pas de table ni de grille) : une bille blanche à gauche et
      une bille rouge à droite, collées l'une à l'autre, posées sur un trait épais vert-bleu foncé horizontal
      qui figure le plan de la table (le tapis).
    elements:
      - "Bille blanche (ivoire) à gauche, au contact de la bille rouge ; un point bleu plein est marqué en son centre, exactement à l'intersection de deux traits noirs fins (un horizontal, un vertical) qui la traversent."
      - "Bille rouge à droite, collée à la blanche, de même diamètre ; elle est traversée par le même trait horizontal noir, qui se prolonge vers la droite au-delà de la rouge (et vers la gauche au-delà de la blanche) ; pas de point bleu sur la rouge."
      - "Trait noir horizontal : passe par le centre des deux billes (hauteur du centre), c'est-à-dire la ligne des centres."
      - "Trait noir vertical : passe par le centre de la blanche et dépasse nettement au-dessus de la bille ainsi que sous le trait de la table."
      - "Trait épais vert-bleu foncé horizontal sous les deux billes : le plan de la table sur lequel elles reposent."
    teaching_point: >-
      Illustre le début de la fiche : au-delà de la quantité « quart de bille », la disposition des billes
      entraîne des visées en « finesse ». La figure montre les deux billes de même taille au contact, sur la
      table, avec un point bleu au centre de la blanche (sa signification n'est pas légendée, voir
      incertitudes).
    adjacent_text_summary: >-
      « Au-delà de la quantité "quart de bille", la disposition des billes entraîne des visées en "finesse".
      Il n'existe pas une seule finesse, mais plusieurs que le joueur saura apprécier selon la trajectoire que
      doit suivre la bille de couleur. »
    bridge: none
    bronze: false
    description: >-
      Deux billes en contact vues de côté, la blanche à gauche avec un point bleu à son centre (là où
      se croisent un trait horizontal et un trait vertical) et la rouge à droite, posées sur le trait vert-bleu
      de la table. Le trait horizontal traverse les centres des deux billes. Le schéma ne porte aucune légende
      ni valeur chiffrée.
    uncertainties:
      - "Le point bleu est lu comme le point d'impact de la queue sur la blanche (centre) ; il peut aussi simplement marquer le centre de la bille : la page ne le légende pas."
      - "Le schéma n'a ni légende ni échelle ; l'interprétation (billes vues de côté, trait épais = table) vient de l'aspect du dessin."
  - id: techniques-p18-schema-finesse
    kind: technique-photo
    sheet: "Fiche Technique N°8 : Les finesses"
    caption: "Trajectoire de blanche après impact — Visée — Point de contact"
    subject: >-
      Schéma en vue de dessus (billes rendues en 3D, sans table ni grille) d'une finesse : une bille rouge en
      haut à gauche et une bille blanche en bas à droite, en contact. La blanche est marquée par une ligne
      bleue verticale (axe de visée) ; la bille rouge est traversée par une croix noire et par une flèche
      noire qui part du centre de la blanche vers le haut gauche.
    elements:
      - "Bille rouge (en haut à gauche), avec une croix noire (traits horizontal et vertical) centrée sur elle."
      - "Bille blanche (en bas à droite, ivoire, avec trois petits points rouges sur sa surface : deux sur le bord droit et en bas, un au contact de la rouge), au contact du bas-droite de la rouge."
      - "Ligne bleue fine verticale, pleine, qui traverse la blanche en son centre et dépasse nettement au-dessus et au-dessous : la direction de visée / de la queue (axe du tir)."
      - "Flèche noire pleine partant du centre de la blanche, passant par le point de contact et par le centre de la rouge, et se prolongeant vers le haut gauche au-delà de la rouge : trajectoire de la bille de couleur."
      - "Trait bleu pointillé partant du centre de la blanche vers le haut, très légèrement incliné vers la droite : « Trajectoire de blanche après impact » (désignée par une flèche depuis le texte en haut à droite)."
      - "Légende « Visée » (en haut à droite de la rouge) : sa flèche noire traverse la ligne bleue verticale, au-dessus de la blanche, et se termine juste à gauche d'elle (pointe vers le haut-droit de la rouge)."
      - "Légende « Point de contact » (en bas à gauche), flèche noire pointant vers le point où la blanche touche la rouge, sur le côté bas-droit de la rouge."
    teaching_point: >-
      Dans une finesse, la visée (ligne bleue verticale passant par le centre de la blanche) passe à côté de
      la rouge sans la couper : la blanche ne la heurte que sur son bord, le point de contact est à la
      périphérie de la bille de couleur. La rouge part
      vers le haut gauche selon la ligne reliant le point de contact au centre de la rouge ; la blanche, qui
      conserve presque toute son énergie, ne dévie que très peu de sa trajectoire initiale (le trait pointillé
      est à peine incliné par rapport à la ligne de visée) et parcourt un trajet plus long que la rouge.
    adjacent_text_summary: >-
      « Les finesses détiennent deux particularités à mettre en évidence auprès du pratiquant : La première
      réside dans le très faible transfert d'énergie que transmet la bille blanche à la bille de couleur lors
      de l'impact, la bille blanche conservant quasiment toute son énergie, elle parcourra un trajet bien plus
      important que la bille de couleur. La deuxième se situe dans la faible déviation obtenue par la bille
      blanche après impact. La bille blanche ne dévie pratiquement pas de sa trajectoire initiale. »
    bridge: none
    bronze: false
    description: >-
      Schéma de contact fin : la visée (ligne bleue verticale) passe par le centre de la blanche, à droite de
      la bille rouge située en haut à gauche, sans la toucher ; le point de contact (blanche contre rouge) est sur le côté bas-droit de la rouge. La flèche
      noire de la bille de couleur part vers le haut gauche. La trajectoire de la blanche après impact
      (pointillé bleu) reste presque alignée sur la visée, avec un très faible écart vers la droite. Légendes
      du PDF : « Trajectoire de blanche après impact », « Visée », « Point de contact ».
    uncertainties:
      - "Les points rouges sur la bille blanche (trois petits points) sont des marques de la bille blanche rendue en 3D ; leur sens n'est pas commenté par le texte."
      - "L'angle exact de la trajectoire de la rouge et l'écart de la trajectoire de la blanche ne sont pas chiffrés ; seule l'impression qualitative (très faible déviation) vient du texte."
      - "La flèche noire de la rouge n'est pas légendée dans le PDF ; son identification comme trajectoire de la bille de couleur vient du texte (« la trajectoire que doit suivre la bille de couleur »)."
  - id: techniques-p18-video-finesse
    kind: technique-photo
    sheet: "Fiche Technique N°8 : Les finesses"
    caption: "Scannez le QR code pour consulter la vidéo « Les quantités de bille »"
    subject: >-
      En bas de page, à gauche, vignette de vidéo sur fond bleu (tapis) avec le titre incrusté « ÉTAPE 3 » en
      petit (fondu) puis « LA FINESSE » en gras ; à droite, un QR code noir et blanc.
    elements:
      - "Vignette vidéo encadrée, vue de dessus d'une table à tapis bleu : une bille blanche en haut à gauche, une queue fine qui arrive du haut, une bille de couleur rouge avec un point blanc à droite et plus bas, une poche sombre en bas de l'image."
      - "Titre incrusté « ÉTAPE 3 » puis « LA FINESSE »."
      - "Logo de marque en bas à droite de la vignette."
      - "QR code à droite de la vignette donnant accès à la vidéo."
    teaching_point: >-
      Renvoi vers la vidéo qui complète la fiche ; la vignette porte la mention « ÉTAPE 3 » et le titre
      « LA FINESSE ». Aucun contenu technique supplémentaire n'est lisible.
    adjacent_text_summary: >-
      « Scannez le QR code pour consulter la vidéo « Les quantités de bille » ». Le QR code renvoie à la
      vidéo ; son contenu n'est pas transcrit.
    bridge: none
    bronze: false
    description: >-
      Vignette de vidéo (étape 3, « LA FINESSE ») montrant une table bleue vue de dessus avec une blanche, une
      bille de couleur et une queue, accompagnée de son QR code. Aucune donnée de position exploitable.
    uncertainties:
      - "L'URL encodée dans le QR code n'est pas décodée."
      - "Le détail des billes et de la queue dans la vignette est petit : positions seulement qualitatives."
      - "La légende du PDF mentionne « Les quantités de bille » alors que la vignette titre « LA FINESSE »."
