    kind: technique-photo
    sheet: "Les fiches résultats"
    caption: "Onglets de couleur « FICHE JEU » et « FICHE RÉSULTATS »."
    subject: "Deux onglets verticaux sur le bord droit de la page, repères de type de fiche."
    elements:
      - "Onglet orange avec le texte vertical « FICHE JEU », en face du paragraphe sur les fiches jeux"
      - "Onglet violet avec le texte vertical « FICHE RÉSULTATS », en face du paragraphe sur les fiches résultats"
    teaching_point: "Code couleur : orange = fiche jeu, violet = fiche résultats (repère visuel des types de fiches)."
    adjacent_text_summary: >-
      Paragraphes décrivant les fiches jeux (fin de séance, autour du thème de la séance, puis parties à
      difficulté réduite) et les fiches résultats.
    description: "Repères graphiques décoratifs de navigation ; aucun contenu technique de billard."
    uncertainties: []
