  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 14, note: "Jeu 14 (partie à difficulté réduite), dont la partie est adaptée"}
uncertainties:
  - "Sections « Replacer la blanche par une bande » (la déduction de la ligne de la blanche et du rôle de la puissance, le replacement près de la noire n'étant appuyé que par les exercices 3 et 4 [S]), « Demi ou trois-quarts », « La queue à plat, le chevalet sur la surface » (adultes) et « Lire la ligne avant de tirer », thème, défis, variante de jeu (jetons, équipes), règle de lien, adaptations, minutes et poids : [Prop], à valider par un animateur dans l'application."
  - "Le jeu est une adaptation [Prop] du jeu 14 [S] ; seuls la partie à 2, les 4 billes par groupe, la noire et le tirage à la bande viennent de la fiche. L'annonce « équerre », la bande annoncée, les jetons, les équipes et l'explication du tirage à la bande n'y figurent pas."
  - "Section « La queue à plat, le chevalet sur la surface » : l'indication « surface » vient de l'inset des schémas [S] des exercices 3 et 4 (bridge_height: surface), alors que le type de chevalet n'est pas écrit dans l'énoncé du PDF ; la séance ne l'impose pas dans les consignes."
  - "Exercices 3 et 4 : la zone grisée est lue « sur la bille noire » dans les PDF ; elle est représentée par la zone proche de la noire. Quantité de bille de l'exercice 3 estimée proche du demi, de l'exercice 4 entre le demi et le trois-quarts d'après le recouvrement de l'inset ; elles ne sont pas légendées."
  - "Fiche technique n° 9 : le texte (plus le coup est puissant, plus l'angle de rebond se referme) et la légende du schéma divergent (voir 00-provenance-et-fiabilite.md) ; la section « Le rebond sur la bande » suit le texte et réserve l'égalité des angles au coup joué à la mesure. L'animateur en est averti ici."
  - "Erreurs fréquentes des exercices 3 et 4 : lecture animateur, déduites des fiches 13 et 16 [S] ; le PDF d'entraînement n'en contient pas, elles ne sont pas des consignes fédérales."
  - "Illustrations `bande-90` et `angle-ouvert` : dispositions propres à la séance, calculées à partir du principe des fiches 13 et 9 (90° exact, égalité des angles au rebond) ; `bande-90` change de poche (haut gauche), de bande (bas) et de zone par rapport à l'exercice 3, pour ne pas en montrer la solution en théorie. `angle-90-bande` est distincte de `angle-90` de angle-droit-1 (autre sommet)."
  - "Liaison avec angle-droit-1 : `theme.name` et `notion` alignés sur la partie 1 (V23) ; `recall.reuse` vise l'illustration `angle-90` de la partie 1 ; la variante de jeu (défi de l'équerre par jetons, avec bande annoncée) diffère de celle de la partie 1."
  - "Initiation 16 : la fiche demande d'empocher une bille ; le compteur de la séance est donc de 1, et la reprise en changeant de repère et de quantité vient de la consigne « quantités de billes différentes »."
  - "Redondance assumée avec angle-droit-1 : le rappel, « Rappel, 90° entre les deux billes » et « Trop fort, l'angle s'ouvre » sont réduits à une phrase chacun ; l'initiation 16 est une reprise d'échauffement, les nouveautés de la séance sont la bande et la lecture de ligne."
