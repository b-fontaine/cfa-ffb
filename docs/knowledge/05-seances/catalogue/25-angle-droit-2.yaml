# Séance du catalogue : « Le coup à angle droit », partie 2/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: angle-droit-2
order: 25
technique: angle-droit
part: 2
title: Le coup à angle droit
technical_sheets: [13]
previous: angle-droit-1
catalogue_block: angle-droit
notion: "Jouer un coup à angle droit : attaque au centre, sans rotation, distance courte, sur toute quantité sauf le plein."
theme:
  name: Le jeu de l'équerre
  pitch: >-
    L'équerre, c'est le coin d'une feuille : 90°. On s'en sert pour placer
    la blanche : elle part à angle droit de la bille de couleur, rebondit
    sur les bandes et vient se ranger près de la noire.
recall:
  points:
    - Attaque au centre, sans rotation de la blanche, sur toute quantité de bille sauf le plein.
    - Après l'impact, les trajectoires des deux billes forment un angle de 90°.
    - On joue à courte distance ; trop puissant, l'angle s'ouvre au-delà de 90°.
  question:
    ask: Avec quelle attaque joue-t-on le coup à angle droit, et quelle quantité de bille est exclue ?
    answer: Attaque au centre ; toute quantité de bille convient, sauf le plein.
  reuse: {sheet: angle-droit-1, illustration: angle-90}
  src: S
theory:
  sections:
    - id: retenir
      title: Rappel, 90° entre les deux billes
      weight: {children: 1, adults: 2}
      body:
        - "Attaque au centre, sans rotation, toutes quantités sauf le plein : les deux billes partent à 90°."
      adult_extra:
        - La blanche avance d'abord en glissant, puis elle roule ; l'amplitude et la vitesse doivent être dosées pour qu'elle glisse jusqu'à l'impact.
      key_point: Attaque au centre, pas de plein, et les deux billes partent à 90°.
      demo: "Jouer une bille en quantité demi, attaque au centre, depuis une distance courte, et montrer les deux trajectoires avec les bras en équerre."
      illustrations: [angle-90-bande, pointe-centre]
      src: S
    - id: puissance
      title: Trop fort, l'angle s'ouvre
      weight: {children: 1, adults: 1}
      body:
        - Trop fort, l'angle s'ouvre au-delà de 90° ; trop doux, la blanche roule et l'angle se referme.
      adult_extra:
        - "Un coup trop puissant ouvre l'angle ; cette trajectoire résulte des différences de poids et de taille entre les deux billes (fiche d'initiation 16)."
        - Trop puissant, l'angle s'ouvre d'autant plus que la quantité de bille se rapproche du plein (fiche technique 13).
        - Garder une distance courte entre les deux billes facilite le glissement de la blanche jusqu'à l'impact.
      key_point: Un coup à la mesure donne l'angle droit ; trop fort, il s'ouvre.
      demo: "Jouer la même quantité à deux vitesses et comparer l'angle entre les deux billes."
      illustrations: [angle-ouvert, angle-90-bande]
      src: S
    - id: bande
      title: Le rebond sur la bande
      weight: {children: 1, adults: 1}
      body:
        - Pour un coup à la mesure et sans effet, la blanche rebondit sur la bande avec un angle de rebond égal à l'angle d'arrivée.
        - Plus le coup est puissant, plus l'angle de rebond se referme.
      key_point: Sans effet, à la mesure, l'angle de rebond égale l'angle d'arrivée ; plus puissant, il se referme.
      demo: null
      illustrations: [bande-90]
      src: S
    - id: replacer
      title: Replacer la blanche par une bande
      weight: {children: 2, adults: 1}
      body:
        - Comme la blanche part à 90° de la bille de couleur, on connaît sa ligne.
        - La puissance décide où la blanche s'arrête.
        - On peut ainsi la replacer près de la noire, par une bande ou par deux bandes, comme aux exercices 3 et 4.
      key_point: On connaît la ligne de la blanche ; la puissance décide où elle s'arrête.
      demo: "Jouer le coup avec une bande, puis montrer au doigt la ligne que la blanche a suivie et l'endroit où elle s'est arrêtée."
      illustrations: [bande-90]
      src: Prop
    - id: quantites
      title: Demi ou trois-quarts
      weight: {children: 1, adults: 1}
      body:
        - Les deux exercices du jour se jouent avec des quantités différentes.
        - Le premier est proche du demi, le second entre le demi et le trois-quarts.
        - "Pour une même rouge et une même poche, la ligne de la blanche ne change pas quand on change de quantité : c'est la place de départ qui change."
      key_point: "Même rouge, même poche : la ligne de la blanche reste la même, seule la place de départ change."
      demo: null
      illustrations: [quantites]
      src: Prop
    - id: surface
      title: La queue à plat, le chevalet sur la surface
      weight: {adults: 1}
      body:
        - Sur la surface de jeu, la queue reste à plat.
        - Le procédé frappe la blanche en son centre, pas au-dessus ni en dessous.
      key_point: Procédé au centre, queue à plat.
      demo: null
      illustrations: [pointe-centre]
      src: Prop
    - id: lire
      title: Lire la ligne avant de tirer
      weight: {adults: 2}
      body:
        - Avant le tir, imaginer la ligne de la bille de couleur vers la poche, puis la ligne à 90° de celle-ci.
        - Prolonger cette seconde ligne jusqu'à la bande pour choisir où la blanche va rebondir.
        - Après le tir, comparer la ligne réelle de la blanche et la ligne imaginée, et corriger la puissance si besoin.
        - Pour une même rouge et une même poche, la ligne de la blanche ne change pas quand on change de quantité ; c'est la place de départ de la blanche qui change.
      key_point: Une ligne imaginée à 90° se compare à la ligne réelle.
      demo: null
      illustrations: [bande-90]
      src: Prop
