training:
  exercises:
    - id: e3
      ref: {block: angle-droit, n: 3}
      diagram: entrainement-p26-e3
      title: L'équerre par la bande du haut
      weight: {children: 1, adults: 1}
      setup: La rouge du schéma à droite de la table, la blanche en bas à gauche de la rouge, sur le repère du schéma ; les jaunes du schéma à côté de la rouge et la noire près de la bande gauche, sous la zone grisée.
      instruction: Empocher la rouge dans la poche d'angle du haut à droite en angle droit, de façon que la blanche rebondisse sur la bande du haut et se replace dans la zone grisée, près de la noire ; recommencer cinq fois.
      expected: Contact proche du demi, attaque au centre ; la rouge part vers la poche, la blanche part à angle droit puis rebondit sur la bande du haut et arrive dans la zone grisée.
      mistakes:
        - {symptom: La blanche passe au-delà de la zone (trop loin), fix: "Moins de puissance : un geste plus court, sans changer de point de visée."}
        - {symptom: La blanche part trop vers la bande de gauche (angle supérieur à 90°), fix: "Un coup trop puissant ouvre l'angle : adoucir le coup et garder la distance courte."}
        - {symptom: "La blanche roule après l'impact, l'angle se referme", fix: "Garder l'attaque au centre et adapter l'amplitude et la vitesse pour que la blanche glisse jusqu'à l'impact, à courte distance."}
      playful:
        hook: Avant le tir, le binôme annonce « équerre » et montre du doigt la zone d'arrivée de la blanche.
        challenge: Replacer la blanche dans la zone grisée trois fois de suite ; pour les adultes, recommencer en changeant de quantité, vers le trois-quarts.
      passes: 1
      src: S
    - id: e4
      ref: {block: angle-droit, n: 4}
      diagram: entrainement-p26-e4
      title: L'équerre par deux bandes
      weight: {children: 2, adults: 2}
      setup: La rouge du schéma près de la bande droite ; les jaunes du schéma restent en place (celles de droite contre la bande, celle de gauche sur la ligne de départ) ; la blanche plus bas, à gauche de la rouge ; la noire au centre de la table et la zone grisée juste en dessous.
      instruction: Empocher la rouge dans la poche d'angle du haut à droite en angle droit, de façon que la blanche rebondisse sur la bande de droite puis sur la bande du bas et se replace dans la zone grisée, sous la noire ; recommencer cinq fois.
      expected: Contact entre le demi et le trois-quarts, attaque au centre ; la rouge part vers la poche et la blanche suit son chemin par les deux bandes jusqu'à la zone grisée.
      mistakes:
        - {symptom: La blanche s'arrête trop tôt après la deuxième bande, fix: "Doser la puissance : un peu plus de vitesse, sans trop en mettre pour ne pas ouvrir l'angle ; garder l'attaque au centre."}
        - {symptom: La rouge reste sur la bande, fix: Reprendre la quantité de bille et la ligne vers la poche avant de tirer.}
      playful:
        hook: Le binôme trace dans l'air le chemin de la blanche (bande de droite, puis bande du bas) avant chaque tir.
        challenge: Réussir deux replacements de suite dans la zone grisée.
      passes: 2
      src: S
game:
  title: Partie à difficulté réduite, le défi de l'équerre
  source_game: 14
  adapted: true
  players: Partie à 2
  materials: "Billes du jeu complet (4 par groupe et la noire) ; des jetons. Tirage à la bande (proposition d'explication, la fiche ne le détaille pas) : chaque joueur joue une bille depuis la ligne de départ vers la bande du fond ; celui dont la bille revient le plus près de la bande de départ casse."
  setup_illustration: schema-jeu
  rules:
    - Partie à 2, avec les règles de la partie classique.
    - Seulement 4 billes de chaque groupe, et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
  scoring: Comme dans une partie classique ; le premier qui empoche son groupe puis la noire gagne.
  end: Fin quand un joueur a empoché son groupe puis la noire.
  playful_variant: "Le défi de l'équerre : à la fin de la partie, celui qui a le plus de jetons gagne le défi, en plus de la partie. En salle chargée, deux équipes de deux se partagent une table : un tireur par équipe à tour de rôle, le partenaire conseille, seul l'adversaire juge."
  link_previous:
    notion_of: angle-droit-1
    rule: "Exception facultative aux règles classiques : sur une bille jouée à courte distance, en attaque au centre et sans plein, le tireur peut annoncer « équerre » et la bande que la blanche doit toucher. Si la bille est empochée ET si la blanche touche la bande annoncée après l'impact, avant toute autre bille, il gagne un jeton ; l'adversaire juge."
    note: "Rejoue l'angle droit de la séance précédente (attaque au centre, courte distance, sans plein) et la bande de cette séance ; règle facultative, la partie se joue telle quelle sans elle. Le jeton n'est gagné que si la bille est empochée, pour que le tir reste celui de la partie. C'est la seule règle de jeton de la séance."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher les billes des poches ; partie limitée à 15 minutes, au-delà gagne qui a le moins de billes restantes ; l'animateur tranche en cas de doute sur la bande touchée."
    adults: "Contrôle de l'angle en plus pour le jeton : les deux billes doivent aussi partir à peu près à angle droit, à un coin de feuille près, jugé à l'oeil par l'adversaire. Après la partie, noter les coups à angle droit tentés et réussis, et l'effet de la puissance sur l'angle."
  src: Prop
review:
  prompts:
    - Quand la blanche est-elle partie plus ouverte que 90° ?
    - Par quelle bande la blanche est-elle revenue, et pourquoi ?
    - Comment expliquerais-tu l'angle droit à un copain ?
