uncertainties:
  - "Mises en place en texte, défis ludiques, variante de jeu (jetons compris), règle de lien et adaptation du jeu : [Prop], à valider par un animateur dans l'application. La différenciation enfants / adultes (poids, compléments, adaptation du jeu) est aussi une proposition."
  - "Le rappel porte sur la demi-bille telle que demi-bille-2 l'a enseignée dans ses sections [S] (tangente, bille fantôme côté opposé à la poche, environ 30°) et reprend son illustration `visee-autre-cote` ; ce que demi-bille-2 a ajouté en [Prop] (même visée à distance, chevalet sur cadre, lecture des erreurs) n'est volontairement pas rappelé sous une provenance [S]."
  - "Écart entre les sources sur l'énergie transférée en trois-quarts (« les trois quarts » en fiche technique, « deux fois plus qu'elle n'en conserve » en initiation) : non harmonisé, voir la section « La couleur va plus loin » (adultes)."
  - "L'illustration `deviations` est générée (`[Prop]`, non validée par un animateur) : trois tirs distincts, blanche décalée de 0, d'un demi-rayon et d'un rayon de la bille de couleur ; positions calculées avec les rayons réels (blanche 0.1038, bille de but 0.1098 case ; distance des centres au contact s = r_c + r_o = 0.2136), soit sin θ = d / s et des déviations de 14,9° et 30,9° ; les décalages sont petits à l'échelle de la table, les trajectoires restent schématiques."
  - "Le chiffre d'environ 15° est donné par la fiche technique pour des billes identiques ; la blanche du Blackball est plus petite, la fiche ne le chiffre pas autrement. Avec les dimensions retenues (48,0 et 50,8 mm, `[FFB]`), le calcul `[Prop]` donne 14,9° : l'écart avec 15° est négligeable et la séance garde « environ 15° »."
  - "Exercice 2 : le PDF ne précise pas le type de chevalet ; l'alternance gauche (repères impairs) / droite (repères pairs) est lue sur la position des numéros du schéma, l'ordre de tir n'étant pas explicite. Les repères 7 et 8 sont au même endroit : huit tirs, sept distances différentes."
  - "Le schéma du jeu 8 [S] montre quinze billes alignées (rouges et jaunes alternées, la noire au bout, à y ≈ 2,1 donc sur l'axe de la table) et deux tirs d'exemple sans blanche pleine, sens d'exécution non précisé. Composition des groupes, ordre des billes, qui pose la blanche, un tir par tour, absence de rejeu après une bille empochée (lecture proposée de « passe à la bille suivante »), tirage au sort et limite de temps sont des propositions (adaptation)."
  - "Le conseil de la fiche écrit « à distance d'une mouche le long de la grande bande » : « mouche » n'est défini ni par la fiche ni par le glossaire du dépôt, et le schéma place la ligne sur l'axe de la table, pas le long de la bande ; la mise en place proposée ne s'en sert pas."
  - "La séance ne lit des fiches que le fait que les schémas montrent le procédé au centre ou un peu au-dessus de la blanche ; la fiche technique n° 6 ne traite pas de l'attaque, la section « Où frappe le procédé ? » (adultes) est une lecture de schémas [Prop]."
  - "Initiation 8 : la fiche cite deux chevalets (surface, cadre) sans dire lequel va avec quel tir ; la séance ne l'impose pas. Les positions de la rouge (moitié haute gauche) et de la jaune (à mi-largeur, à droite) sont lues sur le schéma ; l'ordre rouge puis jaune est aussi une lecture du schéma, pas du texte de la fiche."
  - "La section « Le milieu du chemin » (enfants) est une glose [Prop] ; l'illustration « Où frappe le procédé ? » (cible sur la blanche et profil de la queue à hauteur moyenne) est générée, non sourcée pour la hauteur de la queue : seule la position d'impact au centre est lue sur un schéma de la fiche ; le procédé y est dessiné à l'échelle de la blanche. Dans la section « Comparer », « moins elle va loin » est une conséquence déduite, présentée comme telle."
