# Séance du catalogue : « Quantité trois-quarts », partie 1/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: trois-quarts-1
order: 11
technique: trois-quarts
part: 1
title: Quantité trois-quarts
technical_sheets: [6]
previous: demi-bille-2
catalogue_block: trois-quarts
notion: Viser à mi-chemin entre le centre et la tangente de la bille de couleur pour empocher en trois-quarts.
theme:
  name: Le chemin du milieu
  pitch: >-
    Entre le centre de la bille de couleur et son bord, il y a un chemin : son
    rayon. En trois-quarts, on le prend à mi-parcours. Au tableau, le jeton de
    l'équipe avance d'une case à chaque bille empochée en exercice, et à chaque
    contact jugé bon au jeu.
recall:
  points:
    - En demi-bille, la blanche couvre la moitié de la bille de couleur.
    - On vise la tangente de la bille de couleur avec le centre de la blanche, quelle que soit la poche.
    - La bille fantôme se place collée à la bille de couleur, du côté opposé à la poche.
    - La bille de couleur part à environ 30° de l'axe de visée.
  question:
    ask: En demi-bille, où vise-t-on et de combien la bille de couleur est-elle déviée ?
    answer: On vise la tangente ; la couleur est déviée d'environ 30° par rapport à l'axe de visée.
  # Illustration `visee-autre-cote` de la séance précédente (demi-bille-2) : la visée en demi
  # avec bille fantôme, à comparer à `visee-trois-quarts` de cette séance.
  reuse: {sheet: demi-bille-2, illustration: visee-autre-cote}
  src: S
theory:
  sections:
    - id: visee
      title: Viser entre le centre et la tangente
      weight: {children: 3, adults: 3}
      body:
        - Le trois-quarts est la dernière quantité de référence qui se vise sur la bille de couleur.
        - Le point de visée est environ à égale distance du centre de la bille de couleur et de sa tangente.
        - Le point où l'on vise et le point où les billes se touchent sont très proches.
        - Ce point est moins précis que le centre (plein) ou la tangente (demi) ; l'expérience du plein et du demi aide à le voir.
      adult_extra:
        - La visée est plus aisée pour le débutant que pour les quantités plus faibles (quart, finesse), car le point de visée et le point de contact sont très proches.
        - "Au Blackball, la blanche est un peu plus petite que la bille de couleur (fiche technique n° 4) : le trois-quarts se repère sur la bille de couleur (à mi-chemin entre son centre et sa tangente), et la bille fantôme est une blanche, dessinée à la taille de la blanche."
        - "Lecture géométrique : la bille fantôme est la même qu'en demi (collée à la bille de couleur, côté opposé à la poche) ; c'est la ligne de tir de la blanche qui passe à mi-rayon du centre, au lieu de la tangente."
      key_point: On vise à mi-chemin entre le centre et le bord de la bille de couleur.
      demo: "Poser la bille fantôme (une blanche collée à la bille de couleur, côté opposé à la poche, dans l'axe de la poche), puis montrer sur la bille de couleur le point à mi-chemin du centre et du bord par lequel passe la ligne de visée de la blanche ; retirer la bille fantôme avant le tir."
      illustrations: [contact-trois-quarts, visee-trois-quarts]
      src: S
    - id: mot-chemin
      title: Le milieu du chemin
      weight: {children: 1}
      body:
        - "Le chemin, c'est le rayon de la bille de couleur : la ligne qui va de son centre jusqu'à son bord."
        - En trois-quarts, on vise le milieu du chemin. Ce chemin est dans la bille ; ce n'est pas la trajectoire de la bille.
        - "La blanche est un peu plus petite que la bille de couleur : le chemin se mesure sur la bille de couleur, pas sur la blanche."
      key_point: "Ni le centre, ni le bord de la bille : le milieu du rayon."
      demo: null
      illustrations: [visee-trois-quarts]
      src: Prop
    - id: energie
      title: La couleur va plus loin
      weight: {adults: 2}
      body:
        - "À l'impact, la blanche confère « les trois quarts » de son énergie à la bille de couleur (fiche technique n° 6)."
        - La bille de couleur parcourt plus de distance que la blanche.
        - La bille de couleur est déviée d'environ 15° par rapport à l'axe de visée.
      adult_extra:
        - La fiche donne environ 15° lorsque les billes sont identiques.
        - "Écart entre les sources : la fiche technique dit que la blanche confère « les trois quarts » de son énergie (reprise ci-dessus) ; la fiche d'initiation dit qu'elle en transfère « deux fois plus » qu'elle n'en conserve. Les deux formulations sont conservées telles quelles."
      key_point: Au trois-quarts, la couleur parcourt plus que la blanche.
      demo: "Tirer à courte distance, sans empocher : la bille de couleur va plus loin que la blanche."
      illustrations: [deviations]
      src: S
    - id: comparer
      title: Plein, demi, trois-quarts
      weight: {children: 2, adults: 2}
      body:
        - "Plein : on vise le centre ; la couleur part droit, dans l'axe."
        - "Trois-quarts : on vise à mi-chemin ; la couleur part à environ 15° (repère donné pour des billes identiques) et parcourt plus que la blanche."
        - "Demi : on vise la tangente ; la couleur part à environ 30°."
      adult_extra:
        - "Conséquence déduite, non écrite dans les fiches : plus la couleur part de côté, moins la blanche lui transmet d'énergie, donc moins elle va loin."
      key_point: Plus on s'éloigne du centre, plus la couleur part de côté.
      demo: "Tirer à courte distance, sans empocher, en trois-quarts : la bille de couleur va plus loin que la blanche."
      illustrations: [quantites]
      src: S
    - id: attaque
      title: Où frappe le procédé ?
      weight: {adults: 1}
      body:
        - "Sur les schémas des fiches, le procédé est tantôt au centre de la blanche, tantôt un peu au-dessus (entraînement 1, un des deux encarts de l'initiation 8)."
        - "La fiche technique n° 6 ne parle pas de l'attaque : la séance ne tranche pas et n'en fait pas un point de la technique."
      key_point: Les schémas placent le procédé au centre de la blanche ou un peu au-dessus ; la fiche ne tranche pas.
      demo: null
      illustrations: [attaque-queue]
      src: Prop
    - id: fantome
      title: "Rappel : la bille fantôme"
      weight: {adults: 2}
      body:
        - L'animateur pose une blanche au contact de la bille à empocher, sur la ligne de la poche, puis la retire avant le tir.
        - Le joueur vise le centre de la bille fantôme en plaçant le procédé au centre de la blanche.
      key_point: Le trois-quarts se repère en regardant où la blanche touche la bille de couleur.
      demo: null
      illustrations: [visee-trois-quarts]
      src: S
