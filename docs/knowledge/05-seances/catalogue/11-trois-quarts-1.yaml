training:
  exercises:
    - id: e1
      ref: {block: trois-quarts, n: 1}
      diagram: entrainement-p07-e1
      title: Quatre billes, deux tirs chacune
      weight: {children: 2, adults: 1}
      setup: Les jaunes du schéma côte à côte sous la poche du milieu du haut, les rouges du schéma plus bas à droite, vers la poche haut droite ; la blanche toujours posée sur le même repère, en bas à droite.
      instruction: Empocher chaque jaune puis chaque rouge du schéma en trois-quarts ; chaque bille est jouée deux fois.
      expected: Chaque bille part vers sa poche ; la blanche reste sur le même repère et la visée reste à mi-chemin entre le centre et la tangente.
      mistakes:
        - {symptom: La bille part trop pleine, fix: "Rappeler le point de visée : un peu plus vers le bord, à mi-chemin du centre et de la tangente."}
        - {symptom: La bille part trop mince et manque la poche, fix: "Revenir un peu vers le centre ; faire montrer le point visé sur la bille avant de tirer."}
      playful:
        hook: "Chaque bille empochée fait avancer le jeton de l'équipe d'une case sur le tableau (huit cases : quatre billes, deux tirs chacune)."
        challenge: "Amener le jeton le plus loin possible au premier passage ; l'animateur fixe la case d'arrivée d'après le taux affiché de l'exercice (il n'est pas nécessaire d'atteindre la dernière case)."
      passes: 2
      src: S
    - id: e2
      ref: {block: trois-quarts, n: 2}
      diagram: entrainement-p07-e2
      title: Près, loin, toujours à mi-chemin
      weight: {children: 1, adults: 1}
      setup: La jaune de gauche et la jaune de droite du schéma sous les poches du haut ; la blanche posée tour à tour sur les repères numérotés, du plus proche au plus éloigné.
      instruction: "Poser la blanche sur chaque repère numéroté, du 1 au 8, et empocher en trois-quarts la jaune de gauche depuis les repères impairs, celle de droite depuis les repères pairs (alternance lue sur le schéma ; les repères 7 et 8 sont au même endroit)."
      expected: Le contact reste en trois-quarts à toute distance ; chaque jaune part vers sa poche.
      mistakes:
        - {symptom: La jaune manque la poche quand la blanche est loin, fix: "Garder le même point de visée, accompagner le geste sans forcer et vérifier l'alignement de la queue."}
      playful:
        hook: Les repères s'éloignent de la jaune ; chaque bille empochée fait avancer le jeton d'un repère, du 1 vers le 8.
        challenge: "En binôme : le tireur annonce « trois-quarts » et montre le point visé sur la jaune ; l'observateur dit « bon » ou « à revoir » avant le tir ; on échange les rôles après chaque tir."
      passes: 1
      src: S
game:
  title: 8 billes en ligne
  source_game: 8
  adapted: false
  players: Partie à 2
  materials: "Billes du jeu complet, alignées sur une ligne (le schéma [S] la place sur l'axe de la table, à mi-largeur ; le conseil de la fiche écrit « à distance d'une mouche le long de la grande bande » sans définir la mouche : voir la mise en place proposée). Pour le défi ludique (proposition) : un tableau et des jetons."
  setup_illustration: schema-jeu
  rules:
    - Vider son groupe de billes puis la noire, d'un seul côté du billard.
    - Les joueurs tirent à tour de rôle ; la blanche est repositionnée après chaque tir pour viser en trois-quarts.
    - Quand une bille de couleur est empochée, le joueur passe à la bille suivante ; toute bille non empochée est replacée sur son point d'origine.
    - Un coup n'est pas valable si le joueur commet une faute.
  scoring: Le premier qui a empoché son groupe puis la noire gagne.
  end: "Fin quand un joueur a vidé son groupe puis empoché la noire ; en cas d'égalité, rejouer une série entière."
  playful_variant: "Avant chaque tir, le tireur annonce « trois-quarts » et montre le point visé sur la bille ; l'adversaire dit « bon » ou « à revoir » ; si le contact est jugé bon, le tireur avance son jeton d'une case sur le tableau de six cases, sinon son jeton reste en place. Arrivé à la sixième case, le joueur peut rejouer une fois dans la partie un de ses tirs manqués."
  link_previous:
    notion_of: demi-bille-2
    rule: "Exception à la règle du trois-quarts : à chaque tour de table (un tir de chaque joueur), un seul des deux tirs est joué en demi-bille, et le joueur concerné change d'un tour à l'autre (premier joueur au tour 1, second joueur au tour 2, et ainsi de suite). Pour ce tir, la blanche est posée pour une demi-bille ; le joueur annonce « demi » et son adversaire contrôle que la blanche vise bien la tangente avant le tir."
    note: "Réactive la demi-bille de la séance précédente (jouée près et loin, des deux côtés) et permet de comparer les deux quantités ; règle facultative, le jeu 8 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Version réduite proposée (la fiche ne la précise pas) : une ligne plus courte, trois rouges et trois jaunes en alternance, la noire au bout, ordre fixé de la gauche vers la droite ; un joueur les rouges, l'autre les jaunes, chacun prend ses billes dans l'ordre de la gauche vers la droite ; l'adversaire pose la blanche ; tirage au sort pour commencer ; partie limitée à 15 minutes, au-delà gagne qui a le moins de billes restantes."
    adults: "Mise en place proposée (la fiche ne la précise pas) : ligne sur l'axe de la table comme sur le schéma, rouges et jaunes en alternance de la gauche vers la droite, la noire au bout, environ une bille d'écart entre deux billes ; un joueur les rouges, l'autre les jaunes, chacun prend ses billes dans l'ordre de la gauche vers la droite ; un tir par joueur et par tour ; l'adversaire pose la blanche, au-dessus ou au-dessous de la ligne comme les deux tirs du schéma, pour un contact en trois-quarts (environ 15° entre l'axe de visée et la direction de la bille, voir la section « La couleur va plus loin » de la théorie) ; une bille empochée ne fait pas rejouer : le joueur passe à la bille suivante de son groupe à son tour suivant. Après la partie, comparer avec le taux de l'exercice : sur quelle distance et de quel côté le trois-quarts échoue-t-il ? Variante plus difficile : jouer aussi la noire en trois-quarts."
  src: S   # titre, règles, score et fin du jeu 8 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Où vise-t-on en trois-quarts, par rapport au demi et au plein ?
    - Quelle bille était la plus difficile en trois-quarts, et pourquoi ?
    - Que dirais-tu à un copain pour trouver le milieu du chemin ?
