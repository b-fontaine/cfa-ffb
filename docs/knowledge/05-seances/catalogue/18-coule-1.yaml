training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e1
      ref: {block: coule, n: 1}
      diagram: entrainement-p19-e1
      title: Au-delà du trait
      weight: {children: 2, adults: 1}
      setup: La rouge du schéma sur le trait, la jaune alignée à sa droite, la noire en bas à gauche ; la blanche sur son repère, en bas à droite de la jaune.
      instruction: Empocher la jaune dans la poche d'angle du haut à gauche, en plein et en attaque en haut, et faire avancer la blanche au-delà du trait pour jouer ensuite la noire.
      expected: La jaune est empochée ; la blanche suit sa trajectoire et s'arrête au-delà du trait, en position pour la noire.
      mistakes:
        - {symptom: La blanche s'arrête avant le trait, fix: Garder le point d'impact en haut et allonger le geste plutôt que d'accélérer.}
        - symptom: La blanche est empochée avec la jaune
          fix: Garder assez de puissance pour atteindre la zone, sans excès ; trop de puissance fait suivre la blanche dans la poche.
      playful:
        hook: La barque doit franchir la ligne d'arrivée tracée par le trait.
        challenge: Chaque passage de la ligne fait avancer la barque d'une case vers le port, dessiné au tableau ; trois cases, et elle y est.
      passes: 2
      src: S
    - id: e2
      ref: {block: coule, n: 2}
      diagram: entrainement-p19-e2
      title: Le chenal de la noire
      weight: {children: 1, adults: 1}
      setup: La noire, la jaune et la rouge du schéma alignées en diagonale ; la blanche sur son repère, en bas, près du trait.
      instruction: Empocher la rouge dans la poche du milieu du haut, en plein et en attaque en haut, puis replacer la blanche pour jouer la noire.
      expected: La rouge passe à droite de la jaune et de la noire vers sa poche ; la blanche s'arrête en position pour jouer la noire.
      mistakes:
        - {symptom: La blanche touche la jaune après le choc, fix: Revoir l'alignement et réduire la puissance pour que la blanche s'arrête plus tôt.}
        - {symptom: Le coup est trop rapide et la blanche roule trop loin, fix: Privilégier l'amplitude du geste à la vitesse.}
      playful:
        hook: La noire est le phare ; la barque doit s'arrêter là où elle peut le viser.
        challenge: En binôme, l'un tire et l'autre marque à la craie, ou d'un repère, l'endroit où la blanche s'est arrêtée.
      passes: 1
      src: S
    - id: e3
      ref: {block: coule, n: 3}
      diagram: entrainement-p20-e3
      title: Les quatre ports
      weight: {children: 1, adults: 1}
      setup: Les billes du schéma réparties en quatre zones, avec les deux noires aux extrémités ; la blanche replacée au centre bas de la table au début de chaque série.
      instruction: Pour chaque zone, empocher la bille visée en plein et en attaque en haut, puis replacer la blanche pour jouer la noire ; chaque série compte trois tirs.
      expected: Chaque bille est empochée en plein ; la blanche suit sa trajectoire et se replace pour jouer la noire.
      mistakes:
        - {symptom: La blanche s'écarte de la ligne de la bille de couleur, fix: Revenir au centre de la bille de couleur et vérifier l'alignement de la queue.}
        - {symptom: Le point d'impact descend sur la blanche au fil de la série, fix: Rappeler le point d'impact au-dessus du centre avant chaque tir.}
      playful:
        hook: Chaque zone est un port à atteindre ; on les visite l'un après l'autre.
        challenge: Visiter les quatre ports sans que la blanche touche une autre bille que sa cible.
      passes: 1
      src: S
game:
  title: Partie à difficulté réduite, version coulé
  source_game: 14
  adapted: true
  players: Partie à 2
  materials: "Billes du jeu complet, un tableau et des jetons (propositions)."
  setup_illustration: schema-jeu
  rules:
    - Les règles sont celles d'une partie classique, avec quatre billes de chaque groupe de couleur et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
    - "Avant un tir, le joueur peut annoncer « coulé » pour une bille jouée en plein ou presque, en attaque en haut."
    - "L'adversaire contrôle l'annonce : la bille de couleur est empochée, la blanche avance après le choc (elle ne recule pas, ne s'arrête pas net) et n'est pas empochée. En plein, elle suit en plus la bille de couleur."
  scoring: "Chaque coulé validé par l'adversaire donne un jeton ; trois jetons amènent la barque au port, ce qu'on marque au tableau. Les jetons n'influent pas sur la victoire : la partie se gagne comme une partie classique."
  end: Fin quand un joueur a vidé son groupe puis empoché la noire.
  playful_variant: "Équipes de deux, en tournante : les partenaires se relaient tir après tir ; leurs jetons s'additionnent ; trois jetons amènent la barque de l'équipe au port, dessiné au tableau. La première barque au port gagne la manche des barques, en plus de la partie, sans changer qui gagne la partie."
  link_previous:
    notion_of: rejet-naturel-2
    rule: "Exception facultative aux règles de la partie : sur une bille jouée proche du demi-bille, le joueur peut annoncer « rejet » à la place de « coulé » et montrer du doigt la zone où il veut replacer la blanche ; il joue en attaque en haut et l'adversaire vérifie que la blanche s'écarte, d'environ 45°, vers cette zone. Si c'est le cas, le joueur gagne un jeton, comme pour un coulé validé."
    note: "Rejoue le rejet naturel de la séance précédente (attaque en haut, demi-bille, déviation d'environ 45°, zone montrée du doigt) et le fait distinguer du coulé, où la blanche suit la couleur ; règle facultative, la partie se joue telle quelle sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche et les billes des poches. Mise en place proposée : un joueur les rouges, l'autre les jaunes, la noire sur son point de départ ; partie limitée à 15 minutes, au-delà gagne qui a le moins de billes restantes."
    adults: "Après la partie, chaque joueur compte ses coulés annoncés et ceux où la blanche a bien avancé sans être empochée, puis les compare au taux des exercices. Variante plus difficile : annoncer aussi où la blanche doit s'arrêter."
  src: Prop
review:
  prompts:
    - Où frappe-t-on la blanche pour un coulé ?
    - En plein, où part la blanche par rapport à la bille de couleur ?
    - À quoi voit-on qu'un coulé est réussi ?
