# Séance du catalogue : « Le coulé », partie 1/3.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: coule-1
order: 18
technique: coule
part: 1
title: Le coulé
technical_sheets: [11]
previous: rejet-naturel-2
catalogue_block: coule
notion: Replacer la blanche par un coulé, attaque en haut, en quantité de bille du plein au trois-quarts.
theme:
  name: Dans le sillage
  pitch: >-
    La bille de couleur est un bateau et la blanche une petite barque qui
    la suit dans son sillage. Chaque coulé validé fait avancer la barque
    vers le port : trois coulés, et elle y est.
recall:
  points:
    - Le rejet naturel se joue en attaque en haut, au-dessus du centre de la blanche.
    - La quantité de bille est proche du demi-bille ; on vise la tangente.
    - La blanche dévie d'environ 45° par rapport à sa trajectoire initiale ; une bille repère permet de le vérifier.
    - Pas trop vite, pour éviter que la blanche recule.
  question:
    ask: Au rejet naturel, où frappe-t-on la blanche et de combien dévie-t-elle ?
    answer: Au-dessus de son centre (attaque en haut) ; elle dévie d'environ 45° par rapport à sa trajectoire initiale.
  reuse: {sheet: rejet-naturel-2, illustration: angle-45}
  src: S
theory:
  sections:
    - id: attaque-haute
      title: Attaquer en haut
      weight: {children: 3, adults: 3}
      body:
        - Pour un coulé, le procédé frappe la blanche au-dessus de son centre.
        - On privilégie l'amplitude du geste à la vitesse, pour garder une rotation avant de la blanche au moment de l'impact.
      adult_extra:
        - Au Blackball, l'adaptation de la puissance est plus prononcée, la blanche étant plus légère et plus petite (fiche technique n° 11).
      key_point: Attaque en haut, geste ample plutôt que rapide.
      demo: Montrer sur la blanche le point d'impact, au-dessus du centre, puis le geste ample.
      illustrations: [attaque-haute, amplitude-vitesse]
      src: S
    - id: plein-suit
      title: En plein, la blanche suit la couleur
      weight: {children: 3, adults: 3}
      body:
        - En bille pleine, un coulé donne à la blanche la même trajectoire que la bille de couleur.
        - "Blanche avant le choc, bille de couleur, blanche après le choc : une seule droite."
      adult_extra:
        - "En plein, le transfert est important : la blanche garde peu d'énergie, il faut donc assez de puissance pour la replacer dans la zone (fiche technique n° 11)."
        - "Mais sans excès : trop de puissance et la blanche suit la couleur jusque dans la poche (initiation 13)."
      key_point: En plein, la blanche part là où part la couleur.
      demo: Jouer un coulé plein vers la poche et montrer où la blanche s'arrête.
      illustrations: [visee-plein, trajectoire-plein]
      src: S
    - id: vers-trois-quarts
      title: Un peu moins plein, la blanche s'écarte
      weight: {adults: 2}
      body:
        - Quand la quantité est proche du plein, la blanche dévie de quelques degrés par rapport à sa trajectoire initiale.
        - Du plein au trois-quarts, plus on s'éloigne du plein, plus elle s'écarte.
      adult_extra:
        - La puissance du coup joue aussi sur la trajectoire de la blanche après l'impact, à cause de sa taille et de son poids.
      key_point: Moins la bille est pleine, plus la blanche s'écarte.
      demo: Jouer le même coulé en plein puis en trois-quarts et comparer où la blanche s'arrête.
      illustrations: [quantites, visee-trois-quarts, trajectoire-trois-quarts]
      src: S
    - id: cadre-surface
      title: Le chevalet, d'abord sur cadre
      weight: {children: 1, adults: 1}
      body:
        - On commence le coulé avec le chevalet sur cadre.
        - Sur la surface de jeu, on place le chevalet de façon à pouvoir attaquer en haut.
      key_point: On commence sur le cadre, puis on passe à la surface.
      demo: null
      illustrations: [chevalet-cadre, chevalet-surface]
      src: S
    - id: contraste
      title: Rejet naturel ou coulé ?
      weight: {children: 1, adults: 1}
      body:
        - Même attaque en haut dans les deux cas ; c'est la quantité de bille qui change le trajet de la blanche.
        - Au rejet naturel, proche du demi-bille, la blanche s'écarte d'environ 45°. Au coulé, en plein, elle suit la couleur.
      key_point: Même attaque en haut ; demi, la blanche s'écarte, plein, elle suit.
      demo: null
      illustrations: [quantites-contraste]
      src: Prop
    - id: sillage
      title: Le sillage
      weight: {children: 1}
      body:
        - Imagine la bille de couleur comme un bateau. En plein, la blanche est la barque qui la suit.
      key_point: La blanche suit la couleur.
      demo: null
      illustrations: [trajectoire-plein]
      src: Prop
initiation:
  - id: ini-13
    initiation_sheet: 13
    title: Deux billes en coulé plein
    weight: {children: 3, adults: 3}
    setup: Une bille jaune sur la ligne de départ du schéma ; deux repères de blanche en V, l'un en haut à droite et l'autre en bas à droite de la jaune.
    goal: "Empocher 2 billes en coulé, une depuis chaque repère, en dirigeant la blanche dans la zone de replacement, avec un chevalet sur la surface de jeu et un chevalet sur cadre."
    expected: La blanche suit la jaune après le choc ; la jaune part vers la poche du côté opposé au repère.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation-13
    src: S
