uncertainties:
  - "Aucun jeu [S] n'existe pour le coulé : la partie à difficulté réduite du jeu 14 est reprise et adaptée (annonce « coulé », jetons, équipes, règle de lien, adaptations) ; tout cela est [Prop] et à valider par un animateur dans l'application. Thème, défis et minutes le sont aussi."
  - "Quantité de bille des exercices 1 à 3 : « en plein » est lu sur l'encart des schémas [S], non légendé ; le plein est estimé."
  - "Le trois-quarts n'est enseigné qu'aux adultes dans cette séance (théorie et schémas indicatifs) ; l'initiation 14 n'est jouée qu'en coule-2, pour ne pas la rejouer."
  - "La section « Rejet naturel ou coulé ? » est un contraste [Prop] : la fiche n° 11 ne l'énonce pas."
  - "Le schéma « attaque en haut » est une cible sur la blanche (valeur `top` : point à mi-rayon au-dessus du centre) ; la fiche dit seulement « au-dessus du centre »."
  - "Tailles : la blanche (48,0 mm) plus petite que la bille de but (50,8 mm) vient de [FFB] ; [S] dit seulement qu'elle est plus petite et plus légère. Les schémas de table et de contact sont calculés avec ces rayons (fantôme à 0,2136 case du centre de la bille de couleur) ; les billes du schéma de posture sont agrandies, non à l'échelle."
  - "Le plan amplitude × vitesse est [Prop] ; seule l'idée « amplitude plutôt que vitesse » vient de la fiche n° 11 [S]. L'exemple placé (amplitude longue, vitesse lente) est une image proposée, non une graduation."
  - "La section « Le sillage » (enfants) est une glose [Prop] : la fiche n° 11 ne donne pas cette image."
  - "Le rappel est écrit d'après la fiche technique n° 10 et ce que rejet-naturel-2 a enseigné (attaque en haut, demi-bille, 45°, bille repère) ; recall.reuse reprend l'illustration angle-45 de cette séance."
  - "Exercice 3 : le schéma [S] n'indique pas quelle bille appartient à quelle zone ; la séance ne l'impose pas. Exercices 1 et 2 : le schéma ne dit pas le type de chevalet."
  - "Les schémas de trajectoire (plein, trois-quarts) sont calculés et indicatifs : l'angle de sortie de la blanche en trois-quarts n'est pas mesuré par la fiche, qui dit seulement qu'il dépend de la quantité de bille."
  - "L'illustration « attaque en haut » est une cible sur la blanche indicative (le point est à mi-rayon au-dessus du centre) : la hauteur de la queue n'est pas précisée par la fiche."
