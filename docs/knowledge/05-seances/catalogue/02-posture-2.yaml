training:
  exercises:
    - id: e1
      ref: {block: posture, n: 3}
      diagram: proposition-p01-e3
      title: Les quatre emplacements
      weight: {children: 2, adults: 1}
      setup: La noire près du coin haut droit et la rouge près du coin bas droit, comme sur le schéma ; la blanche posée sur le premier des quatre emplacements alignés à gauche.
      instruction: Depuis chacun des quatre emplacements, jouer la noire puis la rouge, main d'appui à plat sur la surface de jeu, même près de la bande, car on s'entraîne à cet appui ; replacer la blanche et les billes entre deux tirs.
      expected: La queue part droit sur la ligne de visée et le corps reste immobile jusqu'à la fin du tir ; la bille visée va vers sa poche.
      mistakes:
        - {symptom: L'élève se relève avant la fin du tir, fix: Lui demander de rester immobile jusqu'à l'arrêt de la blanche.}
        - {symptom: La queue se relève en fin de geste, fix: Desserrer la main et garder un poignet souple.}
        - {symptom: Le tir part sur le côté, fix: "Reprendre la visée avant de se placer, queue posée sur la trajectoire."}
      playful:
        hook: Chaque emplacement est une épreuve ; les deux cibles réussies depuis un même emplacement donnent une étoile au tireur.
        challenge: Réussir les deux cibles depuis le premier et depuis le quatrième emplacement, les plus près des bandes.
      passes: 2
      src: Prop
    - id: e2
      ref: {block: posture, n: 4}
      diagram: proposition-p01-e4
      title: Les six cibles du tireur
      weight: {children: 1, adults: 1}
      setup: Les billes du schéma posées chacune devant une poche, comme sur le schéma ; pas de blanche sur le schéma, c'est le binôme qui la place avant chaque tir, tantôt près d'une bande, tantôt loin.
      instruction: Empocher les billes du schéma, une par tir, chacune dans la poche devant laquelle elle est posée ; le binôme place la blanche à chaque tir, l'élève choisit alors l'appui sur le cadre ou sur la surface selon sa place, et l'annonce avant de se placer.
      expected: Un appui adapté à chaque tir, une posture stable, et la bille empochée sans bouger avant la fin du tir.
      mistakes:
        - {symptom: La blanche est empochée au début des essais, fix: Ne pas corriger tout de suite ; laisser l'élève chercher.}
        - {symptom: L'élève se place avant d'avoir visé, fix: Lui faire poser la queue sur la ligne de visée d'abord.}
      playful:
        hook: Le binôme pose la blanche sans prévenir ; le tireur nomme son chevalet à voix haute avant de se placer et le justifie.
        challenge: Enchaîner trois cibles sans manquer, chacune avec l'appui le plus adapté.
      passes: 1
      src: Prop
game:
  title: Billes à un espace de bille des poches
  source_game: 2
  adapted: false
  players: Défi à 2
  materials: "Six billes de couleur et la blanche. Pour la variante (proposition) : des jetons et une tirelire."
  setup_illustration: schema-jeu
  rules:
    - Les billes de couleur sont placées près des poches, en laissant l'espace d'une bille.
    - Le joueur en contrôle place librement la blanche sur la surface de jeu et doit réaliser une série de 6 billes.
    - S'il manque ou commet une faute, on replace toutes les billes et la main passe à l'adversaire, qui doit réaliser l'enchaînement à son tour.
  scoring: Réaliser une série de 6 billes d'affilée.
  end: Le défi est relevé quand un joueur réalise la série de 6 billes ; la fiche ne précise pas de décompte entre les deux joueurs.
  playful_variant: "Tirelire du groupe (exception coopérative aux règles du jeu, durée 15 minutes) : la tirelire se remplit de 5 jetons ; chaque série de 6 réussie ajoute un jeton, puis la partie continue sans s'arrêter : on replace toutes les billes et la main passe à l'autre joueur. Le groupe gagne si la tirelire est pleine avant la fin des 15 minutes. Tournante : à chaque main perdue, le joueur qui a manqué laisse sa place à un joueur du groupe en attente. Convenir avant de jouer que chaque bille doit entrer dans la poche devant laquelle elle est posée (la fiche ne le précise pas)."
  link_previous:
    notion_of: posture-1
    rule: "Exception aux règles du jeu : avant chaque tir, le joueur annonce sa ligne de visée en posant la queue sur l'alignement queue-blanche-cible, puis se place ; l'adversaire contrôle que l'ordre viser puis se placer est respecté. Si l'ordre n'est pas respecté, le tir est traité comme une faute : on replace toutes les billes et la main passe, comme pour une faute du jeu."
    note: "Rejoue l'alignement puis la posture de la séance précédente, tout en gardant l'appui adapté à la place de la blanche ; règle facultative, le jeu 2 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Série ramenée à 4 billes, billes un peu plus près des poches ; le premier à réussir sa série gagne la manche (la fiche ne fixe pas de décompte) ; partie limitée à 15 minutes."
    adults: "Série de 6 en alternant l'appui cadre ou surface selon la blanche ; l'adversaire note où la queue finit à chaque série manquée (lecture des défauts)."
  src: S
review:
  prompts:
    - Depuis quel emplacement as-tu eu le plus de mal à rester immobile ?
    - Quel appui as-tu préféré sur la surface de jeu, et pourquoi ?
    - Que dirais-tu à un copain pour garder le même geste de près comme de loin ?
