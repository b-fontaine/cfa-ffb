uncertainties:
  - "Tailles : la séance ne mesure aucune quantité de bille ; la blanche plus petite (48,0 contre 50,8 mm, 06-dimensions-du-materiel.md) n'est donc pas dite dans les textes, seulement respectée dans le schéma `distances` (blanche au rayon r_c, flèches arrêtées au contact à s = r_c + r_o = 0,2136 case de la rouge, soit y = 0,364). La posture et la puissance n'utilisent plus aucun « cran »."
  - "Les exercices 3 et 4 du bloc posture, leurs taux et leurs mises en place sont [Prop], adaptés des fiches d'initiation 3 et 4 et du jeu 1 [S] ; à valider par un animateur dans l'application."
  - "Thème, défis, tirelire, tournante, règle de lien et adaptations du jeu : [Prop]. Titre, thème « Le tireur d'élite », notion, bloc et fiches techniques sont identiques à ceux de posture-1 (V23) ; la notion reprend la phrase de posture-1. Fil de la séance : rester stable autour de la ligne de visée (chevalet à plat, coup de queue droit, même geste de près et de loin) ; reformuler `notion` pour y nommer le coup de queue suppose de modifier posture-1 dans le même changement."
  - "La fiche du jeu 2 ne dit pas comment on désigne le gagnant ; le décompte proposé (adaptation.children) est une proposition."
  - "Le rappel ne porte que sur ce que posture-1 a enseigné (alignement, posture, appui sur le cadre, main à plat) ; il réutilise l'illustration `posture-personnage` de posture-1. Le coup de queue (seul l'avant-bras bouge) est nouveau et n'est pas rappelé."
  - "Pas de section d'initiation : les fiches d'initiation 3 et 4 sont déjà la base des exercices 3 et 4 ; les ajouter ferait doublon ; les deux sections nouvelles ont une démonstration que les élèves reproduisent aussitôt (chevalet à plat, trois balanciers à vide)."
  - "La section « Près ou loin, le même geste » est une glose [Prop] : la fiche technique n° 1 ne traite pas de la distance de la blanche ; son schéma aligne les trois emplacements avec la bille et la poche pour que seule la distance change."
  - "Dans l'exercice 3, les emplacements 1 et 4 sont à moins d'une demi-case d'une bande et la main reste à plat : choix volontaire repris de la fiche d'initiation 3 [S] pour travailler ce chevalet ; la fiche technique recommande plutôt le cadre près de la bande."
