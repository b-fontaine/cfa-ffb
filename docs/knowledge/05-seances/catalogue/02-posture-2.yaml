    alt: "Table vue de dessus : une bille rouge devant la poche du milieu du haut et trois emplacements pour la blanche (un peu plus petite que la rouge) alignés sur une même droite avec la rouge et la poche, de plus en plus éloignés, chacun avec une flèche vers la rouge."
