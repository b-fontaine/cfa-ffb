# Séance du catalogue : « Posture, visée et coup de queue », partie 2/2 (exercices 3-4 du bloc `posture` [Prop]).
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: posture-2
order: 2
technique: posture
part: 2
title: Posture, visée et coup de queue
technical_sheets: [1]
previous: posture-1
catalogue_block: posture
notion: Aligner la queue, la blanche et la cible avant de tirer, puis se placer de façon stable autour de cette ligne.
theme:
  name: Le tireur d'élite
  pitch: >-
    Deuxième épisode : le tireur d'élite relève un défi de tir. Il doit
    toucher ses cibles depuis plusieurs emplacements, de près comme de loin,
    sans trembler et sans bouger avant la fin du tir.
recall:
  points:
    - On aligne d'abord la queue, la blanche et la cible, puis on se place autour de cette ligne.
    - Le pied droit est sous la main droite (pour un droitier) ; l'avant-bras droit est vertical.
    - Les premiers tirs se font avec la main d'appui sur le cadre.
    - Quand la blanche est loin de la bande, la main se pose à plat sur la surface de jeu.
  question:
    ask: Dans quel ordre prépare-t-on un tir ?
    answer: On vise, on se place les pieds stables, puis on installe la main d'appui, sur le cadre ou à plat sur la surface de jeu.
  # Illustration `posture-personnage` de la séance précédente (posture-1), non recopiée ici.
  reuse: {sheet: posture-1, illustration: posture-personnage}
  src: S
theory:
  sections:
    - id: chevalet-surface
      title: La main d'appui sur la surface de jeu
      weight: {children: 3, adults: 3}
      body:
        - Quand la blanche est loin de la bande, la main d'appui se pose sur la surface de jeu.
        - "Chevalet à plat : toute la main d'appui sur le tapis, doigts écartés, pouce relevé et collé à l'index."
        - Le pouce et l'index de la main d'appui guident la queue ; la tête reste au plus près de la queue.
      adult_extra:
        - "Le chevalet bouclé (la flèche repose sur le majeur, entourée du pouce et de l'index) donne plus de stabilité à la queue ; la fiche précise qu'il est plus fréquent au billard américain."
        - "Le chevalet en angle prend plus de flèche et permet d'abaisser la tête près de la queue ; la fiche le décrit appuyé sur le cadre."
      key_point: Main à plat sur le tapis, doigts écartés, tête près de la queue.
      demo: "Former devant les élèves le chevalet à plat (doigts écartés, pouce relevé contre l'index, puis baisser la tête au plus près de la queue), puis les laisser le reproduire sur la table."
      illustrations: [posture-surface, chevalet-pdf]
      src: S
    - id: queue-droite
      title: Un coup de queue qui reste droit
      weight: {children: 2, adults: 2}
      body:
        - Seul l'avant-bras droit bouge ; le coude est le pivot, avec un poignet souple.
        - "La main qui tient la queue : le pouce et l'index la tiennent, les autres doigts la portent."
        - La paume ne touche la queue qu'à la fin du geste.
        - La queue traverse la blanche en restant sur sa trajectoire.
      key_point: Seul l'avant-bras bouge, le coude est le pivot.
      demo: "Faire le balancier devant les élèves : seul l'avant-bras bouge, le coude est le pivot, la main arrière tient la queue et la paume ne la touche qu'à la fin ; chacun fait ensuite trois balanciers à vide."
      illustrations: [queue-pdf]
      src: S
    - id: lire-defauts
      title: Lire la fin du geste
      weight: {adults: 2}
      body:
        - La position finale de la queue renseigne sur l'origine du défaut.
        - "Queue désaxée à gauche, coude éloigné du corps : l'épaule a travaillé sur le plan horizontal."
        - "Queue désaxée à droite : un peu l'épaule, surtout le poignet."
        - "Queue qui se relève avec le coude plus bas qu'au départ : l'épaule a travaillé sur le plan vertical."
        - "Queue qui se relève avec le coude au même niveau : main trop serrée, poignet rigide."
      key_point: On corrige le geste en regardant où finit la queue.
      demo: null
      illustrations: [defauts-pdf]
      src: S
    - id: distance
      title: Près ou loin, le même geste
      weight: {children: 1, adults: 1}
      body:
        - Plus la blanche est loin de la bille, plus un petit écart d'axe se voit au bout.
        - On garde la même posture et on reste immobile jusqu'à la fin du tir.
      key_point: Près ou loin, la posture et le geste restent les mêmes.
      demo: "Tirer la même bille depuis un poste proche puis un poste éloigné, avec le même geste."
      illustrations: [distances]
      src: Prop
