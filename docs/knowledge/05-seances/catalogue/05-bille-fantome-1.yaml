uncertainties:
  - "Exercices 1 et 2, taux et mise en place : [Prop] (bloc bille-fantome, hors des PDF d'entraînement), adaptés de la fiche technique n° 3 et de l'initiation 6 ; à valider par un animateur dans l'application."
  - "Duel des fantômes : [Prop], adapté du jeu 1 ; la série réduite, la pose de la fantôme par l'adversaire, la règle de lien avec la puissance, les vignettes et l'adaptation sont des propositions. Les thèmes, défis et minutes le sont aussi."
  - "La section « Le mot fantôme » (enfants) est une glose [Prop] : la fiche n° 3 n'emploie le mot qu'en le glosant pour l'animateur."
  - "Le rappel [S] se limite à la fiche n° 2 (vitesse et amplitude) et reprend l'illustration echelle-puissance de puissance-2 (V7) ; la distance, le recul et l'annonce « petit, moyen, grand » sont des propositions [Prop] de puissance-2, reprises seulement dans la règle de lien du jeu."
  - "Jeu 1 : la fiche dit seulement « blanche placée librement ». Lecture retenue ici [Prop] : placement libre au premier tir, puis blanche jouée d'où elle s'arrête ; la règle de lien (facultative) impose, en exception explicite, le placement à la main avant chaque tir."
  - "Les positions de la bille fantôme sont schématisées avec deux billes de même rayon (cf. fiche n° 4) ; au Blackball la blanche est un peu plus petite, l'écart est minime."
  - "Le sens de la ligne « blanche vers fantôme » et la hauteur « level » de la queue (vue de côté) sont des schématisations ; la fiche ne précise que le procédé au centre de la blanche."
