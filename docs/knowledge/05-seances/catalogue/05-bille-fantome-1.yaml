# Bloc d'entraînement [Prop] : exercices, taux et jeu adaptés de fiches [S], non fédéraux.
version: 1
id: bille-fantome-1
order: 5
technique: bille-fantome
part: 1
title: Viser pour empocher (bille fantôme)
technical_sheets: [3]
previous: puissance-2
catalogue_block: bille-fantome
notion: Viser pour empocher en alignant la blanche à l'impact (bille fantôme) sur le centre de la bille de couleur et celui de la poche.
theme:
  name: Le chasseur de fantômes
  pitch: >-
    Une bille fantôme se cache au contact de chaque bille de couleur. Le
    chasseur repère sa place avant qu'elle ne disparaisse, puis la blanche
    la remplace et la bille de couleur file à la poche.
recall:
  points:
    - La puissance d'un coup dépend de la vitesse de la queue et de son amplitude.
    - L'amplitude est le recul de la main quand on arme le tir, jusqu'à la fin de la pénétration dans la blanche.
    - Grande amplitude et grande vitesse, coup puissant ; peu d'amplitude et peu de vitesse, coup doux.
  question:
    ask: De quoi dépend la puissance d'un coup de queue ?
    answer: De la vitesse de la queue et de son amplitude, le recul de la main jusqu'à la fin de la pénétration dans la blanche.
  reuse: {sheet: puissance-2, illustration: echelle-puissance}
  src: S
theory:
  sections:
    - id: ligne
      title: La ligne de la poche
      weight: {children: 3, adults: 3}
      body:
        - La bille de couleur part sur la ligne qui joint le centre de la poche et son propre centre.
        - Pour qu'elle suive cette ligne, le centre de la blanche doit s'y trouver au moment du choc.
      key_point: Poche, bille et blanche doivent être alignées par leurs centres.
      demo: null
      illustrations: [ligne-poche]
      src: S
    - id: fantome
      title: La bille fantôme
      weight: {children: 3, adults: 3}
      body:
        - L'animateur pose une blanche, la fantôme, au contact de la bille à empocher, sur la ligne de la poche.
        - La queue est alignée entre le centre de ta blanche et le centre de la fantôme.
        - Le procédé touche ta blanche en son centre.
        - L'animateur retire la fantôme avant le tir et fait observer le point visé sur la bille de couleur.
      adult_extra:
        - Le procédé est placé au centre de la blanche de tir (limage) ; la queue suit la ligne centre de la blanche de tir vers centre de la fantôme.
      key_point: On vise le centre de la bille fantôme, puis on la retire avant de tirer.
      demo: L'animateur pose une blanche au contact de la bille, sur la ligne de la poche, puis la retire.
      illustrations: [visee-fantome, procede-centre]
      src: S
    - id: mot-fantome
      title: Le mot « fantôme »
      weight: {children: 1}
      body:
        - La bille fantôme n'existe pas vraiment. C'est la place de la blanche au moment où elle touche la bille de couleur.
        - Le point à montrer sur la bille est celui qui fait face à la blanche, sur la ligne de la poche.
      key_point: La fantôme, c'est la place de la blanche au contact de la bille.
      demo: null
      illustrations: [visee-fantome]
      src: Prop
    - id: plein
      title: Alignée avec la poche, c'est le plein
      weight: {children: 2, adults: 2}
      body:
        - "Bille alignée avec sa poche : la blanche arrive de face, centre sur centre, c'est le plein."
      adult_extra:
        - Au Blackball, la blanche est plus petite que les billes de couleur ; le contact se fait légèrement au-dessus de son équateur.
      key_point: Bille alignée sur la poche, la blanche la touche de face, en plein.
      demo: null
      illustrations: [contact-plein]
      src: S
