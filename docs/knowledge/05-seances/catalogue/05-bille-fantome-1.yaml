  - {id: visee-fantome, type: ghost_aim, cue: [3.6, 3.6], object: [1.0, 1.0], pocket: tl, fraction: full,
     caption: "La bille fantôme est la place de la blanche au moment du choc.",
     alt: "Blanche en bas à droite, bille de couleur vers le coin haut gauche ; la bille fantôme est collée à la bille de couleur, sur la ligne de la poche."}
  - {id: procede-centre, type: cue_side, tip_point: center, cue_height: level,
