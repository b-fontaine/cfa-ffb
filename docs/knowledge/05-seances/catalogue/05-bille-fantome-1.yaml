training:
  exercises:
    - id: e1
      ref: {block: bille-fantome, n: 1}
      diagram: proposition-p02-e1
      title: La fantôme posée
      weight: {children: 3, adults: 1}
      setup: Les billes du schéma sont posées devant leurs poches ; la blanche part de chaque emplacement numéroté du schéma, et chaque emplacement va avec la bille de même numéro. Pour chaque tir, l'animateur pose une blanche au contact de la bille, sur la ligne de la poche.
      instruction: Aligner la queue entre le centre de sa blanche et le centre de la fantôme, procédé au centre de la blanche ; l'animateur retire la fantôme, puis l'élève tire. Un tir par emplacement, quatre tirs en tout.
      expected: La blanche touche la bille de face ; la bille de couleur part droit vers sa poche.
      mistakes:
        - {symptom: La bille de couleur part de côté, fix: "Refaire l'alignement de la queue sur la ligne blanche vers fantôme et vérifier que le procédé reste au centre de la blanche."}
        - {symptom: "L'élève relève la tête avant le tir", fix: "Lui faire fixer la place de la fantôme retirée, puis tirer sans bouger."}
      playful:
        hook: L'animateur fait apparaître puis disparaître la fantôme ; le chasseur doit retenir sa place.
        challenge: Attraper une fantôme à chaque emplacement, soit un tir réussi par fantôme.
      passes: 2
      src: Prop
    - id: e2
      ref: {block: bille-fantome, n: 2}
      diagram: proposition-p02-e2
      title: La fantôme imaginée
      weight: {children: 2, adults: 1}
      setup: Les billes du schéma sont posées devant leurs poches, côté bas de la table ; aucune blanche n'est posée au contact. La blanche part de chacun des emplacements du schéma.
      instruction: Avant chaque tir, montrer du doigt, sur la bille, le point qui fera face à la blanche, sur la ligne de la poche, puis aligner la queue sur la fantôme imaginée et tirer. Un tir par emplacement.
      expected: Le point montré est celui qui fait face à la blanche, sur la ligne de la poche, et correspond au contact réel ; la bille de couleur part droit vers sa poche.
      mistakes:
        - {symptom: "Le doigt n'est pas sur la ligne blanche-bille-poche", fix: "Poser une blanche au contact pour vérifier la place de la fantôme avant de retirer."}
        - {symptom: L'élève tire sans avoir montré la place, fix: "Lui demander de la désigner du doigt avant de se pencher sur la queue."}
      playful:
        hook: La fantôme est invisible ; seul le chasseur la voit.
        challenge: Désigner la fantôme du doigt, puis réussir le tir sans que l'animateur ait à la poser.
      passes: 2
      src: Prop
game:
  title: Le duel des fantômes
  source_game: 1
  adapted: true
  players: "Duel à 2 ; l'animateur arbitre et pose la fantôme (ou un 3e joueur sous son contrôle) ; les duos tournent à la fin d'une série"
  materials: "Billes du jeu 1 en bord de poche, une blanche supplémentaire ou un repère pour la fantôme. Des jetons pour la règle de lien ; pour le défi ludique : un tableau et des vignettes."
  setup_illustration: schema-jeu
  rules:
    - Les billes sont posées en bord de poche, comme au jeu 1 ; au premier tir de la série, la blanche est placée librement par le tireur, de préférence en face de la bille, dans l'axe de la poche ; ensuite il joue la blanche d'où elle s'est arrêtée.
    - "Pour chaque tir, un 3e joueur ou l'animateur pose une blanche au contact de la bille, sur la ligne de la poche, puis la retire avant le tir ; l'animateur arbitre la pose."
    - "Le tireur aligne la queue entre sa blanche et la fantôme, procédé au centre de sa blanche. Si la blanche est placée de côté, le contact n'est plus de face : la quantité n'est pas encore nommée."
    - Après une faute ou un tir manqué, on replace les billes et la main passe, comme au jeu 1.
  scoring: La série compte les billes réussies d'affilée ; un tir manqué la remet à zéro.
  end: Le premier qui réussit une série de quatre billes d'affilée gagne (six au jeu 1 ; la série est réduite).
  playful_variant: "Après les duels, but collectif : à chaque bille empochée, on colle une vignette « fantôme capturé » sur une grille commune, que toute la salle remplit ensemble."
  link_previous:
    notion_of: puissance-2
    rule: "Exception aux règles du duel : avant chaque tir de la série, le tireur place la blanche à la main, à une distance de son choix, au lieu de la jouer d'où elle s'est arrêtée ; avant de tirer, il annonce « petit », « moyen » ou « grand » recul de la main selon la distance qu'elle doit parcourir ; l'animateur contrôle le recul et accorde un jeton si l'annonce correspond ; un jeton permet de rejouer, une fois, un tir manqué."
    note: "Réactive le dosage de l'amplitude de la séance précédente, avec les mêmes mots que son jeu ; règle facultative, le duel se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche des billes ; faire tourner les rôles tireur et animateur après chaque tir ; série réduite à trois billes d'affilée si le groupe débute."
    adults: "Après le duel, chaque joueur dit si l'échec venait de l'alignement sur la fantôme, de la puissance ou du geste. Variante plus difficile : poser la fantôme à la main seulement au premier tir de la série."
  src: Prop
review:
  prompts:
    - Où se trouve la bille fantôme par rapport à la bille de couleur et à la poche ?
    - Quel tir as-tu le mieux réussi, avec la fantôme posée ou imaginée ?
    - Que dirais-tu à un copain pour retrouver la place de la fantôme ?
