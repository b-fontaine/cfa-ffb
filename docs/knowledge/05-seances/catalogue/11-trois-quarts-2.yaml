version: 1
id: trois-quarts-2
order: 11
technique: trois-quarts
part: 2
title: Quantité trois-quarts
technical_sheets: [6]
previous: trois-quarts-1
catalogue_block: trois-quarts
notion: Viser à mi-chemin entre le centre et la tangente de la bille de couleur pour empocher en trois-quarts.
theme:
  name: Le chemin du milieu
  pitch: >-
    Entre le centre de la bille et son bord, il y a un chemin que l'on prend
    à mi-parcours. Aujourd'hui, la blanche passe d'un côté à l'autre : selon la
    poche visée, le chemin change de côté et la même rouge part vers deux poches.
recall:
  points:
    - Au trois-quarts, on vise à égale distance du centre de la bille de couleur et de sa tangente.
    - Le point de visée et le point de contact sont très proches.
    - La bille de couleur part à environ 15° et parcourt plus que la blanche.
    - La bille fantôme se place au contact de la bille de couleur, sur la ligne de la poche, du côté opposé à la poche.
  question:
    ask: Où vise-t-on au trois-quarts, et quelle bille parcourt le plus après le choc ?
    answer: À mi-chemin entre le centre et la tangente de la bille de couleur ; c'est la bille de couleur qui parcourt le plus.
  reuse: {sheet: trois-quarts-1, illustration: contact-trois-quarts}
  src: S
theory:
  sections:
    - id: point-visee
      title: Entre le centre et la tangente
      weight: {children: 3, adults: 3}
      body:
        - Au trois-quarts, la blanche recouvre les trois quarts de la bille de couleur.
        - On vise à égale distance du centre de la bille de couleur et de sa tangente.
        - Le point de visée et le point de contact sont très proches, donc c'est plus facile que les quantités plus faibles.
      adult_extra:
        - "Après le choc, la bille de couleur est déviée d'environ 15° (billes identiques) ; à la demi-bille, c'était environ 30°. Au Blackball la blanche est un peu plus petite que la bille de couleur : ces valeurs sont des ordres de grandeur."
      key_point: Trois-quarts, on vise à mi-chemin entre le centre et la tangente.
      demo: "Tirer sans empocher, à courte distance : la bille de couleur parcourt plus que la blanche."
      illustrations: [visee-poche-bas, demi-et-trois-quarts, fiche-trois-quarts]
      src: S
    - id: chevalets
      title: Deux chevalets pour le trois-quarts
      weight: {children: 1, adults: 1}
      body:
        - Le chevalet est l'appui de la main.
        - Elle s'appuie sur le cadre du billard, ou sur la surface de jeu.
      key_point: Deux chevalets, le même trois-quarts.
      demo: null
      illustrations: [attaque-centre]
      src: S
    - id: meme-visee
      title: Le chevalet change, pas la visée
      weight: {children: 1, adults: 1}
      body:
        - Aujourd'hui, tu joues le trois-quarts avec les deux appuis.
        - Avec l'autre chevalet, on garde le même point de visée et la même attaque au centre de la blanche.
      key_point: On change de chevalet, on ne change pas de visée.
      demo: "Tirer la même bille depuis le même repère avec les deux chevalets."
      illustrations: [attaque-centre]
      src: Prop
    - id: cote-poche
      title: Selon la poche, le point de visée change de côté
      weight: {children: 2, adults: 2}
      body:
        - La bille fantôme se pose toujours du côté opposé à la poche.
        - "La bille fantôme est collée à la rouge, sur la ligne rouge-poche prolongée, du côté de la blanche : poche en bas, elle est en haut à droite de la rouge ; poche en haut, en bas à droite."
        - Le point de visée passe de l'autre côté de la rouge, mais la quantité reste la même, le trois-quarts.
      adult_extra:
        - "Question de lecture : la poche est en haut, la blanche est posée en bas ; de quel côté de la rouge est la bille fantôme ? En bas à droite de la rouge, sur le prolongement de la ligne poche-rouge, côté opposé à la poche."
        - Poser la blanche du côté opposé à la poche garde une coupe modérée ; du même côté que la poche, la coupe devient trop forte pour le trois-quarts.
      key_point: Poche en bas, on vise en haut à droite de la rouge ; poche en haut, en bas à droite.
      demo: "Poser la blanche en haut à droite : montrer la bille fantôme en haut à droite de la rouge, sur le prolongement de la ligne poche-rouge, puis la rouge qui part vers la poche du milieu du bas ; recommencer depuis le bas."
      illustrations: [visee-poche-bas, visee-poche-haut]
      src: Prop
    - id: fantome
      title: "Rappel : la bille fantôme"
      weight: {adults: 1}
      body:
        - L'animateur pose une blanche (un peu plus petite que la bille à empocher) au contact de celle-ci, sur la ligne de la poche, puis la retire avant le tir.
      key_point: On vise le centre de la bille fantôme en plaçant le procédé au centre de la blanche.
      demo: null
      illustrations: [visee-poche-haut]
      src: S
