uncertainties:
  - "Sections « Le chevalet change, pas la visée » et « Selon la poche, le point de visée change de côté », défis ludiques, variante de jeu (jetons compris), règle de lien (alternance des chevalets) et adaptation du jeu (mise en place, faute) : [Prop], à valider par un animateur dans l'application. La différenciation enfants / adultes est aussi une proposition."
  - "Titre, notion et thème (« Le chemin du milieu ») alignés sur trois-quarts-1 (V23) ; la variante de jeu diffère de la sienne (équipes de 2 avec un guide, contre annonce et jeton de case)."
  - "Le rappel est écrit d'après la fiche technique n° 6, la fiche technique n° 3 (bille fantôme) et les exercices 1 et 2 du bloc ; il reprend l'illustration `contact-trois-quarts` de trois-quarts-1 (recall.reuse), non redéfinie ici."
  - "Écart de sources : la fiche technique n° 6 dit que la blanche confère « les trois quarts » de son énergie, la fiche d'initiation « deux fois plus qu'elle n'en conserve » ; la séance ne cite aucun chiffre d'énergie et dit seulement que la bille de couleur parcourt plus que la blanche."
  - "Le jeu 8 annonce 8 billes alors que le schéma en montre quinze (7 rouges, 7 jaunes, la noire) ; la composition des groupes, le côté des poches, l'ordre des tirs après un empochage et la définition de la faute ne sont pas précisés par la fiche : ce sont des propositions (adaptation). Le terme « mouche » (conseil de la fiche) n'est défini dans aucune source du dépôt."
  - "Initiation 8 : la fiche ne précise pas le type de chevalet ; la séance ne l'impose pas. Elle rejoue volontairement la même mise en place que trois-quarts-1 (même fiche, même schéma, même jeu 8) : la progression vient de l'exercice 3 (chevalet sur surface), de l'exercice 4 et de la lecture du côté de la poche. Exercice 3 : l'ordre des deux séries n'est pas indiqué sur le schéma."
  - "Exercice 4 : le PDF ne relie pas explicitement chaque position de la blanche à une poche. Les billes fantômes du schéma (en haut à droite et en bas à droite de la rouge, sur le prolongement de la ligne poche-rouge ; calcul : coupe d'environ 16° vers la poche du milieu opposée, d'environ 81° vers l'autre) imposent la blanche du côté opposé à la poche : blanche en haut, rouge vers la poche du milieu du bas ; blanche en bas, rouge vers la poche du milieu du haut. Le diagramme transcrit `entrainement-p08-e4` associe la série du haut à la poche tm (appariement croisé à corriger dans le diagramme, hors du périmètre de cette séance : le schéma affiché contredit donc la consigne tant qu'il n'est pas corrigé, d'où la mention dans la mise en place) ; la séance suit la géométrie."
  - "Illustrations `visee-poche-bas` et `visee-poche-haut` : blanche en (7.6 ; 1.0) ou (7.6 ; 3.0), rouge en (6.0 ; 2.0) : coupe d'environ 14,6° (distance de visée 0,054 case pour 0,055 nominale), calculée avec la blanche plus petite (r 0,1038 case contre 0,1098) ; la bille fantôme, une blanche, est à 0,2136 case du centre de la rouge. Positions [Prop]."
