training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e3
      ref: {block: trois-quarts, n: 3}
      diagram: entrainement-p08-e3
      title: Deux cibles, un seul trois-quarts
      weight: {children: 2, adults: 2}
      setup: La jaune du schéma en haut à gauche et la rouge du schéma en bas à gauche, près de la ligne de départ ; la blanche posée au centre de la table, au même repère pour les deux cibles.
      instruction: Empocher la jaune vers la poche du haut à gauche, puis la rouge vers la poche du bas à gauche, en trois-quarts ; quatre tirs par couleur, la blanche toujours replacée au repère.
      expected: Même repère pour tous les tirs ; chaque bille de couleur part vers sa poche et parcourt plus que la blanche.
      mistakes:
        - {symptom: La bille de couleur manque la poche, fix: "Faire montrer sur la bille le point à égale distance du centre et de la tangente avant de tirer ; le comparer au point de contact, tout proche."}
        - {symptom: L'élève se relève avant la fin du coup, fix: "Lui demander de rester immobile jusqu'à l'arrêt de la bille de couleur."}
      playful:
        hook: Chaque bille empochée fait avancer un jeton d'une case sur le chemin dessiné au tableau.
        challenge: Amener un jeton jaune et un jeton rouge au bout d'un chemin de quatre cases chacun, sans changer le repère de la blanche.
      passes: 2
      src: S
    - id: e4
      ref: {block: trois-quarts, n: 4}
      diagram: entrainement-p08-e4
      title: Une rouge, deux poches du milieu
      weight: {children: 1, adults: 1}
      setup: La rouge du schéma à droite du centre de la table ; deux repères pour la blanche à droite de la rouge, l'un en haut et l'autre en bas, comme sur le schéma ; le schéma ne relie pas chaque repère à une poche, suivre la consigne ci-dessous.
      instruction: Choisir une poche du milieu, puis poser la blanche sur le repère du côté opposé à la poche et empocher la rouge en trois-quarts ; blanche en haut pour la poche du milieu du bas, blanche en bas pour la poche du milieu du haut ; quatre tirs par poche.
      expected: La rouge part vers la poche du milieu choisie ; la bille fantôme est du côté opposé à la poche, le point de visée change de côté d'une poche à l'autre et la quantité reste la même.
      mistakes:
        - {symptom: La rouge part vers la mauvaise poche ou la coupe est trop forte, fix: "Vérifier que la blanche est du côté opposé à la poche ; faire montrer la bille fantôme sur la rouge, du côté opposé à la poche, avant de tirer."}
        - {symptom: La blanche est mal alignée avec le repère choisi, fix: "Poser la queue sur la ligne du repère au point de contact avant d'abaisser la tête."}
      playful:
        hook: La même rouge prend deux chemins, vers la poche du bas puis vers celle du haut.
        challenge: Gagner un jeton par rouge empochée et remplir les deux poches dessinées au tableau, en annonçant avant chaque tir de quel côté de la rouge se trouve la bille fantôme.
      passes: 1
      src: S
game:
  title: 8 billes en ligne
  source_game: 8
  adapted: false
  players: Partie à 2
  materials: "Billes du jeu complet, alignées le long de la grande bande, à distance d'une mouche (conseil de la fiche, non défini par les sources : distance laissée à l'animateur). Le titre dit 8 billes, le schéma en montre quinze (sept rouges, sept jaunes, la noire). Pour le défi ludique (proposition) : un tableau et des jetons."
  setup_illustration: schema-jeu
  rules:
    - Vider son groupe de billes puis la noire, d'un seul côté du billard.
    - Les joueurs tirent à tour de rôle ; la blanche est repositionnée après chaque tir pour viser en trois-quarts.
    - Quand une bille de couleur est empochée, le joueur passe à la bille suivante ; toute bille non empochée est repositionnée sur son point d'origine.
    - Un coup n'est pas valable en cas de faute.
  scoring: Le premier joueur qui a empoché toutes les billes de son groupe puis la noire gagne.
  end: Fin quand un joueur a vidé son groupe puis empoché la noire ; en cas d'égalité, rejouer une série entière.
  playful_variant: "Deux équipes de 2 (un tireur et un guide par équipe, rôles échangés à chaque tir). Avant son tir, le guide montre du doigt, à un doigt de la bille et sans la toucher, le point à égale distance du centre et de la tangente ; le tireur annonce « trois-quarts » puis tire. L'équipe adverse juge le point montré et donne un jeton s'il est juste ; l'équipe qui a le plus de jetons gagne le titre de « meilleurs guides », sans effet sur le résultat de la partie."
  link_previous:
    notion_of: trois-quarts-1
    rule: "Exception facultative aux règles du jeu 8 : la première bille de chaque joueur est jouée avec le chevalet sur cadre, la suivante avec le chevalet sur surface, et ainsi de suite en alternant."
    note: "Alterner les deux chevalets pour réinvestir le chevalet sur surface (exercice 3) et le chevalet sur cadre (exercice 4) dans une situation de jeu ; règle facultative, le jeu 8 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche des billes (distances courtes). Mise en place proposée (la fiche ne la précise pas), valable pour les deux publics : un joueur les rouges, l'autre les jaunes, la noire en bout de ligne ; tirage au sort pour commencer et pour choisir le côté ; poches d'un seul côté : les deux poches d'angle de la petite bande gauche, bas gauche et haut gauche, comme sur le schéma ; un seul tir par joueur à tour de rôle, que la bille soit empochée ou non, puis le tour passe à l'adversaire ; faute (à valider par l'animateur) : blanche empochée ou aucune bille touchée, le coup n'est alors pas valable et la bille est replacée sur son point d'origine. Partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes."
    adults: "Mise en place proposée (la fiche ne la précise pas), valable pour les deux publics : un joueur les rouges, l'autre les jaunes, la noire en bout de ligne ; tirage au sort pour commencer et pour choisir le côté ; poches d'un seul côté : les deux poches d'angle de la petite bande gauche, bas gauche et haut gauche, comme sur le schéma ; un seul tir par joueur à tour de rôle, que la bille soit empochée ou non, puis le tour passe à l'adversaire ; faute (à valider par l'animateur) : blanche empochée ou aucune bille touchée, le coup n'est alors pas valable et la bille est replacée sur son point d'origine. Après la partie, noter à quelle distance et avec quel chevalet les billes ont été manquées, pour relier le résultat au taux de l'exercice. Variante plus difficile : annoncer la poche et le côté du point de visée avant chaque tir."
  src: S   # titre, règles, score et fin du jeu 8 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
