# Séance du catalogue : « Le rétro », partie 2/4.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: retro-2
order: 26
technique: retro
part: 2
title: Le rétro
technical_sheets: [14]
previous: retro-1
catalogue_block: retro
notion: Jouer un rétro, attaquer la blanche sous son centre pour la faire reculer après le contact.
theme:
  name: Le boomerang
  pitch: >-
    La blanche est un boomerang : on la lance sur la bille de couleur et
    elle revient. Aujourd'hui, le boomerang doit revenir à la bonne place,
    même quand la bille est un peu plus de côté.
recall:
  points:
    - Le rétro se joue en attaque basse, sous le centre de la blanche.
    - En bille pleine, la blanche revient sur sa ligne de départ, à 180°.
    - Le coup doit être assez rapide pour que la blanche garde sa rotation arrière jusqu'à l'impact.
    - Si la blanche ne recule pas, l'attaque n'est pas assez basse ou le coup est trop lent.
  question:
    ask: Où frappe-t-on la blanche pour un rétro, et que fait la blanche en bille pleine ?
    answer: Sous son centre (attaque basse) ; en bille pleine, la blanche revient sur sa ligne de départ.
  reuse: {sheet: retro-1, illustration: retro-plein}
  src: S
theory:
  sections:
    - id: quantite-puissance
      title: Quantité et puissance règlent le retour
      weight: {children: 4, adults: 4}
      body:
        - Entre le plein et le demi-bille, la blanche en rotation arrière peut prendre de nombreuses directions.
        - La direction dépend de la quantité de bille et de la puissance du coup.
        - En trois-quarts, une légère différence de quantité de bille ou de puissance change le retour de la blanche.
      adult_extra:
        - "En demi-bille, la déviation de la blanche est de 90° : c'est la limite du rétro."
        - "Au Blackball, la blanche est petite : pour obtenir 90°, il faut viser une quantité proche du demi-bille, mais un peu plus à l'intérieur de la bille de couleur (légèrement plus pleine)."
        - "Sous le demi-bille, la blanche ne recule plus après l'impact : le coup n'est plus un rétro."
      key_point: "Trois-quarts : un peu de quantité ou de puissance en plus, et le retour change."
      demo: "Jouer deux trois-quarts en attaque basse, assez vite dans les deux cas, l'un moins fort, l'autre plus fort, et marquer où la blanche s'arrête."
      illustrations: [retour-plein, schema-initiation, bande-quantites]
      src: S
    - id: mot-boomerang
      title: Le boomerang
      weight: {children: 1}
      body:
        - Le boomerang revient vers toi, mais pas toujours au même endroit.
        - Selon où on touche la bille (plein, trois-quarts) et la force du coup, la blanche revient plus ou moins loin, plus ou moins de côté.
      key_point: La blanche revient comme un boomerang, mais pas toujours sur la même ligne.
      demo: null
      illustrations: [schema-initiation]
      src: Prop
    - id: garder-rotation
      title: Garder la rotation arrière
      weight: {children: 1, adults: 1}
      body:
        - Comme en séance précédente, les billes ne doivent pas être trop éloignées et le coup doit être assez rapide.
        - La queue ne doit pas se relever à la fin du coup ; sinon la main est trop serrée.
      adult_extra:
        - Selon la vitesse d'exécution, la trajectoire de la blanche peut varier après l'impact.
      key_point: Attaque basse, coup assez rapide, main souple.
      demo: "Jouer un rétro de près, puis de plus loin, et comparer le recul de la blanche."
      illustrations: [attaque-basse, contact-trois-quarts]
      src: S
    - id: cadre
      title: Sur le cadre, lever le talon
      weight: {children: 1, adults: 1}
      body:
        - Sur le cadre, on lève légèrement le talon de la queue pour l'incliner.
        - Cela permet d'attaquer la blanche en dessous de son centre.
      key_point: "Cadre : on lève un peu le talon."
      demo: "Montrer la queue à plat, puis le talon légèrement relevé."
      illustrations: [talon-leve]
      src: S
    - id: fiche
      title: Revoir la fiche
      weight: {adults: 1}
      body:
        - "La fiche technique n° 14 montre les trois cas : plein, demi-bille et trois-quarts."
      key_point: "Plein : 180° ; demi : 90° (au Blackball, un peu plus plein que le demi) ; entre les deux : selon quantité et puissance."
      demo: null
      illustrations: [voir-fiche]
      src: S
