training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e4
      ref: {block: retro, n: 4}
      diagram: entrainement-p28-e4
      title: Le boomerang dans les zones
      weight: {children: 2, adults: 1}
      setup: "La blanche posée sur le repère du schéma, la rouge près de la poche du milieu du haut ; les jaunes et la noire à droite, comme sur le schéma. Marquer deux zones sur la surface de jeu : la zone 1 près de la blanche, vers la droite du schéma, et la zone 2 plus bas et plus à droite (lecture du schéma, qui ne les délimite pas)."
      instruction: Empocher la rouge dans la poche du milieu du haut par un rétro, de façon que la blanche revienne dans chaque zone pour jouer la noire ; six tirs, la rouge et la blanche replacées à chaque tir, trois retours dans chaque zone.
      expected: Contact en plein ou proche du plein, attaque basse ; la rouge part vers la poche, la blanche recule et se place dans la zone visée ; sur le schéma, le retour vers la zone 2 passe par la bande du bas.
      mistakes:
        - {symptom: La blanche ne recule pas après le contact, fix: Frapper plus bas sous le centre et jouer un peu plus vite.}
        - {symptom: La blanche part trop loin de la zone, fix: Doser la puissance ; poser une bille repère dans la zone et recommencer.}
        - {symptom: La queue se relève en fin de coup, fix: Desserrer la main et accompagner le geste.}
      playful:
        hook: Le boomerang revient se poser dans sa boîte, la zone.
        challenge: Faire entrer le boomerang dans chaque zone trois fois, en alternant les zones.
      passes: 2
      src: S
    - id: e5
      ref: {block: retro, n: 5}
      diagram: entrainement-p29-e5
      title: Le boomerang passe le trait
      weight: {children: 2, adults: 1}
      setup: La rouge à gauche du trait, la blanche posée sur le trait ; les jaunes juste à droite du trait, la noire au centre vers le bas, comme sur le schéma.
      instruction: Empocher la rouge dans la poche du haut à gauche par un rétro, de façon que la blanche recule au-delà du trait pour jouer la noire ; recommencer cinq fois.
      expected: Contact en trois-quarts, attaque basse ; la rouge part vers la poche, la blanche recule et dépasse le trait, la noire restant jouable.
      mistakes:
        - {symptom: La blanche s'arrête avant le trait, fix: Jouer un peu plus vite en gardant l'attaque basse.}
        - {symptom: La blanche touche une jaune en reculant, fix: Revoir la quantité de bille et la puissance ; viser légèrement plus plein si elle part trop de côté.}
      playful:
        hook: "Le trait est la porte du boomerang : il doit la franchir sans toucher les jaunes, les gardiens."
        challenge: Franchir la porte trois fois de suite sans toucher les gardiens (défi ajouté, pas un critère de la fiche).
      passes: 2
      src: S
    - id: e6
      ref: {block: retro, n: 6}
      diagram: entrainement-p29-e6
      title: Le boomerang depuis le cadre
      weight: {children: 1, adults: 1}
      setup: La blanche posée sur le repère du schéma, en bas à droite de la rouge ; la rouge à gauche du trait ; les jaunes sur et près du trait, la noire au centre, comme sur le schéma.
      instruction: Empocher la rouge dans la poche du haut à gauche par un rétro, de façon que la blanche rebondisse sur la bande du bas et se place au-delà du trait pour jouer la noire ; recommencer cinq fois.
      expected: Contact en trois-quarts, attaque basse en levant légèrement le talon de la queue ; la blanche recule en diagonale vers la bande du bas, la touche et se place au-delà du trait.
      mistakes:
        - {symptom: La blanche ne recule pas, fix: Lever un peu plus le talon de la queue pour attaquer sous le centre.}
        - {symptom: La blanche ne dépasse pas le trait, fix: "Augmenter légèrement la vitesse, sans forcer."}
      playful:
        hook: Le boomerang fait un détour par la bande du bas, sans rester en deçà de la porte.
        challenge: Réussir deux retours de suite avec rebond, pendant que le binôme contrôle le talon relevé.
      passes: 1
      src: S
game:
  title: Partie à difficulté réduite, le tour du boomerang
  source_game: 14
  adapted: true
  players: Partie à 2, ou équipes de deux en tournante
  materials: "Billes du jeu complet (4 par groupe et la noire) ; des jetons pour la variante."
  setup_illustration: schema-jeu
  rules:
    - Partie à 2 ; les règles sont celles d'une partie classique, avec seulement 4 billes de chaque groupe et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
  scoring: Comme dans une partie classique ; le premier qui empoche son groupe puis la noire gagne.
  end: Fin quand un joueur a empoché son groupe puis la noire.
  playful_variant: "Tournante par équipes de deux, avec les jetons de la règle de lien (ils ne s'ajoutent à aucun autre) : à chaque tour de son équipe, un seul partenaire tire, en alternant (A, B, A, B...) ; l'autre contrôle l'attaque basse et regarde si la blanche recule. Les jetons se comptent à la fin de la partie : l'équipe qui en a le plus gagne la manche des boomerangs, en égalité la manche est partagée. La manche des boomerangs est un bonus : le vainqueur de la partie reste celui de la règle classique."
  link_previous:
    notion_of: retro-1
    rule: "Exception facultative aux règles classiques : avant un tir, le tireur annonce « boomerang » et la quantité, « plein » ou « trois-quarts », selon ce que sa bille permet ; il la joue en attaque basse et gagne un jeton si la blanche recule après le contact. Si la blanche ne recule pas, il n'y a ni jeton ni faute. Un tir non annoncé se joue librement, sans jeton."
    note: "Rejoue le rétro de la séance précédente (plein) et y ajoute le trois-quarts ; règle facultative, la partie se joue telle quelle sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher les billes des poches. Mise en place proposée : un joueur les rouges, l'autre les jaunes, tirage au sort pour commencer, partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes. Repère de recul : la blanche s'arrête au-delà de l'endroit où elle a touché la bille, vers le trait de départ ; l'animateur tranche en cas de doute."
    adults: "Après la partie, noter pour chaque boomerang la quantité jouée et où la blanche s'est arrêtée, puis comparer au taux de l'exercice. Variante plus difficile : annoncer la zone où la blanche doit revenir."
  src: Prop
review:
  prompts:
    - Dans quel cas la blanche n'a-t-elle pas reculé, et pourquoi ?
    - Qu'as-tu changé pour que le boomerang revienne dans la zone ?
    - Comment expliquerais-tu à un copain l'effet de la puissance sur le retour ?
