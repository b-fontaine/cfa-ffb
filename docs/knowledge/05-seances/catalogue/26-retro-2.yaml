uncertainties:
  - "Section « Le boomerang » (enfants), thème, défis, variante de jeu (tournante, jetons), règle de lien, adaptations et minutes : [Prop], à valider par un animateur dans l'application."
  - "Le jeu est une adaptation [Prop] du jeu 14 [S] ; seuls les 4 billes par groupe, la noire et le tirage à la bande viennent de la fiche. L'annonce « boomerang », le jeton, le choix plein / trois-quarts, la tournante et la manche bonus n'y figurent pas et sont facultatifs."
  - "Exercice 4 : les positions des zones 1 et 2 de la mise en place sont lues d'après les libellés du schéma (vers (5,4 ; 1,4) et (6,5 ; 2,6)), non formulées par la fiche. Le schéma [S] ne délimite pas les zones 1 et 2 et ne dit pas quelle bille correspond à quelle zone ; l'énoncé parle de six billes à empocher alors que le schéma dessine une rouge, trois jaunes et la noire. La consigne impose seulement six tirs avec replacement de la rouge et de la blanche à chaque tir (lecture de la répétition du schéma, comme dans retro-1) ; le rebond sur la bande du bas n'est que la lecture du trajet dessiné vers la zone 2, il n'est pas exigé pour la zone 1, dont le libellé est hors de ce trajet."
  - "Exercice 5 : que les jaunes soient des obstacles est une lecture du schéma, pas de l'énoncé : le critère de réussite est seulement « blanche au-delà du trait » ; « sans toucher les jaunes » n'est qu'un défi ajouté [Prop]."
  - "Ordre des exercices : l'ordre du catalogue (4, 5, 6) est conservé, mais l'exercice 5 (trois-quarts direct) est plus simple que le 4 (plein, rebond sur bande, zones) ; l'animateur peut jouer le 5 avant le 4."
  - "Exercices 5 et 6 : la quantité de bille (trois-quarts) est estimée d'après le petit schéma, non légendé ; la fiche ne précise pas le type de chevalet pour l'exercice 5. Le texte de l'exercice 6 et le catalogue indiquent le cadre."
  - "Initiation 18 : la fiche cite deux chevalets (surface, cadre) sans dire lequel va avec quelle position ; la séance ne l'impose pas."
  - "Alignée sur retro-1 : `theme.name`, `notion`, `technical_sheets` identiques (V23), variante de jeu différente ; `recall.reuse` reprend `retro-plein` de retro-1. L'illustration locale `retour-plein` est un schéma distinct (autre position) pour la théorie, pas une copie."
