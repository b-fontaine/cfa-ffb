    title: Rétro en trois-quarts
    weight: {children: 3, adults: 3}
    setup: Une rouge et une jaune près de la bande de gauche ; deux positions de départ pour la blanche, l'une sur le trait, l'autre à sa gauche, le trait étant à dépasser (le schéma).
    goal: "Empocher 2 billes en réalisant un rétro en trois-quarts, une par position, pour faire reculer la blanche au-delà du trait ; essayer un chevalet sur la surface de jeu et un chevalet sur cadre."
    expected: La blanche recule après le contact et dépasse le trait ; la trajectoire varie selon la vitesse du coup.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation
    src: S
