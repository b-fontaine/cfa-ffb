  - id: ini-6
    initiation_sheet: 6
    title: Deux billes en plein
    weight: {children: 2, adults: 2}
    setup: "Même fiche d'initiation qu'à la séance précédente ; on rejoue ses deux schémas, comme en partie 1 : la rouge vers la poche d'angle du haut à gauche, puis la jaune alignée avec la poche du milieu du haut (schéma illustré). Un tir par schéma ; on change seulement de chevalet d'un tir à l'autre."
    goal: "Empocher 2 billes en bille pleine, une par schéma, un tir avec un chevalet sur la surface de jeu et un tir avec un chevalet sur cadre ; billes parfaitement alignées avec la poche, puissance adaptée."
    expected: La bille de couleur part droit vers la poche ; la blanche parcourt peu.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation
    src: S
