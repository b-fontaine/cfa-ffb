uncertainties:
  - "Section « Deux chevalets, le même alignement » [Prop], défis ludiques, variante de jeu, règle de lien et adaptation du jeu : à valider par un animateur dans l'application. La différenciation enfants / adultes est aussi une proposition."
  - "Le rappel reprend ce que bille-pleine-1 enseigne (centre visé, alignement poche-bille-blanche, énergie transmise) et réutilise son illustration `visee-plein` ; la mention des deux chevalets n'y est pas reprise, la fiche n° 4 ne les distinguant pas."
  - "Initiation 6 : la fiche cite deux chevalets sans dire lequel va avec quel tir ; les deux schémas de la fiche (p06-e1 puis p06-e2) sont rejoués comme en partie 1, un tir chacun, en changeant de chevalet ; l'ordre des chevalets n'est pas imposé. L'illustration montre p06-e2 ; p06-e1 est montré à la séance précédente."
  - "Exercice 3 : l'ordre des tirs n'est pas indiqué sur le schéma. Exercice 4 : le point d'impact du petit schéma (légèrement au-dessus du centre, lecture approximative), pour le chevalet sur cadre comme pour celui de l'initiation, diffère de l'attaque au centre enseignée à la séance précédente (section « Où frapper la blanche ? » [Prop]) ; à vérifier avec un animateur."
  - "Le pitch (« le tir est plus long ») est une lecture [Prop] des schémas des exercices 3 et 4 ; la section de théorie « Aligner et doser la puissance » ne reprend que les deux conseils de la fiche d'initiation 6 (adapter la puissance, billes parfaitement alignées avec la poche)."
  - "Jeu 6 : la fiche dit à la fois « 5 tirs à tour de rôle » et « le premier à placer 5 fois la noire gagne » ; le rôle de la blanche, le replacement, le camp visé par chaque joueur et le départage ne sont pas dans la source : ils sont tranchés en [Prop] dans `adaptation`, jamais dans `rules`, `scoring` ni `end`."
