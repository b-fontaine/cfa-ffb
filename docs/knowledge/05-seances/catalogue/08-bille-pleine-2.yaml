training:
  exercises:
    - id: e3
      ref: {block: bille-pleine, n: 3}
      diagram: entrainement-p04-e3
      title: Deux cibles, un seul repère
      weight: {children: 1, adults: 1}
      setup: La rouge du schéma en haut à gauche, la jaune du schéma en haut à droite ; la blanche posée au même repère, au milieu de la table dans la moitié basse, pour les deux cibles.
      instruction: Empocher la rouge vers la poche du haut à gauche, puis la jaune vers la poche du haut à droite, en bille pleine ; quatre tirs par cible, la blanche toujours replacée au même repère.
      expected: Même repère pour tous les tirs ; chaque bille de couleur part droit vers sa poche.
      mistakes:
        - symptom: "La bille de couleur part de côté"
          fix: "Poser la blanche en bille fantôme au contact puis la retirer, et revérifier blanche, bille, poche."
        - symptom: "L'élève se relève avant la fin du tir"
          fix: "Lui demander de garder la queue immobile jusqu'à l'arrêt de la bille de couleur."
      playful:
        hook: "Deux cibles, deux couleurs : l'équipe rouge et l'équipe jaune comptent chacune ses billes."
        challenge: Annoncer la poche à voix haute avant chaque tir.
      passes: 2
      src: S
    - id: e4
      ref: {block: bille-pleine, n: 4}
      diagram: entrainement-p04-e4
      title: Le X vers les poches du milieu
      weight: {children: 1, adults: 1}
      setup: "Les deux jaunes du schéma, l'une au-dessus de l'autre, près des poches du milieu. Deux repères pour la blanche dans la partie gauche de la table, l'un en bas, l'autre en haut ; depuis le repère du bas on joue la jaune du haut, depuis le repère du haut la jaune du bas."
      instruction: Empocher la jaune du haut dans la poche du milieu du haut, puis la jaune du bas dans la poche du milieu du bas, en bille pleine ; quatre tirs par jaune.
      expected: Chaque jaune part droit dans sa poche du milieu ; la puissance s'adapte, l'alignement ne change pas.
      mistakes:
        - symptom: "La jaune passe à côté de la poche du milieu"
          fix: "Faire montrer le centre de la jaune avant de tirer, puis vérifier la ligne jaune, poche."
        - symptom: "Le coup est trop lent ou trop fort"
          fix: "Adapter l'amplitude du geste à la distance sans changer l'alignement."
      playful:
        hook: Les deux trajets de la blanche se croisent en X à gauche de la table, avant les jaunes.
        challenge: Réussir les quatre tirs d'une même jaune d'affilée.
      passes: 2
      src: S
game:
  title: Placer la noire dans une zone
  source_game: 6
  adapted: false
  players: Partie à 2
  materials: "Noire, blanche, quatre rouges et quatre jaunes pour matérialiser les camps. Pour la variante (proposition) : un tableau pour les étoiles."
  setup_illustration: schema-jeu
  rules:
    - Chaque joueur tire 5 fois, à tour de rôle.
    - Placer la noire en un tir dans le camp adverse, en la visant en bille pleine avec un chevalet sur cadre ; elle peut rebondir sur la petite bande.
    - Le coup n'est pas valable en cas de faute ou si la noire touche une bille.
    - Faire aussi jouer avec un chevalet sur la surface de jeu, en éloignant davantage la blanche et la noire de la bande.
  scoring: Le premier joueur qui place 5 fois la noire dans le camp adverse gagne.
  end: Fin dès qu'un joueur a placé 5 fois la noire dans le camp adverse.
  playful_variant: "Deux équipes de deux, un tir chacun à tour de rôle ; le partenaire qui ne tire pas regarde où s'arrête la noire et le dit à voix haute. Une étoile au tableau pour chaque placement réussi ; à la fin de la manche, les équipes changent de côté."
  link_previous:
    notion_of: bille-pleine-1
    rule: "Exception aux règles du jeu 6, avant chaque tir : le tireur annonce « plein cœur » ; les adultes montrent en plus du doigt, sur la noire, le centre qu'ils vont viser, comme le geste de la séance précédente, ici sur le centre. L'adversaire vérifie que ce centre, la blanche et le camp visé sont alignés."
    note: "Rejoue l'annonce « plein cœur » de bille-pleine-1 ; le geste du doigt reste réservé aux adultes, comme à la séance précédente ; règle facultative, le jeu 6 se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Agrandir la zone ou rapprocher le camp adverse de la noire (la fiche conseille de modifier la zone). Mise en place proposée, la fiche ne la précisant pas : chaque joueur tire depuis son côté, vers le camp de l'autre ; noire et blanche sont replacées sur leurs repères avant chaque tir, et la blanche est tirée sur la noire. Pour finir : après cinq tirs chacun, gagne qui a placé le plus de fois la noire ; en cas d'égalité, un tir de barrage chacun, à répéter. Tirage au sort pour commencer."
    adults: "Réduire la zone pour augmenter la difficulté (la fiche conseille de modifier la zone). Mise en place proposée, comme pour les enfants : chaque joueur tire depuis son côté vers le camp de l'autre ; noire et blanche replacées sur leurs repères avant chaque tir, la blanche tirée sur la noire ; départage en cas d'égalité après cinq tirs chacun par un tir de barrage. Après la partie, noter où la noire s'arrête par rapport au camp (trop courte, trop longue, de côté) pour relier le résultat à la puissance et à l'alignement."
  src: S   # titre, règles, score et fin du jeu 6 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
