version: 1
id: bille-pleine-2
order: 8
technique: bille-pleine
part: 2
title: Quantité de bille pleine
technical_sheets: [4]
previous: bille-pleine-1
catalogue_block: bille-pleine
notion: Viser le centre de la bille de couleur, en ligne avec la poche, pour l'empocher en bille pleine.
theme:
  name: Tir plein cœur
  pitch: >-
    Le tir en plein cœur a trouvé sa cible, et chaque bille empochée droit
    devant est un but. Aujourd'hui, même alignement, mais les tirs sont plus
    longs, avec deux cibles à viser à la suite.
recall:
  points:
    - En bille pleine, on vise le centre de la bille de couleur ; elle part droit.
    - "Poche, bille, blanche : trois centres sur une même ligne."
    - La bille de couleur file loin, la blanche parcourt peu.
  question:
    ask: Quelle ligne vérifie-t-on avant un tir en bille pleine, et quel point vise-t-on ?
    answer: Poche, bille de couleur et blanche sont alignées ; on vise le centre de la bille de couleur.
  # Illustration `visee-plein` de la séance précédente (bille-pleine-1) ; la théorie de cette séance
  # n'utilise pas le même identifiant (son schéma local s'appelle `visee-plein-milieu`).
  reuse: {sheet: bille-pleine-1, illustration: visee-plein}
  src: S
theory:
  sections:
    - id: alignement
      title: Trois centres alignés
      weight: {children: 2, adults: 2}
      body:
        - La bille de couleur part sur la ligne qui joint son centre au centre de la poche.
        - Pour cela, le centre de la blanche doit être sur cette ligne au moment du choc.
        - En bille pleine, on vise le centre de la bille de couleur ; le point visé est le point de contact.
        - La bille de couleur suit alors la trajectoire de la blanche.
      adult_extra:
        - "La bille fantôme sert de contrôle : l'animateur pose une blanche au contact de la bille, sur la ligne de la poche, puis la retire avant le tir."
        - "Au Blackball, la blanche est plus petite que les billes de couleur : le contact se fait légèrement au-dessus de l'équateur de la blanche, d'où des rejets différents des autres disciplines (fiche technique n° 4)."
      key_point: Blanche, bille de couleur, poche, les trois centres sont alignés.
      demo: "Poser une blanche en bille fantôme au contact de la bille, la retirer, puis tirer en visant sa place."
      illustrations: [alignement-trois, visee-plein-milieu, contact-plein]
      src: S
    - id: chevalets
      title: Deux chevalets, le même alignement
      weight: {children: 1, adults: 1}
      body:
        - Le chevalet sur cadre s'appuie sur le cadre du billard ; le chevalet sur surface se pose sur le tapis.
        - On change de chevalet, on garde le même alignement poche, bille, blanche.
      key_point: On change de chevalet, on ne change pas d'alignement.
      demo: "Tirer une même bille depuis un même repère une fois avec chaque chevalet (démonstration libre), puis faire les exercices 3 (surface) et 4 (cadre)."
      illustrations: [chevalet-surface, chevalet-cadre]
      src: Prop
    - id: distance
      title: Aligner et doser la puissance
      weight: {children: 2, adults: 2}
      body:
        - Les billes doivent être parfaitement alignées avec la poche.
        - On adapte la puissance à la distance.
      key_point: Billes parfaitement alignées avec la poche, puissance adaptée à la distance.
      demo: null
      illustrations: [chevalet-cadre, fiche-plein]
      src: S
