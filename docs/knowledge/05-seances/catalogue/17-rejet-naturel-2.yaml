uncertainties:
  - "Sections « Loin des bandes, le chevalet sur la surface », « Le virage long » et « Lire le chemin avant de tirer », thème, défis (hors notation), variante de jeu (étoiles, équipes, tournante), règle de lien (annonce de la zone, bille repère posée par le partenaire ou l'animateur), mise en place du jeu et adaptations : [Prop], à valider par un animateur dans l'application."
  - "Le jeu 14 [S] est joué tel quel (4 billes par groupe, la noire, tirage à la bande) ; la fiche ne détaille pas la partie classique (groupes, noire, fautes). La séance n'invente pas ces règles : elle renvoie à la partie classique. La variante diffère de celle de la partie 1 (annonce et jeton de rejeu d'un tir manqué) par son objectif (étoiles d'équipe, jamais de rejeu) et par le porteur de la bille repère (le partenaire, ou l'animateur en partie à 2)."
  - "Écart exercice 4 : la lecture « exercice 4 plus éloigné que l'exercice 3 » est abandonnée. D'après les coordonnées transcrites, la distance d'approche de la blanche vaut environ 2,8 cases à l'exercice 3 et 2,3 à l'exercice 4 ; l'exercice 4 se distingue par le long trajet de la blanche après le choc (environ 3,8 cases, presque horizontal, contre environ 1,3 à l'exercice 3)."
  - "Critère des exercices 3 et 4 : la fiche [S] demande seulement de replacer la blanche pour jouer la noire (taux 3/5). L'empochage de la rouge (exercice 3) ou de la jaune (exercice 4) est lu depuis la flèche du schéma ; il est présenté comme lecture du schéma à valider, non comme critère [S]. « Repère » désigne le cercle de départ du schéma ; la bille posée à l'arrivée est la « bille repère » (aide [Prop])."
  - "Jeu 14 : la fiche ne donne que trois règles (partie à deux joueurs, partie classique avec 4 billes par groupe et la noire, casse au tirage à la bande). Le score et la fin (groupe puis noire) sont repris des jeux 7 et 12 et marqués [Prop] ; les fautes renvoient au règlement fédéral, comme dans rejet-naturel-1, dont les règles de la partie classique ne figurent pas dans les sources du dépôt."
  - "Notation : le taux de la fiche vise « replacer la blanche pour jouer la noire ». Le schéma [S] ne montre pas le tir vers la noire, et l'arrivée dessinée de la blanche à l'exercice 3 est à plus de 2 cases de la noire : « en position de jouer la noire » est jugé à l'œil par l'animateur. Les défis ludiques sont hors notation."
  - "Quantité : la notion, identique à celle de la partie 1 (V23), dit « en demi-bille » alors que la source dit « proche du demi-bille » ; ce fichier écrit « proche du demi-bille » partout ailleurs, la notion est à corriger dans les deux parties en même temps. L'écart 30° (bille de couleur en demi-bille) et 45° (blanche en rejet) est rappelé dans une section [Prop] pour les adultes."
  - "Le bloc d'entraînement existe deux fois dans le PDF avec des schémas différents ; la séance utilise la 1re occurrence (page 14), dans la continuité des exercices 1 et 2 (page 13)."
  - "Exercices 3 et 4 : le schéma [S] ne montre pas le type de chevalet ; la séance ne l'impose pas. La position de départ de la blanche est déduite de cercles pointillés."
  - "Tailles : la blanche (48,0 mm) est un peu plus petite que les billes de but (50,8 mm), rapport 0,945 (`02-techniques/06-dimensions-du-materiel.md`, [FFB] ; [S] dit seulement « plus petite »). Les billes et la bille fantôme des schémas inline sont recalculées avec la géométrie réelle : centre du fantôme à r_c + r_o = 0,2136 case de la jaune (et non 0,23), soit (4,0 ; 2,214) à l'exercice de repère et (5,073 ; 1,778) au virage long ; positions de la blanche et fins de flèche conservées du schéma [S]. Le virage reste un angle d'environ 45° mesuré sur ces points (44° à 45°)."
  - "Liaison avec la partie 1 (rejet-naturel-1, écrite) : `theme.name`, `notion` et `technical_sheets` alignés (V23) ; `recall.reuse` vise `deviation-45` ; la séance rejoue l'initiation 12 avec une blanche placée par l'élève et ajoute le chevalet sur la surface et le long trajet, au lieu de répéter la partie 1."
