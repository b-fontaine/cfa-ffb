training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e3
      ref: {block: rejet-naturel, n: 3}
      diagram: entrainement-p14-e3
      title: Le virage court
      weight: {children: 1, adults: 1}
      setup: La blanche posée sur le cercle de départ à droite du schéma, la rouge sous et à gauche d'elle ; les jaunes et la noire à gauche de la table, comme sur le schéma ; la bille repère, aide facultative, peut être posée à l'arrivée de la flèche de la blanche.
      instruction: Empocher la rouge dans la poche du milieu du bas par un rejet naturel, de façon que la blanche se replace pour jouer la noire ; recommencer cinq fois.
      expected: Le tir compte quand la blanche, repartie vers la gauche sans reculer, est replacée en position de jouer la noire ; la rouge empochée, dessinée sur le schéma, accompagne le tir (lecture du schéma, à valider) ; la bille repère peut servir d'aide.
      mistakes:
        - {symptom: La blanche recule ou revient vers le tireur, fix: "Jouer moins vite et vérifier que le procédé frappe bien au-dessus du centre."}
        - {symptom: La blanche s'arrête loin de la zone prévue, fix: Poser une bille repère sur la trajectoire estimée et recommencer.}
      playful:
        hook: La blanche vise la bille repère posée là où elle doit s'arrêter pour pouvoir jouer la noire.
        challenge: "Hors notation : le binôme annonce la zone d'arrivée avant le tir ; un point chaque fois que la blanche s'arrête sur la bille repère ou contre elle."
