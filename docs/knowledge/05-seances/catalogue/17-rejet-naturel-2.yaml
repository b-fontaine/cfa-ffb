      diagram: entrainement-p14-e4
      title: Le virage long
      weight: {children: 1, adults: 1}
      setup: La blanche posée en haut à droite du schéma, la jaune plus bas, à droite du centre de la table ; la rouge sur la ligne de départ et la noire près de la bande de gauche, comme sur le schéma ; la bille repère, aide facultative, peut être posée à l'arrivée de la flèche de la blanche.
      instruction: Empocher la jaune dans la poche du milieu du bas par un rejet naturel, de façon que la blanche reparte presque à l'horizontale vers la gauche pour jouer la noire ; recommencer cinq fois.
      expected: Le tir compte quand la blanche, repartie presque à l'horizontale sur un long trajet sans reculer, est replacée en position de jouer la noire ; la jaune empochée, dessinée sur le schéma, accompagne le tir (lecture du schéma, à valider) ; la bille repère peut servir d'aide.
