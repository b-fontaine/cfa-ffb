        challenge: "Hors notation : le binôme annonce la zone d'arrivée avant le tir ; un point chaque fois que la blanche touche la bille repère."
      passes: 1
      src: S
game:
  title: Partie à difficulté réduite
  source_game: 14
  adapted: false
  players: "Partie à 2 ; la variante se joue à 4 (deux équipes de deux), en tournante si la salle compte plus de deux équipes"
  materials: "Billes du jeu complet (4 par groupe et la noire). Pour la règle de lien et la variante (propositions) : une bille hors partie comme bille repère, un tableau ou des jetons pour les étoiles."
  setup_illustration: schema-jeu
  rules:
    - "Partie à 2 ; les règles sont celles d'une partie classique, excepté que l'on utilise uniquement 4 billes de chaque groupe de couleur et la bille noire."
    - Le joueur qui casse est désigné par le tirage à la bande.
    - "Pour les fautes, se reporter au règlement fédéral (proposition : la fiche 14 ne les détaille pas)."
  scoring: "Proposition, reprise des jeux 7 et 12 (absente de la fiche 14) : le premier qui empoche son groupe puis la noire gagne."
  end: "Proposition, reprise des jeux 7 et 12 : fin quand un joueur a empoché son groupe puis la noire."
  playful_variant: "La manche des étoiles, avec la règle de lien, en deux équipes de deux : la partie se joue entre les équipes, à chaque visite à la table l'autre équipier tire, et son partenaire pose la bille repère et juge le contact en demi-bille (l'animateur tranche en cas de doute). Chaque tir où la bille est empochée ET où la blanche touche la bille repère rapporte une étoile à l'équipe ; rien si la bille n'est pas empochée. La première équipe à trois étoiles gagne le badge « Virage ». La manche est un défi en plus : elle ne compte pas pour la victoire, qui reste celle du jeu (groupe puis noire). En tournante, l'équipe qui perd cède sa place à une équipe en attente."
  link_previous:
    notion_of: rejet-naturel-1
    rule: "Exception facultative aux règles classiques, à chaque tir en demi-bille : avant le tir, le tireur désigne du doigt la zone où il veut replacer la blanche ; son partenaire (en partie à 2, l'animateur) pose une bille repère dans cette zone, libre de toute autre bille, puis la retire après le tir. La blanche qui touche la bille repère n'est jamais une faute, et la bille repère ne change pas le score."
    note: "Fait rejouer la zone de replacement et la vérification par une bille repère de la séance précédente ; règle facultative, la partie se joue telle quelle sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher les billes des poches. Mise en place proposée (la fiche ne la précise pas) : un joueur les rouges, l'autre les jaunes ; les billes groupées en losange avec la noire au centre, comme sur le schéma ; la blanche sur la ligne de départ. Pour la faute, la noire empochée trop tôt et la blanche empochée, appliquer les règles de la partie classique, que la fiche ne détaille pas. Partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes."
    adults: "Même mise en place proposée que pour les enfants (un groupe par joueur, noire au centre du losange, blanche sur la ligne de départ, partie classique pour le reste). Après la partie, noter où la blanche s'est arrêtée à chaque rejet (zone atteinte, trop courte ou trop longue) et comparer au taux de l'exercice. Variante plus difficile : annoncer la poche et la zone avant chaque tir."
  src: S   # titre et règles du jeu 14 (3 règles de la fiche) ; scoring et end repris des jeux 7 et 12, fautes : règlement fédéral, donc [Prop] ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Dans quel cas la blanche est-elle partie ailleurs que prévu ?
    - Où la blanche s'est-elle arrêtée par rapport à la bille repère, et qu'as-tu corrigé au tir suivant ?
    - Comment expliquerais-tu l'attaque haute à un copain ?
