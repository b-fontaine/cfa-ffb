# Séance du catalogue : « Le rejet naturel », partie 2/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: rejet-naturel-2
order: 17
technique: rejet-naturel
part: 2
title: Le rejet naturel
technical_sheets: [10]
previous: rejet-naturel-1
catalogue_block: rejet-naturel
notion: Empocher une bille en demi-bille avec une attaque haute, pour que la blanche soit rejetée à environ 45°.
theme:
  name: Le virage à 45°
  pitch: >-
    La blanche frappe la bille de couleur, puis prend un virage d'environ
    45° vers la zone où l'on veut la poser. Aujourd'hui, le virage est
    parfois long, presque à l'horizontale, et doit finir au bon endroit.
recall:
  points:
    - Le rejet naturel se joue en attaque haute, au-dessus du centre de la blanche.
    - La quantité de bille est proche du demi-bille ; on vise la tangente.
    - La blanche dévie d'environ 45° par rapport à sa trajectoire initiale.
    - Un coup trop rapide fait reculer la blanche.
  question:
    ask: Avec quelle attaque joue-t-on un rejet naturel, et de combien la blanche dévie-t-elle ?
    answer: Attaque haute, quantité proche du demi-bille ; la blanche dévie d'environ 45° par rapport à sa trajectoire initiale.
  # Illustration `deviation-45` de la séance précédente (rejet-naturel-1).
  reuse: {sheet: rejet-naturel-1, illustration: deviation-45}
  src: S
theory:
  sections:
    - id: retenir
      title: En une phrase
      weight: {children: 1, adults: 1}
      body:
        - "Proche du demi-bille, attaque haute, coup à la mesure : la blanche dévie d'environ 45°."
      key_point: Attaque haute, proche du demi-bille, coup à la mesure.
      demo: "Jouer une bille proche du demi-bille, attaque haute, et montrer où la blanche s'arrête."
      illustrations: [attaque-haute, contact-demi, angle-45]
      src: S
    - id: verifier
      title: Vérifier avec une bille repère
      weight: {children: 2, adults: 2}
      body:
        - Avant le tir, on pose une bille dans la zone où la blanche doit se replacer, sur la trajectoire estimée.
        - On joue le coup et on regarde si la blanche touche cette bille.
      adult_extra:
        - Laisser l'élève placer la blanche avant le tir, pour s'assurer que la notion de demi-bille est intégrée.
      key_point: La bille repère montre où la blanche doit arriver.
      demo: "Poser une bille repère sur la trajectoire estimée de la blanche, jouer, constater."
      illustrations: [repere-zone]
      src: S
    - id: cadre
      title: Près de la bande, le chevalet sur cadre
      weight: {children: 1, adults: 1}
      body:
        - "Blanche près d'une bande et chevalet sur cadre : l'attaque haute est obligatoire."
      key_point: Près de la bande, sur cadre, l'attaque haute est obligatoire.
      demo: null
      illustrations: [attaque-haute]
      src: S
    - id: surface
      title: Loin des bandes, le chevalet sur la surface
      weight: {children: 1, adults: 1}
      body:
        - Quand la blanche est loin des bandes, le chevalet se pose sur la surface de jeu.
        - "L'attaque haute ne vient plus toute seule : on la cherche, en vérifiant que la queue frappe au-dessus du centre."
      key_point: Sur la surface, on cherche l'attaque haute.
      demo: "Jouer le même rejet sur cadre puis sur la surface et comparer la hauteur de la queue."
      illustrations: [attaque-haute]
      src: Prop
    - id: virage-long
      title: Le virage long
      weight: {children: 1, adults: 2}
      body:
        - "Au schéma de l'exercice 4, la blanche repart presque à l'horizontale, sur un long trajet vers la gauche."
        - "On garde la même visée et la même attaque haute, et on dose sans forcer : un coup à la mesure."
      adult_extra:
        - "Comparer les deux schémas du bloc : la blanche part d'une distance voisine, mais son trajet après le choc est court à l'exercice 3 (environ une case) et long à l'exercice 4 (près de quatre cases)."
      key_point: Long trajet, même visée, même attaque, coup à la mesure.
      demo: "Jouer le rejet de l'exercice 4 et montrer où la blanche s'arrête sur son long trajet."
      illustrations: [trajet-long]
      src: Prop
    - id: lire-chemin
      title: Lire le chemin avant de tirer
      weight: {adults: 2}
      body:
        - "Avant le tir, repérer le prolongement de la trajectoire de la blanche : elle repartira à environ 45° de cette ligne."
        - Vérifier que la direction obtenue ne mène pas vers une poche, puis choisir la puissance selon l'endroit où la blanche doit s'arrêter.
        - "Ne pas confondre : en demi-bille, c'est la bille de couleur qui est déviée d'environ 30° de l'axe de visée (fiche technique n° 5) ; ici, c'est la blanche qui dévie d'environ 45°, avec une quantité proche du demi-bille et une attaque haute."
        - "Au Blackball, la blanche est un peu plus petite que les billes de couleur (fiche technique n° 4) : en demi-bille, c'est le centre de la blanche qui passe par la tangente de la bille de couleur. Sur les schémas, la différence de taille se voit à peine ; elle ne change pas la lecture du rejet."
      key_point: On lit le prolongement, les 45° et la puissance avant de tirer.
      demo: null
      illustrations: [angle-45]
      src: Prop
