version: 1
id: carreau-2
order: 22
technique: carreau
part: 2
title: Le carreau
technical_sheets: [12]
previous: carreau-1
catalogue_block: carreau
notion: Faire s'arrêter la blanche sur la bille de couleur en la jouant en plein, avec une attaque au centre.
theme:
  name: La blanche se gare
  pitch: >-
    La blanche sait se garer : frappée au centre, elle s'arrête net sur la
    bille de couleur. Aujourd'hui, elle doit se garer pile entre des billes
    voisines, d'abord au centre de la table, puis dans sa moitié droite.
recall:
  points:
    - Le carreau se joue en bille pleine, avec une attaque au centre de la blanche.
    - Sans rotation à l'impact, la blanche s'arrête sur la bille de couleur.
    - "La blanche glisse d'abord, puis roule : on joue à courte distance."
    - Trop fort, la blanche recule ; trop doux, elle roule après l'impact.
  question:
    ask: Où frappe-t-on la blanche pour un carreau, et que fait-elle à l'impact ?
    answer: Au centre, en bille pleine ; sans rotation, la blanche s'arrête sur la bille de couleur.
  reuse: {sheet: carreau-1, illustration: schema-carreau}
  src: S
theory:
  sections:
    - id: glissement
      title: "Rappel : glisser avant de rouler"
      weight: {children: 1, adults: 1}
      body:
        - "Bille pleine, attaque au centre : la blanche glisse d'abord, puis elle roule."
        - Au carreau, elle touche la bille de couleur pendant qu'elle glisse, et elle s'arrête.
      adult_extra:
        - La pénétration et la vitesse sont à adapter pour garder le glissement jusqu'à l'impact.
        - "Rappel des fiches n° 12 et initiation 15 : trop puissant, la blanche recule (écarts de poids et de taille entre la blanche, plus petite et plus légère, et la bille de couleur) ; trop doux, elle roule après l'impact."
      key_point: Attaque au centre, bille pleine, blanche qui glisse jusqu'à l'impact.
      demo: "Jouer un carreau à courte distance, en bille pleine avec une attaque au centre, et montrer que la blanche glisse jusqu'à l'impact puis s'arrête."
      illustrations: [cue-centre, carreau-distance]
      src: S
    - id: surface-cadre
      title: Sur la surface ou sur le cadre
      weight: {children: 1, adults: 1}
      body:
        - Le carreau se travaille avec un chevalet sur la surface de jeu et avec un chevalet sur cadre.
      key_point: Deux appuis à travailler, sur la surface et sur le cadre.
      demo: null
      illustrations: [cue-centre]
      src: S
    - id: meme-attaque
      title: Le chevalet change, l'attaque non
      weight: {children: 1, adults: 1}
      body:
        - Avec un chevalet sur cadre, on garde la bille pleine et l'attaque au centre.
        - "Sur cadre, on risque de frapper au-dessus du centre : on vérifie que la queue est à plat, talon légèrement levé si besoin, pour garder l'attaque au centre."
      key_point: Le chevalet change, la visée reste bille pleine et attaque au centre.
      demo: null
      illustrations: [cue-centre]
      src: Prop
    - id: doser
      title: Chercher le bon dosage
      weight: {children: 2, adults: 2}
      body:
        - "On reprend la mise en place de l'exercice 3 : la blanche sur son repère, à courte distance de la rouge."
        - "On joue trois coups d'essai depuis ce repère : un coup un peu plus doux, un coup un peu plus fort, puis celui du milieu."
        - Ces trois coups ne comptent pas dans les passages de l'exercice.
        - On garde la force qui arrête la blanche pile à l'impact.
      key_point: On essaie, on observe, on garde le coup où la blanche s'arrête pile.
      demo: "Jouer les trois coups d'essai depuis le repère de l'exercice 3 et montrer à chaque fois où la blanche s'arrête."
      illustrations: [plan-dosage]
      src: Prop
    - id: lire-arret
      title: Lire où la blanche s'arrête
      weight: {adults: 2}
      body:
        - Après chaque carreau, noter si la blanche est restée sur place, a reculé ou a roulé vers l'avant.
        - "Recul : coup trop puissant ; roulement : coup trop doux ou pénétration insuffisante."
        - "La blanche recule ou suit malgré un bon dosage : vérifier le point d'attaque (centre, queue à plat) ; frappée sous le centre elle recule, au-dessus elle suit, comme au coulé."
        - Après la série, rejouer en priorité les tirs ratés en nommant d'abord ce que la blanche a fait.
      key_point: Le sens de l'erreur donne la correction.
      demo: null
      illustrations: [carreau-distance]
      src: Prop
