uncertainties:
  - "Jeu : la source ne propose aucun jeu spécifique au rétro ; le jeu 14 est repris et adapté (règle du rétro, jetons boomerang pour les enfants, règle de lien pour les adultes, scoring « comme une partie classique ») : [Prop], à valider par un animateur dans l'application."
  - "Thème « Le boomerang », défis ludiques, variante de jeu, règle de lien, adaptations, poids et minutes : [Prop]. Le nom du thème devra être repris par retro-2 à retro-4 (V23) et la variante de jeu y être différente."
  - "Rappel : repris de la fiche technique n° 13 et de angle-droit-2 (attaque au centre, toute quantité sauf le plein, 90°, angle ouvert si trop puissant) ; `recall.reuse` vise l'illustration `angle-90-bande` de angle-droit-2 et `link_previous` rejoue ce coup (V7, V14)."
  - "Exercice 3 : les zones 1 et 2 ne sont pas délimitées sur le schéma [S], seuls les libellés « Zone 1 x3 » et « Zone 2 x3 » figurent (vers 1,3 ; 1,8 et vers 2,7 ; 3,3) ; leur taille (carré d'une case), leur position sur la ligne de retour et le fait qu'on les règle par la vitesse sont des lectures [Prop] du schéma et de la fiche n° 14 (déviations selon la quantité et la puissance), non formulées telles quelles ; l'ordre « zone 1 puis zone 2 » n'est pas imposé."
  - "Exercice 3 : le schéma montre une seule rouge, deux jaunes et la noire alors que l'énoncé parle de six tirs ; la rouge est replacée à chaque tir."
  - "Exercices 1 et 3 : le type de chevalet n'est pas précisé par la source ; il est lu dans le catalogue (cadre à l'exercice 2)."
  - "Tailles des illustrations : la blanche est dessinée plus petite que la bille de couleur (48,0 mm contre 50,8 mm, `02-techniques/06-dimensions-du-materiel.md`, valeurs [FFB] ; la source [S] dit seulement que la blanche est plus petite) et la bille fantôme à r_c + r_o ; le point d'impact du procédé est à l'échelle de la blanche, la cible et la vue de face sont des agrandissements indicatifs [Prop]."
  - "Section « Le boomerang » (enfants) : glose [Prop], absente des fiches."
  - "Illustration `talon-leve` : la fiche n° 14 et l'initiation 17 donnent le conseil (lever légèrement le talon sur cadre), mais pas d'angle ; l'inclinaison du schéma est indicative."
  - "Section « En plein, la blanche revient » : « certaine vitesse » et « billes pas trop éloignées » viennent de l'initiation 17 ; la source ne donne ni vitesse ni distance chiffrée. La section adultes « Régler le retour » est une lecture [Prop]."
  - "Jeu : `rules` reprend les trois règles du jeu 14 ; le critère du jeton boomerang (la blanche s'immobilise plus près du tireur que du point de contact, jugé par l'adversaire), l'équerre annoncée (adultes), le placement de la blanche à trois jetons (enfants) et le jeu en équipes sont [Prop], facultatifs, exclusifs l'un de l'autre (une seule règle facultative par partie), et la partie se joue sans eux."
  - "Notion : la formulation « attaquer la blanche sous son centre » est commune aux quatre séances du rétro ; retro-2 doit être alignée (V23)."
