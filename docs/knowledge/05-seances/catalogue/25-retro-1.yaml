training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e1
      ref: {block: retro, n: 1}
      diagram: entrainement-p27-e1
      title: Le boomerang revient
      weight: {children: 2, adults: 1}
      setup: La rouge du schéma près de la bande de gauche, sous la poche d'angle du haut à gauche ; les jaunes et la noire en dessous d'elle ; la blanche posée sur le trait tracé sur la surface de jeu, à droite de la rouge.
      instruction: Empocher la rouge en bille pleine avec une attaque basse, de façon que la blanche recule au-delà du trait, pour pouvoir jouer ensuite la noire ; recommencer la même situation à chaque tir.
      expected: La rouge est empochée en plein et la blanche recule sur sa ligne au-delà du trait, bien placée pour la noire.
      mistakes:
        - symptom: La blanche ne recule pas
          fix: Attaquer plus bas, sous le centre de la blanche, et jouer un peu plus vite.
        - symptom: La queue se relève en fin de coup
          fix: Moins serrer le talon de la queue pour garder un mouvement rectiligne.
      playful:
        hook: >-
          Chaque retour de la blanche au-delà du trait est un boomerang rattrapé :
          l'élève ajoute un trait sur une feuille ou au tableau.
        challenge: >-
          Rattraper le boomerang trois fois de suite pour devenir lanceur
          confirmé.
      passes: 2
      src: S
    - id: e2
      ref: {block: retro, n: 2}
      diagram: entrainement-p27-e2
      title: Le boomerang sur le cadre
      weight: {children: 1, adults: 1}
      setup: La noire du schéma en haut près de la bande de gauche, la rouge plus bas ; la blanche posée sur son repère près du trait, en haut à droite de la rouge.
      instruction: Empocher la rouge dans la poche d'angle du bas à gauche en bille pleine, la queue appuyée sur le cadre, avec une attaque basse, de façon que la blanche recule au-delà du trait ; recommencer la même situation à chaque tir.
      expected: La rouge est empochée et la blanche revient en arrière sur sa ligne, au-delà du trait, pour pouvoir jouer la noire.
      mistakes:
        - symptom: La blanche ne recule pas, la queue reste trop à plat
          fix: Lever légèrement le talon de la queue pour l'incliner et attaquer plus bas.
        - symptom: La queue se relève brusquement après le contact
          fix: Détendre la main sur le talon de la queue.
      playful:
        hook: >-
          Le cadre est la rampe de lancement : on annonce « lancer » avant
          chaque tir, puis « retour » si la blanche passe le trait.
        challenge: >-
          Réussir deux lancers de suite depuis la rampe sans que la queue
          se relève.
      passes: 1
      src: S
    - id: e3
      ref: {block: retro, n: 3}
      diagram: entrainement-p28-e3
      title: Deux zones de retour
      weight: {children: 1, adults: 2}
      setup: "La rouge près de la poche d'angle du haut à gauche, les jaunes et la noire comme sur le schéma ; la blanche posée sur le trait. Le schéma ne délimite pas les zones, il n'en donne que les libellés : proposition à marquer au sol ou avec des repères, deux carrés d'une case de côté sur la ligne de retour de la blanche (de la rouge vers le trait et au-delà) ; la zone 1 centrée un peu avant le trait, la zone 2 centrée plus loin, au-delà du trait (repères du schéma : vers 1,3 ; 1,8 et vers 2,7 ; 3,3)."
      instruction: Empocher la rouge en bille pleine avec une attaque basse, de façon que la blanche recule trois fois dans la zone 1 et trois fois dans la zone 2, pour pouvoir jouer ensuite la noire.
      expected: La rouge est empochée et la blanche s'arrête dans la zone visée, trois fois dans chaque zone.
      mistakes:
        - symptom: La blanche dépasse la zone visée
          fix: Réduire un peu la vitesse tout en gardant l'attaque basse (lecture de la fiche n° 14, qui relie puissance et déviation ; la fiche ne donne pas de lien chiffré avec la distance).
        - symptom: La blanche s'arrête avant la zone
          fix: Jouer un peu plus vite sans changer la quantité de bille ni l'attaque basse.
        - symptom: La blanche ne revient pas du tout
          fix: Revenir à l'attaque sous le centre et vérifier que les billes ne sont pas trop éloignées.
      playful:
        hook: >-
          Deux cibles à boomerang : l'élève annonce « zone 1 » ou « zone 2 »
          avant de tirer, dans l'ordre qu'il veut.
        challenge: >-
          Atteindre la zone annoncée trois fois de suite pour décrocher
          un titre de lanceur précis.
      passes: 2
      src: S
game:
  title: Partie à difficulté réduite, avec rétro
  source_game: 14
  adapted: true
  players: "Adultes : partie à 2, avec la règle de lien (équerre) ; enfants : variante ludique à 4, en 2 équipes de deux (jetons boomerang)"
  materials: "Billes du jeu complet, quatre par groupe plus la noire. Pour la variante ludique enfants (proposition) : une feuille ou un tableau pour les jetons boomerang."
  setup_illustration: schema-jeu
  rules:
    - Jouer une partie avec les règles classiques.
    - Jouer avec seulement quatre billes de chaque groupe de couleur et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
  scoring: Comme dans une partie classique, le premier qui empoche son groupe de billes puis la noire gagne.
  end: Fin quand un joueur a vidé son groupe puis empoché la noire.
  playful_variant: "Variante enfants, autonome, jouée sans la règle de lien : les jetons boomerang, en 2 équipes de deux ; chaque équipe garde la main comme dans la partie classique (on continue tant qu'on empoche), l'autre partenaire jouant à la visite suivante. Un rétro annoncé avant le tir, dont la bille est empochée et dont la blanche s'immobilise plus près du tireur que du point de contact, donne un jeton boomerang ; l'équipe adverse juge. Avec trois jetons, l'équipe choisit une seule fois, pour un tir, la place de la blanche ; ses jetons sont alors remis à zéro. Les jetons ne comptent pas comme des billes : le seul avantage qu'ils donnent est cette place de la blanche, une exception facultative aux règles classiques."
  link_previous:
    notion_of: angle-droit-2
    rule: "Règle facultative, adultes seulement (les enfants jouent la variante), à jouer sans jeton boomerang, en exception aux règles classiques : une fois par joueur et par partie, avant son tir, on annonce « équerre » (bille à courte distance, attaque au centre, bille non pleine, les deux billes doivent partir à 90° l'une de l'autre) ; l'adversaire juge les 90° à l'œil. La réussite est simplement notée, sans effet sur la victoire."
    note: "Fait rejouer le coup à angle droit de la séance précédente à côté du rétro et oblige à choisir l'attaque (centre ou basse) ; règle facultative, réservée aux adultes et exclusive des jetons boomerang de la variante enfants : la partie se joue telle quelle sans elle. Une seule règle facultative par partie."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Version enfants : la variante ludique seule (jetons boomerang), sans la règle de lien. Mise en place proposée (la fiche ne la précise pas) : une équipe les rouges et l'autre les jaunes (chaque équipe tient le rôle d'un joueur de la partie à 2, ses deux partenaires jouant à tour de rôle), la noire sur son point de départ comme sur le schéma, le tirage à la bande pour commencer comme dans la partie classique, partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes."
    adults: "Version adultes : la règle de lien seule (équerre), sans jetons boomerang. Après la partie, compter les rétros annoncés et réussis, et les comparer au taux de l'exercice 1."
  src: Prop
review:
  prompts:
    - Dans quel rétro la blanche est-elle revenue exactement où tu voulais ?
    - Qu'est-ce qui change quand tu attaques plus bas ou plus vite ?
    - Que dirais-tu à un copain pour que la blanche recule ?
