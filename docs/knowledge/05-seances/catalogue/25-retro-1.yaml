# Séance du catalogue : « Le rétro », partie 1/4.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: retro-1
order: 25
technique: retro
part: 1
title: Le rétro
technical_sheets: [14]
previous: angle-droit-2
catalogue_block: retro
notion: Jouer un rétro, attaquer la blanche sous son centre pour la faire reculer après le contact.
theme:
  name: Le boomerang
  pitch: >-
    La blanche est un boomerang : on la lance sur la bille de couleur et,
    bien jouée, elle revient vers toi. Première étape : la faire revenir
    droit vers toi, puis choisir où elle s'arrête.
recall:
  points:
    - Le coup à angle droit se joue avec une attaque au centre de la blanche.
    - La quantité de bille est au choix, sauf la bille pleine.
    - Sans rotation à l'impact, les deux billes partent à 90° l'une de l'autre ; trop puissant, l'angle dépasse 90°.
    - "Aujourd'hui, on change d'attaque : en bas de la blanche, avec une rotation arrière, pour qu'elle recule au lieu de continuer."
  question:
    ask: Au coup à angle droit, où frappe-t-on la blanche et quel angle forment les deux billes ?
    answer: Au centre de la blanche ; les deux billes partent à 90° l'une de l'autre.
  reuse: {sheet: angle-droit-2, illustration: angle-90-bande}
  src: S
theory:
  sections:
    - id: attaque-basse
      title: Attaquer en bas
      weight: {children: 3, adults: 3}
      body:
        - Pour un rétro, le procédé frappe la blanche sous son centre.
        - "La blanche avance en tournant à l'envers : c'est la rotation arrière."
      adult_extra:
        - Avec l'attaque basse, le frottement du drap fait d'abord glisser la blanche, puis rouler vers l'avant ; l'impact doit avoir lieu tant que la rotation arrière est conservée.
      key_point: "Attaque basse : le procédé frappe sous le centre de la blanche."
      demo: "Montrer sur la blanche le point d'impact, sous le centre, puis jouer un rétro plein à courte distance."
      illustrations: [attaque-basse, contact-retro]
      src: S
    - id: plein-180
      title: En plein, la blanche revient
      weight: {children: 4, adults: 3}
      body:
        - En bille pleine, on vise le centre de la bille de couleur.
        - Après l'impact, la blanche recule et revient droit vers toi, par où elle est venue.
        - C'est une déviation de 180°.
        - Le coup doit avoir une certaine vitesse, pour que la blanche garde sa rotation arrière jusqu'à l'impact.
        - Les billes ne sont pas trop éloignées l'une de l'autre, pour que la rotation dure jusqu'au contact.
      adult_extra:
        - Entre le plein et la demi-bille, la blanche peut prendre de nombreuses déviations ; elles dépendent de la quantité de bille et de la puissance du coup.
      key_point: "Plein et attaque basse : la blanche revient droit vers toi."
      demo: "Jouer un rétro plein vers la poche et montrer où la blanche s'arrête ; le rejouer doucement, puis plus vite, et regarder si la blanche recule."
      illustrations: [visee-plein, retro-plein]
      src: S
    - id: cadre
      title: Sur le cadre, talon levé
      weight: {children: 1, adults: 1}
      body:
        - Quand la queue s'appuie sur le cadre, on lève légèrement le talon de la queue pour l'incliner.
        - Cela permet d'attaquer bas.
        - Si la queue se relève en fin de coup, la main serre trop fort le talon.
      key_point: Sur le cadre, talon légèrement levé et main détendue.
      demo: "Poser la queue sur le cadre, lever légèrement le talon et montrer sur la blanche le point d'impact, sous le centre."
      illustrations: [talon-leve]
      src: S
    - id: limite
      title: "La limite : la demi-bille"
      weight: {adults: 2}
      body:
        - "Proche du demi-bille, le recul de la blanche donne une déviation de 90° par rapport à sa trajectoire d'arrivée : elle repart parallèlement à la grande bande, c'est la limite du rétro."
        - Sous la demi-bille, la blanche ne recule plus, ce n'est plus un rétro.
        - Au Blackball, la blanche étant petite, il faut viser un peu plus à l'intérieur de la bille de couleur pour obtenir 90°.
      key_point: "Plein : 180°. Proche du demi-bille, un peu plus plein : 90°, c'est la limite."
      demo: null
      illustrations: [quantites, schema-retro-demi]
      src: S
    - id: regler-retour
      title: Régler le retour
      weight: {adults: 1}
      body:
        - Pour régler où la blanche s'arrête, on peut ajuster la vitesse en gardant l'attaque basse.
        - La fiche relie la puissance et la déviation de la blanche ; ce lien avec la distance de retour est une lecture de la séance.
      key_point: On garde l'attaque basse quand on ralentit.
      demo: "Jouer le même rétro plein à deux vitesses et comparer où la blanche s'arrête."
      illustrations: [retro-plein]
      src: Prop
    - id: mot-boomerang
      title: Le boomerang
      weight: {children: 1}
      body:
        - Un boomerang revient vers celui qui l'a lancé.
        - En rétro, c'est la blanche qui revient.
      key_point: En rétro, la blanche revient comme un boomerang.
      demo: null
      illustrations: [retro-plein]
      src: Prop
