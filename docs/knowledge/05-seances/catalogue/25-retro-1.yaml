    goal: "Empocher 2 billes en rétro, en bille pleine, en faisant reculer la blanche au-delà du trait, avec un chevalet sur la surface de jeu et un chevalet sur cadre."
    expected: La bille est empochée en plein et la blanche recule au-delà du trait.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation
    src: S
