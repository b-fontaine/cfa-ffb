uncertainties:
  - "Jeu : la source ne propose aucun jeu spécifique au rétro ; le jeu 14 est repris et adapté (annonce de la zone, jetons, règle de lien) : [Prop], à valider par un animateur dans l'application."
  - "Thème, défis ludiques, variante de jeu (binômes, œil du boomerang, décalage de la blanche), règle de lien, adaptations, poids et minutes : [Prop]. `theme.name` et `notion` sont ceux de retro-1 et retro-2 ; la variante de jeu diffère de celle de retro-2 (V23). L'annonce de la zone n'est que dans `link_previous` (facultative) : `rules`, `scoring` et `end` sont ceux du jeu 14."
  - "Théorie : les deux sections sont [Prop] (badge « Proposition »). L'idée de décider la zone avant le tir est tirée des énoncés des exercices 7 et 8 ; la source ne la formule pas telle quelle. Cette séance garde la section (exercices 7 et 8) ; la section voisine de retro-4 (« Choisir la zone avant de tirer », actuellement S) devrait passer en [Prop] ou être retirée. Rappel : la quantité est donnée par la place des billes ; la puissance est le levier principal pour changer de zone (lecture du schéma, [Prop])."
  - "Exercice 7 : le schéma [S] ne trace pas les zones (deux étiquettes seulement : zone 1 vers x ≈ 3,0 et zone 2 vers x ≈ 1,6, à gauche du trait) et la flèche de la blanche s'arrête à x ≈ 2,1, à droite du trait. La mise en place (zone 1 proche de la rouge, zone 2 plus reculée près du trait) est une proposition de l'animateur, [Prop]. Le trait est lu vers x ≈ 1,8 ; le type de chevalet n'est pas précisé. La rouge est replacée sous la poche après chaque tir (une seule rouge sur le schéma pour six tirs)."
  - "Exercice 8 : la quantité de bille de l'encart (demi-bille environ) est estimée d'après le recouvrement, non légendée ; la fin de la flèche de la blanche est approximative."
  - "Erreurs fréquentes : les corrections introduites par « conseil d'animateur » (exercice 7 : main desserrée et queue à plat, modification de la puissance un seul réglage à la fois ; exercice 8 : queue à plat, retour à la visée de la rouge) ne sont pas dans la fiche : ce sont des conseils pédagogiques [Prop], destinés à l'animateur et non attribués à la source."
  - "Illustrations indicatives, [Prop] : retro-trois-quarts est redessinée avec une coupe d'environ 14,5° (trois-quarts) ; les deux trajets de retour (écarts d'environ 16° et 31° par rapport à la verticale, vers la gauche) sont d'ordre de grandeur, non mesurés ; un retour plausible est ouvert d'au moins 20° dès que la blanche recule peu, et le schéma ne prétend pas ramener la blanche sur son axe d'arrivée. retro-demi reprend le schéma de l'exercice 8 (coupe d'environ 27°, proche du demi-bille) : la fiche demande de viser un peu plus plein au Blackball pour obtenir 90°. La correspondance exacte entre puissance et déviation n'est pas donnée par la source."
