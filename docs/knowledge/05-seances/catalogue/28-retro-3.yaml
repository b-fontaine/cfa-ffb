training:
  exercises:
    - id: e7
      ref: {block: retro, n: 7}
      diagram: entrainement-p30-e7
      title: Deux zones de retour
      weight: {children: 2, adults: 1}
      setup: La noire, la rouge et les jaunes comme sur le schéma ; la rouge est juste sous la poche du milieu du haut et replacée là après chaque tir ; la blanche sur son repère, en bas à droite de la rouge. Le schéma ne trace pas les zones ; proposition de l'animateur, à repérer sur la table, une zone proche de la rouge (zone 1) et une zone plus reculée, près du trait tracé (zone 2).
      instruction: Empocher la rouge en rétro vers la poche du milieu du haut, en faisant revenir la blanche trois fois en zone 1 puis trois fois en zone 2, pour pouvoir jouer ensuite la noire ; six tirs en tout.
      expected: La rouge est empochée et la blanche recule vers la zone annoncée avant le tir ; la quantité est donnée par la place des billes, et c'est surtout la puissance qui change d'une zone à l'autre.
      mistakes:
        - symptom: La blanche ne recule pas
          fix: Attaquer plus bas sur la blanche et jouer assez vite.
        - symptom: La queue se relève en fin de coup
          fix: "Conseil d'animateur : desserrer la main et garder la queue à plat jusqu'à la fin du geste."
        - symptom: La blanche revient dans la mauvaise zone
          fix: "Conseil d'animateur : modifier la puissance (la quantité vient de la place des billes), un seul réglage à la fois."
      playful:
        hook: >-
          Chaque tir est un lancer de boomerang : l'élève annonce « zone 1 »
          ou « zone 2 » avant de lancer.
        challenge: >-
          Pour la médaille du lanceur : trois tirs de suite sans faute, la
          rouge empochée et la blanche dans la zone annoncée, pendant que
          le binôme juge l'arrivée.
      passes: 1
      src: S
    - id: e8
      ref: {block: retro, n: 8}
      diagram: entrainement-p30-e8
      title: Passer le trait en reculant
      weight: {children: 1, adults: 1}
      setup: La rouge juste sous la poche du milieu du haut ; la jaune du schéma posée contre le trait tracé, l'autre jaune à droite du trait, à gauche de la rouge et plus bas ; la noire près de la bande de gauche ; la blanche sur son repère, en bas à droite de la rouge.
      instruction: Empocher la rouge en rétro, en quantité proche du demi-bille, de façon que la blanche recule et s'arrête au-delà du trait, pour jouer ensuite la noire ; cinq tirs.
      expected: La rouge est empochée et la blanche s'arrête au-delà du trait, bien placée pour la noire.
      mistakes:
        - symptom: La blanche s'arrête avant le trait
          fix: "Attaquer plus bas, ou jouer un peu plus franc ; conseil d'animateur : vérifier que la queue reste à plat."
        - symptom: La rouge manque la poche quand on cherche à faire reculer la blanche
          fix: "Conseil d'animateur : revenir d'abord à la visée de la rouge ; la hauteur d'attaque règle ensuite le recul."
      playful:
        hook: >-
          Le trait est la ligne d'arrivée du boomerang : chaque passage vaut
          un tampon sur la carte de l'élève.
        challenge: >-
          Faire passer la ligne au boomerang trois fois de suite pour
          gagner le titre de maître lanceur.
      passes: 2
      src: S
game:
  title: Partie à difficulté réduite, avec rétro
  source_game: 14
  adapted: true
  players: Partie à 2, ou à 4 en binômes pour la variante ludique
  materials: "Billes du jeu complet, quatre par groupe plus la noire. Pour la règle de lien et la variante ludique (propositions) : des jetons ou un tableau."
  setup_illustration: schema-jeu
  rules:
    - Jouer une partie avec les règles classiques, avec seulement quatre billes de chaque groupe de couleur et la noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
  scoring: Comme dans une partie classique, le premier qui empoche son groupe de billes puis la noire gagne.
  end: Fin quand un joueur a vidé son groupe puis empoché la noire.
  playful_variant: "Les binômes du boomerang, à 4 joueurs en deux équipes de deux : les partenaires jouent à tour de rôle, et celui qui ne tire pas est « l'œil du boomerang » : il aide à voir si la blanche est bien arrivée dans la zone annoncée, mais c'est l'adversaire qui tranche, comme dans la règle de lien. Les jetons sont ceux de la règle de lien (un seul décompte) ; ils n'ajoutent rien à la victoire. L'équipe qui atteint trois jetons gagne un tampon sur sa carte, sans effet sur la partie."
  link_previous:
    notion_of: retro-2
    rule: "Exception facultative aux règles classiques : le joueur qui vient d'empocher une bille peut annoncer un rétro, avec sa bille, sa poche et la zone ou le trait imaginaire que la blanche doit atteindre en reculant, comme aux exercices 7 et 8 ; c'est lui qui désigne la zone, et son adversaire juge l'arrivée. S'il empoche la bille et que la blanche atteint la zone ou passe le trait annoncé, il marque un jeton. Ce jeton est le seul décompte ; il n'ajoute rien à la victoire de la partie."
    note: "Rejoue le rétro de la séance précédente (attaque basse, puissance réglée pour le recul) et y ajoute l'annonce d'une destination ; la quantité de bille vient de la position de la bille, elle ne se choisit pas : on tente de préférence un rétro quand elle est proche du trois-quarts ou du demi-bille, comme aux exercices 7 et 8. Règle facultative, la partie se joue telle quelle sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche et les billes des poches. Mise en place proposée : un joueur les rouges et l'autre les jaunes, partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes. Pour les enfants, un tirage au sort (pile ou face) remplace le tirage à la bande."
    adults: "Après la partie, compter les rétros annoncés et ceux où la blanche a atteint la zone annoncée. Variante plus difficile : annoncer aussi la quantité de bille (trois-quarts ou proche du demi) avant le tir."
  src: Prop
review:
  prompts:
    - Dans quel rétro la blanche est-elle revenue où tu le voulais ?
    - Qu'est-ce qui change quand tu joues plus plein ou plus doux ?
    - Que dirais-tu à un copain pour faire reculer la blanche sans manquer la bille ?
