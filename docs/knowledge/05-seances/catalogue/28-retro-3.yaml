catalogue_block: retro
notion: Jouer un rétro, attaquer la blanche sous son centre pour la faire reculer après le contact.
theme:
  name: Le boomerang
  pitch: >-
    La blanche est un boomerang : elle part, touche la bille de couleur, puis
    revient. Cette fois, tu choisis où elle retombe : dans une zone, ou
    au-delà d'une ligne tracée sur la table.
recall:
  points:
    - Entre le plein et le demi-bille, la direction de la blanche dépend de la quantité de bille et de la puissance.
    - En bille pleine, la blanche revient sur sa trajectoire d'arrivée, à 180°.
    - En trois-quarts, une légère différence de quantité de bille ou de puissance change le retour de la blanche.
    - Le coup doit être assez rapide, et la queue ne se relève pas en fin de coup.
  question:
    ask: De quoi dépend la direction de la blanche entre le plein et le demi-bille ?
    answer: De la quantité de bille et de la puissance du coup.
  reuse: {sheet: retro-2, illustration: bande-quantites}
  src: S
theory:
  sections:
    - id: zone-arrivee
      title: Décider où la blanche s'arrête
      weight: {children: 2, adults: 2}
      body:
        - Avant de tirer, on décide où la blanche doit s'arrêter, pour jouer ensuite la noire.
        - Cet endroit peut être une zone proche de la rouge, ou une zone plus reculée, au-delà d'un trait.
        - Pour la même rouge et la même poche, c'est surtout la puissance qui change l'endroit ; la quantité de bille vient de la place des billes.
      adult_extra:
        - Partir de la zone visée pour régler la puissance, levier principal ; la quantité de bille est donnée par la place des billes et ne varie que légèrement. Ne changer qu'un seul réglage à la fois, pour savoir lequel a fait la différence.
      key_point: On choisit où la blanche s'arrête avant de tirer.
      demo: null
      illustrations: [schema-e7, schema-e8]
      src: Prop
    - id: deux-arrivees
      title: Deux rétros, deux arrivées
      weight: {children: 1, adults: 1}
      body:
        - Même rouge, même poche, deux rétros.
        - En trois-quarts, la blanche recule plus ou moins ouverte selon la puissance du coup.
        - En quantité proche du demi-bille, un peu plus pleine, elle repart à peu près à angle droit.
      key_point: Quantité et puissance changent l'arrivée de la blanche.
      demo: "Jouer deux rétros depuis la même place, l'un en trois-quarts, l'autre proche du demi-bille un peu plus plein, et marquer où la blanche s'arrête."
      illustrations: [retro-trois-quarts, retro-demi]
      src: Prop
