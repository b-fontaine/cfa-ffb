uncertainties:
  - "Les exercices 1 et 2 appartiennent au bloc `posture` [Prop] : taux, consignes et mise en place sont des propositions adaptées des initiations 1 et 2 [S], à valider par un animateur dans l'application."
  - "L'initiation 1 et l'exercice 1 reprennent la même mise en place : l'initiation sert à laisser essayer sans corriger (conseil de la fiche), l'exercice est noté et porte les points de contrôle. Le bloc [Prop] ne remplace pas l'initiation."
  - "Le jeu 1 [S] ne fixe pas le décompte entre les deux joueurs, le nombre de manches ni si la blanche est posée une fois ou avant chaque tir : tentatives, égalité acceptée, pose de la blanche, liste de fautes, binômes, relais et rotations sont des propositions (playful_variant, adaptation) ; la variante enfants ne garde qu'une mécanique (trois tentatives, plus longue série) et les étoiles ne servent que dans les exercices 1 et 2. La fiche ne définit pas non plus la « faute »."
  - "Accueil (règles de conduite, matériel), section gauchers et section « Où la queue touche la blanche » (adultes) : propositions, la fiche ne les traite pas. La notion de point de contact (côté de la bille opposé à la poche) a été retirée de la séance 1 le 2026-10-15 : elle relève de la fiche n° 3 (bille fantôme) et alourdissait la première séance (audit)."
  - "La séance n'enseigne pas la différence de taille des billes (quart de bille, rétro 90°, contact au-dessus de l'équateur : séances ultérieures, où elle est sourcée [S], voir 06-dimensions-du-materiel.md § 1)."
  - "La fiche technique n° 1 conseille une première séance courte sur la posture (risque de rejet) : la durée de 90 ou 120 min est une contrainte de projet ; le poids de l'initiation et du jeu est relevé pour limiter l'explication. Pour les enfants, le chevalet main à plat (page 9) n'est qu'une phrase de la section « Premier chevalet » (loin de la bande, main à plat), montrée au moment de l'exercice 2 ; cet ajout enfants (ligne de la section « Premier chevalet », `src: S`) est [Prop] : seule la phrase de la fiche p. 9 est [S] ; le détail du geste reste réservé aux adultes."
  - "Le joueur est un pictogramme neutre généré (type `player_figure`) : les proportions sont des propositions [Prop] (révisées le 2026-10-15 : buste penché, menton près de la queue, blanche près de la bande sur le cadre) et les billes y sont agrandies, la fiche n° 1 ne donne que des photos. L'avant-bras vertical se lit de profil (`posture-personnage`), que la vue de dessus ne montre pas ; le renvoi à la page 6 de la fiche reste proposé. Les trois places de la tête (`tete-cas-1` à `tete-cas-3`) sont trois illustrations, une par cas ; `posture-gaucher` est la figure droitière en miroir [Prop]."
  - "Initiation 1 : le PDF dit « 4 billes » alors que trois billes sont dessinées (la jaune du milieu est jouée deux fois) ; lecture du schéma reprise dans le diagramme transcrit, la consigne de replacer la jaune avant le troisième tir, comme celles de poser la blanche sur l'emplacement suivant et de replacer une bille non empochée, n'est pas dans la fiche : elle figure seulement dans l'exercice 1 [Prop] (le diagramme de proposition l'indique), pas dans le texte [S] de l'initiation."
  - "Exercice 1 : avec les billes au ras de la bande devant leur poche, une bille visée en son centre entre dans la poche (coupes théoriques de 16° à 37°) ; la séance 1 ne demande que l'alignement queue, blanche, bille visée."
  - "Note animateur : le schéma d'initiation 1 [S] place le procédé légèrement au-dessus du centre (`upper_center`) ; la séance enseigne le centre, attaque de référence du niveau 1 (décision [U] du 2026-10-15), sans le dire aux élèves."
  - "Le type de chevalet de l'exercice 2 (sur la surface) vient du catalogue [Prop] ; la fiche d'initiation 2 dit seulement « adapter le chevalet »."
  - "Le nom du thème « Le tireur d'élite » est conservé (identique dans posture-2, règle V23) ; l'image est adoucie dans le pitch. Le glossaire (07-glossaire.md) définit flèche et procédé ; la séance les glose en une parenthèse pour les enfants."
