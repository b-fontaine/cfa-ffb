training:
  exercises:
    - id: e1
      ref: {block: posture, n: 1}
      diagram: proposition-p01-e1
      title: Les quatre emplacements
      weight: {children: 1, adults: 1}
      setup: "La rouge de gauche, la jaune du milieu et la rouge de droite au ras de la bande du haut, chacune devant sa poche ; la blanche sur le premier des quatre emplacements du schéma, à gauche."
      instruction: "Jouer un tir depuis chaque emplacement, de gauche à droite : la rouge de gauche, la jaune du milieu (deux tirs), puis la rouge de droite. Avant chaque tir, aligner la queue, la blanche et la bille visée, puis rester immobile jusqu'à la fin du geste. Replacer la jaune sur sa mise en place avant le tir du troisième emplacement et poser la blanche sur l'emplacement suivant. Si la bille n'est pas empochée ou si la blanche est empochée, replacer et passer au tir suivant, sans commentaire."
      expected: "Queue, blanche et bille visée alignées ; le corps ne bouge pas avant que la blanche ait touché la bille ; la bille part vers sa poche."
      mistakes:
        - {symptom: L'élève se relève avant la fin du tir, fix: "Lui demander de garder la tête sur la queue jusqu'à ce que la bille soit touchée."}
        - {symptom: "La bille touche la bande ou le bord de la poche sans entrer : la queue n'est pas restée sur la ligne choisie", fix: "Lui faire poser la queue sur la ligne blanche-bille visée, puis vérifier depuis derrière qu'elle y reste jusqu'à la fin du geste."}
        - {symptom: Les pieds sont trop serrés ou la main droite n'est pas au-dessus du pied droit, fix: "Reprendre les points de contrôle : écartement des pieds, puis main droite à l'aplomb du pied droit ; une seule correction à la fois."}
      playful:
        hook: "Avant de tirer, annoncer à voix haute « queue, blanche, bille » ; chaque tir où la bille est empochée et où le corps reste immobile rapporte une étoile au tableau."
        challenge: "Gagner le plus d'étoiles possible ; l'animateur valide chaque étoile, le binôme observe et encourage sans corriger."
      passes: 2
      src: Prop
    - id: e2
      ref: {block: posture, n: 2}
      diagram: proposition-p01-e2
      title: La croix du tireur
      weight: {children: 1, adults: 1}
      setup: "La blanche au centre de la ligne de départ, sur le repère du schéma ; une cible près de chacune de ces poches : le coin haut gauche, le milieu du haut, le coin bas gauche et le milieu du bas."
      instruction: "Empocher chaque cible à tour de rôle depuis la même position, en replaçant la blanche au centre après chaque tir ; garder le même placement des pieds et de la main d'un tir à l'autre. La blanche est loin de la bande : la main se pose à plat sur la surface de jeu."
      expected: "La position de départ est la même pour les quatre tirs ; l'alignement est refait à chaque tir ; le corps reste immobile jusqu'à la fin du geste."
      mistakes:
        - {symptom: L'élève change de placement d'un tir à l'autre, fix: "Lui faire marquer ses pieds au sol avec un ruban de marquage, puis comparer au tir suivant."}
        - {symptom: La queue n'est pas alignée avec la trajectoire de la blanche, fix: "Contrôler la ligne queue-blanche-bille visée en se plaçant derrière l'élève, sans le toucher."}
      playful:
        hook: "Une étoile par tir : la bille empochée et le corps immobile jusqu'à la fin du geste ; l'animateur passe de table en table pour valider."
        challenge: "Réussir les quatre cibles de la croix en gardant exactement la même position, soit quatre étoiles : l'étoile compte pour le score du binôme ; échanger les rôles après chaque cible, le binôme observe sans corriger."
      passes: 1
      src: Prop
game:
  title: Série de 6 billes en bord de poche
  source_game: 1
  adapted: false
  players: Défi à 2
  materials: "Billes de couleur du jeu. Pour le défi ludique (proposition) : un tableau pour noter les séries."
  setup_illustration: schema-jeu
  rules:
    - Les billes de couleur sont placées près des poches, une devant chacune des six poches.
    - Le joueur en contrôle place librement la blanche sur la surface de jeu.
    - Il doit réaliser une série de 6 billes d'affilée.
    - "S'il manque une bille ou commet une faute, on replace toutes les billes et la main passe à l'adversaire, qui tente la série à son tour."
  scoring: "On compte les billes empochées d'affilée à chaque tentative ; la série est réussie à 6 billes. La fiche ne précise pas de décompte entre les deux joueurs : convenir avant de jouer."
  end: "Fin quand la série de 6 billes est réalisée ; la fiche ne fixe pas de nombre de manches."
  playful_variant: >-
    Proposition, version enfants, jouable seule (sans règle de lien : la
    séance 1 n'en a pas) : on vise une série de N billes d'affilée, N étant le
    nombre annoncé avant de jouer (trois pour commencer, voir l'adaptation).
    Une seule mécanique : chaque joueur a trois tentatives et sa plus longue
    série est retenue ; la plus longue série gagne, et une égalité est
    acceptée. La partie s'arrête après les trois tentatives de chacun, ou à la
    fin du temps de jeu, même si personne n'a réalisé N billes. Facultatifs
    pour les enfants : allonger N, le relais et la rotation des tables (voir
    l'adaptation) ; il n'y a ni étoile ni annonce dans ce jeu. Une seule règle
    facultative par partie.
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Proposition : viser une série de trois billes au lieu de six, puis l'allonger d'une bille dès que tous la réussissent ; la fiche ne dit pas si la blanche est posée une seule fois pour la série ou avant chaque tir : annoncer avant de jouer que, pour ce jeu, elle est posée librement avant chaque tir. Rappeler les fautes courantes : blanche empochée, blanche qui ne touche aucune bille de couleur, bille sortie de la table. Jouer en relais, un joueur à la table et les autres qui regardent ; changer de table ou de binôme toutes les cinq minutes pour que chacun tire souvent."
    adults: "Proposition : mêmes réglages que pour les enfants (série de trois billes, blanche posée avant chaque tir, fautes rappelées), sans la variante ludique des enfants (aucune règle facultative pour les adultes), car le public adulte est aussi débutant ; ne durcir qu'après un résultat observé, par exemple une série de trois réussie facilement, avec le jeu 2 de la fiche [S] (billes à un espace de bille des poches). Après la série, chaque joueur nomme le point de posture qui lui a fait manquer."
  src: S   # titre, règles, score et fin du jeu 1 ; playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Quels trois éléments aligne-t-on avant de tirer ?
    - Où est ton pied droit quand tu tiens la queue ?
    - Quel tir as-tu le mieux réussi, et pourquoi ?
