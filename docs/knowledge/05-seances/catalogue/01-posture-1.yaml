# Séance du catalogue : « Posture, visée et coup de queue », partie 1/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: posture-1
order: 1
technique: posture
part: 1
title: Posture, visée et coup de queue
technical_sheets: [1]
previous: null
catalogue_block: posture
notion: Aligner la queue, la blanche et la cible avant de tirer, puis se placer de façon stable autour de cette ligne.
theme:
  name: Le tireur d'élite
  pitch: >-
    Un tireur d'élite ne bouge pas avant d'avoir bien visé. Ici, la queue est
    l'outil de précision : chaque bille empochée sans bouger avant la fin du
    geste rapporte une étoile.
recall:
  # Première séance : pas de rappel, mais l'accueil (règles de conduite, matériel).
  points:
    - "Aujourd'hui, on découvre comment viser et se placer."
    - "Pas de posture parfaite : on essaie d'abord, puis on corrige une seule chose à la fois."
    - "Autour de la table, rester à l'écart du joueur qui tire et ne pas toucher aux billes des autres."
    - "Matériel : des queues à partager entre les tables, de la craie de billard, du ruban de marquage au sol, les billes du jeu et un tableau."
  question:
    ask: Qu'as-tu déjà vu faire à un joueur de billard avant de tirer ?
    answer: "Réponses libres : il regarde la table, se penche, pose sa main, vise, puis tire. On retient « il vise avant de tirer »."
  src: Prop
theory:
  sections:
    - id: viser
      title: "Viser : tout s'aligne"
      weight: {children: 3, adults: 3}
      body:
        - Viser, c'est contrôler que la queue, la blanche et le point cible sont alignés.
        - "Le point cible est l'endroit où l'on veut envoyer la blanche."
        - On choisit l'axe de visée avant de se mettre en position de jeu.
        - "La queue est placée sur la trajectoire que la blanche doit suivre, en passant par son centre."
      adult_extra:
        - "Séquence du regard : repérer où se trouve le procédé (l'embout de la queue) sur la blanche, alterner entre le procédé et le point visé, puis fixer l'endroit précis où projeter la blanche."
      key_point: "Queue, blanche, point cible : trois éléments sur une même ligne."
      demo: "Poser la queue sur la ligne blanche-point cible avant de se mettre en position, puis s'installer autour d'elle. Aujourd'hui, le point cible est la bille à empocher."
      illustrations: []
      src: S
    - id: posture
      title: "Se placer : stable et à l'aise"
      weight: {children: 3, adults: 3}
      body:
        - Les pieds ne sont ni trop serrés ni trop espacés.
        - "Le pied droit est sous la main droite qui tient la queue (pour un droitier)."
        - "L'avant-bras droit reste vertical : il se balance comme un balancier."
      adult_extra:
        - "Pour l'aisance du balancier, pivoter légèrement le bassin à gauche, jambe droite tendue et gauche fléchie, ou avancer la jambe gauche, les deux jambes fléchies."
      key_point: Pieds stables, pied droit sous la main droite, avant-bras vertical.
      demo: "Se placer devant la table et montrer de profil l'avant-bras vertical ; ne pas imposer une attitude très précise, elle s'acquiert avec le temps."
      illustrations: [posture-personnage, posture-dessus, posture-profil]
      src: S
    - id: gauchers
      title: "Et pour un gaucher ?"
      weight: {children: 1, adults: 1}
      body:
        - "Tout se lit à l'envers : le pied gauche est sous la main gauche, et c'est l'avant-bras gauche qui reste vertical."
      key_point: Un gaucher inverse la droite et la gauche.
      demo: null
      illustrations: [posture-gaucher]
      src: Prop
    - id: oeil
      title: "Où poser la tête : l'œil directeur"
      weight: {adults: 2}
      body:
        - "Trois cas se rencontrent : l'œil droit au-dessus de la queue, la queue entre les deux yeux, ou l'œil gauche au-dessus de la queue."
        - "Test : deux yeux ouverts, pointer un objet à 5 m avec le doigt, puis fermer l'œil gauche ; si le doigt pointe toujours l'objet, l'œil droit est directeur, sinon c'est le gauche."
      key_point: Connaître l'œil directeur évite de corriger la tête inutilement.
      demo: "Faire le test de l'œil directeur avec un élève."
      illustrations: [tete-cas-1, tete-cas-2, tete-cas-3]
      src: S
    - id: cadre
      title: "Premier chevalet : sur le cadre"
      weight: {children: 2, adults: 3}
      body:
        - "Pour les premiers tirs, la main s'appuie sur le cadre : il sert de support naturel."
        - "Pouce et majeur le long de la flèche (la partie de la queue entre le bout et le chevalet), index par-dessus."
        - Peu de flèche, tête un peu relevée.
        - "Quand la blanche est loin de la bande, la main se pose à plat sur la surface de jeu, doigts écartés ; l'animateur le montre au moment de l'exercice 2."
      adult_extra:
        - "Quand la blanche est loin de la bande, chevalet main à plat : toute la main sur la surface de jeu, doigts écartés, pouce relevé et collé à l'index, intérieur de la main légèrement relevé, tête au plus près de la queue."
      key_point: "Premiers tirs : la main s'appuie sur le cadre."
      demo: "Former le chevalet sur le cadre et laisser chacun le reproduire ; avec des adultes, montrer ensuite la main à plat."
      illustrations: [chevalet-cadre-ref, chevalet-plat-ref]
      src: S
    - id: attaque
      title: "Où la queue touche la blanche"
      weight: {adults: 1}
      body:
        - "Le procédé frappe la blanche en son centre : la cible montre où il touche."
        - "La queue reste presque à l'horizontale."
      key_point: "Procédé au centre de la blanche, queue presque à l'horizontale."
      demo: null
      illustrations: [pointe-centre]
      src: Prop
