    initiation_sheet: 1
    title: Les quatre tirs, pour essayer
    weight: {children: 4, adults: 3}
    setup: "Une rouge dans le coin haut gauche, une jaune devant la poche du milieu du haut, une rouge dans le coin haut droit ; quatre emplacements pour la blanche en bas de la table, du plus à gauche au plus à droite."
    goal: "Empocher 4 billes avec un chevalet sur cadre : un tir depuis chacun des quatre emplacements du schéma (la jaune du milieu est jouée deux fois)."
    expected: "Les quatre tirs sont joués ; l'animateur laisse d'abord essayer et ne corrige pas si la blanche est empochée."
    scoring: {mode: counter, of: 4}
    illustration: schema-initiation
    src: S
