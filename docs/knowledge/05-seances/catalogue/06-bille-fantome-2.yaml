training:
  exercises:
    - id: e3
      ref: {block: bille-fantome, n: 3}
      diagram: proposition-p02-e3
      title: Plein puis demi, fantôme imaginée
      weight: {children: 2, adults: 1}
      setup: La blanche sur le repère A pour la première série, puis sur le repère B pour la seconde ; les billes du schéma, chacune devant sa poche. La bille fantôme n'est pas posée.
      instruction: "Série A : empocher en plein les billes alignées avec leur poche. Série B : empocher en demi-bille les billes décalées. Avant chaque tir, montrer du doigt où serait la bille fantôme."
      expected: Le contact est plein en série A et en demi en série B ; la place montrée du doigt est celle où la blanche touche la bille de couleur.
      mistakes:
        - {symptom: "L'élève vise le centre de la bille de couleur en série B", fix: "Poser une blanche à la place de la fantôme, aligner la queue, la retirer, puis tirer."}
        - {symptom: "La bille de couleur passe à côté de la poche en demi-bille", fix: "Faire montrer la fantôme du doigt avant de tirer et vérifier avec une blanche posée."}
      playful:
        hook: "Le chasseur annonce sa cible, « fantôme ici ! », en désignant la place du doigt."
        challenge: "Gagner un point pour la fantôme bien placée et un point pour la bille empochée."
      passes: 2
      src: Prop
    - id: e4
      ref: {block: bille-fantome, n: 4}
      diagram: proposition-p02-e4
      title: Une seule place pour la blanche
      weight: {children: 1, adults: 1}
      setup: "La blanche posée sur son repère du schéma, toujours le même ; les billes du schéma réparties à droite, chacune avec sa poche. Les cercles creux du schéma marquent la bille fantôme : c'est le corrigé de l'animateur, l'élève ne le regarde pas avant d'avoir montré sa place."
      instruction: Pour chaque bille, montrer du doigt la place de la bille fantôme, puis tirer une seule fois ; replacer la blanche et les billes non empochées avant le tir suivant.
      expected: La blanche part toujours du même repère ; la fantôme est plus ou moins décalée selon la bille ; la bille de couleur part vers sa poche.
      mistakes:
        - {symptom: "Toutes les billes sont visées de la même façon", fix: "Demander où est la fantôme pour chaque bille ; elle change de côté et de décalage."}
        - {symptom: "La bille de couleur frôle la poche sans y entrer", fix: "Poser une blanche pour montrer la fantôme, puis la retirer et rejouer le tir."}
      playful:
        hook: Un chasseur tire, son binôme pose une blanche où il pense que la fantôme se cache, puis la retire.
        challenge: Faire tomber les premières billes d'affilée sans que le binôme ait à corriger la place de la fantôme.
      passes: 1
      src: Prop
game:
  title: Duel de la bille fantôme
  source_game: 10
  adapted: true
  players: Duel à 2, un joueur les rouges et l'autre les jaunes
  materials: "Les billes du schéma du jeu 10 (rouges et jaunes), la blanche, une seconde blanche ou un repère pour la fantôme (règle de lien) ; des jetons pour la variante."
  setup_illustration: schema-jeu
  rules:
    - "D'après le jeu 10 [S] : une seule bille par tir, la blanche part toujours du même point d'origine, une bille non empochée est replacée."
    - "Écart proposé [Prop] : le jeu 10 est un défi seul ; ici, un duel, un joueur les rouges, l'autre les jaunes, et chacun joue une bille de sa couleur à son tour. Un tirage au sort désigne qui commence."
    - "Chaque bille de sa couleur n'est jouée qu'une seule fois : une bille non empochée est replacée sur la table mais ne se rejoue pas. Seule la bille annoncée compte ; toute autre bille empochée sur le même tir est replacée."
    - Avant de tirer, le joueur annonce la poche et montre du doigt où serait la bille fantôme.
    - "Faute : blanche empochée, aucune bille touchée, ou bille adverse touchée en premier. Le tir ne compte pas, la bille jouée est replacée et le tour passe."
    - La blanche revient à son point d'origine après chaque tir ; une bille de l'adversaire empochée est replacée, ne compte pour personne, et le tour passe comme après tout tir.
  scoring: Un point par bille de sa couleur annoncée puis empochée.
  end: "Fin quand chacun a joué une fois chacune de ses 7 billes, soit 7 tirs chacun ; le plus de points gagne. Égalité : partie nulle (sauf si la variante est jouée : voir ci-dessous)."
  playful_variant: "Le pari du tireur : l'animateur donne trois jetons à chaque joueur ; avant son tir, le tireur mise un jeton sur son propre tir ; si la bille est empochée, il le garde et en gagne un second, sinon il le perd ; sans jeton, il tire sans miser. Exception aux règles du duel : si les points sont égaux à la fin, le joueur qui a le plus de jetons gagne ; à jetons égaux, la partie est nulle."
  link_previous:
    notion_of: bille-fantome-1
    rule: "Exception facultative aux règles du duel : après avoir montré du doigt la place de la bille fantôme, le joueur la fait vérifier ; l'adversaire pose la seconde blanche (ou le repère) à la place montrée, puis la retire avant le tir ; si la place est fausse, le joueur la corrige avant de tirer. Nouveauté de cette séance [Prop] : à la séance précédente, c'était l'animateur ou un 3e joueur qui posait la fantôme."
    note: "Rejoue la bille fantôme posée puis retirée de la séance précédente, pour contrôler la fantôme imaginée ; règle facultative, le duel se joue tel quel sans elle."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche des billes et ne garder que 4 billes par joueur, les plus proches de leur poche, soit 4 tours chacun ; l'animateur pose la fantôme en cas de doute."
    adults: "Nommer aussi la quantité (plein, demi ou entre les deux) avant chaque tir, puis comparer les annonces aux résultats : sur quelles billes la fantôme est-elle la moins bien placée ?"
  src: Prop
review:
  prompts:
    - Où se cachait la bille fantôme sur la bille que tu as le mieux réussie ?
    - Pour une bille alignée avec la poche et pour une bille décalée, la bille fantôme était-elle à la même place ?
    - Comment expliquerais-tu à un copain où placer la bille fantôme ?
sources:
  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 13, note: "Fiche technique n° 3 (viser pour empocher, bille fantôme, entre le plein et le demi-bille)"}
  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 14, note: "Fiche technique n° 4 (bille pleine : la couleur suit la trajectoire de la blanche ; équateur au Blackball)"}
  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 15, note: "Fiche technique n° 5 (demi-bille, déviation d'environ 30°)"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 10, note: "Jeu 10 (14 billes depuis une seule position de la blanche), dont le duel est adapté"}
uncertainties:
  - "Exercices 3 et 4, taux, mise en place, défis, thème, variante de jeu, règle de lien, adaptation et minutes : [Prop], à valider par un animateur dans l'application."
  - "Le duel est une adaptation [Prop] du jeu 10 [S] (défi seul) ; sont [Prop] : rouges contre jaunes, tirage au sort, définition de la faute, comptage, fin à 7 tirs, bille jouée une seule fois, seule la bille annoncée comptée, nombre réduit de billes pour les enfants, annonce de la poche et de la fantôme, replacement de la bille adverse, pari aux jetons et départage par les jetons. Seuls la bille unique par tir, la position d'origine de la blanche et le replacement viennent de la fiche."
  - "La section « La fantôme se décale » est une déduction [Prop] : les fiches 3, 4 et 5 parlent de trajectoire et de 30° par rapport à l'axe de visée, pas d'une fantôme décalée."
  - "La section « Blanche près, blanche loin » (adultes seulement) est une proposition pédagogique : la fiche technique n° 3 ne traite pas de la distance de la blanche."
  - "Le schéma de l'exercice 4 présente des coupes de 7 à 18° environ, proches du plein : il illustre peu le demi-bille ; aucun nouveau diagramme n'est ajouté."
  - "Les schémas de bille fantôme sont générés avec un rayon de bille identique pour toutes les billes ; au Blackball la blanche est plus petite, donc ils sont illustratifs et non à l'échelle."
  - "Le rappel s'appuie sur ce que bille-fantome-1 enseigne (ligne poche-bille, fantôme posée puis retirée, plein) et réutilise son illustration `visee-fantome` ; la règle de lien reprend la pose puis le retrait de la fantôme du duel de la partie 1, mais la pose par l'adversaire est une nouveauté de cette séance (en partie 1, l'animateur ou un 3e joueur la pose) : proposition, à valider."
