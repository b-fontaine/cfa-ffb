      - {id: b1, ball: o1, kind: object, path: [[6.0, 1.0], [8.0, 0.0]], to: tr}
    zones: []
    caption: "La bille fantôme reste à la même place, que la blanche parte de A (près) ou de B (loin)."
    alt: "Table vue de dessus : une bille de couleur près de la poche en haut à droite, sa bille fantôme collée contre elle, et deux départs de blanche sur la même ligne, A proche et B éloigné."
  - {id: schema-jeu, type: diagram_ref, diagram: jeux-p10-j1,
     caption: "Jeu 10 : quatorze billes, la blanche au centre ; ici adapté en duel rouges contre jaunes.",
