# Séance du catalogue : « Viser pour empocher (bille fantôme) », partie 2/2.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: bille-fantome-2
order: 6
technique: bille-fantome
part: 2
title: Viser pour empocher (bille fantôme)
technical_sheets: [3]
previous: bille-fantome-1
catalogue_block: bille-fantome
notion: Viser pour empocher en alignant la blanche à l'impact (bille fantôme) sur le centre de la bille de couleur et celui de la poche.
theme:
  name: Le chasseur de fantômes
  pitch: >-
    Épisode 2 : les fantômes ne sont plus posés sur la table. Ils se glissent
    sur le côté, entre le plein et le demi-bille, et se cachent de plus en plus
    loin. Le chasseur doit les repérer dans sa tête avant de tirer.
recall:
  points:
    - La bille de couleur va vers la poche si le centre de la blanche est, à l'impact, sur la ligne qui joint le centre de la poche et celui de la bille de couleur.
    - L'animateur pose une blanche, la bille fantôme, au contact de la bille à empocher.
    - La bille fantôme est retirée avant le tir ; on regarde le point visé sur la bille de couleur.
  question:
    ask: Où doit se trouver le centre de la blanche à l'impact pour que la bille de couleur parte vers la poche ?
    answer: Sur la ligne qui passe par le centre de la poche et le centre de la bille de couleur, là où serait la bille fantôme.
  # Illustration `visee-fantome` de la séance précédente (bille-fantome-1).
  reuse: {sheet: bille-fantome-1, illustration: visee-fantome}
  src: S
theory:
  sections:
    - id: trajectoire
      title: Rappel express, poche-bille-fantôme
      weight: {children: 1, adults: 1}
      body:
        - La bille de couleur part sur la ligne poche-bille ; la bille fantôme est la blanche à l'impact, sur cette ligne.
        - On aligne la queue sur la ligne qui va du centre de la blanche au centre de la bille fantôme, procédé au centre de la blanche.
      adult_extra:
        - Le joueur doit pouvoir viser précisément un point de la bille de couleur s'il veut lui faire suivre une trajectoire pour l'empocher.
      key_point: La fantôme est la blanche à l'impact, sur la ligne poche-bille.
      demo: "Poser une blanche au contact de la bille de couleur, sur la ligne de la poche ; aligner la queue ; retirer la blanche avant le tir ; faire montrer le point visé."
      illustrations: [visee-plein, procede-centre]
      src: S
    - id: plein-demi
      title: Du plein au demi-bille
      weight: {children: 3, adults: 3}
      body:
        - On découvre d'abord les quantités entre le plein et le demi-bille.
        - En plein, la blanche est sur la ligne poche-bille ; la bille de couleur suit la trajectoire de la blanche.
        - En demi-bille, la blanche couvre la moitié de la bille de couleur, qui part avec une déviation d'environ 30° par rapport à l'axe de visée.
      adult_extra:
        - Au Blackball, la blanche est plus petite que les billes de couleur ; le contact se fait légèrement au-dessus de son équateur.
      key_point: "Plein : la couleur suit la blanche ; demi-bille : elle part à environ 30°."
      demo: null
      illustrations: [quantites]
      src: S
    - id: fantome-decalee
      title: La fantôme se décale
      weight: {children: 2, adults: 2}
      body:
        - En plein, la bille fantôme est dans l'axe de la blanche ; en demi-bille, elle est décalée sur le côté de la bille de couleur.
        - Dans les deux cas, on cherche la place de la fantôme avant de tirer, puis on aligne la queue dessus.
      key_point: "Plein : fantôme dans l'axe ; demi : fantôme décalée de côté."
      demo: null
      illustrations: [visee-demi]
      src: Prop
    - id: surface-distance
      title: Blanche près, blanche loin
      weight: {adults: 1}
      body:
        - "La bille fantôme ne dépend pas de la distance de la blanche : que la blanche parte de A (près) ou de B (loin), la fantôme est à la même place."
        - Seule la distance change ; la visée reste la même.
      adult_extra:
        - Comparer, avec le même alignement, un tir proche et un tir lointain, et noter si la couleur s'écarte de la poche.
      key_point: Près ou loin, la fantôme reste à la même place.
      demo: "Poser la blanche près de la bille puis loin d'elle, sur le même alignement : montrer que la bille fantôme garde la même place."
      illustrations: [distances]
      src: Prop
illustrations:
  - {id: visee-plein, type: ghost_aim, cue: [2.42, 2.79], object: [6.0, 1.0], pocket: tr, fraction: full,
     caption: "Bille pleine : la blanche, la bille fantôme, la bille de couleur et la poche sont alignées.",
     alt: "Blanche en bas à gauche, bille de couleur en haut à droite, poche en haut à droite ; la bille fantôme est collée à la bille de couleur, sur la ligne qui va à la poche."}
  - {id: visee-demi, type: ghost_aim, cue: [1.84, 1.69], object: [5.0, 2.0], pocket: br, fraction: half,
     caption: "Demi-bille : la bille fantôme est décalée de côté et couvre la moitié de la bille de couleur.",
     alt: "Blanche à gauche, bille de couleur au centre, poche en bas à droite ; la bille fantôme est décalée sur le côté de la bille de couleur, qui est couverte à moitié."}
  - {id: quantites, type: contact_strip, fractions: [full, half], highlight: full,
     caption: "Du plein au demi-bille : les deux quantités à connaître pour la bille fantôme.",
     alt: "Deux schémas de contact côte à côte : la bille pleine, mise en évidence, puis la demi-bille."}
  - {id: procede-centre, type: cue_side, tip_point: center, cue_height: level,
     caption: "Le procédé se place au centre de la blanche.",
     alt: "Vue de côté : le procédé de la queue touche la blanche en son centre."}
  - id: distances
    type: table
    balls:
      - {id: o1, color: red, at: [6.0, 1.0]}
      - {id: w, color: white, at: [4.21, 1.89], role: cue, label: "A"}
    ghosts:
      - {id: g1, at: [5.82, 1.09], role: impact, for: w}
      - {id: gb, at: [1.08, 3.46], role: cue_start, for: w, label: "B"}
    arrows:
      - {id: a1, ball: w, kind: cue, path: [[4.21, 1.89], [5.82, 1.09]], bounces: []}
