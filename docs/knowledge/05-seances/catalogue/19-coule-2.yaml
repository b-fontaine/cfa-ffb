# Séance du catalogue : « Le coulé », partie 2/3.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: coule-2
order: 19
technique: coule
part: 2
title: Le coulé
technical_sheets: [11]
previous: coule-1
catalogue_block: coule
notion: Replacer la blanche par un coulé, attaque en haut, en quantité de bille du plein au trois-quarts.
theme:
  name: Dans le sillage
  pitch: >-
    La bille de couleur est un bateau et la blanche une petite barque qui
    la suit dans son sillage. Cette fois, la barque ne s'arrête plus après
    le choc : en trois-quarts elle part sur le côté, et chaque arrêt bien
    placé rapproche d'une mini-récompense.
recall:
  points:
    - Le coulé se joue avec une attaque en haut de la blanche.
    - En bille pleine, la blanche suit la bille de couleur sur la même ligne.
    - On privilégie l'amplitude du geste à la vitesse.
    - On commence avec le chevalet sur le cadre, puis sur la surface de jeu.
  question:
    ask: Où frappe-t-on la blanche pour un coulé, et que fait-elle en bille pleine ?
    answer: En haut de la blanche ; en bille pleine, elle suit la bille de couleur sur la même ligne.
  # Illustration `trajectoire-plein` de la séance précédente (coule-1) : la
  # blanche suit la bille de couleur sur la même ligne (V7).
  reuse: {sheet: coule-1, illustration: trajectoire-plein}
  src: S
theory:
  sections:
    - id: mot-coule
      title: Le coulé, une blanche qui file
      weight: {children: 1}
      body:
        - "Après le choc, la blanche ne s'arrête pas : elle continue sa route."
      key_point: Le coulé, c'est une blanche qui continue après le choc.
      demo: null
      illustrations: [coule-plein]
      src: Prop
    - id: trajectoires
      title: Où va la blanche après le choc ?
      weight: {children: 2, adults: 2}
      body:
        - En bille pleine, la blanche suit la bille de couleur sur la même ligne.
        - Proche du plein, la blanche dévie de plusieurs degrés, selon la quantité de bille.
        - En trois-quarts, la déviation est plus ouverte ; elle dépend de la quantité de bille.
      adult_extra:
        - "Le coulé s'exprime entre le plein et le trois-quarts ; au Blackball, l'adaptation de la puissance est plus prononcée, la blanche étant plus légère et plus petite (fiche technique n° 11)."
      key_point: La déviation de la blanche dépend de la quantité de bille.
      demo: "Jouer le même coulé en plein puis en trois-quarts, depuis la même distance, et montrer où la blanche s'arrête."
      illustrations: [coule-trois-quarts, visee-trois-quarts]
      src: S
    - id: amplitude
      title: Du geste ample, pas du geste rapide
      weight: {children: 1, adults: 1}
      body:
        - On privilégie l'amplitude du geste à la vitesse, pour garder la rotation avant de la blanche.
        - "En plein, le transfert d'énergie est important : on adapte la puissance."
        - La puissance joue aussi sur la trajectoire de la blanche après l'impact, à cause de sa taille et de son poids.
        - Attention, une blanche trop vite jouée peut finir dans une poche.
      key_point: Amplitude plutôt que vitesse, pour garder la blanche en rotation avant.
      demo: null
      illustrations: [attaque-haute]
      src: S
    - id: lire-arret
      title: Lire où la blanche s'arrête
      weight: {adults: 1}
      body:
        - Après chaque coulé, noter où la blanche s'arrête par rapport à l'endroit prévu.
        - Un arrêt toujours trop court ou toujours trop long se corrige par l'amplitude et la puissance ; un arrêt qui change de côté se cherche dans la quantité de bille.
      key_point: "Arrêt toujours trop court ou trop long : amplitude et puissance. Arrêt qui change de côté : quantité de bille."
      demo: null
      illustrations: [coule-trois-quarts]
      src: Prop
initiation:
  - id: ini-14
    initiation_sheet: 14
    title: Un coulé en trois-quarts
    weight: {children: 4, adults: 4}
    setup: Une bille rouge sous la poche du milieu du haut ; la blanche plus bas, légèrement à droite de la rouge, comme sur le schéma.
    goal: "Empocher la rouge au milieu en trois-quarts, avec une attaque en haut, et diriger la blanche vers la grande bande grâce à un coulé."
    expected: La rouge est empochée en trois-quarts et la blanche part vers la grande bande ; la comparaison avec le coulé en plein est faite.
    scoring:
      mode: checklist
      criteria:
        - La rouge est empochée dans la poche du milieu.
        - La blanche part vers la grande bande après le choc.
        - L'attaque est en haut et le geste est ample.
        - Après un coulé en plein puis un coulé en trois-quarts depuis la même place, l'élève dit où la blanche s'est arrêtée dans chaque cas.
    illustration: schema-initiation
    src: S
