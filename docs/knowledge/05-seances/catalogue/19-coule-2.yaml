uncertainties:
  - "Le rappel reprend ce que coule-1 a enseigné (attaque en haut, la blanche suit la couleur en plein, amplitude plutôt que vitesse) et réutilise son illustration `trajectoire-plein` ; titre, notion et nom du thème sont alignés sur coule-1 (V23), `coule-3` devra faire de même."
  - "Thème, défis, mot « coulé » pour les enfants, lecture de l'arrêt (adultes), variante à jetons (enfants), zone d'arrêt (largeur d'une main), règle de lien (adultes, zone réduite au prolongement de ligne) et adaptations : [Prop], à valider par un animateur dans l'application. La différenciation enfants / adultes (poids, compléments, adaptation du jeu) est aussi une proposition."
  - "La variante à jetons ne réénonce pas les règles de la partie classique (faute, placement de la blanche, visites de l'adversaire) : elle renvoie aux règles du club ; seule la continuité du tour tant qu'on empoche vient de la fiche du jeu 14."
  - "Exercice 6, erreur « la blanche monte trop loin » : [Prop], déduite du schéma (la blanche monte vers la noire) ; la fiche n'énonce pas d'erreur typique pour cet exercice."
  - "La hauteur de la queue n'est pas précisée par les fiches n° 11 et initiation 13-14 : la séance n'illustre pas le profil de la queue et ne donne pas de hauteur de queue ; l'attaque en haut n'est rappelée que par le point d'impact sur la blanche."
  - "Aucun jeu spécifique au coulé dans la source : le jeu est la partie à difficulté réduite (jeu 14) [S], adaptée [Prop] ; les règles de victoire (groupe puis noire) sont celles de la partie classique, pas écrites dans la fiche du jeu 14."
  - "Les erreurs fréquentes et leurs corrections sont des lectures [Prop] des conseils des fiches (amplitude plutôt que vitesse, risque d'empocher la blanche) ; la fiche d'entraînement n'en donne pas."
  - "Exercice 4 : le type de chevalet n'est pas indiqué sur la fiche ; l'ordre des deux séries (alternées ou successives) n'est pas précisé. Exercices 5 et 6 : la position finale de la blanche est une lecture approchée du schéma. Exercice 5 : « sans heurter la jaune posée sur le trait » est une lecture [Prop] du schéma (la fiche ne le dit pas) ; le nombre de tirs (cinq) vient de la répétition marquée sur les schémas et de l'énoncé de la fiche."
  - "Les schémas du coulé en plein et en trois-quarts sont générés ; les billes y sont dessinées à leurs rayons réels (blanche 48,0 mm, un peu plus petite que la bille de but 50,8 mm, écart à peine visible) et la bille fantôme est une blanche au contact (distance entre centres r_c + r_o), mais les positions et les trajectoires restent indicatives ; la trajectoire de la blanche après le choc est dessinée d'après les schémas de la fiche technique n° 11 et de l'initiation 14."
