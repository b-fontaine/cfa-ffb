training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e4
      ref: {block: coule, n: 4}
      diagram: entrainement-p20-e4
      title: Deux côtés, une noire à jouer
      weight: {children: 2, adults: 1}
      setup: Les billes du schéma en deux groupes, de chaque côté de la poche du milieu du haut, une noire près de chaque groupe ; la blanche posée sur le repère du schéma, en bas, de chaque côté.
      instruction: Empocher la bille de couleur marquée du schéma dans la poche du milieu du haut, en bille pleine et avec une attaque en haut, de façon que la blanche se replace pour jouer la noire ; deux séries de cinq tirs, une depuis chaque côté, en recommençant la même situation à chaque tir.
      expected: La bille de couleur part droit vers la poche du milieu ; la blanche continue son chemin sans être empochée et s'arrête en position pour jouer la noire.
      mistakes:
        - {symptom: La blanche est empochée ou file trop loin, fix: Réduire la vitesse et garder l'amplitude du geste ; le transfert est important en plein.}
        - {symptom: La blanche s'arrête net après le choc, fix: Vérifier que le procédé frappe bien en haut de la blanche et que le geste est ample.}
      playful:
        hook: La blanche est une balle d'argent qui doit s'arrêter en position pour jouer la noire.
        challenge: S'arrêter en position pour jouer la noire sans empocher la blanche, tir après tir, avec un point par arrêt réussi.
      passes: 1
      src: S
    - id: e5
      ref: {block: coule, n: 5}
      diagram: entrainement-p21-e5
      title: Franchir le trait
      weight: {children: 2, adults: 1}
      setup: La rouge, la jaune sur le trait et la noire comme sur le schéma ; la blanche posée sur le repère du schéma, en bas à droite de la rouge.
      instruction: Empocher la rouge dans la poche d'angle du haut à gauche en trois-quarts, avec une attaque en haut, de façon que la blanche dépasse le trait tracé sur la surface et se replace pour jouer la noire ; cinq tirs, en recommençant la même situation à chaque tir.
      expected: La rouge part vers la poche d'angle ; la blanche avance en coulé et dépasse le trait, sans heurter la jaune.
      mistakes:
        - {symptom: La blanche ne dépasse pas le trait, fix: Chercher l'amplitude du geste plutôt que la vitesse et vérifier l'attaque en haut.}
        - {symptom: La blanche touche la jaune posée sur le trait, fix: La rouge est coupée trop fine ; revenir au point de visée trois-quarts avec la bille fantôme du schéma.}
      playful:
        hook: Le trait est la ligne d'arrivée de la blanche.
        challenge: Faire franchir le trait à la blanche deux tirs de suite.
      passes: 2
      src: S
    - id: e6
      ref: {block: coule, n: 6}
      diagram: entrainement-p21-e6
      title: Replacer pour la noire
      weight: {children: 2, adults: 1}
      setup: La rouge, la jaune et la noire du schéma ; la blanche posée sur le repère du schéma, plus bas que la rouge, légèrement à droite.
      instruction: Empocher la rouge dans la poche du milieu du haut en trois-quarts, avec une attaque en haut, de façon que la blanche monte presque droit et se replace pour jouer la noire ; cinq tirs, en recommençant la même situation à chaque tir.
      expected: La rouge est empochée au milieu ; la blanche monte presque droit et s'arrête jouable sur la noire.
      mistakes:
        - {symptom: La blanche part trop sur le côté, fix: Vérifier la quantité de bille ; une visée plus pleine ferme la trajectoire.}
        - {symptom: La blanche monte trop loin vers la bande du haut, fix: Réduire la puissance et l'amplitude pour que la blanche s'arrête près de la noire et reste jouable.}
      playful:
        hook: Avant le tir, le binôme désigne la zone où la blanche doit s'arrêter.
        challenge: Si la blanche s'arrête dans la zone et que la rouge est empochée, point pour l'équipe.
      passes: 1
      src: S
game:
  title: Partie réduite, le coulé qui replace
  source_game: 14
  adapted: true
  players: Partie à 2
  materials: "Quatre billes de chaque groupe de couleur et la noire (jeu 14) ; variante enfants (proposition) : jetons et tableau ; règle de lien adultes : aucun matériel."
  setup_illustration: schema-jeu
  rules:
    - Partie à deux, avec les règles d'une partie classique.
    - On n'utilise que quatre billes de chaque groupe de couleur et la bille noire.
    - Le joueur qui casse est désigné par le tirage à la bande.
  scoring: Le premier qui empoche son groupe puis la noire gagne, comme dans la partie classique.
  end: Fin quand un joueur a empoché son groupe puis la noire.
  playful_variant: "Variante facultative pour les enfants, à jouer sans la règle de lien. Le coulé à jetons : avant de jouer une bille du plein au trois-quarts, le joueur annonce « coulé » et montre avec la main où la blanche doit s'arrêter (une zone de la largeur d'une main). L'adversaire valide l'annonce avant le tir, puis valide le résultat : la bille est empochée et la blanche s'arrête dans la zone. Un coulé validé donne un jeton ; trois jetons donnent une mini-récompense (une marque au tableau) ; les jetons n'ajoutent rien à la victoire de la partie. Pour le reste, on joue avec les règles de la partie classique du club ; on continue tant qu'on empoche une bille et on évite d'empocher la blanche (jeu 14)."
  link_previous:
    notion_of: coule-1
    rule: "Règle facultative, adultes seulement (les enfants jouent la variante), à jouer sans la variante ludique, en exception aux règles de la partie : avant de jouer une bille en bille pleine, le joueur annonce « coulé » ; la bille est alignée avec la poche et la blanche, et la zone d'arrêt se réduit au prolongement de la ligne. L'adversaire valide si la bille est empochée, si la blanche n'est pas empochée et si elle s'arrête sur ce prolongement, dans une largeur de main."
    note: "Rejoue le coulé en bille pleine de la séance précédente (la blanche suit la couleur) avec la même annonce « coulé », mais une zone d'arrêt réduite au prolongement de la ligne ; la partie réduite se joue telle quelle sans elle. Une seule règle facultative par partie."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher les billes des poches ; mise en place proposée (la fiche ne la précise pas) : un joueur les rouges, l'autre les jaunes, partie limitée à 15 minutes, au-delà gagne qui a le moins de billes restantes."
    adults: "Version adultes : la règle de lien seule, sans la variante à jetons. Après la partie, comparer les arrêts de la blanche au prolongement de ligne annoncé sur les coulés en plein : sur quels coulés l'écart est-il le plus grand (distance parcourue, côté de l'arrêt) ?"
  src: Prop
review:
  prompts:
    - Quel coulé as-tu le mieux réussi, le plein ou le trois-quarts ?
    - Où s'est arrêtée la blanche quand tu as joué trop vite ?
    - Que dirais-tu à un copain pour que la blanche file là où il le souhaite ?
