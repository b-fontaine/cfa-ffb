# Séance du catalogue : « Quantité quart de bille », partie 1/1.
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: quart-1
order: 12
technique: quart
part: 1
title: Quantité quart de bille
technical_sheets: [7]
previous: trois-quarts-2
catalogue_block: quart-finesses
notion: Viser en dehors de la bille de couleur, à un demi-rayon au-delà, pour empocher en quart de bille.
theme:
  name: Au ras des billes
  pitch: >-
    En quart de bille, la blanche prend la bille de couleur tout près de
    son bord, comme un funambule qui marche au ras du vide. Chaque bille
    empochée fait avancer le funambule d'un pas sur un fil de 8 pas dessiné
    au tableau.
recall:
  points:
    - Au trois-quarts, on vise à mi-chemin entre le centre et la tangente de la bille de couleur.
    - Le point de visée et le point de contact sont très proches.
    - La bille de couleur part à environ 15° et parcourt plus que la blanche.
  question:
    ask: Au trois-quarts, où vise-t-on et quelle bille parcourt le plus de distance ?
    answer: À mi-chemin entre le centre et la tangente ; la bille de couleur parcourt plus que la blanche.
  reuse: {sheet: trois-quarts-2, illustration: demi-et-trois-quarts}
  src: S
theory:
  sections:
    - id: fantome
      title: "Rappel : la bille fantôme"
      weight: {adults: 2}
      body:
        - L'animateur pose une blanche au contact de la bille à empocher, sur la ligne de la poche, puis la retire avant le tir.
        - Le joueur vise le centre de la bille fantôme avec le centre de la blanche.
        - Le procédé frappe la blanche en son centre.
      key_point: Le centre de la blanche vise le centre de la bille fantôme.
      demo: null
      illustrations: [visee-quart, attaque-queue]
      src: S
    - id: en-dehors
      title: Viser en dehors de la bille
      weight: {children: 3, adults: 3}
      body:
        - Le quart de bille se vise au-delà de la bille de couleur.
        - Le point de visée n'est plus sur la bille de couleur, mais en dehors d'elle.
        - On vise à un demi-rayon de bille au-delà de la bille de couleur.
        - "La blanche est un peu plus petite que la bille de couleur : ce demi-rayon se compte avec la blanche."
      adult_extra:
        - "Fiche technique n° 7 : au Blackball, cette mesure est prise en référence à la blanche, plus petite que les billes de couleur."
        - La visée et le point de contact sont donc un peu plus rapprochés que dans les autres disciplines.
      key_point: On vise en dehors de la bille de couleur, à un demi-rayon au-delà.
      demo: "Fiche technique n° 3 : poser une blanche au contact de la bille de couleur, en quart, montrer que la ligne de visée passe à côté de la bille, puis retirer la blanche avant le tir."
      illustrations: [contact-quart, visee-quart]
      src: S
    - id: impression
      title: On a l'impression de la manquer
      weight: {children: 2, adults: 2}
      body:
        - Ta visée passe à côté de la bille de couleur, et pourtant tu la touches.
        - "Les billes sont rondes : leurs bords se touchent même si la visée semble passer à côté."
      adult_extra:
        - "Fiche technique n° 7 : l'animateur aide le débutant à prendre en compte la dimension sphérique des billes."
      key_point: Même si la visée passe à côté, la blanche touche la bille.
      demo: null
      illustrations: [visee-quart]
      src: S
    - id: energie
      title: La blanche garde une grande part
      weight: {children: 2, adults: 2}
      body:
        - "Le quart de bille est une quantité faible : la bille de couleur reçoit peu de force."
        - La blanche garde une grande part de son énergie et va plus loin que la couleur.
        - La blanche est peu déviée de sa trajectoire initiale.
      adult_extra:
        - Le transfert d'énergie à la bille de couleur est faible ; la déviation de la blanche est faible par comparaison avec le demi et le trois-quarts.
        - "La fiche d'initiation le formule ainsi : la blanche conserve deux fois plus d'énergie qu'elle n'en transfère à la bille de couleur."
      key_point: Au quart, la blanche garde une grande part de son énergie et dévie peu.
      demo: "Tirer à courte distance, sans empocher : la blanche parcourt plus de trajet que la bille de couleur."
      illustrations: [trajectoires]
      src: S
    - id: comparer
      title: Plein, demi, trois-quarts, quart
      weight: {children: 1, adults: 2}
      body:
        - "Plein : on vise le centre. Trois-quarts : on vise entre le centre et la tangente."
        - "Demi : on vise la tangente. Quart : on vise en dehors de la bille."
      adult_extra:
        - Plus la quantité de bille diminue, plus la blanche garde son énergie et moins elle est déviée.
      key_point: Plus la quantité diminue, plus la blanche garde son énergie.
      demo: null
      illustrations: [quantites]
      src: S
    - id: mot-bord
      title: Un quart, c'est près du bord
      weight: {children: 1}
      body:
        - Pour t'en souvenir, la blanche appuie sur le côté de la bille de couleur, tout près de son bord.
      key_point: "Quart de bille : la blanche appuie sur le côté de la couleur, près du bord."
      demo: null
      illustrations: [contact-quart]
      src: Prop
initiation:
  - id: ini-9
    initiation_sheet: 9
    title: Une bille en quart
    weight: {children: 3, adults: 3}
    setup: "La jaune du schéma de gauche sous la poche du haut à gauche, la blanche à courte distance sous elle, décalée du côté du centre de la table (vers la droite) : la visée passe à côté de la jaune, côté centre, et la blanche la touche sur son côté tourné vers le centre ; décalée de l'autre côté, la jaune partirait à l'opposé de la poche. La jaune et la blanche sont replacées après le premier tir."
    goal: "Empocher la jaune en quart de bille, deux fois de suite : viser en dehors de la bille, près de la tangente."
    expected: La visée passe en dehors de la jaune alors que les billes se touchent ; la jaune part vers la poche et la blanche parcourt plus que la jaune.
    scoring: {mode: counter, of: 2}
    illustration: schema-initiation
    src: Prop
illustrations:
  - {id: contact-quart, type: contact, fraction: quarter, tip_point: center, paths: true,
     caption: "Quart de bille : vue de dessus, la blanche, un peu plus petite, frôle le bord de la bille de couleur ; à droite, la blanche de face avec le procédé au centre.",
     alt: "À gauche, vue de dessus : la blanche, un peu plus petite que la bille de couleur, arrive par la gauche sur la ligne de visée en pointillés et ne touche que le bord de la bille de couleur, placée plus haut ; à droite, la blanche vue de face avec une croix et un anneau à mi-rayon, le point du procédé au centre."}
  - {id: visee-quart, type: ghost_aim, cue: [1.02, 3.0], object: [1.0, 1.0], pocket: tl, fraction: quarter,
     caption: "La bille fantôme montre où la blanche touche la bille de couleur : la visée reste à côté de la bille.",
     alt: "Table vue de dessus : la blanche en bas à gauche, la bille de couleur près de la poche du haut à gauche ; la bille fantôme, de la taille de la blanche (plus petite que la bille de couleur), est collée à la bille de couleur sur son côté bas droit, avec le point de contact marqué ; la ligne de visée va de la blanche à la bille fantôme et passe à côté de la bille de couleur."}
  - {id: quantites, type: contact_strip, fractions: [full, three_quarter, half, quarter], highlight: quarter,
     caption: "Plein, trois-quarts, demi et quart, du plus plein au plus fin ; la blanche est dessinée un peu plus petite que la bille de couleur.",
     alt: "Quatre schémas de contact alignés vus de dessus, du plus plein au plus fin : bille pleine, trois-quarts, demi-bille, puis quart de bille mis en évidence ; dans chacun, la blanche est un peu plus petite que la bille de couleur, et une note rappelle les diamètres de la blanche et des billes de but."}
  - id: trajectoires
    type: table
    balls:
      - {id: w, color: white, at: [1.02, 3.0], role: cue}
      - {id: r, color: red, at: [1.0, 1.0]}
    arrows:
      - {id: a-blanche, ball: w, kind: cue, path: [[1.02, 3.0], [1.15, 1.15], [2.08, 0.2]], label: "la blanche dévie moins qu'au demi"}
      - {id: a-rouge, ball: r, kind: object, path: [[1.0, 1.0], [0.0, 0.0]], to: tl, label: "la rouge part vers la poche"}
    caption: "Au quart de bille, la blanche garde une grande part de son énergie et dévie moins qu'au demi et au trois-quarts (tracé indicatif) ; la bille de couleur part vers la poche."
    alt: "Table vue de dessus : la blanche monte vers une bille rouge près de la poche du haut à gauche, puis repart en biais vers le haut à droite, moins déviée qu'au demi et au trois-quarts ; la rouge part vers la poche."
  - {id: attaque-queue, type: cue_ball_target, tip_point: center, cue_height: level,
     caption: "Le procédé frappe la blanche au centre : cible vue de face, point d'impact à l'échelle du procédé.",
     alt: "Cible sur la blanche vue de face, avec ses anneaux à mi-rayon et au bord : le point du procédé est au centre ; un petit profil montre la queue à hauteur moyenne."}
  - {id: schema-initiation, type: diagram_ref, diagram: initiation-p09-e1,
     caption: "Initiation 9 : deux situations en haut de la table ; la jaune de gauche est jouée en quart de bille.",
     alt: "Table vue de dessus : deux billes jaunes en haut, chacune avec une blanche à courte distance ; à gauche, la blanche passe en dehors de la jaune près de la poche du haut à gauche et la touche sur son côté, près du bord."}
  - {id: schema-jeu, type: diagram_ref, diagram: jeux-p09-j1,
     caption: "Jeu 9 : une rouge près de la poche du milieu du haut, une jaune près de la poche du milieu du bas, la blanche dans la zone de replacement à gauche.",
     alt: "Table vue de dessus : la blanche à gauche sur la ligne de départ ; une rouge sous la poche du milieu du haut et une jaune au-dessus de la poche du milieu du bas, chacune annoncée en quart de bille par le schéma (depuis la blanche d'origine, l'angle de coupe est en fait plus fin qu'un quart), la zone de replacement de la blanche à gauche."}
training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e1
      ref: {block: quart-finesses, n: 1}
      diagram: entrainement-p09-e1
      title: Les deux coins
      weight: {children: 2, adults: 1}
      setup: "La rouge de gauche sous la poche du haut à gauche et la rouge de droite sous la poche du haut à droite, comme sur le schéma ; la blanche posée sur le repère situé en dessous de chacune, décalée du côté du centre de la table : la visée passe à côté de la rouge, côté centre, et la touche sur son côté tourné vers le centre (décalée de l'autre côté, la rouge partirait à l'opposé de la poche)."
      instruction: Empocher la rouge de gauche en quart de bille depuis son repère, puis celle de droite depuis le sien ; chaque situation est jouée quatre fois.
      expected: La visée passe en dehors de la rouge, les billes se touchent et la rouge part vers sa poche ; le repère de la blanche ne change pas.
      mistakes:
        - {symptom: La blanche passe à côté et ne touche pas la rouge, fix: "Rapprocher légèrement la visée de la bille ; faire montrer le point de contact avec la bille fantôme."}
        - {symptom: La rouge part trop de côté ou manque la poche, fix: "Vérifier que la visée est bien en dehors de la bille, à un demi-rayon, et que la queue est alignée sur la trajectoire."}
        - {symptom: L'élève hésite car il a l'impression de manquer la bille, fix: "Poser la bille fantôme pour montrer que les billes se touchent bien, puis la retirer avant le tir."}
      playful:
        hook: Chaque rouge empochée fait avancer le funambule d'un pas sur le fil dessiné au tableau.
        challenge: Faire traverser le fil au funambule de l'équipe avant l'équipe voisine.
      passes: 2
      src: S
    - id: e2
      ref: {block: quart-finesses, n: 2}
      diagram: entrainement-p09-e2
      title: Les quatre cibles
      weight: {children: 1, adults: 1}
      setup: Les deux jaunes du schéma près de la poche du haut à gauche et les deux rouges du schéma près de la poche du haut à droite ; la blanche posée sur le repère de gauche pour les jaunes, puis sur celui de droite pour les rouges ; pour chaque bille, la visée passe du côté de la bille tourné vers le centre de la table, jamais du côté de la bande.
      instruction: Empocher chaque bille du schéma en quart de bille vers la poche du haut voisine ; chaque bille est jouée trois fois.
      expected: La même visée en dehors de la bille à chaque tir ; les billes d'un même coin partent vers la même poche et la blanche garde une grande part de son énergie.
      mistakes:
        - {symptom: "Une bille d'un coin part trop de côté et manque la poche (visée trop près du centre de la bille)", fix: "Écarter la visée du centre de la bille, vers le centre de la table, à un demi-rayon au-delà, et faire annoncer « quart » avant chaque tir."}
        - {symptom: La puissance varie d'un tir à l'autre, fix: "Adapter la puissance pour que la bille de couleur soit empochée, sans la forcer."}
      playful:
        hook: Avant chaque tir, le tireur annonce « quart » et montre où passe sa visée.
        challenge: Vider les deux billes d'un coin avant que le binôme vide l'autre coin.
      passes: 1
      src: S
game:
  title: 8 billes en poche du milieu
  source_game: 9
  adapted: false
  players: Partie à 2
  materials: "Billes du jeu complet. Pour le défi ludique (proposition) : un tableau et des jetons."
  setup_illustration: schema-jeu
  rules:
    - Vider son groupe de billes puis la noire dans une poche du milieu, en quart de bille.
    - Les joueurs tirent à tour de rôle ; la blanche est repositionnée sur son point d'origine après chaque tir.
    - Quand une bille de couleur est empochée, on replace une autre bille sur le même point ; toute bille non empochée est replacée sur son point d'origine.
    - Un coup n'est pas valable en cas de faute ou si la blanche n'est pas replacée dans la zone.
    - Vérifier à chaque tir que la bille est bien positionnée et jouée en quart de bille.
    - Adapter la puissance du coup pour empocher la bille (objectif du jeu 9).
  scoring: Le premier qui a empoché toutes les billes de son groupe puis la noire gagne.
  end: "Fin quand un joueur a vidé son groupe puis empoché la noire ; en cas d'égalité, jouer la noire jusqu'à ce que l'un manque."
  playful_variant: "Avant chaque tir, annoncer « quart » en montrant où passe la visée ; si l'adversaire contrôle et confirme que la visée est bien en quart, le funambule du tireur avance d'un pas sur un fil de 8 pas dessiné au tableau. Quand son funambule est au bout du fil, un joueur peut, une seule fois dans la partie, rejouer un tir manqué."
  link_previous:
    notion_of: trois-quarts-2
    rule: "Échauffement avant la partie, hors règles du jeu 9 : chaque joueur tire la rouge du schéma deux fois, d'abord en trois-quarts depuis un point que son adversaire pose plus près de la ligne rouge-poche, puis en quart depuis un point plus bas de la ligne de départ que le point d'origine (environ y = 2,9, au choix de l'animateur : depuis le point d'origine, l'angle de coupe est trop fin pour un vrai quart) ; il annonce « trois-quarts » ou « quart » et son adversaire contrôle que la visée est entre le centre et la tangente, ou en dehors de la bille, avant le tir. Ces tirs ne comptent pas dans la partie."
    note: "Réactive le trois-quarts de la séance précédente et fait comparer les deux quantités sur la même bille ; échauffement facultatif : la partie se joue ensuite telle quelle, sans exception aux règles du jeu 9."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Rapprocher la blanche et les billes de la poche du milieu. Mise en place proposée (la fiche ne la précise pas) : un joueur les rouges, l'autre les jaunes, chacun un groupe de 7 billes ; les rouges se replacent sur le point de la rouge du schéma (près de la poche du milieu du haut), les jaunes sur celui de la jaune (près de la poche du milieu du bas) ; la noire se joue depuis l'un de ces deux points, au choix du tireur ; tirage au sort pour commencer, partie limitée à 15 minutes ; au-delà, gagne qui a le moins de billes restantes."
    adults: "Même mise en place proposée (la fiche ne la précise pas) : un joueur les rouges, l'autre les jaunes, chacun un groupe de 7 billes plus la noire ; rouges sur le point de la rouge du schéma, jaunes sur celui de la jaune, noire jouée depuis l'un des deux points au choix du tireur. Après la partie, comparer avec le taux de l'exercice : sur quelle distance et de quel côté le quart échoue-t-il ? Variante plus difficile : jouer aussi la noire en quart de bille."
  src: S   # titre, règles, score et fin du jeu 9 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Où vise-t-on en quart de bille, par rapport au trois-quarts ?
    - Quelle bille était la plus difficile en quart, et pourquoi ?
    - Que dirais-tu à un copain qui croit que la blanche ne touchera pas la bille ?
