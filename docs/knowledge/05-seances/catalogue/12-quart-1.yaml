uncertainties:
  - "Mises en place en texte, défis ludiques, variante de jeu (jetons compris), règle de lien et adaptation du jeu : [Prop], à valider par un animateur dans l'application. La différenciation enfants / adultes (poids, compléments, adaptation du jeu) est aussi une proposition."
  - "Le rappel porte sur le trois-quarts, tel que l'enseigne trois-quarts-2 (point de visée à égale distance du centre et de la tangente, déviation d'environ 15°, la bille de couleur parcourt plus que la blanche) ; il reprend l'illustration `demi-et-trois-quarts` de trois-quarts-2 (recall.reuse). Les sections [Prop] de trois-quarts-2 (chevalet, distance) ne sont pas rappelées : le rappel reste [S]."
  - "Initiation 9 : la fiche demande 2 billes, une en quart et une en finesse ; la finesse relevant de la séance finesse-1, cette séance joue deux tirs en quart sur la jaune de gauche. L'adaptation est une proposition (src Prop). Le PDF ne précise pas le type de chevalet."
  - "Le schéma de l'initiation 9 n'est pas légendé : l'association gauche = quart, droite = finesse est déduite des schémas de quantité (voir la transcription) ; le décalage mesuré à gauche est plus épais que le quart dessiné."
  - "Exercice 2 : l'énoncé du PDF dit « huit billes » mais le schéma porte 4 x 3 = 12 tirs ; le type de chevalet n'est pas indiqué. L'ordre de pose de la blanche entre les deux repères n'est pas explicite."
  - "Le schéma du jeu 9 [S] ne montre que deux billes (une rouge près de la poche du milieu du haut, une jaune près de celle du bas) et leurs trajectoires de blanche ; composition des groupes, place de la noire, tirage au sort et limite de temps sont des propositions communes aux deux publics (adaptation). Depuis la zone de replacement, l'angle de coupe est élevé : un trois-quarts n'y est pas jouable, d'où l'échauffement hors partie (link_previous). Recalculé sur le schéma [S] (blanche en 1,8 ; 2,0, bille fantôme en 4,0 ; 1,0 sous la rouge en 4,0 ; 0,77), l'angle de coupe mesuré est d'environ 65° (quantité d'environ 0,09 selon FORMAT § 6), soit une finesse plutôt qu'un quart (environ 49°) ; la fiche, elle, étiquette ces tirs « quart » (sequence du diagramme jeux-p09-j1). Un vrai quart n'est atteignable dans la zone que depuis un point plus bas de la ligne de départ (environ y = 2,9)."
  - "Les illustrations générées (visée avec bille fantôme, trajectoires, cible sur la blanche) sont indicatives pour les distances ; la déviation de la blanche dans « trajectoires » est qualitative, la fiche ne la chiffre pas ; le tracé, calculé avec la bille fantôme et la règle des 90° (angle de coupe d'environ 45°), montre une sortie à environ 45°, moins déviée qu'au demi et au trois-quarts, sans valeur [S]. La section « Un quart, c'est près du bord » (enfants) est une glose [Prop] : le mot « frôlement » est réservé à la finesse (fiche technique n° 8)."
  - "La fiche technique n° 7 ne donne pas la déviation de la bille de couleur au quart (seulement qu'elle reçoit peu d'énergie) : l'adulte ne peut pas la comparer aux 15° du rappel ; la démonstration avec blanche retirée vient de la fiche technique n° 3. Le glossaire (07-glossaire.md) n'a pas d'entrée « Quart de bille » : à proposer dans un lot connaissances."
  - "La fiche technique n° 7 est citée telle quelle pour le demi-rayon ; la mesure par rapport à la blanche (plus petite au Blackball) est celle de la fiche, non transposée d'une autre discipline."
