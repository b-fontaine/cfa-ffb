# Séance du catalogue : « La puissance », partie 1/2 (introduction).
# Format : FORMAT.md de ce dossier. Validée par `cd app && dart run tool/fiches.dart`.
# Copiée vers app/assets/fiches/ par scripts/sync_fiches.sh (ne pas éditer la copie).
version: 1
id: puissance-1
order: 3
technique: puissance
part: 1
title: La puissance
technical_sheets: [2]
previous: posture-2
catalogue_block: puissance
notion: Doser la puissance du coup en réglant la vitesse du coup de queue et l'amplitude du geste.
theme:
  name: Les deux curseurs
  pitch: >-
    Chaque joueur a deux curseurs : le recul de la main et la vitesse du
    coup. Aujourd'hui on apprend à les régler ensemble : la blanche doit
    s'arrêter dans la zone qu'on a choisie.
recall:
  points:
    - Quand la blanche est loin de la bande, la main d'appui est à plat sur la surface de jeu.
    - Au coup de queue, seul l'avant-bras de queue bouge, le coude est le pivot.
    - "Le corps reste immobile jusqu'à la fin du tir : on ne se relève pas trop tôt."
  question:
    ask: Au moment du coup de queue, quelle partie du corps bouge ?
    answer: Seul l'avant-bras de queue, autour du coude ; le reste du corps ne bouge pas.
  # Illustration `posture-surface` de la séance précédente (posture-2) : main d'appui à plat.
  reuse: {sheet: posture-2, illustration: posture-surface}
  src: Prop   # le point 3 (immobilité jusqu'à la fin du tir) est un contenu [Prop] de posture-2
theory:
  sections:
    - id: deux-criteres
      title: La puissance, c'est la vitesse et l'amplitude
      weight: {children: 3, adults: 3}
      body:
        - La puissance d'un coup dépend de deux choses, la vitesse du coup de queue et son amplitude.
        - L'amplitude, c'est le recul de la main quand on arme son tir, jusqu'à la fin de la pénétration dans la blanche.
        - Peu d'amplitude et peu de vitesse, le coup est doux. Grande amplitude et grande vitesse, le coup est puissant.
      adult_extra:
        - Le débutant pense surtout à la vitesse ; c'est l'amplitude que l'animateur doit mettre en évidence.
        - Le recul part de la situation initiale de la main vers l'arrière, la pénétration va vers l'avant jusqu'à la fin du passage de la queue dans la blanche.
      key_point: Doux, c'est peu de recul et peu de vitesse ; puissant, c'est grand recul et grande vitesse.
      demo: null
      illustrations: []
      src: S
    - id: curseur
      title: "Deux curseurs : le recul et la vitesse"
      weight: {adults: 1}
      body:
        - "Pour s'entraîner, on imagine deux curseurs : le recul de la main, court ou long, et la vitesse du coup, lente ou rapide."
        - "Le plan recul et vitesse est une image de la séance : le doux est en bas à gauche, le puissant en haut à droite ; ce n'est pas une graduation fédérale."
      key_point: Peu de recul et peu de vitesse, c'est doux ; grand recul et grande vitesse, c'est puissant.
      demo: "Montrer deux tirs à vide, l'un avec peu de recul et peu de vitesse, l'autre avec grand recul et grande vitesse, et nommer ce qui change."
      illustrations: [plan-doux, plan-puissant]
      src: Prop
    - id: mots-queue
      title: Les mots de la queue
      weight: {children: 1}
      body:
        - Le talon, c'est le bout épais de la queue, du côté de la main.
        - Le centre de gravité, c'est le point où la queue tient en équilibre sur un doigt, un peu plus près du talon que du milieu.
      key_point: Le talon est le bout épais, côté main ; la flèche va du bout au chevalet.
      demo: "Montrer sur une queue le bout, le centre de gravité, le talon, puis la flèche."
      illustrations: []
      src: Prop
    - id: regler-fleche
      title: Régler le recul avec la flèche
      weight: {children: 2, adults: 2}
      body:
        - La flèche, c'est la longueur de queue entre le bout (le procédé) et le chevalet.
        - Main près du centre de gravité de la queue, le chevalet est près de la blanche, la flèche est courte et le recul reste faible.
        - Main vers le talon, le chevalet est plus loin de la blanche, la flèche est longue et le recul peut être grand.
        - Entre les deux, on règle la longueur de flèche selon la puissance voulue.
      key_point: Main vers le talon et chevalet plus loin, c'est un grand recul possible.
      demo: null
      illustrations: [fleche-courte-longue]
      src: S
    - id: mesure
      title: À la mesure de la distance
      weight: {children: 2, adults: 2}
      body:
        - On adapte l'amplitude et la vitesse à la distance à parcourir.
        - "Après l'impact, la blanche doit rester dans la zone grise : c'est le test de la mesure."
      key_point: On règle la puissance sur la distance, la blanche s'arrête dans la zone grise.
      demo: null
      illustrations: [court-long]
      src: S
initiation:
  - id: ini-5
    initiation_sheet: 5
    title: Quatre billes à la mesure
    weight: {children: 4, adults: 4}
    setup: Une rouge près de la poche d'angle du haut à gauche et une jaune sous la poche du milieu du haut, chacune dans sa zone grise ; deux positions pour la blanche, à droite et en bas à gauche (le schéma). Replacer la blanche après chaque tir.
    goal: "Empocher 4 billes à la mesure : la rouge et la jaune, depuis chaque position, deux billes avec un chevalet sur cadre puis deux avec un chevalet sur la surface de jeu ; la blanche reste dans la zone grise après l'impact."
    expected: "La blanche s'arrête dans la zone grise ; le recul de la main change entre le tir proche et le tir lointain ; attaque au centre de la blanche à tous les tirs (consigne du projet). Conseil à l'animateur (fiche) : faire se questionner l'élève sur le placement de son corps selon la place de la blanche, et regarder la rectitude du geste et l'amplitude."
    scoring: {mode: counter, of: 4}
    illustration: schema-initiation
    src: S
illustrations:
  - {id: plan-doux, type: power_ratio,
     points: [{amplitude: short, speed: slow}], distance_label: "bille proche",
     caption: "Coup doux : peu de recul, peu de vitesse (le plan est une image proposée, pas une graduation fédérale).",
     alt: "Plan amplitude (recul de la main) et vitesse : un point en bas à gauche, amplitude courte et vitesse lente, zone douce, pour une bille proche."}
  - {id: plan-puissant, type: power_ratio,
     points: [{amplitude: long, speed: fast}], distance_label: "bille lointaine",
     caption: "Coup puissant : grand recul, grande vitesse (le plan est une image proposée, pas une graduation fédérale).",
     alt: "Plan amplitude (recul de la main) et vitesse : un point en haut à droite, amplitude longue et vitesse rapide, zone puissante, pour une bille lointaine."}
  - {id: fleche-courte-longue, type: pdf_ref, file: "Fiches techniques CFA BàP.pdf", page: 12,
     caption: "Voir page 12 de la fiche technique : main près du centre de gravité, flèche courte ; main vers le talon, flèche longue.",
     alt: "Renvoi vers la page 12 de la fiche technique n° 2, dont les photos montrent la main près du centre de gravité de la queue (flèche courte, recul faible) puis vers le talon (flèche longue, grand recul)."}
  - id: court-long
    type: table
    balls:
      - {id: j1, color: yellow, at: [4.0, 0.2], role: object}
      - {id: w, color: white, at: [4.4, 1.7], role: cue}
    ghosts:
      - {id: g1, at: [4.86, 3.2], role: cue_start, for: w, label: "tir lointain"}
      - {id: g-impact, at: [4.0, 0.414], role: impact, for: w}
    arrows:
      - {id: a1, kind: cue, ball: w, path: [[4.4, 1.7], [4.0, 0.414]], label: "tir doux"}
      - {id: a2, kind: cue, ball: w, path: [[4.86, 3.2], [4.0, 0.414]], label: "tir puissant"}
    zones:
      - {id: z1, from: [3.0, 0.0], to: [5.0, 1.0], shape: rect, label: "zone grise"}
    caption: "Même cible, deux distances : la puissance change, la blanche reste dans la zone grise."
    alt: "Table vue de dessus : une bille jaune sous la poche du milieu du haut dans une zone grise ; la blanche est soit tout près, soit loin en bas à droite, avec une flèche courte et une flèche longue vers la jaune."
  - {id: schema-initiation, type: diagram_ref, diagram: initiation-p05-e1,
     caption: "Initiation 5 : quatre tirs à la mesure, depuis deux positions.",
     alt: "Table vue de dessus : une rouge près de la poche d'angle du haut à gauche, une jaune sous la poche du milieu du haut, chacune dans une zone grise ; la blanche est posée à droite puis en bas à gauche."}
  - {id: schema-jeu, type: diagram_ref, diagram: jeux-p03-g1,
     caption: "Jeu 3 : placer la blanche dans la zone grise du camp adverse.",
     alt: "Table vue de dessus : deux camps de quatre billes aux deux extrémités, chacun autour d'une zone grise ; une longue flèche part du camp de gauche vers le camp de droite."}
training:
  recall_slot: {weight: {children: 1, adults: 1}, passes: 1}   # exercice choisi à l'exécution parmi les séances précédentes (ADR 0011, [U] 2026-10-15)
  exercises:
    - id: e1
      ref: {block: puissance, n: 1}
      diagram: entrainement-p01-e1
      title: Trois cibles, trois dosages
      weight: {children: 3, adults: 1}
      setup: "Les trois rouges du schéma au ras des poches du haut, chacune dans sa zone grise ; les jaunes du schéma en paires au milieu de la table ; la blanche en bas, devant les paires. Ordre conseillé (proposition, le schéma ne le donne pas) : la rouge du milieu, la plus proche, puis celle de gauche, puis celle de droite."
      instruction: Empocher chaque rouge trois fois, soit neuf tirs, en passant entre les deux jaunes d'une paire ; la blanche doit rester dans la zone grise après l'impact.
      expected: La blanche s'arrête dans la zone grise ; le recul de la main est plus court pour la rouge proche et plus long pour la rouge lointaine ; attaque au centre de la blanche, la même à tous les tirs (consigne du projet).
      mistakes:
        - {symptom: La blanche sort de la zone grise, fix: "Raccourcir le recul de la main plutôt que seulement ralentir le coup."}
        - {symptom: La queue dévie en armant ou en frappant, fix: "Ne bouger que l'avant-bras autour du coude et garder la queue sur sa trajectoire."}
      playful:
        hook: Avant chaque tir, annoncer à voix haute « doux », « moyen » ou « fort ».
        challenge: "Réussir chaque rouge avec le bon dosage annoncé (doux pour la rouge du milieu, moyen pour celle de gauche, fort pour celle de droite) sans que la blanche sorte de sa zone."
      passes: 2
      src: S
    - id: e2
      ref: {block: puissance, n: 2}
      diagram: entrainement-p01-e2
      title: La grande traversée
      weight: {children: 2, adults: 1}
      setup: Les deux jaunes du schéma au ras des poches du fond, en haut et en bas à gauche, chacune dans sa zone grise ; les rouges du schéma en deux paires sur le chemin ; la blanche de l'autre côté de la table, à droite.
      instruction: Empocher la jaune du haut cinq fois, puis celle du bas cinq fois, en passant entre les deux rouges d'une paire ; la blanche reste dans la zone grise après l'impact.
      expected: Un geste fluide, avec une vitesse suffisante pour traverser la table ; la blanche s'arrête dans la zone grise.
      mistakes:
        - {symptom: La blanche n'arrive pas jusqu'à la zone, fix: "Accompagner le geste jusqu'au bout et donner un peu plus de vitesse, sans se précipiter ni lever le corps."}
        - {symptom: La blanche passe la zone grise, fix: "Garder le même geste mais ralentir l'accompagnement de la queue."}
      playful:
        hook: Traverser la table d'un geste fluide, comme un grand bateau qui arrive à quai tout en douceur.
        challenge: Réussir les deux séries à deux, chacun une série, et comparer qui dose le mieux.
      passes: 1
      src: S
game:
  title: Placer la blanche dans le camp adverse
  source_game: 3
  adapted: false
  players: Partie à 2
  materials: "Quatre rouges et quatre jaunes en deux camps ; pour le défi ludique (proposition) : un tableau et des jetons."
  setup_illustration: schema-jeu
  rules:
    - "Partie à deux joueurs : chacun tire 5 fois, à tour de rôle."
    - Chacun à son tour, placer la blanche en un seul tir dans le camp adverse, matérialisé par quatre billes (la zone grise entre elles) ; la blanche part du bord de son propre camp, comme sur le schéma.
    - La blanche peut rebondir sur la petite bande.
    - Le coup n'est pas valable si le joueur commet une faute ou si la blanche touche une bille.
  scoring: Le premier joueur qui place cinq fois la blanche dans le camp adverse gagne.
  end: Fin quand un joueur a placé cinq fois la blanche dans le camp adverse.
  playful_variant: "Variante facultative, à jouer sans la règle de lien : un tir valide dont la blanche s'arrête au centre de la zone grise, loin des quatre billes, rapporte un jeton (l'adversaire juge). Deux jetons permettent de rejouer, une fois, un tir invalide ; les jetons servent de la même façon dans les deux règles facultatives."
  link_previous:
    notion_of: posture-2
    rule: "Règle facultative, à jouer sans la variante ludique, en exception aux règles du jeu 3 : avant chaque tir, le tireur annonce « je reste immobile » ; son adversaire vérifie qu'il ne se relève pas avant l'arrêt de la blanche. Si le contrôle est bon, le tireur gagne un jeton ; deux jetons permettent de rejouer, une fois, un tir invalide (mêmes jetons que la variante ludique)."
    note: "Réactive la posture de la séance précédente (corps immobile jusqu'à la fin du tir, ne pas se relever trop tôt), qui reste la même quand on dose la puissance ; le jeu 3 se joue tel quel sans elle. Une seule règle facultative par partie."
  weight: {children: 1, adults: 1}
  adaptation:
    children: "Zone du camp plus large (la fiche conseille de modifier la zone). Version enfants : la variante ludique seule, sans la règle de lien ; l'observateur du centre de la zone est l'adversaire (ou le groupe en attente). Qui commence : tirage au sort (la fiche ne le dit pas). Fin proposée [Prop], qui remplace la fin de la fiche (ambiguë) : 3 tirs chacun au lieu de 5 pour tenir dans le temps, le plus de placements gagne ; en cas d'égalité, un tir de plus chacun."
    adults: "Réduire la zone du camp, ou jouer le tir sans rebond sur la petite bande. Version adultes : la règle de lien seule, sans la variante ludique. Qui commence : tirage au sort (la fiche ne le dit pas). Fin proposée [Prop], qui remplace la fin de la fiche (ambiguë) : 5 tirs chacun, le plus de placements gagne ; en cas d'égalité, un tir de plus chacun. Après la partie, comparer la distance parcourue à l'exercice 2 : quel geste, quelle vitesse pour quelle distance ?"
  src: S   # titre, règles, score et fin du jeu 3 ; link_previous, playful_variant et adaptation restent [Prop] (FORMAT § 5)
review:
  prompts:
    - Pour envoyer la blanche plus loin, as-tu reculé la main, accéléré, ou les deux ?
    - Où as-tu placé ta main sur la queue pour le tir le plus long ?
    - Quel dosage du recul et de la vitesse était le plus difficile à régler ?
sources:
  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 12, note: "Fiche technique n° 2 (puissance : vitesse, amplitude, flèche)"}
  - {rank: S, file: Fiches techniques CFA BàP.pdf, page: 10, note: "Fiche technique n° 1 (coup de queue : avant-bras, coude, pour le rappel)"}
  - {rank: S, file: Fiches Initiation CFA blackball.pdf, page: 5, note: Initiation 5}
  - {rank: S, file: Fiches Entrainement CFA blackball.pdf, page: 1, note: "Entraînement « La puissance », exercices 1 et 2"}
  - {rank: S, file: Fiches Jeux CFA blackball.pdf, page: 3, note: Jeu 3}
uncertainties:
  - "Mises en place en texte, défis ludiques, variante de jeu (jetons compris), règle de lien et adaptation du jeu : [Prop], à valider par un animateur dans l'application. La différenciation enfants / adultes (poids, compléments, adaptation du jeu) est aussi une proposition."
  - "Entraînement 1 et 2 : le schéma ne dit pas si les billes de couleur d'appoint (jaunes de l'exercice 1, rouges de l'exercice 2) sont des obstacles ou des repères ; la séance les lit comme des paires entre lesquelles passe la blanche (flèches du schéma)."
  - "La section « Les mots de la queue » (enfants) et la section « Deux curseurs : le recul et la vitesse » (adultes : le plan recul et vitesse est une image abstraite, retirée du public enfants le 2026-10-15) sont des gloses [Prop] absentes de la fiche n° 2 ; la définition de la flèche vient du glossaire de la base, le talon et le centre de gravité sont glosés par la séance. La section « Le ressort » a été retirée le 2026-10-15 (audit) : l'amplitude n'est pas de l'énergie stockée, la métaphore contredisait la phrase sur la vitesse."
  - "Initiation 5 : la fiche ne dit pas quelles positions vont avec le chevalet sur cadre ou sur surface ; la séance ne l'impose pas. Les positions de la blanche et les flèches de l'illustration « court-long » sont indicatives, non à l'échelle ; les deux tirs visent la même bille fantôme avec une coupe voisine (environ trois-quarts de bille) pour n'isoler que la distance. Tailles : les billes sont dessinées à l'échelle réelle (blanche plus petite, rayon 0,1038 case contre 0,1098) ; la bille fantôme est une blanche posée au contact de la jaune, à s = r_c + r_o = 0,2136 case de son centre, d'où l'arrivée des flèches en (4,0 ; 0,414). La séance ne traite pas le quart de bille ni le rétro : aucune mention de la taille de la blanche n'est ajoutée au texte."
  - "Le recul et la vitesse ne sont pas chiffrés par la source : le plan recul et vitesse et ses trois zones (doux, moyen, puissant) sont une image [Prop], isolée dans la section « Deux curseurs : le recul et la vitesse » ; seuls les deux extrêmes (peu de recul et peu de vitesse : doux ; grand recul et grande vitesse : puissant) viennent de la fiche n° 2 (pas une graduation fédérale)."
  - "Le rappel porte sur ce que posture-2 enseigne et réutilise son illustration `posture-surface` (V7), qui n'appuie que le premier point (main d'appui à plat). Le point 2 vient de la fiche technique n° 1 ; le point 3 reprend un contrôle de la fiche d'initiation (p. 3-4) et un contenu [Prop] de posture-2 (immobilité jusqu'à la fin du tir)."
  - "Jeu 3 : la fiche dit à la fois « 5 tirs à tour de rôle » et « le premier à placer 5 fois la blanche gagne » ; les deux sont repris tels quels, la condition de fin est ambiguë (un 5 sur 5 seul rend la partie gagnable à la lettre). La fin proposée (nombre de tirs, plus de placements gagne, égalité départagée par un tir de plus chacun) remplace la fin de la fiche : c'est une proposition (adaptation), comme qui commence et la taille de la zone. Le schéma place la blanche au bord de la zone grise du camp du tireur."
  - "Entraînement 1 : le schéma ne donne pas l'ordre des tirs (milieu, gauche, droite est une proposition) ; le « x3 » vaut trois tirs par rouge, soit neuf tirs. La correspondance doux / moyen / fort avec les trois rouges est une proposition. Note animateur : l'encart du schéma dessine le procédé un peu au-dessus du centre et l'initiation 5 montre le centre ou un peu au-dessus ; la séance enseigne le centre (décision [U] du 2026-10-15, attaque de référence du niveau 1) et ne le dit pas aux élèves."
  - "Entraînement 2 : la blanche est près de la petite bande et le chevalet est sur cadre, donc près de la blanche ; l'exercice travaille la vitesse maîtrisée et le geste fluide, pas un grand recul (repris en puissance-2, chevalet sur surface)."
